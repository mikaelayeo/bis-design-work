name: Sync catalog

# Rebuilds data/catalog.json whenever you push files into showcase/ or studio/,
# so the hub always reflects what's actually in the repo. Your titles, dates,
# ticket numbers, and folder grouping are preserved (merged by build-catalog.mjs).

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - "studio/**"
      - "scripts/build-catalog.mjs"

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild catalog
        run: |
          export SYNC_DATE="$(git log -1 --format=%cs)"
          node scripts/build-catalog.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/catalog.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "chore: sync catalog from folder changes [skip ci]"
            git push
          else
            echo "catalog.json already up to date — nothing to commit."
          fi
