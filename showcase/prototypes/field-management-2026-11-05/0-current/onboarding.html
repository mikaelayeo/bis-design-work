<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<title>FM Onboarding · By Wave</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#19191a;--mut:#5f6168;--line:#d5d6db;--blue:#0078b3;--link:#1a73c8;--blue-l:#e5f2f9;--purple:#433a5c;--green:#4cb944;--green-l:#e8f5e6;--teal:#1597c4;--teal-l:#e2f1f7;--violet:#5b6fb0;--violet-l:#e7eaf4;--amber:#c47a00;--amber-l:#fdf3e1;--red:#c62828;--grey-l:#f0f0f2;--r:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button{font:inherit;cursor:pointer}
a{cursor:pointer}
.proto{background:#19191a;color:#fff;padding:6px 16px;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.proto .sp{flex:1}.proto a{color:#9cd3f0}
.proto select{font:inherit;font-size:12px;background:#333;color:#fff;border:1px solid #555;border-radius:3px}
.top{background:#fff;display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:1px solid #eee}
.bis{font-weight:800;font-size:22px;color:#2b2b3a;letter-spacing:-1px}.bis small{font-weight:400;font-size:10px;letter-spacing:0;display:inline-block;line-height:1.1;border-left:1px solid #999;padding-left:6px;margin-left:6px;vertical-align:middle}
.top .sp{flex:1}.search{border:1px solid var(--line);border-radius:3px;padding:5px 10px;width:200px;color:#999;font-size:13px}
nav.main{display:flex;gap:26px;padding:0 16px;overflow-x:auto;white-space:nowrap;background:#fff;border-bottom:1px solid #e3e3e3}
nav.main a{padding:10px 0;color:var(--ink);border-bottom:2px solid transparent;font-size:15px}
nav.main a.on{border-color:var(--purple);font-weight:600}
.new{background:var(--blue);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:5px;vertical-align:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 90px}
main.wide{max-width:none;padding:0 0 90px}
main.fm{max-width:none;padding:0;display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 120px)}
@media(max-width:760px){main.fm{grid-template-columns:1fr}.side{display:none}}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:20px}
h1{font-size:20px;margin:0 0 4px;font-weight:600}h2{font-size:17px;margin:0 0 4px;font-weight:600}h3{font-size:14px;margin:0 0 6px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:12px}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:4px;padding:7px 14px}
.btn.sec{background:#fff;color:var(--blue)}.btn.ghost{border-color:transparent;background:none;color:var(--blue);padding:7px 8px}
.btn.g{background:#5cb85c;border-color:#5cb85c;padding:4px 14px}.btn.b{background:#1aa1d6;border-color:#1aa1d6;padding:4px 14px}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
/* home */
.tools{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;background:#fff;flex-wrap:wrap}
.seg2{display:flex;border:1px solid #999}.seg2 span{padding:3px 30px;border-left:1px solid #999;font-size:13px}.seg2 span:first-child{border:0;background:var(--purple);color:#fff}
.pbar{background:var(--purple);color:#fff;padding:11px 10px;font-size:15px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;background:#fff}th{background:#e9e9ec;text-align:left;padding:10px 8px;font-weight:600;font-size:13px}td{padding:9px 8px;border-bottom:1px solid #eee;font-size:13px}
td a{color:var(--link)}
.banner{display:flex;gap:14px;align-items:center;background:var(--blue-l);border:1px solid #b9dcee;border-left:4px solid var(--blue);padding:12px 14px;margin:10px;flex-wrap:wrap}
.ico i,.srcic i{font-size:inherit}
.ico{width:40px;height:40px;border-radius:8px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-size:20px;flex:none}
.banner .ico i,.srcic i{font-size:inherit}
.ico{background:#fff}
.anchored{position:absolute;z-index:8;width:270px;background:#19191a;color:#fff;border-radius:6px;padding:12px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.anchored:before{content:"";position:absolute;top:-6px;left:24px;border:6px solid transparent;border-top:0;border-bottom-color:#19191a}
.anchored button,.tip button{font-size:12px;border-radius:3px;padding:3px 9px;border:1px solid #fff;background:#fff;color:#19191a}.anchored button.x,.tip button.x{background:none;color:#ccc;border-color:#555}
/* steps */
.steps{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.step{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px 3px 4px;color:var(--mut);display:flex;gap:6px;align-items:center;font-size:13px}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px}
.step.on{border-color:var(--teal);color:var(--ink)}.step.on i{border-color:var(--teal);color:var(--teal)}
.step.done i{background:var(--teal);border-color:var(--teal);color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;z-index:3}
.foot .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
.saved{font-size:12px;color:var(--mut)}.saved:before{content:"✓ ";color:var(--green)}
.pic{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:16px 0}
.lvl{flex:1;min-width:130px;border-radius:var(--r);padding:12px;border:1px solid}
.lvl b{display:block}.arrow{align-self:center;color:var(--mut)}
.t-group{background:var(--green-l);border-color:var(--green)}.t-site{background:var(--teal-l);border-color:var(--teal)}
.t-job{background:var(--violet-l);border-color:var(--violet)}.t-crew{background:var(--amber-l);border-color:var(--amber)}.t-asset{background:#f3eee6;border-color:#a1887f}.t-none{background:var(--grey-l);border-color:var(--line)}
.map{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:center;margin-top:10px}
.ai{background:var(--blue-l);border:1px solid #b9dcee;border-radius:var(--r);padding:14px}
.shape{border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:#fff}
.shape.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.box2{width:18px;height:18px;border:1.5px solid #999;border-radius:3px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff}
.on>.box2,.box2.on{background:var(--blue);border-color:var(--blue)}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:700px){.shapes{grid-template-columns:1fr}}
.because{font-size:12px;color:var(--teal);margin-top:4px}
/* AI drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:20;display:flex;flex-direction:column}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .bd{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fafafb}
.drawer .ft{padding:12px 16px;border-top:1px solid var(--line)}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px}
.msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.quick{display:flex;flex-wrap:wrap;gap:6px}.quick button{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:14px;padding:4px 10px;font-size:12px}
.proposal{border:1px solid var(--blue);border-radius:8px;background:#fff;padding:12px}
/* tree */
.tree{font-size:13px}
.node{display:flex;align-items:center;gap:8px;margin:5px 0}
.box{flex:1;display:flex;align-items:center;gap:8px;border:1px solid;border-radius:3px;padding:6px 8px;min-height:34px}
.cnt{font-size:11px;background:#fff;border-radius:9px;padding:0 7px;border:1px solid var(--line)}
.sel{border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:inherit;font-size:12px;background:#fff}
.sug{font-size:11px;color:var(--blue)}
.indent{border-left:1px dashed #aab;margin-left:14px;padding-left:14px}
.chip{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid;white-space:nowrap}
.preview .pn{padding:3px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--mut)}
.tabs button.on{border-color:var(--blue);color:var(--ink);font-weight:600}
.sync{display:flex;gap:10px;align-items:flex-start;background:var(--green-l);border:1px solid #bfe3bb;border-radius:var(--r);padding:10px;margin-top:12px}
.tip{background:#19191a;color:#fff;border-radius:6px;padding:10px 12px;font-size:12px;margin:8px 0 10px;position:relative}
.tip:before{content:"";position:absolute;top:-6px;left:22px;border:6px solid transparent;border-top:0;border-bottom-color:#19191a}
/* build places (drag) */
.brow{display:flex;align-items:center;gap:6px;margin:4px 0;position:relative}
.brow .box{cursor:grab;background:#fff}
.brow.drag{opacity:.4}
.handle{color:#999;cursor:grab;user-select:none;padding:0 2px}
.dropline{position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--blue);border-radius:2px}
.dropline.child{left:34px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:3px;width:26px;height:26px;padding:0;color:var(--mut)}
.box input{border:0;background:transparent;font:inherit;flex:1;min-width:60px}
/* words */
.wordrow{border-top:1px solid var(--line);padding:12px 0}.wordrow:first-of-type{border-top:0}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.idea{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 11px;font-size:12px}
.idea.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* routine */
.rcard{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;background:#fff}
.rcard.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.rcard .rh{padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rcard .items{border-top:1px solid var(--line);padding:6px 12px 10px 40px}
.item{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.tag{font-size:10px;border-radius:3px;padding:0 5px;border:1px solid var(--line);color:var(--mut)}
.attach{display:flex;flex-wrap:wrap;gap:6px}
.attach label{border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 6px;font-size:12px;display:flex;gap:5px;align-items:center;cursor:pointer;background:#fff}
.attach label.on{border-color:var(--blue);background:var(--blue-l)}
/* phone */
.phone{width:270px;margin:0 auto;border:10px solid #1d1d20;border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone .notch{height:22px;background:#1d1d20;display:flex;justify-content:center}.phone .notch i{width:80px;height:14px;background:#000;border-radius:0 0 10px 10px}
.phone .ph{background:var(--purple);color:#fff;padding:10px 12px}
.phone .pb{padding:10px 12px;min-height:330px;font-size:13px}
.prow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee;cursor:pointer}
/* checklist/launcher */
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.tick.y{background:var(--green);border-color:var(--green);color:#fff}
.bar{height:6px;background:var(--grey-l);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.bar.g i{background:var(--green)}
.empty{text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.launcher{position:fixed;right:16px;bottom:16px;z-index:7}
.launcher .pill{background:var(--purple);color:#fff;border-radius:22px;padding:9px 16px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;border:0}
.launcher .panel{width:330px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px;margin-bottom:8px}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(#7fd17a calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center}
.ring:after{content:"";width:14px;height:14px;border-radius:50%;background:var(--purple)}
/* FM pages */
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;font-size:13px}
.side a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:16px;color:var(--ink)}
.side a.on{background:var(--blue-l);outline:1px solid var(--teal);font-weight:600}
.side .sub{padding-left:28px;font-size:12px}
.side .lab{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 10px 4px}
.fmbody{padding:18px 20px 90px;max-width:1080px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.cards{grid-template-columns:1fr}}
.lr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;border-top:1px solid #f0f0f0}
.mini{width:60px;height:5px;background:var(--grey-l);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}.mini i{display:block;height:100%;background:var(--blue)}
.daybar{display:inline-flex;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:13px}.daybar span{padding:4px 10px;border-left:1px solid var(--line)}.daybar span:first-child{border:0}
.hint{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;font-size:13px}
.note{position:fixed;right:16px;top:40px;width:320px;box-shadow:0 8px 24px rgba(0,0,0,.18);background:#fffbe6;border:1px solid #e8d77a;border-radius:6px;padding:10px 12px;font-size:12px;z-index:6}
.note b{display:block;margin-bottom:2px}
.hide{display:none}
/* ===== Match the FM prototype (v3.3): tokens and components ===== */
:root{--blue:#0078B3;--link:#0078B3;--line:#DFDFE2;--mut:#636368;--ink:#19191A;--green:#167B00;--red:#CC2222;--amber:#9C6300;--blue-l:#F0F9FE}
main{max-width:1320px;margin:0 auto;padding:16px 24px 90px}
.foot .in{max-width:1272px}
.card{border:1px solid #DFDFE2;border-radius:8px;padding:16px;background:#FEFEFE}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:4px 10px;border-radius:4px;border:1px solid transparent;background:#0078B3;color:#FEFEFE;font-size:15px;font-weight:600;white-space:nowrap}
.btn:hover{background:#095F8C}
.btn.sec{background:transparent;border-color:#AFAFB5;color:#636368}.btn.sec:hover{background:#F2F2F2}
.btn.ghost{background:transparent;border-color:transparent;color:#0078B3;font-weight:400;padding:4px 4px}.btn.ghost:hover{text-decoration:underline;background:transparent}
.btn.sm{height:26px;padding:4px 8px;font-size:13px}
.btn:disabled{background:#F2F2F2;color:#AFAFB5;border-color:transparent;opacity:1}
.chip{border-radius:4px;font-size:12px;font-weight:600;padding:2px 6px}
.fseg{display:inline-flex;border:1px solid #AFAFB5;border-radius:4px;overflow:hidden;background:#FEFEFE;height:30px;flex:none}
.fseg button{border:0;background:none;padding:2px 12px;font-size:14px;color:#19191A}
.fseg button+button{border-left:1px solid #AFAFB5}
.fseg button[aria-pressed="true"]{background:#F8FEFF;color:#0078B3;font-weight:600;box-shadow:inset 0 -2px 0 #0078B3}
.fseg.sm{height:24px}.fseg.sm button{font-size:12px;padding:1px 8px}
.tabs button.on{border-color:#0078B3;color:#0078B3}
.rowlist{border:1px solid #DFDFE2;border-radius:8px;overflow:hidden;background:#FEFEFE}
.rowlist>div{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid #DFDFE2}
.rowlist>div:first-child{border-top:0}
.srcic{width:34px;height:34px;border-radius:8px;background:#F2F2F2;display:grid;place-items:center;font-size:17px;flex:none}
.find{background:#FEFEFE;border:1px solid #DFDFE2;border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.find.yes{border-color:#167B00;background:#F6FCEC}.find.no{border-color:#CC2222;background:#FFF6F6}
.yn{display:flex;gap:4px;margin-left:auto;flex:none}
.yn button{width:28px;height:28px;border-radius:50%;border:1px solid #AFAFB5;background:#FEFEFE;color:#636368;font-size:13px;padding:0}
.yn button.y[aria-pressed="true"]{background:#167B00;border-color:#167B00;color:#fff}
.yn button.n[aria-pressed="true"]{background:#CC2222;border-color:#CC2222;color:#fff}
.ftree .box{background:#FEFEFE}
.ftree .box.t-group{background:#EBF8D6;border-color:#4cb944}.ftree .box.t-site{background:#e2f1f7;border-color:#1597c4}.ftree .box.t-job{background:#e7eaf4;border-color:#5b6fb0}.ftree .box.t-crew{background:#fdf3e1;border-color:#c47a00}.ftree .box.t-asset{background:#f3eee6;border-color:#a1887f}
.phone.small{transform:scale(.82);transform-origin:top center;margin-bottom:-70px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{border:1px solid #AFAFB5;background:#FEFEFE;border-radius:80px;padding:6px 14px;font-size:14px;color:#19191A}
.pill:hover{background:#F2F2F2}.pill.on{border-color:#009ACB;background:#F0F9FE;color:#0078B3;font-weight:600}
.chip-rec{background:#F0F9FE;border-color:#C9EFFA;color:#0078B3}
.phone.small{width:250px}
.pnode.drag{opacity:.4}
.selbox{margin:0;opacity:.35}.node:hover .selbox,.selbox:checked{opacity:1}
.opts{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid #DFDFE2;background:#fff;border-radius:8px;padding:10px 14px;font:inherit;color:inherit;cursor:pointer}.opt:hover{border-color:#009ACB}.opt.on{border-color:#009ACB;background:#F0F9FE;box-shadow:inset 3px 0 0 #0078B3}.opt small{display:block;color:#6b6b73;font-size:12px;margin-top:2px}.opt>i{color:#0078B3;font-size:18px}
.v41{--line:#dfdfe2;--line2:#ececef;--blue-d:#005f8f;--blue-l:#f0f9fe;--blue-b:#c9effa;--teal:#1597c4;--teal-l:#e2f1f7;--violet:#5b6fb0;--violet-l:#eceffa;--amber:#b26b00;--amber-l:#fdf3e1;--green:#2e8540;--green-l:#e8f5e6;--mut:#5f6168}
.v41 h2{font-size:20px;margin:0 0 4px;font-weight:600}.v41 h3{font-size:15px;margin:0;font-weight:600}
.v41 .prev{position:sticky;top:12px;padding:0;overflow:hidden}.v41 .ph{padding:16px 18px 12px;border-bottom:1px solid var(--line2)}.v41 .pb{padding:14px 18px 16px}
.v41 .empty{border:1.5px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--mut)}
.v41 .tag{margin-left:auto;font-size:11px;border-radius:10px;padding:1px 8px;background:var(--line2);color:var(--mut);white-space:nowrap}

 foot(`<button class="btn sec" onclick="go('how')">Back</button><span class="saved">Saved</span><span style="flex:1"></span><button class="btn" ${a===null?'disabled':''} onclick="go('words')">Continue</button>`);
 return setupHead()+`<div class="card">
 <h2>Here's what we found in your portal</h2><p class="mut">We looked at your Locations, Assets, Folders and the forms you use most. Nothing changes until you say so. <a style="color:var(--blue)" onclick="S.aiAccepted=false;render()">Set up by hand instead</a></p>
 <div class="ai" style="padding:18px"><div class="row" style="gap:10px"><span class="ico" style="width:40px;height:40px;font-size:20px;background:#fff"><i class="fa-solid fa-wand-magic-sparkles"></i></span><div style="flex:1"><div class="sm mut">Our best guess</div><b style="font-size:17px">${C.ai}</b></div></div>
 <div class="row" style="margin-top:14px;gap:10px"><b class="sm">Is this right?</b><span class="sm mut">${Object.keys(S.fok).length} of ${FOUND[S.client].filter(x=>x[4]!=='info').length} checked</span></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px">${syncHtml()}${FOUND[S.client].map(([i,h,d,src],n)=>`<div class="find ${S.fok[n]===true?'yes':S.fok[n]===false?'no':''}"><span style="font-size:22px;line-height:1">${i}</span><div style="flex:1"><b class="sm" style="font-size:13px">${h}</b><div class="sm mut">${d}</div><div class="sm" style="color:var(--blue);margin-top:2px">From ${src}</div></div>${x4(n)?'<span class="chip" title="Nothing to decide yet">For your information</span>':`<div class="yn"><button class="y" title="Right" aria-pressed="${S.fok[n]===true}" onclick="setFok(${n},true)">✓</button><button class="n" title="Not right" aria-pressed="${S.fok[n]===false}" onclick="setFok(${n},false)">✕</button></div>`}</div>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn" style="height:40px;padding:6px 18px;font-size:16px" ${allOk()?'disabled':''} onclick="FOUND[S.client].forEach((x,n)=>{ if(x[4]!=='info') S.fok[n]=true; });S.aiAccepted=true;S.shape=[...C.shape];S.need=[];S.peopleOnly=!!C.peopleOnly;render()"><i class="fa-solid fa-check"></i> ${allOk()?'All correct':'Yes, all correct'}</button><span class="sm mut">${allOk()?'Change any card above if you need to.':'Or check each one above.'}</span></div>${C.peopleOnly?`<div class="sm" style="margin-top:8px;background:#fff;border:1px solid #b9dcee;border-radius:4px;padding:6px 8px"><b>So we'll start with who\'s allowed on site</b>, not daily routines. You can add routines any time.</div>`:''}
 </div>
 ${a===false?`<div class="ai row" style="margin-top:14px;gap:10px;background:#fff"><span class="ico" style="width:32px;height:32px;font-size:15px"><i class="fa-solid fa-comments"></i></span><div style="flex:1"><b>No problem. We'll go with your answers from step 1.</b><div class="sm mut">Or tell our setup assistant how your work runs. It asks 3 quick questions and suggests a setup.</div></div><button class="btn sec" onclick="openChat()">Describe your work</button></div>`:''}
 </div>`;
}
function toggleNeed(k){ S.need=S.need[0]===k?[]:[k]; S.shape=[...new Set(S.need.flatMap(n=>NEEDS.find(x=>x[0]===n)[3]))]; if(!S.shape.length) S.shape=[...C.shape]; S.peopleOnly=S.need[0]==='gate'; render(); }
function toggleShape(k){ S.shape=has(k)?S.shape.filter(s=>s!==k):[...S.shape,k]; render(); }

/* --- setup assistant (guided, not an open chat) --- */
function openChat(){ S.chat=[{b:C.chat[0][0]}]; S.chatStep=0; render(); }
function reply(txt){ S.chat.push({m:txt}); S.chatStep++; if(S.chatStep<C.chat.length) S.chat.push({b:C.chat[S.chatStep][0]}); else S.chat.push({b:'Thanks, that helps. Here\'s what I\'d set up for you:',proposal:true}); render(); const bd=$('.drawer .bd'); if(bd) bd.scrollTop=bd.scrollHeight; }
function useProposal(){ const p=C.proposal; S.shape=[...p.shape]; S.words={...p.words}; S.aiAccepted=true; S.chat=null; render(); }
function drawerHtml(){ if(!S.chat) return '';
 const last=S.chat[S.chat.length-1]; const p=C.proposal;
 return `<div class="drawer"><div class="hd"><span class="ico" style="width:32px;height:32px;font-size:15px"><i class="fa-solid fa-wand-magic-sparkles"></i></span><div style="flex:1"><b>Setup assistant</b><div class="sm mut">Helps with setup only · ${Math.min(S.chatStep+1,3)} of 3</div></div><button class="btn ghost" onclick="S.chat=null;render()">✕</button></div>
 <div class="bd">${S.chat.map(m=>m.m?`<div class="msg me">${m.m}</div>`:`<div class="msg bot">${m.b}</div>${m.proposal?`<div class="proposal"><b class="sm">Suggested setup</b><ul class="sm" style="padding-left:18px;margin:6px 0">${p.lines.map(l=>`<li>${l}</li>`).join('')}</ul><div class="row" style="gap:6px"><button class="btn sm" onclick="useProposal()">Use this</button><button class="btn sec sm" onclick="S.chat=null;render()">Change something</button></div><a class="sm" style="color:var(--blue);display:block;margin-top:8px">Talk to our team instead</a></div>`:''}`).join('')}
 ${!last.proposal&&last.b?`<div class="quick">${C.chat[S.chatStep][1].map(q=>`<button onclick="reply(this.textContent)">${q}</button>`).join('')}</div>`:''}</div>
 <div class="ft"><div class="row" style="gap:6px"><input class="sel" style="flex:1;font-size:13px;padding:7px" placeholder="Or type your own answer" onkeydown="if(event.key==='Enter'&&this.value){reply(this.value)}" ${last.proposal?'disabled':''}><button class="btn sm" onclick="const i=this.previousElementSibling;if(i.value)reply(i.value)">Send</button></div>
 <div class="sm mut" style="margin-top:6px">I can only help with setup. For anything else, contact support.</div></div></div>`;
}

/* --- Your places --- */
function fmParent(id){ let p=parentOf(id); while(p&&p.id!=='root'){ const l=S.labels[p.id]; if(l&&l!=='none') return l; p=parentOf(p.id); } return null; }
/* equipment only comes from Assets; a location can never become equipment */
let CATSEL=false;
function selOpts(lab,pt){ return ['site','job','crew','asset','none'].filter(t=>(canSit(t,pt)||t===lab)&&(t!=='asset'||(S.source==='equipment'&&AI()))&&!(S.source==='equipment'&&(CATSEL?!['group','site','none'].includes(t):['crew','group'].includes(t)))).map(t=>`<option value="${t}" ${t===lab?'selected':''}>${DESC[t]}</option>`).join(''); }
function nodeHtml(n){
 const unset=!(n.id in S.labels); const lab=S.labels[n.id]||'none'; const kids=n.kids||[]; const pt=fmParent(n.id); const lv=lab==='site'?siteLevel(n.id):0, deep=lv>S.levels; const bad=lab!=='none'&&(!canSit(lab,pt)||deep);
 const isCat=S.source==='equipment'&&!!n.kids; CATSEL=isCat; const nm=n.name.split(' · ')[0], total=parseInt((n.name.split(' · ')[1]||'0').replace(/[^0-9]/g,''))||0;
 return `<div class="node"><input type="checkbox" class="selbox" ${S.sel[n.id]?'checked':''} onchange="S.sel['${n.id}']=this.checked;render()"><div class="box t-${unset?'unset':lab}" style="${bad?'outline:2px solid var(--red)':''};${S.sel[n.id]?'box-shadow:0 0 0 2px #0078B3':''}" onclick="if(event.ctrlKey||event.metaKey||event.shiftKey){S.sel['${n.id}']=!S.sel['${n.id}'];render()}">${isCat?'<i class="fa-solid fa-folder-tree" style="color:#AFAFB5"></i>':''}${lab==='site'?`<span class="chip t-site" style="font-size:10px">${lvlName(lv)}</span>`:''}<span style="flex:1">${nm}</span>${isCat?`<span class="chip">Category · ${total} assets</span>`:''}${n.users?`<span class="cnt">${n.users} people</span>`:""}</div>
 <select class="sel" style="width:200px" onchange="setLabel('${n.id}',this.value)">${unset?'<option value="" selected disabled>Choose…</option>':''}${selOpts(unset?'':lab,pt)}</select></div>
 ${bad?`<div class="sm" style="color:var(--red);margin:-2px 0 4px 2px">${deep?`Field Management goes up to ${S.levels} level${S.levels>1?'s':''} here. ${S.levels<3?`<a style="color:var(--blue)" onclick="addLevel()">Add a level</a> or pick another type.`:'Pick a higher one or leave it out.'}`:whyNot(lab,pt)+' Pick another type, or leave it out.'}</div>`:''}
 `
 +(kids.length?`<div class="indent">${isCat?`<div class="row sm" style="gap:8px;margin:4px 0 6px;background:#F0F9FE;border-radius:6px;padding:6px 8px"><i class="fa-solid fa-layer-group" style="color:#0078B3"></i><span>Make all ${total} assets</span><select class="sel" onchange="if(this.value)setAll('${n.id}',this.value)"><option value="" ${new Set(kids.map(k=>S.labels[k.id]||'none')).size>1?'selected':''}>Mixed: choose…</option>${['job','site','asset','none'].filter(t=>t!=='asset'||AI()).map(t=>`<option value="${t}" ${kids.length&&kids.every(k=>(S.labels[k.id]||'none')===t)?'selected':''}>${t==='none'?'Not for Field Management':pl(t)}</option>`).join('')}</select><span class="mut">and ignore the category? Set the category to Not for Field Management.</span></div>`:''}${kids.map(nodeHtml).join('')}${isCat&&total>kids.length?`<div class="sm mut" style="padding:4px 0 6px 28px">+ ${total-kids.length} more, set the same way</div>`:''}</div>`:'');
}
function setAll(cid,v){ const c=find(TREE,cid); (c.kids||[]).forEach(k=>S.labels[k.id]=v); render(); }
function firstWhy(){ let f=null; (function w(n){ if(!f&&n.why) f=n; (n.kids||[]).forEach(w); })(TREE); return f; }
function setLabel(id,v){ S.labels[id]=v; const n=find(TREE,id); if(n&&n.kids&&v==='none'&&S.source!=='equipment') (function w(m){ m.kids&&m.kids.forEach(k=>{S.labels[k.id]='none';w(k);}); })(n); render(); }
function previewHtml(){
 const box=(l,name,cnt,lab)=>`<div class="node"><div class="box t-${l}"><span class="chip t-${l}" style="font-size:10px">${lab||sg(l)}</span><span style="flex:1">${name||'<span class=mut>Unnamed</span>'}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</div></div>`;
 if(S.source==='fresh'){ const B=S.build; return B.length?`<div class="tree ftree">${B.map((b,i)=>`<div style="margin-left:${b.d*22}px">${box(b.t,b.n,0,b.t==='site'?lvlName(bSiteDepth(i)):'')}</div>`).join('')}</div>`:'<div class="mut sm">Nothing yet.</div>'; }
 /* flat list of what's in FM, each with its natural parent from Locations/Assets */
 const all=[]; function walk(n,par,src){ const l=S.labels[n.id]; let p=par; if(l&&l!=='none'){ all.push({id:n.id,name:n.name,users:n.users,l,par,src}); p=n.id; } (n.kids||[]).forEach(k=>walk(k,p,src)); }
 (C.tree.kids||[]).forEach(k=>walk(k,null,'loc')); (SRC[S.client].eq.kids||[]).forEach(k=>walk(k,null,'asset'));
 S.newCrews.forEach(c=>all.push({id:c.id,name:c.name,users:c.users,l:'crew',par:null,src:'fm'}));
 const parentOfX=x=>x.id in S.moved?S.moved[x.id]:x.par;
 const depthX=x=>{ let d=1,p=parentOfX(x); while(p){ const y=all.find(z=>z.id===p); if(!y) break; if(y.l==='site') d++; p=parentOfX(y); } return d; };
 /* locked = a place synced from Locations; everything FM owns (jobs, crews, equipment, new crews) can move */
 const movable=x=>!LIVE()||x.src!=='loc'||x.l==='crew';
 PV=all;
 const draw=x=>{ const kids=all.filter(y=>parentOfX(y)===x.id); const mv=movable(x);
  return `<div class="pnode ${S.pdrag===x.id?'drag':''}" draggable="${mv}" ondragstart="event.stopPropagation();S.pdrag='${x.id}'" ondragend="S.pdrag=null" ondragover="event.preventDefault();event.stopPropagation()" ondrop="event.stopPropagation();pDrop('${x.id}')">
   <div class="node"><div class="box t-${x.l}" style="${mv?'cursor:grab':''}">${mv?'<i class="fa-solid fa-grip-vertical" style="color:#AFAFB5"></i>':'<i class="fa-solid fa-lock" style="color:#AFAFB5;font-size:11px" title="Synced from Locations. Change it there."></i>'}<span class="chip t-${x.l}" style="font-size:10px">${x.l==='site'?lvlName(depthX(x)):sg(x.l)}</span><span style="flex:1">${x.name}</span>${x.users?`<span class="cnt">${x.users} people</span>`:''}${x.id in S.moved?'<i class="fa-solid fa-link" style="color:#0078B3;font-size:11px" title="Linked in Field Management"></i>':''}</div></div>
   ${kids.length?`<div class="indent">${kids.map(draw).join('')}</div>`:''}</div>`; };
 const top=all.filter(x=>!parentOfX(x)||!all.some(y=>y.id===parentOfX(x)));
 return `${S.pflash?`<div class="tip" style="background:var(--red)">${S.pflash}</div>`:''}<div class="tree ftree"><div class="node" ondragover="event.preventDefault()" ondrop="pDrop(null)"><div class="box" style="background:#eee;border-color:#999;font-weight:600"><span style="flex:1">${C.tree.name}</span><span class="cnt">${C.tree.users} people</span></div></div><div class="indent">${top.map(draw).join('')||'<div class="mut sm">Nothing yet.</div>'}</div></div>
 <div class="sm mut" style="margin-top:8px"><i class="fa-solid fa-grip-vertical"></i> Drag ${pl('job').toLowerCase()} and ${pl('crew').toLowerCase()} onto a place${AI()?`, and equipment onto the ${sg('site').toLowerCase()} or ${sg('job').toLowerCase()} it's at today`:''}. ${LIVE()?'<i class="fa-solid fa-lock"></i> Places synced from Locations move there.':''}</div>`; }
let PV=[];
function pDrop(target){ const id=S.pdrag; S.pdrag=null; if(!id||id===target) return;
 const x=PV.find(y=>y.id===id), t=target&&PV.find(y=>y.id===target);
 /* no dropping into its own children */
 let p=target; while(p){ if(p===id) return; const n=PV.find(y=>y.id===p); p=n&&(n.id in S.moved?S.moved[n.id]:n.par); }
 if(t?!canSit(x.l,t.l):!canSit(x.l,null)){ S.pflash=whyNot(x.l,t?t.l:null); render(); return; }
 S.moved[id]=target; S.pflash=''; render(); }

function countSrc(x){ let n=0; (function w(m){ (m.kids||[]).forEach(k=>{ n++; w(k); }); })(x==='equipment'?SRC[S.client].eq:C.tree); return n; }
function selIds(){ return Object.keys(S.sel).filter(k=>S.sel[k]); }
function bulkSet(v){ selIds().forEach(id=>S.labels[id]=v); S.sel={}; render(); }
function structure(){
 foot(`<button class="btn sec" onclick="go('words')">Back</button><span class="saved">Saved</span><span style="flex:1"></span><span class="sm mut">${countLine()}</span><button class="btn" onclick="go('routine')">Continue</button>`);
 const link=S.source!=='fresh';
 const rec=SRC[S.client].start;
 S.detail=S.view==='detail';
 const tabs=`<div class="tabs"><button class="${link?'on':''}" onclick="S.source=S.lastSrc||'locations';render()">From your portal</button><button class="${!link?'on':''}" onclick="if(S.source!=='fresh')S.lastSrc=S.source;S.source='fresh';render()">Start fresh</button></div>
 ${link?`<div class="row" style="margin:-2px 0 14px;gap:10px">${AI()?`<div class="fseg"><button aria-pressed="${S.view==='overview'}" onclick="S.view='overview';render()"><i class="fa-solid fa-wand-magic-sparkles"></i> Overview</button><button aria-pressed="${S.view==='detail'}" onclick="S.view='detail';render()">Detailed</button></div>`:''}${S.view==='detail'?`<div class="pills" style="margin:0">${['locations','equipment'].map(x=>`<button class="pill ${S.source===x?'on':''}" onclick="S.source='${x}';S.sel={};render()"><i class="fa-solid fa-${x==='locations'?'sitemap':'truck'}"></i> ${SRCNAME[x]} <span class="chip" style="margin-left:4px">${countSrc(x)}</span></button>`).join('')}</div>`:''}</div>`:'<div class="sm mut" style="margin:-2px 0 12px">Build it here. Not linked to Locations or Assets.</div>'}`;
 const jobsNote=has('dispatch')&&AI()?`<div class="sync" style="background:var(--violet-l);border-color:#c9cfe6"><span style="font-size:18px"><i class="fa-solid fa-bolt"></i></span><div class="sm"><b>${pl('job')} are added on the go</b><br>Your ${pl('crew').toLowerCase()} start a ${sg('job').toLowerCase()} from their phone when they arrive. No address or setup needed here.</div></div>`:
  has('mobile')?`<div class="sync" style="background:var(--violet-l);border-color:#c9cfe6"><span style="font-size:18px"><i class="fa-solid fa-right-left"></i></span><div class="sm"><b>Your ${pl('site').toLowerCase()} move</b><br>Their address is optional and can be updated from the phone when they move.</div></div>`:'';
 let left;
 if(S.source!=='fresh'&&S.view==='overview') left=bringHtml();
 else if(!link) left=buildHtml();
 else left=`<h2>${S.source==='locations'?'Your Locations':'Your Assets'}</h2><p class="mut" style="margin:0 0 12px">Choose what each one is, in the menu on the right.</p>
  ${selIds().length?`<div class="row" style="position:sticky;top:0;z-index:5;background:#0078B3;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:10px;gap:10px"><b>${selIds().length} selected</b><span>Set as</span><select class="sel" onchange="if(this.value)bulkSet(this.value)"><option value="">Choose a type…</option>${['site','job','crew','asset','none'].filter(t=>S.source==='equipment'?!['group','crew'].includes(t):t!=='asset').map(t=>`<option value="${t}">${t==='none'?'Not for Field Management':sg(t)+' · '+DESC[t]}</option>`).join('')}</select><span style="flex:1"></span><a style="color:#fff" onclick="S.sel={};render()">Clear</a></div>`:''}
  ${S.source==='locations'?`<div class="tree"><div class="node"><div class="box" style="background:#eee;border-color:#999;font-weight:600"><span style="flex:1">${TREE.name}</span>${TREE.users?`<span class="cnt">${TREE.users} people</span>`:""}</div></div>
  <div class="indent">${TREE.kids.map(nodeHtml).join('')}</div></div>`:`<div class="tree">${(TREE.kids||[]).map(nodeHtml).join('')||'<div class="mut sm">Assets isn\'t used in this portal.</div>'}</div>`}
  <p class="sm mut" style="margin-top:12px">${LIVE()?`To move things around, change them in <a style="color:var(--blue)">${SRCNAME[S.source]}</a>. Field Management follows.`:'This is a one-time copy. After setup, you change things in Field Management.'}</p>`;
 return setupHead()+`<div class="grid2"><div class="card">${S.newSafety&&S.source==='fresh'?'<div class="aifill"><i class="fa-solid fa-seedling"></i><span><b>Your Locations aren\'t set up for field work yet</b>, so we started you here. Build your places, or switch to From your portal.</span></div>':''}${tabs}${left}</div>
 <div class="card"><h3>Your Field Management</h3><p class="mut sm" style="margin-top:0">How it fits together, in your words.</p>
 <div class="preview sm">${previewHtml()}</div>${jobsNote}
 ${link&&!LIVE()?`<div class="sync"><span style="font-size:18px"><i class="fa-solid fa-file-import"></i></span><div class="sm"><b>Copied once from Locations and Assets</b><br>Names and people come over now. Later changes in Locations or Assets don't show here; you change things in Field Management.</div></div>`:link?`<div class="sync"><span style="font-size:18px"><i class="fa-solid fa-rotate"></i></span><div class="sm"><b>Stays in sync with Locations and Assets</b><br>Rename, move or add something there, and Field Management follows. ${AI()?'People who move in Locations move here too'+(SYNC[S.client].list.length?', including changes from your '+SYNC[S.client].list[0][0]:'')+'.':''}</div></div>`:`<div class="sync" style="background:var(--amber-l);border-color:#ecd3a3"><span style="font-size:18px">!</span><div class="sm"><b>Not linked to Locations</b><br>Changes in Locations won't show here. You can link it later.</div></div>`}
 <details class="sm" style="margin-top:10px"><summary style="cursor:pointer;color:var(--blue)">Need help deciding?</summary><p class="mut">Book 30 minutes with our team and we'll set it up with you.</p></details></div></div>`;
}
function x4(n){ return FOUND[S.client][n][4]==='info'; }
function allOk(){ return FOUND[S.client].every((x,n)=>x[4]==='info'||S.fok[n]===true); }
function setFok(n,v){ S.fok[n]=v; const vals=Object.values(S.fok); if(vals.includes(false)) S.aiAccepted=false; else if(allOk()){ S.aiAccepted=true; S.shape=[...C.shape]; S.need=[]; S.peopleOnly=!!C.peopleOnly; } else S.aiAccepted=null; render(); }
function syncHtml(){ const x=SYNC[S.client];
 return `<div style="grid-column:1/-1;display:flex;gap:10px;align-items:center;background:${x.list.length?'var(--green-l)':'#fff'};border:1px solid ${x.list.length?'#bfe3bb':'var(--line)'};border-radius:10px;padding:10px 12px"><span style="font-size:22px">${x.list.length?'<i class="fa-solid fa-rotate"></i>':'<i class="fa-solid fa-hand"></i>'}</span><div class="sm" style="flex:1">${x.list.length?x.list.map(([a,b,c])=>`<b>Connected: ${a}</b> keeps your ${b.toLowerCase()} up to date (${c.toLowerCase()}). Field Management will follow it automatically.`).join('<br>')+(x.after?' '+x.after:''):`<b>No connections found.</b> ${x.none}`}</div>${x.list.length?'':'<a class="sm" style="color:var(--blue);white-space:nowrap">Ask about connecting</a>'}</div>`; }
function bringHtml(){ const B=BRING[S.client]; const ic={Locations:'<i class="fa-solid fa-location-dot"></i>',Equipment:'<i class="fa-solid fa-truck"></i>',Assets:'<i class="fa-solid fa-truck"></i>'};
 return `<h2><i class="fa-solid fa-wand-magic-sparkles" style="color:#0078B3;font-size:16px"></i> Bring these over</h2><p class="mut" style="margin-top:0">You've already set up a lot of this in BIS, sometimes in places built for something else. Your originals stay where they are.</p>
 <div class="rowlist">${B.filter(b=>b.to!=='asset').concat(eqRows()).map(b=>{ const on=b.ids.length>0&&b.ids.every(id=>S.labels[id]===b.to); const na=S.na[b.id]||(!b.ids.length&&S.na[b.id]!==false); const src=b.from.split(' ')[0]; return `<div style="${on?'':'background:#FAFAFA'};${na?'opacity:.55':''}">
  <span class="srcic">${ic[src]||'<i class="fa-solid fa-folder"></i>'}</span>
  <div style="flex:1;min-width:0"><b style="${na?'text-decoration:line-through':''}">${b.what}</b>${na?' <span class="chip">Doesn\'t apply</span>':''}<div class="sm mut">From ${b.from.replace('Equipment','Assets')}${b.note?' · '+b.note:''}</div>
