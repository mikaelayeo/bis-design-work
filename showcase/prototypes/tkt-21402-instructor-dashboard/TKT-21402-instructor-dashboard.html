const Ppl=(k,arr)=>masked(k)?'':arr.map(PChip).join('');
function setScreen(single){if(S.presenting)stopPresent();S.single=single;S.rev={};S.showProg=false;closeLayer();render();snack(single?'Single screen: names stay hidden until you show them':'Extended screen: Present opens a second window');}
function openScreen(btn){
  const r=btn.getBoundingClientRect(), opt=(v,ic,l,sub)=>`<button class="mi scr-mi${S.single===v?' on':''}" role="menuitemradio" aria-checked="${S.single===v}" onclick="setScreen(${v})">${I(ic)}<span><b>${l}</b><small>${sub}</small></span>${S.single===v?`<span class="ck">${I('fa-solid fa-check')}</span>`:''}</button>`;
  document.getElementById('layer').innerHTML=`<div class="menu" role="menu" style="width:320px;top:${r.bottom+4}px;left:${Math.max(8,Math.min(innerWidth-328,r.right-320))}px"><div class="mhd">Screen setup</div>${opt(false,'fa-solid fa-display','Extended screen','Laptop plus a projector. Present opens a second window for the class.')}${opt(true,'fa-solid fa-tv','Single screen','One touch screen the class can see. Names stay hidden until you show them, and Present uses this screen.')}</div>`;
  setTimeout(()=>document.addEventListener('click',closeLayer,{once:true}),0);
}

/* =====================================================================
   MODALS: Assign, Progress, Results
   ===================================================================== */
function renderModal(){
  const L=document.getElementById('modal-root')||Object.assign(document.body.appendChild(document.createElement('div')),{id:'modal-root'});
  if(!S.modal){L.innerHTML='';return;}
  const keepScroll=L.querySelector('.res-r')?.scrollTop||0;
  L.innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()">${S.modal.k==='assign'?assignModal():S.modal.k==='progress'?progressModal():resultsModal()}</div>`;
  const rr=L.querySelector('.res-r'); if(rr) rr.scrollTop=keepScroll;
}
function closeModal(){if(S.modal?.k==='assign'&&!S.assign)S.picked={};S.modal=null;S.rev={};S.showProg=false;render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('layer').innerHTML)closeLayer();else if(S.modal)closeModal();}});

/* ---------- Assign ---------- */
function openAssign(){S.modal={k:'assign',who:'all',ppl:{}};render();}
function assignModal(){
  const m=S.modal, names=Object.keys(S.picked).map(id=>DOCS_ALL.find(d=>d.id===id).name);
  const nppl=m.who==='all'?PEOPLE.length:Object.keys(m.ppl).length;
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Assign"><div class="mh"><h2>Assign ${names.length===1?'1 course':names.length+' courses'}</h2><button class="ib" aria-label="Close" onclick="closeModal()">${I('fa-solid fa-xmark')}</button></div>
    <div class="mb"><div class="mut" style="font-size:14px;margin-bottom:8px">${names.map(esc).join(' · ')}</div>
      <button class="rd" role="radio" aria-checked="${m.who==='all'}" onclick="S.modal.who='all';render()"><i class="dot"></i>Everyone in this class (${PEOPLE.length})</button>
      <button class="rd" role="radio" aria-checked="${m.who==='some'}" onclick="S.modal.who='some';render()"><i class="dot"></i>Only some people</button>
      ${m.who==='some'?`<div style="margin:4px 0 0 26px;max-height:180px;overflow:auto">${PEOPLE.map((n,p)=>`<button class="rd" style="font-size:14px;padding:4px 0" onclick="S.modal.ppl[${p}]?delete S.modal.ppl[${p}]:S.modal.ppl[${p}]=1;render()"><span class="cb" aria-checked="${!!m.ppl[p]}">${I('fa-solid fa-check')}</span>${n}</button>`).join('')}</div>`:''}
      <div class="mut" style="font-size:13px;margin-top:10px">${I('fa-solid fa-circle-info')} It shows in their Home tab, and their answers appear in Results. People already assigned won’t get a second copy. Anyone who joins the class later needs to be assigned again.</div></div>
    <div class="mf"><button class="b b-ghost" onclick="closeModal()">Cancel</button><button class="b b-primary" ${nppl?'':'disabled'} onclick="doAssign(${nppl})">Assign to ${nppl} ${nppl===1?'person':'people'}</button></div></div>`;
}
function doAssign(n){const k=Object.keys(S.picked).length;S.modal=null;S.assign=false;S.picked={};render();snack(`Assigned ${k===1?'1 course':k+' courses'} to ${n} ${n===1?'person':'people'}. It shows in their Home tab.`);}

/* ---------- Progress ---------- */
function openProgress(p){S.modal={k:'progress',hl:p===undefined?null:p,sort:'name'};render();}
function cell(qz,p){
  const x=personQuiz(qz,p);
  /* outlined chips: the colour lives in the icon only */
  if(x.st==='na') return `<span class="oc mut" data-tip="Added after this course was assigned">Not assigned</span><button class="b b-ghost b-sm asg" onclick="assignOne('${qz.id}',${p})">Assign</button>`;
  if(x.st==='not') return `<span class="oc">${I('fa-regular fa-circle ic-mute')}Not started</span>`;
  if(x.st==='prog') return `<span class="oc">${I('fa-solid fa-spinner ic-info')}Question ${x.r+1} of ${x.tot}</span>${x.wrong?`<span class="hot-i cell-i" tabindex="0" data-tip="${wa(x.wrong)} so far">${I('fa-solid fa-flag')}</span>`:''}`;
  return x.st==='pass'?`<span class="oc">${I('fa-solid fa-circle-check ic-ok')}Passed · ${x.score}%</span>`:`<span class="oc">${I('fa-solid fa-circle-xmark ic-bad')}Failed · ${x.score}%</span>`;
}
/* simple overall status: Not started / In progress / Completed */
function miniStatus(p){const as=Q.filter(qz=>!isNA(qz,p));if(!as.length)return `<span class="oc mut">Not assigned</span>`;
  if(as.every(qz=>qz.reached[p]===qz.qs.length))return `<span class="oc">${I('fa-solid fa-circle-check ic-ok')}Completed</span>`;
  return as.some(qz=>qz.reached[p]>0)?`<span class="oc">${I('fa-solid fa-spinner ic-info')}In progress</span>`:`<span class="oc">${I('fa-regular fa-circle ic-mute')}Not started</span>`;}
/* overall status across every course assigned to the person */
function statusCell(p){
  const as=Q.filter(qz=>!isNA(qz,p)), done=as.filter(qz=>qz.reached[p]===qz.qs.length).length, started=as.some(qz=>qz.reached[p]>0);
  if(!as.length) return `<span class="oc mut">Not assigned</span>`;
  if(done===as.length) return `<span class="oc">${I('fa-solid fa-circle-check ic-ok')}Completed</span>`;
  if(!started) return `<span class="oc">${I('fa-regular fa-circle ic-mute')}Not started</span>`;
  return `<span class="oc">${I('fa-solid fa-spinner ic-info')}${done}/${as.length} done</span>`;
}
/* single screen: a minimal Progress (status only, nothing negative) until the instructor asks for more */
function miniCell(qz,p){const x=personQuiz(qz,p);
  if(x.st==='na') return `<span class="oc mut">Not assigned</span>`;
  if(x.st==='not') return `<span class="oc">${I('fa-regular fa-circle ic-mute')}Not started</span>`;
  if(x.st==='prog') return `<span class="oc">${I('fa-solid fa-spinner ic-info')}In progress</span>`;
  return `<span class="oc">${I('fa-solid fa-circle-check ic-ok')}Completed</span>`;}
function progressModal(){
  const m=S.modal, mini=S.single&&!S.showProg; let ids=PEOPLE.map((_,p)=>p);
  if(mini&&m.sort==='wrong') m.sort='name';
  if(m.sort==='wrong') ids.sort((a,b)=>wrongTotal(b)-wrongTotal(a));
  if(m.sort==='name') ids.sort((a,b)=>PEOPLE[a].localeCompare(PEOPLE[b]));
  return `<div class="modal wide" role="dialog" aria-modal="true" aria-label="Progress"><div class="mh"><h2>Progress</h2>${liveChip()}<button class="ib" aria-label="Close" onclick="closeModal()">${I('fa-solid fa-xmark')}</button></div>
    <div class="mb" style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="mut" style="font-size:14px">Everyone’s progress on the online courses assigned in this class.</span>
        <span style="margin-left:auto"></span>${S.single?`<button class="b b-sm" onclick="S.showProg=!S.showProg;render()">${I(mini?'fa-solid fa-eye':'fa-solid fa-eye-slash')}${mini?'Show more':'Show less'}</button>`:''}${mini?'':`<span class="mut">Sort</span><div class="seg"><button aria-pressed="${m.sort==='name'}" onclick="S.modal.sort='name';render()">A to Z</button><button aria-pressed="${m.sort==='wrong'}" onclick="S.modal.sort='wrong';render()">Most wrong answers first</button></div>`}</div>
      <div class="twrap"><table class="tbl ptbl${mini?' mini':''}"><thead><tr><th>Participant</th><th>Status</th>${mini?'':'<th>Wrong answers</th>'}${Q.map(qz=>`<th>${esc(qz.name)}<div class="sub">${qz.qs.length} questions${mini?'':` · pass ${qz.pass}%`}${qz.final?' · final exam':''}</div></th>`).join('')}<th class="fill"></th></tr></thead>
      <tbody>${ids.map(p=>{const miss=missingOf(p);return `<tr${m.hl===p?' class="hl"':''}><td><span style="display:flex;align-items:center;gap:8px">${Av(p)}<b style="font-weight:600">${PEOPLE[p]}</b>${miss.length>1?`<button class="b b-ghost b-sm asg" style="margin-left:auto" data-tip="Assign all ${miss.length} missing courses" onclick="assignPerson(${p})">Assign all</button>`:''}</span></td>
        <td>${mini?miniStatus(p):statusCell(p)}</td>
        ${mini?'':`<td>${wrongTotal(p)?`<span class="oc" tabindex="0" data-tip="${esc(wrongList(p))}">${I('fa-solid fa-flag')}${wrongTotal(p)}</span>`:'<span class="mut">0</span>'}</td>`}${Q.map(qz=>`<td>${mini?miniCell(qz,p):cell(qz,p)}</td>`).join('')}<td class="fill"></td></tr>`;}).join('')}</tbody></table></div></div>
    <div class="mf"><button class="b b-ghost" onclick="closeModal()">Close</button></div></div>`;
}

/* ---------- Results (with Most Challenging Questions) ---------- */
function openResults(pick,qi,focus){
  S.res.pick=pick||'all'; S.res.open={}; S.res.order=null; S.res.pending=false;
  if(qi!==null&&qi!==undefined) S.res.open[pick+':'+qi]=1;
  S.modal={k:'results'}; render();
}
function liveChip(){return `<span class="live${S.live?'':' snap'}" id="livechip">${S.live?'<span class="dot"></span>Live':I('fa-solid fa-pause')+'Paused'} <small>updated ${ago()}</small><button class="ib ib-sm" style="width:18px;height:18px" data-tip="Refresh now" onclick="tick(true)">${I('fa-solid fa-rotate')}</button></span>`;}
function resultsModal(){
  const r=S.res, mis=allMissed();
  const nh=needHelp();
  const ov=(id,ic,label,n)=>`<button class="pick ovp${r.pick===id?' on':''}" onclick="openResults('${id}')"><b>${I(ic)}${label}</b><span class="cnt">${n}</span></button>`;
  const picks=`<div class="pick-h">Overview</div>${ov('all','fa-solid fa-circle-exclamation','Most Challenging Questions',mis.length)}${ov('people','fa-solid fa-user-group','Students who need help',nh.length)}
    <div class="pick-h">Online courses<span>${Q.length} course${Q.length===1?'':'s'}</span></div>${Q.map(qz=>{const st=qz.qs.map((_,i)=>qStats(qz,i)), hard=st.filter(s=>s.bad&&s.pct>=50).length, started=PEOPLE.filter((_,p)=>qz.reached[p]>0).length;
      return `<button class="pick${r.pick===qz.id?' on':''}" onclick="openResults('${qz.id}')"><b>${esc(qz.name)}</b><small>${started} of ${assignedN(qz)} started${hard?` · <span style="font-weight:600" data-tip="Challenging = half or more of the people who answered chose a wrong answer (to confirm)">${hard} challenging</span>`:''}</small></button>`;}).join('')}`;
  return `<div class="modal wide" role="dialog" aria-modal="true" aria-label="Results"><div class="mh"><h2>Results</h2>${liveChip()}<button class="ib" aria-label="Close" onclick="closeModal()">${I('fa-solid fa-xmark')}</button></div>
    <div class="res"><nav class="res-l" aria-label="Pick a course">${picks}</nav><div class="res-r">${r.pick==='all'?resMCQ(mis):r.pick==='people'?resPeople(nh):resQuiz(Q.find(x=>x.id===r.pick))}</div></div>
    <div class="mf"><span class="mut" style="font-size:13px;margin-right:auto">${S.single?I('fa-solid fa-tv')+' Single screen: the class can see this screen.':I('fa-solid fa-lock')+' Only you see this. The second screen only shows what you present.'}</span><button class="b b-ghost" onclick="closeModal()">Close</button></div></div>`;
}
/* Overview tab 1 (Figma 412:365): every question with mistakes, all open, hardest first */
function resMCQ(mis){
  return `<div class="res-top"><h3>Most Challenging Questions</h3></div><div class="res-sum">The most challenging questions across all the assigned courses.</div>
    ${mis.length?mis.map((m,k)=>{const q=m.q;
      return `<div class="mcq"><span class="no">${k+1}.</span><div class="mq-b">
        <div class="mq-h"><b>${esc(q.t)}</b><span class="chip chip-warning">${m.bad} of ${m.n} chose a wrong answer</span><button class="ib ib-sm" data-tip="Present this question: answer counts only, no names" onclick="presentQ('${m.qz.id}',${m.i})">${I('fa-solid fa-display')}</button></div>
        <div class="mq-sub">Course: <button class="lnk" onclick="openResults('${m.qz.id}',${m.i})">${esc(m.qz.name)}</button> · Correct answer: <b class="mq-ok">${L[q.c]}. ${esc(q.o[q.c])}</b></div>
        <div class="mq-oh">Wrong options chosen${S.single?showBtn(m.qz.id+':'+m.i):''}</div>
        ${wrongPicks(m.qz,m.i).map(x=>`<div class="mq-opt"><div class="mq-oh2"><b>${L[x.o]}. ${esc(q.o[x.o])}</b><span class="chip">${x.ppl.length} chose this</span></div>${masked(m.qz.id+':'+m.i)?'':`<div class="mq-s">Students who chose this option:</div><div class="mq-ppl">${x.ppl.map(PChip).join('')}</div>`}</div>`).join('')}
      </div></div>`;}).join(''):`<div class="es"><div class="es-i">${I('fa-regular fa-face-smile')}</div><b>No wrong answers yet</b></div>`}`;
}
/* Overview tab 2: students who need help */
function resPeople(nh){
  return `<div class="res-top"><h3>Students who need help</h3></div><div class="res-sum">People with 3 or more wrong answers, across all the assigned courses.</div>
      ${S.single&&!S.rev.people?`<div class="res-gen"><b>${nh.length} ${nh.length===1?'student has':'students have'} 3 or more wrong answers.</b>${showBtn('people','Show students')}</div>`:(S.single?`<div class="res-gen"><b>${nh.length} ${nh.length===1?'student has':'students have'} 3 or more wrong answers.</b>${showBtn('people','Show students')}</div>`:'')+nh.map(x=>{const qs=[];Q.forEach(qz=>qz.qs.forEach((q,i)=>{if(q.w[x.p]!==undefined&&answered(qz,i,x.p))qs.push({qz,q,i,o:q.w[x.p]});}));
        /* one card per person: each question to go over, the option they chose and the correct one */
        return `<div class="mq-opt sp"><div class="mq-oh2">${Av(x.p)}<b>${x.n}</b><span class="chip">${wa(x.w)}</span></div>
          <details class="spd" ${S.res.sp?.[x.p]?'open':''} ontoggle="(S.res.sp=S.res.sp||{})[${x.p}]=this.open"><summary>${I('fa-solid fa-chevron-right')}See wrong questions</summary>${qs.map(y=>`<div class="spq"><div class="spt">${esc(y.q.t)}<small>${esc(y.qz.name)} · Question ${y.i+1}</small></div>
            <div class="spa"><span>Chose <b>${L[y.o]}. ${esc(y.q.o[y.o])}</b></span><span>Correct <b class="mq-ok">${L[y.q.c]}. ${esc(y.q.o[y.q.c])}</b></span></div></div>`).join('')}</details></div>`;}).join('')||'<div class="mut">Nobody yet.</div>'}`;
}
function resQuiz(qz){
  const r=S.res, st=qz.qs.map((_,i)=>qStats(qz,i));
  if(qz.order==='random') return `<div class="res-top"><h3>${esc(qz.name)}</h3></div><div class="rnd">${I('fa-solid fa-shuffle')}<span>This course shuffles its questions. Results show here as people answer.</span></div>`;
  let order=qz.qs.map((_,i)=>i);
  const ranked=order.slice().sort((a,b)=>st[b].bad-st[a].bad||st[b].pct-st[a].pct||a-b);
  if(r.sort==='missed'){ if(!r.order||r.order.qz!==qz.id) r.order={qz:qz.id,ids:ranked}; order=r.order.ids; }
  const started=PEOPLE.filter((_,p)=>qz.reached[p]>0).length, done=PEOPLE.filter((_,p)=>qz.reached[p]===qz.qs.length).length, na=(qz.na||[]).length;
  const changed=r.sort==='missed'&&r.order&&r.order.ids.join()!==ranked.join();
  return `<div class="res-top"><h3>${esc(qz.name)}</h3>${qz.final?'<span class="chip chip-info">Final exam</span>':''}<span class="chip">Pass ${qz.pass}%</span>
      <span class="r"><span class="mut">Sort</span><div class="seg"><button aria-pressed="${r.sort==='missed'}" onclick="S.res.sort='missed';S.res.order=null;render()">Most wrong answers first</button><button aria-pressed="${r.sort==='course'}" onclick="S.res.sort='course';render()">Course order</button></div></span></div>
    <div class="res-sum">${started} of ${assignedN(qz)} started · ${done} finished · click a question to see who chose what</div>
    ${changed?`<div class="newbar">${I('fa-solid fa-arrow-down-up-across-line')}New answers changed the order<button onclick="S.res.order=null;render()">Update order</button></div>`:''}
    ${order.map((i,k)=>qRow(qz,i,r.sort==='missed'?k+1:i+1,false)).join('')}`;
}
function qRow(qz,i,rank,showQuiz){
  /* the top-ranked question starts open so its answers and names show at a glance */
  const q=qz.qs[i], s=qStats(qz,i), key=qz.id+':'+i, open=key in S.res.open?!!S.res.open[key]:(showQuiz||S.res.sort==='missed')&&rank===1;
  const okN=s.n-s.bad, notYet=PEOPLE.map((_,p)=>p).filter(p=>!answered(qz,i,p)&&!isNA(qz,p)), naP=qz.na||[];
  const right=PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&q.w[p]===undefined);
  const wrongBy=q.o.map((_,o)=>PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&q.w[p]===o));
  const hot=s.n&&s.pct>=50, topWrong=Math.max(0,...wrongBy.filter((_,o)=>o!==q.c).map(x=>x.length));
  const det=`<div class="qd">${S.single?`<div class="res-gen">${masked(key)?'Names are hidden on a shared screen.':'Names are showing.'}${showBtn(key)}</div>`:''}
      <div class="ans ok"><span class="ltr">${L[q.c]}</span><span class="at"><b>${esc(q.o[q.c])}</b> <span class="mut" style="font-size:12px">correct answer</span><div class="ppl">${masked(key)?'':right.map(PChip).join('')||'<span class="mut" style="font-size:12px">Nobody yet</span>'}</div></span><span class="ct">${right.length}</span></div>
      ${q.o.map((o,oi)=>oi===q.c||!wrongBy[oi].length?'':`<div class="ans bad"><span class="ltr">${L[oi]}</span><span class="at"><b>${esc(o)}</b>${hot&&wrongBy[oi].length===topWrong?`<span class="hot-i" data-tip="Most chosen wrong answer: the main reason this question is challenging">${I('fa-solid fa-circle-exclamation')}</span>`:''}<div class="ppl">${Ppl(key,wrongBy[oi])}</div></span><span class="ct">${wrongBy[oi].length} chose this</span></div>`).join('')}
      ${notYet.length?`<div class="ans none"><span class="ltr">${I('fa-regular fa-clock')}</span><span class="at"><b class="mut">Not answered yet</b><div class="ppl">${Ppl(key,notYet)}</div></span><span class="ct mut">${notYet.length}</span></div>`:''}
      
    </div>`;
  return `<div class="qrow${open?' open':''}"><button class="qh" aria-expanded="${open}" onclick="S.res.open['${key}']=${open?0:1};render()">
      <span class="rk">${rank}${hot?`<span class="hot-i" data-tip="Challenging: half or more chose a wrong answer">${I('fa-solid fa-flag')}</span>`:''}</span><span class="qt">${esc(q.t)}<small>${showQuiz?esc(qz.name)+' · ':''}Question ${i+1}</small></span>
      <span class="st"><span><b>${s.n?`${okN} of ${s.n} correct`:'No answers yet'}</b><span class="mut">${s.n?wa(s.bad):''}</span></span>
        <span class="pb"><span class="bad" style="width:${s.n?s.bad/PEOPLE.length*100:0}%"></span><span class="ok" style="width:${s.n?okN/PEOPLE.length*100:0}%"></span></span></span>
      <span class="ch">${I('fa-solid fa-chevron-right')}</span></button>${det}</div>`;
}

/* =====================================================================
   LIVE: every 10 seconds a learner answers the next question (sample feed)
   ===================================================================== */
function tick(manual){
  if(manual){const c=document.getElementById('livechip');if(c)c.classList.add('spin');setTimeout(()=>{S.lastUpd=Date.now();render();},500);return;}
  if(!S.live) return;
  const f=FEED[S.feed]; if(!f){S.lastUpd=Date.now();render();return;}
  S.feed++;
  const [p,qid,wrong]=f, qz=Q.find(x=>x.id===qid);
  if(qz.reached[p]<qz.qs.length){ if(wrong>=0) qz.qs[qz.reached[p]].w[p]=wrong; qz.reached[p]++; }
  const c=document.getElementById('livechip'); if(c) c.classList.add('spin');
  setTimeout(()=>{S.lastUpd=Date.now();render();},500);
}
setInterval(()=>tick(false),10000);
setInterval(()=>{const c=document.getElementById('livechip');if(c&&!c.classList.contains('spin')){const sm=c.querySelector('small');if(sm)sm.textContent='updated '+ago();}},1000);

/* review bar */
function setDocs(on){S.docsOn=on;S.sel=null;S.assign=false;S.picked={};document.getElementById('rv-docs-some').classList.toggle('on',on);document.getElementById('rv-docs-none').classList.toggle('on',!on);render();}
function setLive(on){S.live=on;document.getElementById('rv-live-on').classList.toggle('on',on);document.getElementById('rv-live-off').classList.toggle('on',!on);render();}
function setMany(on){MANY=on;const m=S.modal;fresh();S.modal=m;document.getElementById('rv-c2').classList.toggle('on',!on);document.getElementById('rv-c10').classList.toggle('on',on);render();}
function setScen(k){SCEN=k;fresh();['live','good','empty'].forEach(x=>document.getElementById('rv-s-'+x).classList.toggle('on',x===k));render();}
function resetAll(){stopPresent();MANY=false;SCEN='live';setScen('live');setMany(false);setDocs(true);setLive(true);}
/* crossing into tablet width closes the drawers; back to desktop opens both panels */
let wasNarrow=narrow();
addEventListener('resize',()=>{const n=narrow();if(n!==wasNarrow){wasNarrow=n;S.left=S.right=!n;render();}});

/* tooltips (data-tip) */
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return;}
  tip.textContent=t.dataset.tip;tip.style.display='block';const r=t.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=(r.bottom+6+tip.offsetHeight>innerHeight?r.top-tip.offsetHeight-6:r.bottom+6)+'px';});
document.addEventListener('focusin',e=>{if(!e.target.closest('[data-tip]'))tip.style.display='none';});

render();
</script>
