<!DOCTYPE html>
<!--
  TKT-21402 · Instructor Dashboard (Classroom Calendar) · working prototype v1, 2026-10-20.
  Built from Mika's wireframes (Figma wireframe nodes 375-7590 default, 375-7588 Progress,
  375-7589 Results, 375-7594 Present window, 375-7617 Present empty, 375-6528 Documents variants)
  in the style of the Field Management prototype (Field Management prototype):
  the token block below is copied from it verbatim (Figma BIStrainer_UI-Library-Guide, Light, desktop).
  Sample data is invented. LOCAL ONLY.
  v4 lean (2026-11-02, Dan's impromptu meeting): copy of v3 with the overview cards, per-card assign and the
  participant/document search and sort removed (not on today's page), plus colour accents (type icons,
  avatars, green Done). Extended / Single screen setup kept.
  Nov 5 (Dan): profile photo from the person's account (initials if none), Adobe-style PDF icon,
  today's % correct bar graph kept on every Results question row.
  Also cut: late-joiner note + Assign, auto-refresh + Update order, name links to Progress, sort buttons in Progress/Results.
  v4.1 (2026-11-09, dev questions Nov 6 + Nov 9): keeps what today's page already does. HTML5 / link / .ppsx / slide-image
  PowerPoint documents, Slides list, fullscreen button + B key, course Preview walks every part, form columns in Progress,
  multi-answer questions in Results, Present greyed out with nothing selected, Question Pool tag + "Removed" option.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructor Dashboard · TKT-21402</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===================================================================
   1. DESIGN TOKENS (copied from the FM prototype, Figma BIStrainer_UI-Library-Guide)
   =================================================================== */
:root{
  --font-family-default:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --color-text-default:#19191A; --color-text-default-on-surface:#FEFEFE; --color-text-primary:#0078B3;
  --color-text-secondary:#636368; --color-text-secondary-light:#AFAFB5; --color-text-disabled:#AFAFB5;
  --color-text-success:#167B00; --color-text-error:#CC2222; --color-text-notice:#9C6300; --color-text-primary-alt:#3D63A7;
  --color-surface-background:#F8F8F8; --color-surface-default:#FEFEFE; --color-surface-default-inverse:#19191A;
  --color-surface-disabled:#F2F2F2; --color-surface-disabled-dark:#AFAFB5; --color-surface-secondary:#636368;
  --color-surface-secondary-light:#96969D; --color-surface-secondary-lighter:#DFDFE2; --color-surface-secondary-lightest:#F2F2F2;
  --color-surface-secondary-subtle:#F8F8F8; --color-surface-overlay:rgba(25,25,27,.25);
  --color-surface-primary:#0078B3; --color-surface-primary-light:#26B1DC; --color-surface-primary-lighter:#F0F9FE;
  --color-surface-primary-lightest:#F8FEFF; --color-surface-primary-dark:#095F8C;
  --color-surface-primary-alt-lighter:#E5EDFB;
  --color-surface-success:#167B00; --color-surface-success-lighter:#EBF8D6;
  --color-surface-error:#CC2222; --color-surface-error-light:#E95B5B; --color-surface-error-lighter:#FEE3E3; --color-surface-error-lightest:#FFF2F2;
  --color-surface-notice:#C37900; --color-surface-notice-lighter:#FFF3E1;
  --color-stroke-default:#AFAFB5; --color-stroke-default-light:#DFDFE2; --color-stroke-default-dark:#4C4C4F;
  --color-stroke-primary:#009ACB; --color-stroke-primary-lighter:#C9EFFA;
  --color-stroke-success:#399300; --color-stroke-success-light:#C2E387; --color-stroke-error:#CC2222; --color-stroke-error-light:#F99A9A;
  --color-stroke-notice-light:#FFD086;
  --color-icon-default:#4C4C4F; --color-icon-default-light:#AFAFB5; --color-icon-primary:#009ACB;
  --color-icon-success:#167B00; --color-icon-error:#CC2222; --color-icon-notice:#C37900;
  --spacing-xxSmall:4px; --spacing-xSmall:6px; --spacing-small:8px; --spacing-base:12px; --spacing-medium:16px; --spacing-large:24px;
  --border-radius-small:2px; --border-radius-base:4px; --border-radius-medium:8px; --border-radius-large:12px; --border-radius-round:80px;
  --shadow-L1:0 0 3px 0 rgba(0,0,0,.15); --shadow-L2:0 0 4px 0 rgba(0,0,0,.15); --shadow-L3:0 0 8px 0 rgba(0,0,0,.15); --shadow-L4:0 0 14px 0 rgba(0,0,0,.15);
  --shadow-menu:0 4px 16px 0 rgba(0,0,0,.08);
}
/* client portal theme (sample brand, local only): the calendar icon and the header bar take the portal colour */
:root{--portal-band:#0099CC; --portal-tint:#E3F4FA;}
/* aliases, same short names as the FM prototype */
:root{
  --font:var(--font-family-default);
  --text-default:var(--color-text-default); --text-secondary:var(--color-text-secondary); --text-secondary-light:var(--color-text-secondary-light); --text-on:var(--color-text-default-on-surface);
  --stroke-default:var(--color-stroke-default); --stroke-light:var(--color-stroke-default-light); --stroke-dark:var(--color-stroke-default-dark);
  --surface-default:var(--color-surface-default); --surface-subtle:var(--color-surface-secondary-subtle); --surface-lightest:var(--color-surface-secondary-lightest);
  --surface-lighter:var(--color-surface-secondary-lighter); --surface-inverse:var(--color-surface-default-inverse); --surface-background:var(--color-surface-background);
  --icon-default:var(--color-icon-default-light); --icon-solo:var(--color-icon-default); --icon-primary:var(--color-icon-primary);
  --r-sm:var(--border-radius-small); --r-base:var(--border-radius-base); --r-md:var(--border-radius-medium); --r-lg:var(--border-radius-large); --r-round:var(--border-radius-round);
  --primary:var(--color-surface-primary); --primary-hover:var(--color-surface-primary-dark); --primary-tint:var(--color-surface-primary-lighter); --primary-tint-2:var(--color-surface-primary-lightest);
  --primary-stroke:var(--color-stroke-primary); --primary-text:var(--color-text-primary);
  --success:var(--color-text-success); --success-tint:var(--color-surface-success-lighter);
  --danger:var(--color-text-error); --danger-fill:var(--color-surface-error); --danger-tint:var(--color-surface-error-lighter);
  --warning:var(--color-text-notice); --warning-tint:var(--color-surface-notice-lighter);
  --info:var(--color-text-primary); --info-tint:var(--color-surface-primary-lighter);
  --overlay:var(--color-surface-overlay);
  --h-btn:34px; --h-btn-sm:26px; --h-input:32px; --h-chip-sm:20px;
}

/* ===================================================================
   2. BASE
   =================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e6e6e9}
body{font:400 14px/20px var(--font);color:var(--text-default);display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--primary-stroke);outline-offset:2px}
.mut{color:var(--text-secondary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* review bar (not product UI) */
#review{background:#fff;border-bottom:1px solid #dfdfe2;display:flex;align-items:center;gap:16px;padding:4px 12px;font-size:12px;flex-wrap:wrap}
#review b{font-size:14px}
/* hidden by default so it doesn't read as part of the design; a small pill bottom-left shows it */
body:not(.rv-on) #review{display:none}
#rv-tog{position:fixed;left:10px;bottom:10px;z-index:200;font-size:12px;padding:4px 10px;border-radius:80px;background:#2a2a2e;color:#fff;opacity:.35;display:inline-flex;align-items:center;gap:6px}
#rv-tog:hover,body.rv-on #rv-tog{opacity:1}
#review .rv-f{display:flex;align-items:center;gap:6px;color:#4c4c4f}
#review .rv-seg{display:inline-flex;border:1px solid #afafb5;border-radius:80px;overflow:hidden}
#review .rv-seg button{padding:2px 10px;font-size:12px;border-left:1px solid #afafb5}
#review .rv-seg button:first-child{border-left:0}
#review .rv-seg button.on{background:#f8feff;color:#0078b3;font-weight:600}

/* ===================================================================
   3. COMPONENTS (BIS library look-alikes, from the FM prototype)
   =================================================================== */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h-btn);padding:4px 8px;border-radius:var(--r-base);border:1px solid var(--stroke-default);background:transparent;font-size:16px;line-height:26px;font-weight:600;white-space:nowrap;color:var(--text-secondary)}
.b.b-icon{width:var(--h-btn);padding:0}
.b:hover{background:var(--surface-lightest)}
.b i{font-size:15px}
.b-primary{background:var(--primary);border-color:transparent;color:var(--text-on)}
.b-primary:hover{background:var(--primary-hover)}
.b-ghost{border-color:transparent;color:var(--text-default)}
.b-ghost:hover{background:var(--surface-lightest)}
.b-sm{height:var(--h-btn-sm);padding:4px 6px;font-size:14px;line-height:18px}
.b-sm i{font-size:12px}
.b:disabled{opacity:.45}
.b-primary:disabled{opacity:1;background:var(--surface-disabled);color:var(--text-secondary-light)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r-base);color:var(--icon-solo);font-size:14px;flex-shrink:0}
.ib:hover{background:var(--surface-lightest)}
.ib:disabled{color:var(--text-secondary-light)}
.ib:disabled:hover{background:none}
.ib-sm{width:24px;height:24px;font-size:13px}
.colbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--stroke-default);background:var(--surface-default);display:inline-flex;align-items:center;justify-content:center;color:var(--icon-default);font-size:12px;flex-shrink:0}
.colbtn:hover{background:var(--surface-lightest);color:var(--icon-solo)}
.chip{display:inline-flex;align-items:center;gap:4px;height:var(--h-chip-sm);padding:2px 4px;border-radius:var(--r-sm);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;border:1px solid var(--stroke-default);background:var(--surface-default);color:var(--text-secondary)}
.chip i{font-size:11px}
.chip-danger{background:var(--danger-tint);border-color:transparent;color:var(--danger)}
.chip-warning{background:var(--warning-tint);border-color:transparent;color:var(--warning)}
.chip-success{background:var(--success-tint);border-color:transparent;color:var(--success)}
.chip-info{background:var(--info-tint);border-color:transparent;color:var(--info)}
.chip-grey{background:var(--surface-lightest);border-color:transparent;color:var(--text-secondary)}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:2px 4px;border-radius:12px;background:var(--surface-lighter);font-size:12px;line-height:16px;font-weight:600;color:var(--text-secondary)}
.cnt-primary{background:var(--primary);color:var(--text-on)}
#tip{position:fixed;z-index:3000;display:none;max-width:340px;white-space:pre-line;background:var(--surface-inverse);color:var(--text-on);font-size:14px;line-height:20px;padding:4px 8px;border-radius:var(--r-base);pointer-events:none;box-shadow:var(--shadow-L2)}
.seg{display:inline-flex;border:1px solid var(--stroke-default);border-radius:var(--r-base);overflow:hidden;background:var(--surface-default);height:30px}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;font-size:14px;color:var(--text-default)}
.seg button+button{border-left:1px solid var(--stroke-default)}
.seg button i{font-size:13px;color:var(--icon-default)}
.seg button[aria-pressed="true"]{background:var(--primary-tint-2);color:var(--primary-text);font-weight:600}
.seg button[aria-pressed="true"] i{color:var(--primary-text)}
.search{position:relative;display:flex;align-items:center;height:var(--h-input);flex:1;min-width:0}
.search i{position:absolute;left:10px;color:var(--icon-default);font-size:12px;pointer-events:none}
.search input{width:100%;height:var(--h-input);padding:4px 8px 4px 30px;border:1px solid var(--stroke-default);border-radius:var(--r-base);background:var(--surface-default);font-size:15px;outline:none}
.search input:focus{border-color:var(--primary-stroke)}
.cb{width:16px;height:16px;border-radius:2px;border:1.5px solid var(--stroke-dark);background:var(--surface-default);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.cb i{font-size:10px;color:#fff;display:none}
.cb[aria-checked="true"]{background:var(--icon-primary);border-color:var(--icon-primary)}
.cb[aria-checked="true"] i{display:block}
.rd{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px;width:100%}
.rd i.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--stroke-dark);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.rd[aria-checked="true"] i.dot{border-color:var(--icon-primary)}
.rd[aria-checked="true"] i.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--icon-primary)}
.menu{position:fixed;z-index:2500;min-width:230px;background:var(--surface-default);border:1px solid var(--stroke-default);border-radius:var(--r-base);box-shadow:var(--shadow-menu);padding:4px}
.menu .mhd{padding:8px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border-radius:var(--r-base);font-size:16px;line-height:24px}
.menu .mi:hover{background:var(--surface-lightest)}
.menu .mi.on{color:var(--primary-stroke)}
.menu .mi .ck{margin-left:auto;font-size:12px}
.ov{position:fixed;inset:0;background:var(--overlay);z-index:1500;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surface-default);border-radius:var(--r-base);box-shadow:var(--shadow-L1);width:100%;max-width:525px;display:flex;flex-direction:column;max-height:88vh}
.modal .mh{display:flex;align-items:center;gap:8px;padding:16px 16px 6px}
.modal .mh h2{font-size:20px;line-height:28px;font-weight:600;margin-right:auto}
.modal .mb{padding:12px 16px 16px;overflow:auto;font-size:15px;line-height:22px}
.modal .mf{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--stroke-light)}
.modal.wide{width:94vw;max-width:94vw;height:88vh}
#snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2800;display:flex;flex-direction:column;gap:8px;align-items:center}
.snack{display:flex;align-items:center;gap:12px;background:var(--surface-default);padding:12px;border-radius:var(--r-md);box-shadow:var(--shadow-L2);font-size:14px;min-width:300px}
.snack i{color:var(--icon-primary);font-size:16px}
.es{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:32px 16px}
.es .es-i{width:48px;height:48px;border-radius:50%;background:var(--surface-lightest);display:flex;align-items:center;justify-content:center;color:var(--icon-default);font-size:20px;margin-bottom:4px}
.es b{font-size:16px;line-height:24px;font-weight:600}
.es p{font-size:14px;line-height:20px;color:var(--text-secondary);max-width:300px}
.es .es-a{margin-top:8px}
.live{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid var(--stroke-default);border-radius:var(--r-round);font-size:13px;font-weight:600;background:var(--surface-default);white-space:nowrap}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--color-icon-success);box-shadow:0 0 0 2px var(--surface-lightest);animation:pulse 2s ease-in-out infinite}
.live small{font-size:12px;font-weight:400;color:var(--text-secondary)}
.live .fa-rotate{font-size:11px;color:var(--icon-default)}
.live.spin .fa-rotate{animation:spin .8s linear infinite;color:var(--icon-primary)}
@keyframes pulse{50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.live .dot,.live.spin .fa-rotate{animation:none}}
/* status value (FM statusValue): small tinted round icon + text */
.sv{display:inline-flex;align-items:center;gap:6px}
.sv .sv-i{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.sv-neg .sv-i{background:var(--danger-tint);color:var(--color-icon-error)}
.sv-wait .sv-i{background:var(--warning-tint);color:var(--color-icon-notice)}
.sv-pos .sv-i{background:var(--success-tint);color:var(--color-icon-success)}
/* progress bar */
.pb{height:6px;border-radius:6px;background:var(--surface-lightest);overflow:hidden;display:flex}
.pb span{display:block;height:100%}
.pb .ok{background:var(--color-surface-success)}
.pb .bad{background:var(--stroke-default)}
.pb .on{background:var(--primary-stroke)}

/* ===================================================================
   4. PAGE SHELL
   =================================================================== */
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface-default);margin:12px;border:1px solid var(--stroke-light);box-shadow:var(--shadow-L2)}
.topbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 16px;border-bottom:1px solid var(--stroke-light);background:var(--surface-default)}
.crumb{display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px;color:var(--text-secondary)}
.crumb button{color:var(--text-secondary)}
.crumb button:hover{text-decoration:underline;color:var(--primary-text)}
.crumb .sl{color:var(--text-secondary-light)}
.crumb b{color:var(--text-default);font-weight:600}
.topbar .r{margin-left:auto;display:flex;align-items:center;gap:4px}
.body{flex:1;min-height:0;display:flex}
.side{flex-shrink:0;background:var(--surface-default);display:flex;flex-direction:column;min-height:0;transition:width .15s}
.side.left{width:320px;border-right:1px solid var(--stroke-light)}
.side.right{width:360px;border-left:1px solid var(--stroke-light)}
.side .full{display:flex;flex-direction:column;min-height:0;flex:1}
.side.c{width:0;border:0;overflow:hidden}
/* a dismissed panel leaves only a floating tab on the page edge */
.body{position:relative}
.fab{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:26px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--surface-default);border:1px solid var(--stroke-light);box-shadow:var(--shadow-L3);color:var(--icon-solo);font-size:12px}
.fab:hover{background:var(--primary-tint);color:var(--primary-text);border-color:var(--primary-stroke)}
.fab.l{left:0;border-left:0;border-radius:0 var(--r-md) var(--r-md) 0}
.fab.r{right:0;border-right:0;border-radius:var(--r-md) 0 0 var(--r-md)}
.sec-h{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.sec-h h3{font-size:16px;line-height:24px;font-weight:600}
.sec-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-background)}

/* left: overview cards (FM .blk widget cards) */
.ovw{padding:0 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--stroke-light)}
.blk{border:1px solid var(--stroke-light);border-radius:var(--r-md);padding:8px 10px;min-width:0;text-align:left;background:var(--surface-default);position:relative}
button.blk:hover{border-color:var(--stroke-default);box-shadow:var(--shadow-L1)}
.blk.wide{grid-column:1/-1}
.blk .k{display:flex;align-items:center;gap:4px;font-size:11px;line-height:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)}
.blk .k i{font-size:9px}
.blk .v{font-size:16px;line-height:24px;margin-top:2px}
.blk .v b{font-weight:600}
.blk .v2{font-size:12px;line-height:16px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* left: participant list */
.plist{flex:1;min-height:0;overflow:auto;padding:0 4px 12px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:var(--r-base);border-bottom:1px solid var(--stroke-light)}
.prow:hover{background:var(--surface-subtle)}
.av{width:30px;height:30px;border-radius:50%;background:var(--color-surface-primary-alt-lighter);color:var(--color-text-primary-alt);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.prow .t{display:block;flex:1;min-width:0}
.qh .st .gbar{justify-content:flex-start}.qh .st .gbar span{display:block;font-size:0}
.gbar{display:flex;align-items:center;gap:8px;width:100%;min-width:220px;height:22px;border-left:2px solid #333}.gbar span{display:block;height:18px;border-radius:0 3px 3px 0}.gbar b{font-size:13px;white-space:nowrap}
.pdf-adobe{width:1em;height:1.25em;display:inline-block;vertical-align:-.25em}.tile .th .pdf-adobe{width:30px;height:38px}
.agraph{width:min(94%,900px);background:#fff;box-shadow:var(--shadow-L1);border-radius:4px;padding:10px 16px;max-height:100%;overflow:auto;align-self:flex-start;margin-top:12px}
.ag-r{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(140px,38%);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--stroke-light);font-size:14px}
.ag-q{font-weight:600}.ag-n{color:var(--primary-text);font-weight:600;text-align:right}
.ag-b{display:flex;align-items:center;gap:8px;border-left:2px solid #333;padding-left:0;height:24px}.ag-f{display:block;height:20px;border-radius:0 3px 3px 0}.ag-b b{font-size:13px}
/* v4 lean: colour accents */
.av-photo{overflow:hidden;padding:0;background:none}.av-photo img{display:block;width:100%;height:100%;object-fit:cover}
.k-pdf{color:#d93a2b!important}.k-course{color:#1f6fd1!important}.k-ppt{color:#d2591f!important}.k-video{color:#7a3fc4!important}.k-photo{color:#1d8a5a!important}
.done-ok{color:#22743a;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.lean-btns{display:flex;gap:8px;padding:0 12px 10px}.lean-btns .b{flex:1;justify-content:center}
.prow .n .chip{height:18px;padding:1px 4px;font-size:11px}
.prow .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.prow .s{display:block;font-size:12px;line-height:16px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .m small{white-space:nowrap}
.prow .m .wr{color:var(--text-secondary);font-weight:600}
/* present window: a question for the class, counts only */
.pq{width:min(90%,900px);background:#fff;border-radius:12px;padding:28px 32px;color:var(--text-primary)}
.pq-k{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
.pq h2{font-size:26px;line-height:34px;margin:6px 0 16px}
.pq-o{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--stroke-light);border-radius:8px;margin-top:8px;font-size:18px}
.pq-o .t{flex:1}.pq-o .t small{display:block;font-size:13px;color:var(--text-secondary)}
.pq-o .n{font-weight:600}
.pq-o .ltr{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--stroke-default);font-weight:600;flex-shrink:0}
.pq-o.ok{background:var(--success-tint);border-color:var(--color-stroke-success-light)}
.pq-o.ok .ltr{background:var(--color-surface-success);color:#fff;border-color:transparent}
.prow .m{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:64px;flex-shrink:0}
.prow .m .pb{width:64px}
.prow .m small{font-size:12px;color:var(--text-secondary)}

/* centre: the course header (FM hero, flushed) */
.hero{background:var(--surface-default);border-bottom:1px solid var(--stroke-light)}
.hero .hb{height:20px;background:var(--portal-tint);border-bottom:1px solid var(--stroke-light)}
.hero .hm{display:flex;align-items:flex-start;gap:14px;padding:0 16px 12px}
.hero .hi{width:48px;height:48px;border-radius:50%;background:var(--surface-default);border:3px solid var(--surface-default);box-shadow:var(--shadow-L2);margin-top:-18px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--portal-band);flex-shrink:0}
.hero .ht{flex:1;min-width:0;padding-top:6px}
.hero h2{font-size:20px;line-height:28px;font-weight:600}
.hero .hmeta{font-size:14px;line-height:22px;color:var(--text-secondary);display:flex;gap:6px;flex-wrap:wrap}
.hero .hmeta b{color:var(--text-default);font-weight:600}
.hero .hmeta .sep{color:var(--text-secondary-light)}
.hero .hact{display:flex;gap:8px;padding-top:10px}
/* centre: preview stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px}
.pv{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface-default);border:1px solid var(--stroke-light);border-radius:var(--r-md);overflow:hidden}
.pv-h{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--stroke-light);min-height:50px}
.pv-h .ti{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.pv-h .ti b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-h .ti .tyi{color:var(--icon-default)}
.pv-b{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--surface-lightest);position:relative;overflow:hidden}
.pv-f{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--stroke-light);font-size:13px;color:var(--text-secondary)}
.pv-f .r{margin-left:auto;display:flex;align-items:center;gap:4px}
.onair{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-round);background:var(--danger-tint);color:var(--danger);font-size:13px;font-weight:600;white-space:nowrap}
.onair .dot{width:8px;height:8px;border-radius:50%;background:var(--danger-fill);animation:pulse 1.6s ease-in-out infinite}
/* content renderings (shared by the preview and the second screen) */
.cv-pdf{width:min(56%,420px);aspect-ratio:8.5/11;background:#fff;box-shadow:var(--shadow-L3);padding:7% 8%;display:flex;flex-direction:column;gap:8px}
.cv-pdf .l{height:7px;background:#e4e4e8;border-radius:2px}
.cv-pdf .h{height:14px;width:60%;background:#c9c9ce;border-radius:2px;margin-bottom:8px}
.cv-media{width:min(84%,760px);aspect-ratio:16/9;background:#26262a;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;position:relative}
.cv-media small{position:absolute;left:12px;bottom:10px;font-size:13px;opacity:.8}
.cv-photo{width:min(70%,640px);aspect-ratio:4/3;background:linear-gradient(135deg,#cfe6f1,#e9f3e1);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#7c98a8;font-size:56px}
.cv-slide{width:min(84%,760px);aspect-ratio:16/9;background:#fff;box-shadow:var(--shadow-L3);display:flex;flex-direction:column;justify-content:center;padding:6%;gap:12px}
.cv-slide h4{font-size:clamp(18px,2.4vw,34px);line-height:1.2;color:var(--color-surface-primary-dark)}
.cv-slide p{font-size:clamp(12px,1.2vw,18px);color:var(--text-secondary)}
.cv-q{width:min(84%,700px);background:#fff;box-shadow:var(--shadow-L3);border-radius:4px;padding:24px}
.cv-q .qn{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)}
.cv-q h4{font-size:20px;line-height:28px;margin:4px 0 14px}
.cv-q .op{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--stroke-light);border-radius:var(--r-base);margin-top:8px;font-size:15px}
.cv-q .op span{width:22px;height:22px;border-radius:50%;border:1px solid var(--stroke-default);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-secondary)}
.cv-empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-secondary);text-align:center;padding:24px}
.cv-empty .es-i{width:56px;height:56px;border-radius:50%;background:var(--surface-default);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--icon-default)}
.cv-empty b{color:var(--text-default);font-size:16px}

/* right: documents */
.dtools{display:flex;align-items:center;gap:6px;padding:0 12px 10px}
.dlist{flex:1;min-height:0;overflow:auto;padding:0 12px 12px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--stroke-light);border-radius:var(--r-md);background:var(--surface-default);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;position:relative;text-align:left}
.tile:hover{border-color:var(--stroke-default);box-shadow:var(--shadow-L1)}
.tile.sel{border-color:var(--primary-stroke);box-shadow:0 0 0 1px var(--primary-stroke)}
.tile .tn{font-size:13px;line-height:18px;font-weight:600;padding:8px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .th{height:84px;margin:0 8px;border-radius:var(--r-base);background:var(--surface-lightest);display:flex;align-items:center;justify-content:center;color:var(--icon-default);font-size:28px;overflow:hidden}
.tile .th .mini{width:52px;height:68px;background:#fff;box-shadow:var(--shadow-L1);padding:6px;display:flex;flex-direction:column;gap:4px}
.tile .th .mini i{display:block;height:3px;background:#e1e1e5;border-radius:1px}
.tile .tf{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 8px}
.tile .tf .chip{margin-right:auto}
.tile.off{background:var(--surface-lightest);cursor:not-allowed}
.tile.off .tn,.tile.off .chip{color:var(--text-secondary-light)}
.tile.off .th{opacity:.5}
.drow{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 8px;border-bottom:1px solid var(--stroke-light);cursor:pointer;border-radius:var(--r-base)}
.drow:hover{background:var(--surface-subtle)}
.drow.sel{background:var(--primary-tint)}
.drow .t{flex:1;min-width:0}
.drow .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .s{font-size:12px;line-height:16px;color:var(--text-secondary)}
.drow.off{background:var(--surface-lightest);cursor:not-allowed}
.drow.off .n,.drow.off .s{color:var(--text-secondary-light)}
.warn-i{color:var(--color-icon-notice);font-size:12px}
.na-t{font-size:12px;font-weight:400;color:var(--text-secondary);margin-left:6px}
.selbar.warnbar{background:var(--warning-tint);border-color:var(--color-stroke-notice-light);color:var(--warning)}
.selbar.warnbar button{margin-left:auto;font-weight:600;text-decoration:underline;color:var(--warning)}
.selbar{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:6px 10px;border-radius:var(--r-base);background:var(--info-tint);border:1px solid var(--color-stroke-primary-lighter);font-size:13px;color:var(--info)}

/* Progress modal: table */
.tbl{width:100%;border:1px solid var(--stroke-default);border-radius:var(--r-sm);border-collapse:separate;border-spacing:0;overflow:hidden}
.tbl th{text-align:left;font-size:14px;font-weight:600;padding:0 10px 0 12px;height:42px;border-bottom:1px solid var(--stroke-default);white-space:nowrap;background:var(--surface-default);position:sticky;top:0}
.tbl td{padding:8px 10px 8px 12px;border-bottom:1px solid var(--stroke-light);vertical-align:middle;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl .sub{font-size:12px;line-height:16px;color:var(--text-secondary)}
.tbl th .sub{font-weight:400}
/* Progress: the table scrolls sideways for many courses; Participant and To review stay fixed on the left */
.twrap{overflow:auto;border:1px solid var(--stroke-default);border-radius:var(--r-sm);max-height:calc(88vh - 190px)}
.twrap .tbl{border:0;border-radius:0;overflow:visible;width:max-content;min-width:100%}
.ptbl th{z-index:2}
.ptbl th:nth-child(n+4),.ptbl td:nth-child(n+4){min-width:220px;width:220px}
/* an empty last column takes the spare width, so the table fills the modal while course columns stay left */
.ptbl th.fill,.ptbl td.fill{width:auto;min-width:0;padding:0}
.ptbl th:first-child,.ptbl td:first-child{position:sticky;left:0;z-index:3;background:var(--surface-default);min-width:220px;width:220px;white-space:nowrap}
.ptbl th:nth-child(2),.ptbl td:nth-child(2){position:sticky;left:220px;z-index:3;background:var(--surface-default);min-width:130px;width:130px}
.ptbl th:nth-child(3),.ptbl td:nth-child(3){position:sticky;left:350px;z-index:3;background:var(--surface-default);min-width:100px;width:100px;border-right:1px solid var(--stroke-default)}
.ptbl th:nth-child(-n+3){z-index:4}
.ptbl tr.hl td{background:var(--primary-tint)}
/* outlined status chip: neutral text and border, coloured icon */
.ptbl td+td,.ptbl th+th{border-left:1px solid var(--stroke-light)}
.oc{display:inline-flex;align-items:center;gap:6px;height:24px;padding:2px 0;font-size:13px;color:var(--text-default);white-space:nowrap;vertical-align:middle}
.oc i{font-size:12px}
.ic-ok{color:var(--color-icon-success)} .ic-bad{color:var(--color-icon-error)} .ic-warn{color:var(--color-icon-notice)} .ic-info{color:var(--color-icon-primary)} .ic-mute{color:var(--icon-default)}
.cell-i{color:var(--color-icon-error);font-size:13px;margin-left:6px;vertical-align:middle;cursor:help}
.asg{color:var(--text-secondary);font-weight:600;margin-left:4px}
.asg:hover{color:var(--primary-text)}

/* Results view */
.res{display:flex;flex:1;min-height:0;border-top:1px solid var(--stroke-light)}
.res-l{width:270px;flex-shrink:0;border-right:1px solid var(--stroke-light);overflow:auto;padding:8px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 10px;border-radius:var(--r-base);border:1px solid transparent;margin-bottom:2px}
.pick:hover{background:var(--surface-lightest)}
.pick.on{background:var(--primary-tint);border-color:var(--primary-stroke)}
.pick b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.pick.on b{color:var(--primary-text)}
.pick small{font-size:12px;line-height:16px;color:var(--text-secondary)}
.pick-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);padding:10px 10px 4px;display:flex}
.pick-h span{margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0;font-size:12px}
.pick.ovp{flex-direction:row;align-items:center;padding:12px 10px}
.pick.ovp .cnt{margin-left:auto}
/* Most Challenging Questions: every question open, options picked instead with names */
.mcq{display:flex;gap:10px;padding:4px 0 16px}
.mcq .no{font-size:13px;color:var(--text-secondary);padding-top:2px;width:18px;flex-shrink:0}
.mcq .mq-b{flex:1;min-width:0}
.mcq .mq-h{display:flex;align-items:center;gap:8px}
.mcq .mq-h b{font-size:15px;font-weight:600;margin-right:auto}
.mcq .mq-sub{font-size:13px;color:var(--text-secondary);margin-top:2px}
.mcq .mq-ok{color:var(--color-text-success,var(--text-primary));font-weight:600}
.lnk{color:var(--primary-text);font-size:inherit}.lnk:hover{text-decoration:underline}
.mcq .mq-oh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);margin:12px 0 6px}
.mcq .mq-opt{border:1px solid var(--stroke-light);border-radius:var(--r-md);padding:9px;margin-bottom:8px}
.mcq .mq-oh2{display:flex;align-items:center;gap:8px}.mcq .mq-oh2 b{font-size:14px;font-weight:600;margin-right:auto}
.mcq .mq-opt .mq-s{font-size:13px;color:var(--text-secondary);margin:6px 0 4px}
.mcq .mq-ppl{display:flex;flex-wrap:wrap;gap:6px}
/* Students who need help: one card per person */
.sp{margin-bottom:10px;border:1px solid var(--stroke-light);border-radius:var(--r-md);padding:10px 12px}.sp .mq-oh2{display:flex;align-items:center;gap:8px;margin-bottom:4px}.sp .mq-oh2 b{font-size:14px;font-weight:600;margin-right:auto}
.spd summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--primary-text);padding:2px 0}
.spd summary::-webkit-details-marker{display:none}
.spd summary i{font-size:10px;transition:transform .12s}.spd[open] summary i{transform:rotate(90deg)}
.spq{padding:8px 0 2px;border-top:1px solid var(--stroke-light);margin-top:6px}
.spt{font-size:13px;font-weight:600}.spt small{display:block;font-weight:400;font-size:12px;color:var(--text-secondary)}
.spa{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--text-secondary);margin-top:4px}.spa b{color:var(--text-primary);font-weight:600}.spa .mq-ok{color:var(--color-text-success,var(--text-primary))}
/* single screen */
.ptbl.mini th:nth-child(3),.ptbl.mini td:nth-child(3){position:static;min-width:220px;width:220px;border-right:0}
.ptbl.mini th:nth-child(2),.ptbl.mini td:nth-child(2){border-right:1px solid var(--stroke-default)}
.prow .m .oc{font-size:12px;white-space:nowrap}
.blk .v.vq{font-size:14px;line-height:20px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scr-chip{display:inline-flex;align-items:center;gap:4px}
.hero .hact .scr-chip{align-self:center}
.scr-mi{align-items:flex-start;gap:10px;white-space:normal;text-align:left}
.scr-mi>i{margin-top:3px}
.scr-mi b{display:block;font-weight:600}.scr-mi small{display:block;font-size:12px;line-height:16px;color:var(--text-secondary)}
.modal{position:relative}
.modal.priv>*:not(.mh):not(.mf):not(.cover){filter:blur(9px);pointer-events:none;user-select:none}
.cover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface-default);border:1px solid var(--stroke-light);border-radius:var(--r-md);box-shadow:var(--shadow-L1);padding:24px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:360px}
.cover .es-i{font-size:20px}.cover b{font-size:16px}.cover p{font-size:14px;color:var(--text-secondary);margin:0 0 6px}
#pres1{position:fixed;inset:0;z-index:300;background:#1d1d20;display:flex;flex-direction:column}
#pres1 .pw-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#2a2a2e;color:#e8e8ec;font-weight:600}
#pres1 .pw-h .r{margin-left:auto;display:flex;gap:6px}#pres1 .pw-h button{color:#e8e8ec;border-color:#5c5c62;background:transparent}#pres1 .pw-h button.on{background:#38383d}
#pres1 .p1-b{flex:1;display:flex;min-height:0}
.p1-docs{width:300px;flex-shrink:0;background:#2a2a2e;border-left:1px solid #3a3a3f;overflow:auto;padding:8px}
.p1-h{color:#a9a9b0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px}
.p1-d{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 8px;border-radius:8px;color:#e8e8ec;min-height:48px}
.p1-d:hover{background:#34343a}.p1-d.on{background:#3d4a57}
.p1-d b{display:block;font-size:14px;font-weight:600}.p1-d small{font-size:12px;color:#a9a9b0}
.p1-d .tyi{width:28px;text-align:center;color:#a9a9b0}
.res-gen{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--stroke-default);border-radius:var(--r-md);font-size:14px;margin:6px 0}
.res-gen .b{margin-left:auto}
.mq-oh .b{margin-left:10px;text-transform:none;letter-spacing:0;font-weight:400}
.scr-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:var(--r-round);border:1px solid var(--stroke-light);background:var(--surface-lightest);color:var(--text-secondary);font-size:11px;font-weight:400;white-space:nowrap;flex-shrink:0}
.scr-badge i{font-size:10px;opacity:.8}.scr-badge:hover{border-color:var(--stroke-default)}
#pres1 .pw-b{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
#pres1 .pw-b .cv-pdf{width:min(46%,560px)} #pres1 .pw-b .cv-media,#pres1 .pw-b .cv-slide,#pres1 .pw-b .cv-q{width:min(90%,1200px)}
/* drag a document onto the preview */
.stage.drop .pv{outline:2px dashed var(--primary-stroke,#1a73e8);outline-offset:-2px}
.stage.drop .pv-b::after{content:'Drop to preview';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);font-weight:600;font-size:16px;color:var(--primary-text)}
.res-r{flex:1;min-width:0;overflow:auto;padding:16px 20px 24px}
.res-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.res-top h3{font-size:18px;line-height:26px;font-weight:600;margin-right:4px}
.res-top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.res-sum{font-size:14px;color:var(--text-secondary);margin-bottom:12px}
.private{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);padding:6px 10px;border-radius:var(--r-base);background:var(--surface-subtle);border:1px solid var(--stroke-light);margin-bottom:12px}
.newbar{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:8px;border-radius:var(--r-base);background:var(--info-tint);color:var(--info);font-size:13px;font-weight:600}
.newbar button{margin-left:auto;color:var(--primary-text);text-decoration:underline}
.qrow{border:1px solid var(--stroke-light);border-radius:var(--r-md);margin-bottom:8px;background:var(--surface-default);overflow:hidden}
.ans .at .hot-i{color:var(--color-icon-warning,var(--warning));font-size:13px;margin-left:6px}
.qh .rk{display:flex;align-items:center;justify-content:flex-start;gap:6px}
.qh .rk .hot-i{color:var(--color-icon-warning,var(--warning));font-size:13px}
.qh{display:grid;grid-template-columns:40px 1fr 300px 20px;gap:12px;align-items:center;width:100%;padding:10px 12px}
.qh:hover{background:var(--surface-subtle)}
.qh .rk{font-size:13px;font-weight:600;color:var(--text-secondary);text-align:center}
.qh .qt{font-size:14px;line-height:20px;font-weight:600}
.qh .qt small{display:block;font-weight:400;font-size:12px;color:var(--text-secondary)}
.qh .st{display:flex;flex-direction:column;gap:4px}
.qh .st span{font-size:13px;display:flex;justify-content:space-between}
.qh .st span b{font-weight:600}
.qh .st .pb{height:8px}
.qh .ch{color:var(--icon-default);font-size:12px;transition:transform .12s}

<script>
/* =====================================================================
   DATA (invented). 8 learners, 2 quizzes pushed through Student Access.
   ===================================================================== */
/* Noah Kim, Ella Park and Raj Gill (8, 9, 10) joined the class after the courses were assigned, so nothing is assigned to them (qz.na) */
const PEOPLE=['Jordan Lee','Priya Shah','Marcus Chen','Aisha Bello','Tom Rivera','Mary Okafor','Sam Patel','Lena Novak','Noah Kim','Ella Park','Raj Gill'];
const LATE=[]; /* v4 lean: courses go to everyone in the event automatically, so nobody is ever "not assigned" */
const ini=n=>n.split(' ').map(x=>x[0]).join('');
const L='ABCD';
/* each question: text, options, correct index, wrong = {person index: option picked}; answered = person reached it */
const QUIZZES=[
  {id:'kc',name:'WHMIS Knowledge Check',short:'Check',pass:80,final:false,order:'fixed',na:LATE.slice(),
   qs:[
    {t:'What does WHMIS stand for?',o:['Workplace Hazardous Materials Information System','Workers Health and Materials Inspection System','Workplace Health Management Information Service','Waste Handling and Materials Information System'],c:0,w:{}},
    {t:'Which pictogram means a product can catch fire?',o:['Flame','Flame over circle','Exploding bomb','Gas cylinder'],c:0,w:{1:1,3:1,7:1}},
    {t:'Who must provide the Safety Data Sheet (SDS)?',o:['The supplier','The worker','The safety committee','The fire department'],c:0,w:{2:2}},
    {t:'How often must WHMIS training be reviewed?',o:['At least once a year','Every five years','Only when you are hired','Never'],c:0,w:{1:1,5:1}},
    {t:'When do you need a workplace label?',o:['When a product is poured into another container','Only on the original container','Only for liquids','Never, if you know the product'],c:0,w:{2:1}},
    /* v4.1: a question with more than one correct answer ("select all that apply"). w[p] = every option that person chose (arrays); cs = the correct set */
    {t:'Which of these must a workplace label include?',multi:true,o:['Product name','Safe handling instructions','A reference to the SDS','The purchase date'],c:0,cs:[0,1,2],w:{1:[0,3],3:[0,1],5:[0,1,2,3]}},
   ],pre:[{k:'video',t:'Welcome to WHMIS',p:'3:10'},{k:'page',t:'Your rights as a worker',p:'The right to know, the right to participate and the right to refuse unsafe work'}],
   reached:[6,6,6,6,3,6,0,6,0,0,0]},
  {id:'fe',name:'WHMIS Final Exam',short:'Exam',pass:75,final:true,order:'fixed',na:LATE.slice(),pre:[{k:'page',t:'Before you start',p:'Read each question carefully. You can’t go back once you answer.'}],
   qs:[
    {t:'Which SDS section lists first-aid measures?',o:['Section 4','Section 2','Section 8','Section 11'],c:0,w:{2:1}},
    {t:'The skull and crossbones pictogram means…',o:['Acute toxicity: can be fatal or toxic','Corrosive to skin','Long-term health hazard','Harmful to the environment'],c:0,w:{7:2}},
    {t:'A container’s supplier label is missing. What do you do?',o:['Stop and tell your supervisor','Check the colour of the product','Make your own label from memory','Use it if you know what it is'],c:0,w:{0:2,1:2,3:1,5:2,7:2}},
    {t:'Where must Safety Data Sheets be kept?',o:['Where workers can easily get them','Locked in the manager’s office','At the supplier','Online only'],c:0,w:{1:3,5:1}},
    /* v4.1: a Question Pool question. Each learner gets their own copy (a different position, different option order), so Results groups by the original pool question and the original option position.
       recv = who was given this question (Tom and Sam got other pool questions). 'x' = the option that person chose was removed from the pool later. */
    {t:'Which pictogram warns that a product can burn skin or eyes?',o:['Corrosion','Exclamation mark','Flame','Health hazard'],c:0,w:{0:1,1:'x',7:2},pool:'Pictograms',recv:[0,1,2,3,5,7]},
    {t:'What must a workplace label include?',o:['Product name, safe handling and an SDS reference','The supplier’s phone number only','A pictogram only','The purchase date'],c:0,w:{3:3}},
    {t:'When must a supplier update an SDS?',o:['Within 90 days of significant new data','Every ten years','Never','Only if a worker asks'],c:0,w:{0:2}},
    {t:'Who is responsible for WHMIS training at work?',o:['The employer','The supplier','The worker','A government inspector'],c:0,w:{}},
   ],reached:[8,5,3,8,1,8,0,6,0,0,0]},
];
/* review only: "Courses: 10" adds 8 module quizzes (placeholder questions) to show a wide Progress table */
const MODULES=['Hazard classes','Pictograms','Supplier labels','Workplace labels','SDS sections','Safe storage','Spills','Review'];
function extraQuizzes(){
  return MODULES.map((t,k)=>({id:'m'+k,name:`Module ${k+1}: ${t}`,short:'M'+(k+1),pass:80,final:false,order:'fixed',na:LATE.slice(),
    qs:[1,2,3,4].map(n=>{const w={};PEOPLE.forEach((_,p)=>{if((p+n+k)%4===0)w[p]=1;});return {t:`${t}: practice question ${n}`,o:['Correct choice','Common mistake','Another option','Unlikely option'],c:0,w};}),
    reached:PEOPLE.map((_,p)=>p>=8?0:Math.min(4,(p*3+k*5)%6))}));
}
/* documents in the right panel (course + event assets). kind decides the badge, the icon and what Present can do */
const DOCS_ALL=[
  {id:'d1',name:'Points Form Acceptance.pdf',kind:'pdf',assign:false},
  {id:'d2',name:'WHMIS Knowledge Check',kind:'course',quiz:'kc',assign:true},
  {id:'d3',name:'WHMIS Overview Slides',kind:'slides',assign:false},
  {id:'d4',name:'Onboarding Video.mp4',kind:'video',assign:false},
  {id:'d5',name:'WHMIS Final Exam',kind:'course',quiz:'fe',assign:true},
  {id:'d6',name:'Spill Kit Photo.jpg',kind:'photo',assign:false},
  {id:'d7',name:'Label Examples.pptx',kind:'pptx',assign:false},
  {id:'d8',name:'Emergency Evacuation Plan.pdf',kind:'pdf',assign:false},
  /* v4.1: the other types today's page already shows */
  {id:'d9',name:'Chemical Storage Module',kind:'html5',assign:false},
  {id:'d10',name:'SDS Online Library',kind:'link',assign:false,url:'https://sds.example.com/library'},
  {id:'d11',name:'Toolbox Talk.ppsx',kind:'ppsx',assign:false},
  {id:'d12',name:'Spill Response Slides',kind:'pptimg',assign:false},
];
/* v4: each type icon gets its own colour (k-*), like the Admin tab. v4.1: HTML5 teal </>, external link grey-blue arrow, PowerPoint (.ppsx and slide images) orange */
const KIND={pdf:{l:'PDF',i:'pdf-adobe'},course:{l:'Course',i:'fa-solid fa-laptop k-course'},slides:{l:'Slides',i:'fa-solid fa-file-powerpoint k-ppt'},
  video:{l:'Video',i:'fa-solid fa-circle-play k-video'},photo:{l:'Photo',i:'fa-solid fa-image k-photo'},pptx:{l:'PowerPoint',i:'fa-solid fa-file-powerpoint k-ppt'},
  html5:{l:'HTML5',i:'fa-solid fa-code k-html'},link:{l:'Link',i:'fa-solid fa-arrow-up-right-from-square k-link'},ppsx:{l:'.ppsx',i:'fa-solid fa-file-powerpoint k-ppt'},pptimg:{l:'PowerPoint',i:'fa-solid fa-file-powerpoint k-ppt'}};
/* v4.1: slide-image PowerPoint: today it lists the slides beside the preview */
const PPT_SLIDES=[['Spill response','Contain, notify, clean up','0:30'],['Stop the source','Close valves, upright containers','0:45'],['Contain it','Dikes, pads and absorbent','0:40'],['Notify','Supervisor, then the emergency contact','0:35'],['Clean up','PPE first, then collect waste','0:50'],['Report it','Complete the incident form','0:30']];
/* v4.1: assessment forms in the class. Today's Summary shows them as columns beside the online courses */
const FORMS=[{id:'f1',name:'Practical Skills Assessment',done:[0,3,5]}];
/* the live feed: who answers next and whether they get it wrong (picked option) or right (-1) */
const FEED=[[1,'fe',-1],[7,'fe',2],[2,'fe',1],[4,'fe',-1],[6,'kc',-1],[1,'fe',-1],[7,'fe',-1],[2,'fe',2],[6,'kc',1],[4,'fe',2],[1,'fe',3],[2,'fe',-1],[6,'kc',-1],[4,'fe',-1],[6,'kc',-1],[2,'fe',-1],[4,'fe',-1],[6,'kc',2],[2,'fe',-1]];

/* =====================================================================
   STATE
   ===================================================================== */
let S, Q, FM, MANY=false, SCEN='live';
/* tablet and phone: the side panels become drawers over the page, closed by default */
const narrow=()=>matchMedia('(max-width:1099px)').matches;
function fresh(){
  const base=JSON.parse(JSON.stringify(QUIZZES));
  Q=MANY?[base[0],...extraQuizzes(),base[1]]:base;
  if(SCEN==='good'){Q.forEach(qz=>{qz.na=[];qz.qs.forEach(q=>q.w={});qz.reached=PEOPLE.map(()=>qz.qs.length);});}
  if(SCEN==='empty') Q=[];
  FM=FORMS.map(f=>({...f,done:SCEN==='good'?PEOPLE.map((_,p)=>p):f.done.slice()}));
  const wide=!narrow();
  S={left:wide,right:wide,docsOn:true,view:'grid',sort:'admin',q:'',pq:'',psort:'az',sel:null,seg:0,assign:false,picked:{},fs:false,slidesOpen:true,
     presenting:false,single:false,showProg:false,rev:{},docs1:false,live:true,feed:0,lastUpd:Date.now(),
     modal:null,res:{pick:'all',sort:'missed',open:{},order:null,pending:false}};
}
fresh();
let PW=null; /* the second-screen window */

/* =====================================================================
   DERIVED NUMBERS
   ===================================================================== */
/* v4.1: a pool question only counts for the learners who were given a copy of it (recv) */
const received=(qz,qi,p)=>{const r=qz.qs[qi].recv;return !r||r.includes(p);};
const qAssigned=q=>!q.recv||q.recv.length>0; /* Results lists only questions that at least one learner received */
const answered=(qz,qi,p)=>qz.reached[p]>qi&&received(qz,qi,p);
const isNA=(qz,p)=>(qz.na||[]).includes(p);
const assignedN=qz=>PEOPLE.filter((_,p)=>!isNA(qz,p)).length;
const missingOf=p=>Q.filter(qz=>isNA(qz,p));
const lateJoiners=()=>PEOPLE.map((_,p)=>p).filter(p=>missingOf(p).length);
/* tooltip text: which questions someone got wrong, grouped by course */
function wrongList(p){
  return Q.map(qz=>{const qs=qz.qs.map((q,i)=>answered(qz,i,p)&&q.w[p]!==undefined?(q.pool?'Pool: '+q.pool:'Q'+(i+1)):null).filter(Boolean);return qs.length?`${qz.name}: ${qs.join(', ')}`:null;}).filter(Boolean).join('\n');
}
function qStats(qz,qi){
  const q=qz.qs[qi]; let n=0,bad=0;
  PEOPLE.forEach((_,p)=>{if(answered(qz,qi,p)){n++; if(q.w[p]!==undefined) bad++;}});
  return {n,bad,pct:n?Math.round(bad/n*100):0};
}
function personQuiz(qz,p){
  const r=qz.reached[p], tot=qz.qs.length;
  if(isNA(qz,p)) return {r:0,tot,wrong:0,score:0,st:'na'};
  let wrong=0; for(let i=0;i<r;i++) if(qz.qs[i].w[p]!==undefined) wrong++;
  const score=r?Math.round((r-wrong)/tot*100):0;
  const st=r===0?'not':r<tot?'prog':(score>=qz.pass?'pass':'fail');
  return {r,tot,wrong,score,st};

const wrongTotal=p=>Q.reduce((a,qz)=>a+personQuiz(qz,p).wrong,0);
function allMissed(){
  const out=[]; Q.forEach(qz=>qz.qs.forEach((q,i)=>{const s=qStats(qz,i); if(s.bad) out.push({qz,i,q,...s});}));
  return out.sort((a,b)=>b.bad-a.bad||b.pct-a.pct);
}
const needHelp=()=>PEOPLE.map((n,p)=>({p,n,w:wrongTotal(p)})).filter(x=>x.w>=3).sort((a,b)=>b.w-a.w);
const docs=()=>S.docsOn?DOCS_ALL:[];

/* v4.1: multi-answer questions + Question Pool labels.
   Letters always follow the ORIGINAL option order (the admin's), even when a learner saw the options shuffled. */
const cset=q=>q.multi?q.cs:[q.c];
const pickedOf=(q,p)=>q.w[p]===undefined?cset(q):(q.multi?q.w[p]:(typeof q.w[p]==='number'?[q.w[p]]:[]));
const pickedBy=(qz,i,o)=>PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&pickedOf(qz.qs[i],p).includes(o));
const optTxt=(q,o)=>o==='x'?'Removed option':`${L[o]}. ${esc(q.o[o])}`;
const correctTxt=q=>cset(q).map(o=>`${L[o]}. ${esc(q.o[o])}`).join(' · ');
const poolTag=q=>q.pool?`<span class="ptag" data-tip="Question Pool: each learner gets their own copy, in their own position. Results groups them as one question, and option letters follow the original order.">${I('fa-solid fa-shuffle')}Pool: ${esc(q.pool)}</span>`:'';
const multiTag=q=>q.multi?`<span class="qtag">Select all that apply</span>`:'';
const qLabel=(q,i)=>q.pool?`Pool: ${esc(q.pool)}`:`Question ${i+1}`;
/* multi-answer question in Results: who chose which options. Correct picks are green, wrong picks red, missed correct options dashed. */
function multiPeople(qz,i,key){
  const q=qz.qs[i], ppl=PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p));
  const rightP=ppl.filter(p=>q.w[p]===undefined), wrongP=ppl.filter(p=>q.w[p]!==undefined);
  const head=`<div class="ans ok"><span class="ltr">${I('fa-solid fa-check')}</span><span class="at"><b>${correctTxt(q)}</b> <span class="mut" style="font-size:12px">correct answers · all of them must be chosen</span><div class="ppl">${masked(key)?'':(rightP.map(PChip).join('')||'<span class="mut" style="font-size:12px">Nobody yet</span>')}</div></span><span class="ct">${rightP.length}</span></div>`;
  if(!wrongP.length) return head;
  if(masked(key)) return head+`<div class="mp-note">${wrongP.length} ${wrongP.length===1?'student chose':'students chose'} a wrong combination. Names are hidden on a shared screen.</div>`;
  return head+`<div class="mq-oh" style="margin:10px 0 0">Wrong combinations, with every option each person chose</div>`+wrongP.map(p=>{
    const got=q.w[p], miss=cset(q).filter(o=>!got.includes(o));
    return `<div class="mp"><div class="mp-who">${PChip(p)}</div><div class="mp-o">${got.map(o=>`<span class="opc ${cset(q).includes(o)?'ok':'bad'}">${I('fa-solid fa-'+(cset(q).includes(o)?'check':'xmark'))}<b>${L[o]}.</b> ${esc(q.o[o])}</span>`).join('')}${miss.map(o=>`<span class="opc miss" data-tip="A correct option this person did not choose"><b>${L[o]}.</b> ${esc(q.o[o])} · missed</span>`).join('')}</div></div>`;}).join('');
}
/* what one person chose, as text (Students who need help) */
const choseTxt=(q,p)=>q.w[p]==='x'?'Removed option':q.multi?q.w[p].map(o=>L[o]).join(', '):`${L[q.w[p]]}. ${esc(q.o[q.w[p]])}`;

    :`<div class="blk wide"><div class="k">Most challenging question</div><div class="v">${Q.some(qz=>qz.reached.some(r=>r>0))?sv('pos','All correct so far'):sv('pos','None yet')}</div><div class="v2">${Q.some(qz=>qz.reached.some(r=>r>0))?'Everyone chose the correct answer so far':'Shows as answers come in'}</div></div>`;

    :card1+card2+card3+(allGood?`<div class="okbar wide">${I('fa-solid fa-circle-check')}Everyone is on track. No wrong answers yet.</div>`:'');

/* wrong answers for one question, most picked first, with who picked each */
const wrongPicks=(qz,i)=>{const q=qz.qs[i];const base=q.o.map((_,o)=>({o,ppl:PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&q.w[p]===o)})).filter(x=>x.o!==q.c&&x.ppl.length).sort((a,b)=>b.ppl.length-a.ppl.length);
  /* v4.1: people whose chosen option was removed from the pool afterwards still count, under "Removed option" */
  const gone=PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&q.w[p]==='x');return gone.length?[...base,{o:'x',ppl:gone}]:base;};
const PSORTS=[['az','A to Z'],['wrong','Most wrong answers first'],['behind','Least progress first'],['late','Not assigned first']];
function progressOf(p){const as=Q.filter(qz=>!isNA(qz,p));const tot=as.reduce((a,qz)=>a+qz.qs.length,0);return tot?as.reduce((a,qz)=>a+qz.reached[p],0)/tot:-1;}
function peopleBody(){
  /* v4 lean: no search or sort (not on today's page), always A to Z */
  return PEOPLE.map((_,p)=>p).sort((a,b)=>PEOPLE[a].localeCompare(PEOPLE[b])).map(pRow).join('');
}
function renderPeople(){document.getElementById('plist').innerHTML=peopleBody();}
function pRow(p){
  if(S.single) return `<button class="prow" data-p="${p}" onclick="openProgress(${p})">${Av(p)}<span class="t"><span class="n">${PEOPLE[p]}</span></span><span class="m"><small>${miniStatus(p)}</small></span></button>`;
  const xs=Q.map(qz=>({qz,...personQuiz(qz,p)})), as=xs.filter(x=>x.st!=='na'), w=wrongTotal(p), miss=xs.length-as.length;
  const doneN=as.filter(x=>x.r===x.tot).length, cur=as.find(x=>x.st==='prog');
  const now=!Q.length?'Nothing assigned yet':!as.length?'Added after courses were assigned':cur?`In ${cur.qz.name} · Q${cur.r+1} of ${cur.tot}`:
    as.every(x=>x.st==='not')?'Not started':doneN===as.length?'Finished everything':'Waiting to start the next course';
  return `<button class="prow" data-p="${p}" onclick="openProgress(${p})">${Av(p)}<span class="t"><span class="n">${PEOPLE[p]}${miss?`<span class="na-t" data-tip="${miss} course${miss===1?'':'s'} not assigned. They joined after the courses were assigned.">Not assigned</span>`:''}</span>
      <span class="s">${now}</span></span>
    <span class="m"><small>${!as.length?'':doneN===as.length?`<span class="done-ok">${I('fa-solid fa-circle-check')}Done</span>`:`${doneN}/${as.length} done`}</small></span></button>`;
}
function assignMissing(){const late=lateJoiners();Q.forEach(qz=>qz.na=[]);render();snack(`Assigned the missing courses to ${late.map(p=>PEOPLE[p]).join(', ')}`);}
function assignPerson(p){const miss=missingOf(p);miss.forEach(qz=>qz.na=qz.na.filter(x=>x!==p));render();snack(`Assigned ${miss.length} courses to ${PEOPLE[p]}`);}
function assignOne(qid,p){const qz=Q.find(x=>x.id===qid);qz.na=qz.na.filter(x=>x!==p);render();snack(`Assigned ${qz.name} to ${PEOPLE[p]}`);}

const SLIDES=[['WHMIS 2015','What every worker needs to know'],['Labels','Supplier labels and workplace labels'],['Safety Data Sheets','16 sections · always within reach']];

/* v4: today's quiz statistics graph, kept as it is: one sideways bar per question, % answered correctly,

function answerGraph(qz){
  if(qz.order==='random') return `<div class="cv-empty"><b>This course shuffles its questions</b><span>The graph fills in as people answer.</span></div>`;
  const col=p=>p<=30?'#d9342b':p<=75?'#e8892a':p<=95?'#1f86c9':'#2e9b47';
  return `<div class="agraph">${qz.qs.map((q,i)=>{const s=qStats(qz,i), ok=s.n?Math.round((s.n-s.bad)/s.n*100):0;
    return `<div class="ag-r"><span class="ag-q">${esc(q.t)}</span><span class="ag-n">(${s.n})</span><span class="ag-b"><span class="ag-f" style="width:${Math.max(ok,1)}%;background:${col(ok)}"></span><b>${ok}%</b></span></div>`;}).join('')}</div>`;
}

/* v4.1: every part of a course, in order: its intro video/pages first, then each question */
function courseParts(qz){
  const pre=qz.pre||[{k:'page',t:'Introduction',p:'What this course covers and how it is marked'}];

      <tbody>${ids.map(p=>{const miss=missingOf(p);return `<tr${m.hl===p?' class="hl"':''}><td><span style="display:flex;align-items:center;gap:8px">${Av(p)}<b style="font-weight:600">${PEOPLE[p]}</b>${miss.length>1?`<button class="b b-ghost b-sm asg" style="margin-left:auto" data-tip="Assign all ${miss.length} missing courses" onclick="assignPerson(${p})">Assign all</button>`:''}</span></td>
        <td>${mini?miniStatus(p):statusCell(p)}</td>
        ${mini?'':`<td>${wrongTotal(p)?`<span class="oc" tabindex="0" data-tip="${esc(wrongList(p))}">${I('fa-solid fa-flag')}${wrongTotal(p)}</span>`:'<span class="mut">0</span>'}</td>`}${Q.map(qz=>`<td>${mini?miniCell(qz,p):cell(qz,p)}</td>`).join('')}${FM.map(f=>`<td>${formCell(f,p,mini)}</td>`).join('')}<td class="fill"></td></tr>`;}).join('')}</tbody></table></div></div>
    <div class="mf"><button class="b b-ghost" onclick="closeModal()">Close</button></div></div>`;
}

/* ---------- Results (with Most Challenging Questions) ---------- */
function openResults(pick,qi,focus){
  S.res.pick=pick||'all'; S.res.open={}; S.res.order=null; S.res.pending=false;
  if(qi!==null&&qi!==undefined) S.res.open[pick+':'+qi]=1;
  S.modal={k:'results'}; render();
}
function liveChip(){return `<span class="live snap" id="livechip"><small>updated ${ago()}</small><button class="ib ib-sm" style="width:18px;height:18px" data-tip="Refresh now" onclick="tick(true)">${I('fa-solid fa-rotate')}</button></span>`;}
function resultsModal(){
  const r=S.res, mis=allMissed();
  const nh=needHelp();
  const ov=(id,ic,label,n)=>`<button class="pick ovp${r.pick===id?' on':''}" onclick="openResults('${id}')"><b>${I(ic)}${label}</b><span class="cnt">${n}</span></button>`;
  const picks=`<div class="pick-h">Overview</div>${ov('all','fa-solid fa-circle-exclamation','Most Challenging Questions',mis.length)}${ov('people','fa-solid fa-user-group','Students who need help',nh.length)}
    <div class="pick-h">Online courses<span>${Q.length} course${Q.length===1?'':'s'}</span></div>${Q.map(qz=>{const st=qz.qs.map((_,i)=>qStats(qz,i)), hard=st.filter(s=>s.bad&&s.pct>=50).length, started=PEOPLE.filter((_,p)=>qz.reached[p]>0).length;
      return `<button class="pick${r.pick===qz.id?' on':''}" onclick="openResults('${qz.id}')"><b>${esc(qz.name)}</b><small>${started} of ${assignedN(qz)} started${hard?` · <span style="font-weight:600" data-tip="Challenging = half or more of the people who answered chose a wrong answer (to confirm)">${hard} challenging</span>`:''}</small></button>`;}).join('')}`;
  return `<div class="modal wide" role="dialog" aria-modal="true" aria-label="Results"><div class="mh"><h2>Results</h2>${liveChip()}<button class="ib" aria-label="Close" onclick="closeModal()">${I('fa-solid fa-xmark')}</button></div>
    <div class="res"><nav class="res-l" aria-label="Pick a course">${picks}</nav><div class="res-r">${r.pick==='all'?resMCQ(mis):r.pick==='people'?resPeople(nh):resQuiz(Q.find(x=>x.id===r.pick))}</div></div>
    <div class="mf"><span class="mut" style="font-size:13px;margin-right:auto">${S.single?I('fa-solid fa-tv')+' Single screen: the class can see this screen.':I('fa-solid fa-lock')+' Only you see this. The second screen only shows what you present.'}</span><button class="b b-ghost" onclick="closeModal()">Close</button></div></div>`;
}
/* Overview tab 1 (Figma 412:365): every question with mistakes, all open, hardest first */
function resMCQ(mis){
  return `<div class="res-top"><h3>Most Challenging Questions</h3></div><div class="res-sum">The most challenging questions across all the assigned courses.</div>
    ${mis.length?mis.map((m,k)=>{const q=m.q;
      return `<div class="mcq"><span class="no">${k+1}.</span><div class="mq-b">
        <div class="mq-h"><b>${esc(q.t)}${poolTag(q)}${multiTag(q)}</b><span class="chip chip-warning">${m.bad} of ${m.n} chose a wrong answer</span><button class="ib ib-sm" data-tip="Present this question: answer counts only, no names" onclick="presentQ('${m.qz.id}',${m.i})">${I('fa-solid fa-display')}</button></div>
        <div class="mq-sub">Course: <button class="lnk" onclick="openResults('${m.qz.id}',${m.i})">${esc(m.qz.name)}</button> · Correct answer${q.multi?'s':''}: <b class="mq-ok">${correctTxt(q)}</b></div>
        <div class="mq-oh">${q.multi?'Options chosen':'Wrong options chosen'}${S.single?showBtn(m.qz.id+':'+m.i):''}</div>
        ${q.multi?multiPeople(m.qz,m.i,m.qz.id+':'+m.i):wrongPicks(m.qz,m.i).map(x=>`<div class="mq-opt${x.o==='x'?' gone':''}"><div class="mq-oh2"><b>${x.o==='x'?'Removed':''}${x.o==='x'?'<span class="mut" style="font-weight:400"> · the option they chose was removed from the pool</span>':optTxt(q,x.o)}</b><span class="chip">${x.ppl.length} chose this</span></div>${masked(m.qz.id+':'+m.i)?'':`<div class="mq-s">Students who chose this option:</div><div class="mq-ppl">${x.ppl.map(PChip).join('')}</div>`}</div>`).join('')}
      </div></div>`;}).join(''):`<div class="es"><div class="es-i">${I('fa-regular fa-face-smile')}</div><b>No wrong answers yet</b></div>`}`;
}
/* Overview tab 2: students who need help */
function resPeople(nh){
  return `<div class="res-top"><h3>Students who need help</h3></div><div class="res-sum">People with 3 or more wrong answers, across all the assigned courses.</div>
      ${S.single&&!S.rev.people?`<div class="res-gen"><b>${nh.length} ${nh.length===1?'student has':'students have'} 3 or more wrong answers.</b>${showBtn('people','Show students')}</div>`:(S.single?`<div class="res-gen"><b>${nh.length} ${nh.length===1?'student has':'students have'} 3 or more wrong answers.</b>${showBtn('people','Show students')}</div>`:'')+nh.map(x=>{const qs=[];Q.forEach(qz=>qz.qs.forEach((q,i)=>{if(q.w[x.p]!==undefined&&answered(qz,i,x.p))qs.push({qz,q,i,o:q.w[x.p]});}));
        /* one card per person: each question to go over, the option they chose and the correct one */
        return `<div class="mq-opt sp"><div class="mq-oh2">${Av(x.p)}<b>${x.n}</b><span class="chip">${wa(x.w)}</span></div>
          <details class="spd" ${S.res.sp?.[x.p]?'open':''} ontoggle="(S.res.sp=S.res.sp||{})[${x.p}]=this.open"><summary>${I('fa-solid fa-chevron-right')}See wrong questions</summary>${qs.map(y=>`<div class="spq"><div class="spt">${esc(y.q.t)}${poolTag(y.q)}<small>${esc(y.qz.name)} · ${qLabel(y.q,y.i)}</small></div>
            <div class="spa"><span>Chose <b>${choseTxt(y.q,x.p)}</b></span><span>Correct <b class="mq-ok">${correctTxt(y.q)}</b></span></div></div>`).join('')}</details></div>`;}).join('')||'<div class="mut">Nobody yet.</div>'}`;
}
function resQuiz(qz){
  const r=S.res, st=qz.qs.map((_,i)=>qStats(qz,i));
  if(qz.order==='random') return `<div class="res-top"><h3>${esc(qz.name)}</h3></div><div class="rnd">${I('fa-solid fa-shuffle')}<span>This course shuffles its questions. Results show here as people answer.</span></div>`;
  let order=qz.qs.map((_,i)=>i).filter(i=>qAssigned(qz.qs[i])); /* v4.1: only questions at least one learner received */
  const ranked=order.slice().sort((a,b)=>st[b].bad-st[a].bad||st[b].pct-st[a].pct||a-b);
  if(r.sort==='missed'){ if(!r.order||r.order.qz!==qz.id) r.order={qz:qz.id,ids:ranked}; order=r.order.ids; }
  const started=PEOPLE.filter((_,p)=>qz.reached[p]>0).length, done=PEOPLE.filter((_,p)=>qz.reached[p]===qz.qs.length).length, na=(qz.na||[]).length;
  const changed=r.sort==='missed'&&r.order&&r.order.ids.join()!==ranked.join();
  return `<div class="res-top"><h3>${esc(qz.name)}</h3>${qz.final?'<span class="chip chip-info">Final exam</span>':''}<span class="chip">Pass ${qz.pass}%</span>
      <span class="r"><span class="mut">Most wrong answers first</span></span></div>
    <div class="res-sum">${started} of ${assignedN(qz)} started · ${done} finished · click a question to see who chose what</div>
    ${false&&changed?`<div class="newbar">${I('fa-solid fa-arrow-down-up-across-line')}New answers changed the order<button onclick="S.res.order=null;render()">Update order</button></div>`:''}
    ${order.map((i,k)=>qRow(qz,i,r.sort==='missed'?k+1:i+1,false)).join('')}`;
}
/* v4: today's quiz statistics bar, kept as it is: % of people who answered correctly,
   red up to 30%, orange to 75%, blue to 95%, green above */
const barCol=p=>p<=30?'#d9342b':p<=75?'#e8892a':p<=95?'#1f86c9':'#2e9b47';
const barG=p=>`<span class="gbar" data-tip="${p}% answered correctly"><span style="width:calc((100% - 48px) * ${Math.max(p,2)} / 100);background:${barCol(p)}"></span><b>${p}%</b></span>`;
function qRow(qz,i,rank,showQuiz){
  /* the top-ranked question starts open so its answers and names show at a glance */
  const q=qz.qs[i], s=qStats(qz,i), key=qz.id+':'+i, open=key in S.res.open?!!S.res.open[key]:(showQuiz||S.res.sort==='missed')&&rank===1;
  const okN=s.n-s.bad, notYet=PEOPLE.map((_,p)=>p).filter(p=>!answered(qz,i,p)&&!isNA(qz,p)&&received(qz,i,p)), naP=qz.na||[]; /* v4.1: only learners who were given this question */
  const goneP=PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&q.w[p]==='x');
  const right=PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&q.w[p]===undefined);
  const wrongBy=q.o.map((_,o)=>PEOPLE.map((_,p)=>p).filter(p=>answered(qz,i,p)&&q.w[p]===o));
  const hot=s.n&&s.pct>=50, topWrong=Math.max(0,...wrongBy.filter((_,o)=>o!==q.c).map(x=>x.length));
  const det=`<div class="qd">${S.single?`<div class="res-gen">${masked(key)?'Names are hidden on a shared screen.':'Names are showing.'}${showBtn(key)}</div>`:''}
      ${q.multi?multiPeople(qz,i,key):`<div class="ans ok"><span class="ltr">${L[q.c]}</span><span class="at"><b>${esc(q.o[q.c])}</b> <span class="mut" style="font-size:12px">correct answer</span><div class="ppl">${masked(key)?'':right.map(PChip).join('')||'<span class="mut" style="font-size:12px">Nobody yet</span>'}</div></span><span class="ct">${right.length}</span></div>`}
      ${q.multi?'':q.o.map((o,oi)=>oi===q.c||!wrongBy[oi].length?'':`<div class="ans bad"><span class="ltr">${L[oi]}</span><span class="at"><b>${esc(o)}</b>${hot&&wrongBy[oi].length===topWrong?`<span class="hot-i" data-tip="Most chosen wrong answer: the main reason this question is challenging">${I('fa-solid fa-circle-exclamation')}</span>`:''}<div class="ppl">${Ppl(key,wrongBy[oi])}</div></span><span class="ct">${wrongBy[oi].length} chose this</span></div>`).join('')}
      ${goneP.length?`<div class="ans gone"><span class="ltr">${I('fa-solid fa-ban')}</span><span class="at"><b>Removed</b> <span class="mut" style="font-size:12px">the option they chose was removed from the pool after they answered</span><div class="ppl">${Ppl(key,goneP)}</div></span><span class="ct">${goneP.length} chose this</span></div>`:''}
      ${notYet.length?`<div class="ans none"><span class="ltr">${I('fa-regular fa-clock')}</span><span class="at"><b class="mut">Not answered yet</b><div class="ppl">${Ppl(key,notYet)}</div></span><span class="ct mut">${notYet.length}</span></div>`:''}
      
    </div>`;
  return `<div class="qrow${open?' open':''}"><button class="qh" aria-expanded="${open}" onclick="S.res.open['${key}']=${open?0:1};render()">
      <span class="rk">${rank}${hot?`<span class="hot-i" data-tip="Challenging: half or more chose a wrong answer">${I('fa-solid fa-flag')}</span>`:''}</span><span class="qt">${esc(q.t)}${poolTag(q)}${multiTag(q)}<small>${showQuiz?esc(qz.name)+' · ':''}${q.pool?'Each learner gets their own copy, in their own position':'Question '+(i+1)}</small></span>
      <span class="st"><span><b>${s.n?`${okN} of ${s.n} correct`:'No answers yet'}</b><span class="mut">${s.n?wa(s.bad):''}</span></span>
        ${s.n?barG(Math.round(okN/s.n*100)):''}</span>
      <span class="ch">${I('fa-solid fa-chevron-right')}</span></button>${det}</div>`;
}

/* =====================================================================
   LIVE: every 10 seconds a learner answers the next question (sample feed)
   ===================================================================== */
/* v4 lean: no auto-refresh (today's page only has a manual refresh). Refresh pulls the newest answers and re-ranks. */
function tick(){
  for(let k=0;k<3;k++){const f=FEED[S.feed]; if(!f) break; S.feed++;
    const [p,qid,wrong]=f, qz=Q.find(x=>x.id===qid);
    if(qz.reached[p]<qz.qs.length){ const tq=qz.qs[qz.reached[p]]; if(wrong>=0) tq.w[p]=tq.multi?[wrong]:wrong; qz.reached[p]++; }}
  S.res.order=null;
  const c=document.getElementById('livechip'); if(c) c.classList.add('spin');
  setTimeout(()=>{S.lastUpd=Date.now();render();},500);
}
setInterval(()=>{const c=document.getElementById('livechip');if(c&&!c.classList.contains('spin')){const sm=c.querySelector('small');if(sm)sm.textContent='updated '+ago();}},1000);

/* review bar */
function setDocs(on){S.docsOn=on;S.sel=null;S.fs=false;S.assign=false;S.picked={};document.getElementById('rv-docs-some').classList.toggle('on',on);document.getElementById('rv-docs-none').classList.toggle('on',!on);render();}
function setLive(on){S.live=on;document.getElementById('rv-live-on').classList.toggle('on',on);document.getElementById('rv-live-off').classList.toggle('on',!on);render();}
function setMany(on){MANY=on;const m=S.modal;fresh();S.modal=m;document.getElementById('rv-c2').classList.toggle('on',!on);document.getElementById('rv-c10').classList.toggle('on',on);render();}
function setScen(k){SCEN=k;fresh();['live','good','empty'].forEach(x=>document.getElementById('rv-s-'+x).classList.toggle('on',x===k));render();}
function resetAll(){stopPresent();MANY=false;SCEN='live';setScen('live');setMany(false);setDocs(true);setLive(true);}
/* crossing into tablet width closes the drawers; back to desktop opens both panels */
let wasNarrow=narrow();
addEventListener('resize',()=>{const n=narrow();if(n!==wasNarrow){wasNarrow=n;S.left=S.right=!n;render();}});

/* tooltips (data-tip) */
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return;}
  tip.textContent=t.dataset.tip;tip.style.display='block';const r=t.getBoundingClientRect(),w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=(r.bottom+6+tip.offsetHeight>innerHeight?r.top-tip.offsetHeight-6:r.bottom+6)+'px';});
document.addEventListener('focusin',e=>{if(!e.target.closest('[data-tip]'))tip.style.display='none';});

render();
</script>
