<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ds.css: stand-ins for BIS design system components, used by onboarding-v2.html (Nov 22, FM - Prototype).
   The prototype is plain HTML, so each class copies the look of a bisComponents component (repo BISTrainingSolutions/bisComponents,
   Storybook from the Pre_Release branch). Values are the repo's light tokens (colors/primitives.ts, tokens.ts), 4px radius, 8px spacing.
   Naming: .bis-<component>. A "STAND-IN" tag marks something with no DS component yet (gap list in checkpoints\epic\field-management\prototype.md).
   Rule: do not restyle a DS-named class to match a screen. If Figma differs from the component, that is a break: show Mika both options. */
:root{
  --bis-text:#19191A;--bis-text-2:#636368;--bis-text-disabled:#7C7C82;--bis-text-secondary-light:#AFAFB5;--bis-text-primary:#0078B3;--bis-text-success:#167B00;--bis-text-error:#CC2222;
  --bis-bg:#F8F8F8;--bis-surface:#FEFEFE;--bis-surface-disabled:#F2F2F2;--bis-surface-2:#F2F2F2;
  --bis-primary:#0078B3;--bis-primary-dark:#095F8C;--bis-primary-lighter:#F0F9FE;--bis-primary-lightest:#F8FEFF;--bis-primary-50:#C9EFFA;--bis-primary-150:#7BD7F1;--bis-primary-400:#009ACB;
  --bis-success:#167B00;--bis-success-lighter:#EBF8D6;--bis-success-lightest:#FAFFF2;--bis-success-light:#ABD559;
  --bis-stroke:#AFAFB5;--bis-stroke-light:#DFDFE2;--bis-stroke-dark:#4C4C4F;
  --bis-r:4px;--bis-gap-xs:4px;--bis-gap-s:8px;--bis-gap-m:12px;--bis-gap-l:16px;--bis-gap-xl:24px;
}
/* BisButton: variants primary, secondary, tertiary, link; sizes sm, md */
.bis-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:31px;padding:4px 8px;border:1px solid transparent;border-radius:var(--bis-r);font-weight:600;font-size:14px;line-height:21px;font-family:inherit;;cursor:pointer;white-space:nowrap;background:none;color:var(--bis-text)}
.bis-btn.sm{min-height:31px;padding:4px 6px;font-size:14px}
.bis-btn.lg{min-height:34px;padding:4px 12px;font-size:16px;line-height:24px}
.bis-btn.primary{background:var(--bis-primary);border-color:var(--bis-primary);color:#fff}
.bis-btn.primary:hover{background:#00547D;border-color:#00547D}.bis-btn.primary:active{background:#003C59;border-color:#003C59}
.bis-btn.secondary{background:transparent;border-color:var(--bis-stroke);color:var(--bis-text-2)}
.bis-btn.secondary:hover{background:var(--bis-surface-2)}.bis-btn.secondary:active{background:var(--bis-stroke-light)}
.bis-btn.secondary-primary{background:transparent;border-color:var(--bis-stroke);color:var(--bis-primary)}
.bis-btn.secondary-primary:hover{background:var(--bis-primary);border-color:var(--bis-primary);color:#fff}
.bis-btn.tertiary{color:var(--bis-text)}.bis-btn.tertiary:hover{background:var(--bis-surface-2)}
.bis-btn.link{padding:4px 8px;min-height:31px;font-weight:400;color:var(--bis-text-primary)}.bis-btn.link:hover{color:#00547D;text-decoration:underline}
.bis-btn:disabled,.bis-btn[aria-disabled=true]{background:var(--bis-surface-disabled);border-color:var(--bis-surface-disabled);color:var(--bis-text-secondary-light);cursor:not-allowed}.bis-btn[aria-disabled=true]{pointer-events:none}
.bis-btn.tertiary:disabled,.bis-btn.link:disabled{background:none;border-color:transparent}
/* BisBadge (variants gray, blue, green, lined; surface default) */
.bis-badge{display:inline-flex;align-items:center;gap:6px;min-height:20px;padding:2px 4px;border-radius:2px;font-weight:600;font-size:12px;line-height:16px;font-family:inherit;;text-transform:none;white-space:nowrap}
.bis-badge.md{min-height:26px;padding:4px 6px;font-size:14px;line-height:18px;border-radius:4px}
.bis-badge.blue{background:var(--bis-primary);color:#fff}
.bis-badge.green{background:var(--bis-success-lighter);color:var(--bis-text-success)}
.bis-badge.gray{background:var(--bis-surface-2);color:var(--bis-text-2)}
.bis-badge.pill{border-radius:12px;padding:4px 8px}
/* BisCounterBadge (gray) */
.bis-counter{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:2px 4px;box-sizing:border-box;border-radius:12px;background:var(--bis-surface-secondary-lighter);color:var(--bis-text-2);font-weight:600;font-size:12px;line-height:16px;font-family:inherit;}
/* BisChip (primary, default surface, pill; dismissible) */
.bis-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 6px;box-sizing:border-box;border:1px solid var(--bis-stroke);border-radius:4px;background:var(--bis-surface);color:var(--bis-text-primary);font-weight:600;font-size:14px;line-height:18px;font-family:inherit;}
.bis-chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0;font-size:12px;line-height:1;display:inline-flex}
.bis-chip.pill{border-radius:12px;padding:4px 8px}.bis-chip.sm.pill{border-radius:12px;padding:2px 8px}
.bis-chip.sm{min-height:24px;padding:2px 4px;border-radius:2px;font-size:12px;line-height:16px}
/* BisInput / BisSearchField */
.bis-field{display:block}
.bis-label{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;line-height:21px;font-family:inherit;;margin-bottom:6px}
.bis-help{font-size:12px;color:var(--bis-text-2);margin:0 0 6px}
.bis-opt{font-style:italic;font-weight:400;font-size:12px;color:var(--bis-text-2)}
.bis-input{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 13px;border:1px solid var(--bis-stroke);border-radius:var(--bis-r);background:var(--bis-surface)}
.bis-input:focus-within{border-color:var(--bis-primary)}
.bis-input input:focus-visible{box-shadow:none;outline:none}
.bis-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;line-height:20px;font-family:inherit;;color:var(--bis-text);padding:5px 0}
.bis-input i{color:var(--bis-text-2);font-size:12px}
.bis-input input::placeholder{color:var(--bis-stroke)}.bis-input input:disabled{background:var(--bis-surface-disabled);color:var(--bis-text-disabled);cursor:not-allowed}
/* BisCheckbox */
.bis-check{appearance:none;-webkit-appearance:none;width:12px;height:12px;margin:2px;border:1.33px solid var(--bis-text-2);border-radius:1.33px;background:transparent;box-sizing:border-box;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.bis-check:checked{background:var(--bis-primary);border-color:var(--bis-primary)}
.bis-check:checked::after{content:"";width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-.5px,-.5px)}
.bis-check:disabled{background:transparent;border-color:var(--bis-stroke);cursor:not-allowed}.bis-check:disabled:checked{background:var(--bis-stroke);border-color:var(--bis-stroke)}
.bis-check:focus-visible{outline:3px solid var(--bis-primary-150);outline-offset:0}
/* BisModal */
.bis-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;z-index:50;overflow:auto;padding:16px}
.bis-modal{margin:auto;background:var(--bis-surface);border-radius:var(--bis-r);box-shadow:0 2px 10px rgba(0,0,0,.1);width:100%;max-width:750px}
.bis-modal.sm{max-width:560px}
.bis-modal-h{display:flex;align-items:center;gap:10px;padding:8px 16px;font-weight:600;font-size:20px;line-height:30px;font-family:inherit;}
.bis-modal-h i.lead.ok{color:var(--bis-icon-success)}
.bis-modal-h i.lead{color:var(--bis-primary-400);font-size:18px}
.bis-modal-h .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--bis-stroke);padding:4px 8px;border-radius:4px}.bis-modal-h .x:hover{background:var(--bis-surface-2)}.bis-modal-h .x:active{color:#96969D}
.bis-modal-b{padding:6px 16px 8px;font-size:16px;line-height:24px}
.bis-modal-f{display:flex;justify-content:flex-end;gap:12px;padding:8px 16px 12px}
/* BisTooltip */
.bis-tip::after{content:"";position:absolute;top:-4px;left:16px;width:8px;height:8px;background:inherit;transform:rotate(45deg)}
.bis-tip{position:absolute;z-index:30;max-width:320px;background:var(--bis-text);color:var(--bis-surface);border-radius:var(--bis-r);padding:8px 12px;font-size:14px;font-weight:600;line-height:21px}
/* BisSnackbar (surface) */
.bis-snack{position:fixed;right:16px;top:56px;z-index:60;display:flex;align-items:flex-start;gap:8px;background:var(--bis-surface);color:var(--bis-text);padding:12px;border-radius:8px;font-size:14px;line-height:20px;min-width:250px;max-width:302px;box-shadow:0 0 4px rgba(25,25,26,.15)}
.bis-snack .sn-i{color:var(--bis-icon-success);font-size:16px;line-height:20px;flex:none}.bis-snack .sn-b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}.bis-snack .sn-x{border:0;background:none;color:#C9C9CE;cursor:pointer;padding:0 2px;font-size:14px;line-height:20px;flex:none}.bis-snack .sn-x:hover{color:var(--bis-text-2)}
/* BisSelect (multiple, combobox, chips): the DS pre-release has it; this mirrors it for the user pickers */
.bis-select{position:relative}
.bis-select .dd{position:absolute;left:0;right:0;top:100%;margin-top:2px;overflow:hidden;background:var(--bis-surface);border:1px solid var(--bis-stroke-light);border-radius:var(--bis-r);box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:10}

@keyframes bisdrop{from{opacity:0;transform:translateY(-4px)}}
.bis-select .dd-list{max-height:200px;overflow:auto}
.bis-select .dd-foot{display:flex;justify-content:flex-end;gap:8px;padding:8px;border-top:1px solid var(--bis-stroke-light);background:var(--bis-surface)}
.bis-select .dd .opt{display:flex;gap:8px;align-items:baseline;padding:7px 10px;font-size:14px;line-height:20px;cursor:pointer;border-bottom:1px solid var(--bis-stroke-light)}
.bis-select .dd .opt:hover,.bis-select .dd .opt.hl{background:var(--bis-primary-lighter)}
.bis-select .dd .none{padding:10px;color:var(--bis-text-2);font-size:12px}
.bis-select .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bis-login{font-size:12px;color:var(--bis-text-2)}
/* BisSection / Collapse is not used in phase 1 */

/* ===== FM components proposed by "DS - FM Components" (work\projects\field-management\ds-components\review.html, log.md) =====
   Copied from review.html and prefixed .bis-. Names and props can still change until Mika approves G1, G4, G5 (G6, G7, G8 approved).
   If review.html changes, change this block to match; do not restyle it to fit one screen (that is a break: ask Mika). */
:root{--bis-stroke-success:#399300;--bis-stroke-success-light:#C2E387;--bis-icon-success:#167B00;--bis-icon-default-light:#AFAFB5;--bis-stroke-primary-lighter:#C9EFFA;--bis-stroke-primary-alt:#5378BB;--bis-surface-success-lighter:#EBF8D6;--bis-surface-error-lighter:#FEE3E3;--bis-stroke-error-lighter:#FDD4D4;--bis-surface-secondary-lighter:#DFDFE2;--bis-focus:0 0 0 3px #7BD7F1}
.bis-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--bis-primary-150);outline-offset:0;box-shadow:none}
/* G1 BisStepper (+ save status) */
.bis-stepper-wrap{background:var(--bis-surface);border:1px solid var(--bis-stroke-light);border-radius:8px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bis-stepper{list-style:none;margin:0;padding:0;display:flex;align-items:center;flex:1 1 380px;min-width:0;gap:0;flex-wrap:nowrap}
.bis-step{display:flex;align-items:center;gap:8px;color:var(--bis-text-2);font-size:16px;line-height:26px}
.bis-step+.bis-step::before{content:"";width:32px;flex:1 1 16px;min-width:12px;max-width:48px;height:1px;background:var(--bis-stroke);margin:0 4px 0 12px}
.bis-step.done+.bis-step::before{background:var(--bis-stroke-success)}
.bis-step-dot{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:12px;line-height:16px;font-weight:600;border:1px solid var(--bis-stroke);background:var(--bis-bg);color:var(--bis-text-2);flex:none}
.bis-step.current{color:var(--bis-text);font-weight:600}
.bis-step.current .bis-step-dot{background:var(--bis-primary);border-color:var(--bis-primary);color:var(--bis-primary-lighter)}
.bis-step.done .bis-step-dot{background:var(--bis-surface-success-lighter);border-color:var(--bis-stroke-success-light);color:var(--bis-icon-success)}
.bis-step>button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:4px}
.bis-step>button:hover .bis-step-label{text-decoration:underline}
.bis-savestat{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.bis-savestat[hidden]{display:none}
.bis-savestat.fresh{background:var(--bis-surface-success-lighter);color:var(--bis-text-success)}
.bis-savestat.old{background:var(--bis-surface-2);color:var(--bis-text-2);border-color:var(--bis-stroke-light)}
.bis-savestat.saving{background:var(--bis-surface-2);color:var(--bis-text-2)}
.bis-savestat.err{background:var(--bis-surface-error-lighter);color:var(--bis-text-error);border-color:var(--bis-stroke-error-lighter)}
.bis-savestat button{border:0;background:none;color:var(--bis-text-primary);font:inherit;font-weight:600;padding:0 2px;border-radius:4px;text-decoration:underline;cursor:pointer}
.bis-spin{width:10px;height:10px;border:2px solid var(--bis-stroke);border-top-color:var(--bis-primary);border-radius:50%;animation:bisspin .8s linear infinite}
@keyframes bisspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.bis-spin{animation:none}}
/* G4 BisBanner (variants info, success, warning, danger, neutral) */
.bis-banner{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:4px;border:1px solid;font-size:12px;line-height:18px;background:var(--bis-primary-lighter);border-color:var(--bis-stroke-primary-lighter)}
.bis-banner .b-icon{flex:none;display:flex;color:var(--bis-primary-400)}
.bis-banner .b-body{flex:1;min-width:0}
.bis-banner .b-title{font-weight:600}
.bis-banner.success{background:var(--bis-surface-success-lighter);border-color:var(--bis-stroke-success-light);color:#00310E}.bis-banner.success .b-icon{color:var(--bis-icon-success)}
.bis-banner .b-counter{font-size:12px;line-height:16px;font-weight:600;padding:0 8px;border-radius:999px;background:var(--bis-surface);border:1px solid var(--bis-stroke-light);color:var(--bis-text-2)}
.bis-banner .b-x{border:0;background:none;padding:4px;border-radius:4px;color:var(--bis-text-2);display:flex;cursor:pointer}
.bis-banner .b-x:hover{background:rgba(0,0,0,.06)}
/* G5 BisBulkBar (the fixed placement is the page's: .bis-bulk-fixed) */
.bis-bulkbar{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bis-primary-lighter);border:1px solid var(--bis-stroke);border-radius:4px;box-shadow:0 0 8px rgba(0,0,0,.15);flex-wrap:wrap}
.bis-bulkbar .sel{font-weight:600}.bis-bulkbar .grow{flex:1}
.bis-bulkbar .bdiv{width:1px;align-self:stretch;min-height:20px;background:var(--bis-stroke)}
.bis-bulk-fixed{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:20;width:min(640px,calc(100% - 32px))}
/* G6 BisTreeList (role=tree; nested lists; level colours by depth) */
.bis-tree,.bis-tree ul{list-style:none;margin:0;padding:0}
.bis-tree ul{margin:6px 0 0 14px;padding-left:12px;border-left:1px solid var(--bis-stroke-light)}
.bis-tree li{margin-top:6px}.bis-tree>li:first-child{margin-top:0}
.bis-trow{display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 8px 4px 12px;border:1px solid var(--bis-stroke);border-radius:4px;background:var(--bis-surface)}
.bis-trow:hover,.bis-trow:focus-within{background:var(--bis-primary-lighter);border-color:var(--bis-primary-400)}
.bis-trow.sel{background:var(--bis-primary-lighter);border-color:var(--bis-primary-400)}
.bis-dot{width:9px;height:9px;border-radius:2px;flex:none}
.bis-tname{flex:1;min-width:0}
.bis-create{opacity:0;border:0;background:none;color:var(--bis-text-primary);font-weight:600;padding:0 4px;border-radius:4px;cursor:pointer;font-size:14px;font-family:inherit}
.bis-trow:hover .bis-create,.bis-trow:focus-within .bis-create,.bis-create:focus-visible{opacity:1}
.bis-created{color:var(--bis-text-success);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:4px}
/* STAND-IN extension (flag B3, Nov 24): a created row keeps its "Created" badge and always shows an Edit pencil to the right of it (no hover reveal, no hover "Create"; rows are created from the bulk bar). Row height is fixed so hover never changes it. */
.bis-trow .bis-edit{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:0;background:none;border-radius:4px;cursor:pointer;font-size:14px;color:var(--bis-icon-default-light)}.bis-trow .bis-edit:hover,.bis-trow .bis-edit:focus-visible{color:var(--bis-primary-400);background:var(--bis-primary-lighter)}
.bis-trow{height:36px;box-sizing:border-box}
/* G8 BisEmptyState and BisSummaryCard */
.bis-empty{background:var(--bis-surface);border:1px solid var(--bis-stroke-light);border-radius:8px;padding:28px 16px;display:grid;justify-items:center;gap:4px;text-align:center}
.bis-empty.embedded{border:0;padding:56px 16px}  /* STAND-IN (flag B6): borderless variant for use inside a card */
.bis-empty .e-ic{color:var(--bis-text-secondary-light);margin-bottom:4px;font-size:32px;line-height:1}
.bis-empty .e-t{font-weight:600}
.bis-empty .e-d{font-size:12px;line-height:16px;color:var(--bis-text-2);max-width:36ch}
.bis-empty .bis-btn{margin-top:12px}
.bis-scard{background:var(--bis-surface);border:1px solid var(--bis-stroke-light);border-radius:4px;padding:8px 12px 12px}
.bis-scard-h{display:flex;align-items:center;gap:8px}
.bis-scard-h .n{font-weight:600;flex:1;min-width:0}
.bis-scard-h .src{font-size:12px;line-height:16px;color:var(--bis-text-2)}
.bis-scard-h .ed{border:0;background:none;color:var(--bis-primary-400);padding:4px;border-radius:4px;display:flex;cursor:pointer}
.bis-scard-h .ed:hover{background:var(--bis-primary-lighter)}
.bis-slot{margin-top:6px;border:1px solid var(--bis-stroke-light);background:var(--bis-bg);border-radius:4px;padding:6px 8px}
.bis-slot .k{font-size:10px;line-height:14px;font-weight:600;color:var(--bis-text-2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.bis-slot .none{text-align:center;color:var(--bis-text-2);font-size:12px;line-height:16px;padding:2px 0}
.bis-slot .chips{display:flex;gap:6px;flex-wrap:wrap}
.bis-tip-badge{display:inline-flex}

/* BisGrid (not live yet; Mika's Figma setup, Nov 22): 12 columns, stretch, margin 30, gutter 16. Page content sits on it:
   <div class="bis-grid"><section class="c-7">…</section><aside class="c-5">…</aside></div> */
.bis-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px;row-gap:16px;padding:0 30px}
.bis-grid>.c-12{grid-column:span 12}.bis-grid>.c-7{grid-column:span 7}.bis-grid>.c-5{grid-column:span 5}.bis-grid>.c-6{grid-column:span 6}.bis-grid>.c-4{grid-column:span 4}.bis-grid>.c-8{grid-column:span 8}
@media(max-width:900px){.bis-grid>*{grid-column:span 12!important}}

/* STAND-IN motion (Mika Nov 22: hover felt abrupt): 160ms ease on hover and focus changes; reduced motion switches it off */
.bis-btn,.bis-chip,.bis-check,.bis-input,.bis-trow,.bis-create,.bis-step>button,.bis-scard-h .ed,.bis-banner .b-x,.bis-select .dd .opt,.bis-select .chips button,.bis-savestat button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,opacity .16s ease,box-shadow .16s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* G7 Collapse type="step" (approved by Mika Nov 22; from ds-components\review.html) */
:root{--bis-surface-secondary-lightest:#F2F2F2;--bis-surface-success-lightest:#FAFFF2}
.bis-acc{border:1px solid var(--bis-stroke-light);border-radius:8px;padding:12px;background:var(--bis-surface-secondary-lightest);display:flex;align-items:center;gap:10px;margin-top:8px}
.bis-acc>.sn{width:18px;height:18px;border-radius:999px;border:1px solid var(--bis-stroke);background:var(--bis-surface-2);color:var(--bis-text-2);font-size:12px;line-height:16px;font-weight:600;display:grid;place-items:center;flex:none}
.bis-acc>.lb{font-weight:600;color:var(--bis-text-2);flex:1}
.bis-acc.done{background:var(--bis-surface-success-lightest);border-color:var(--bis-stroke-success-light)}
.bis-acc.done>.sn{background:var(--bis-surface-success-lighter);border-color:var(--bis-stroke-success-light);color:var(--bis-icon-success)}
.bis-acc.done>.lb{color:var(--bis-text)}
.bis-acc.active{background:var(--bis-surface);border-color:var(--bis-primary);align-items:flex-start;flex-wrap:wrap}
.bis-acc.active>.sn{background:var(--bis-primary);border-color:var(--bis-primary);color:#fff}

<script>
/* ============ Sample data (a paving company) ============ */
const USERS=['Alex Brooks','Tessa Nguyen','Marcus Chen','Priya Patel','Jordan Price','Sam Okafor','Lena Fischer','Diego Ramos','Hannah Lee','Omar Haddad','Grace Kim','Noah Tremblay','Ivy Morgan','Ravi Singh','Elena Costa','Kai Johnson'].map((n,i)=>({id:'u'+i,n,l:(n[0]+n.split(' ')[1]).toLowerCase()+(i+1)}));
/* BisTreeList level colours: grey, green, blue, indigo (DS tokens); the fifth (orange) is in Figma only: DS asked Mika */
const LC=['#AFAFB5','#399300','#009ACB','#5378BB','#EA8D00'];
const ROOT={n:'Paving Company',c:120};
const T=[['Head Office',10,0],['Leadership',10,1],['Office',10,1],['Paving',0,1],['Paving Crew 1',10,2],['Paving Crew 2',3,2],['Concrete',0,1],['Flatwork Crew',3,2],['Curb Crew',0,2],["John's Curb Crew",2,3],["Sally's Curb Crew",3,3],['Night Curb Crew',2,4],['Trucking',0,1],['Haul Crew',3,2],['Lowbed Crew',2,2]];
const LOCS=(()=>{const st=[],roots=[];const a=T.map(([n,c,d],i)=>{st.length=d;const path=st.slice();st[d]=n;const members=Array.from({length:c},(_,k)=>USERS[(i*3+k)%USERS.length].id);return {id:'l'+i,n,c,d,path:path.length?path.join(' › '):ROOT.n,members,kids:[]};});
 const stack=[];a.forEach(l=>{if(l.d>0)stack[l.d-1].kids.push(l);else roots.push(l);stack[l.d]=l;});a.roots=roots;return a;})();
const NAV=['Home','Profile','Store','Rewards','Purchases','Users','Reporting','Calendar','Assets','Folders','QR','Field','Admin'];
const STEPS=[['crew','Crew'],['site','Site'],['job','Job'],['routine','Routine']];
const ROUTES=['home','welcome','crew','site','job','routine'];
const fresh=()=>({route:'home',portal:new URLSearchParams(location.search).get('portal')==='none'?'none':'users',bannerOff:false,started:false,crews:[],sel:new Set(),m:null,n:0,tf:'l0',ret:[],s:{lv:1,words:[null,null,null],step:1,sites:[],n:0,filter:'all',q:'',csel:new Set(),ctf:null,targets:[]},j:{step:1,sites:[],n:0,filter:'all',q:'',csel:new Set(),ctf:null,targets:[]},r:{tab:'tpl',list:[],n:0,seq:0,rename:null,adding:null,editing:null,err:false}});
let S=fresh();
/* Site and Job share one step: P() is the list being built on this route, K() its words */
const JOB=()=>S.route==='job';
const P=()=>JOB()?S.j:S.s;
const K=()=>JOB()?{one:'Job',many:'Jobs',lone:'job',lmany:'jobs'}:{one:'Site',many:'Sites',lone:'site',lmany:'sites'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const user=id=>USERS.find(u=>u.id===id);
const crewOfLoc=id=>S.crews.find(c=>c.locId===id);
const announce=m=>{ $('#live').textContent=''; setTimeout(()=>{$('#live').textContent=m;},30); };
const focusFirst=(...sels)=>{ for(const s of sels.flat()){ const n=s&&document.querySelector(s); if(n){ n.focus(); return true; } } return false; };
/* keep keyboard focus on the same control across a re-render */
function keepFocus(fn){ const a=document.activeElement, d=a&&a.dataset||{}; const sel=d.act&&d.id?`[data-act="${d.act}"][data-id="${d.id}"]`:a&&a.id?'#'+a.id:null; fn(); if(sel) focusFirst(sel); }

/* ============ Auto save badge (BisStepper save status) ============ */
const SAVE={status:'idle',at:0,skew:0}; let saveT;
const fmtTime=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).toLowerCase();
function ssView(){
 if(SAVE.status==='saving') return ['saving','<span class="bis-spin"></span>Saving'];
 if(SAVE.status==='error') return ['err','Couldn’t save <button type="button" data-act="retry">Try again</button>'];
 const m=Math.floor((Date.now()+SAVE.skew-SAVE.at)/60000);
 if(m<1) return ['fresh','<i class="fa-solid fa-check" aria-hidden="true"></i>Saved just now'];
 if(m<60) return ['old','Last saved '+m+' min ago'];
 return ['old','Last saved at '+fmtTime(SAVE.at)];
}
function ssDraw(){ const el=$('#savestat'); if(!el) return; if(SAVE.status==='idle'){ el.hidden=true; return; } const [c,h]=ssView(); el.hidden=false; el.className='bis-savestat '+c; el.innerHTML=h; }
function autosave(){ SAVE.status='saving'; SAVE.skew=0; ssDraw(); announce('Saving'); clearTimeout(saveT); saveT=setTimeout(()=>{ SAVE.at=Date.now(); SAVE.status='saved'; ssDraw(); announce('Saved'); },900); }
setInterval(ssDraw,5000);

/* ============ Routing ============ */
function go(r){ S.route=r; S.m=null; if(r!=='home') S.started=true; if(location.hash!=='#/'+r) history.replaceState(null,'','#/'+r); render(); window.scrollTo(0,0); }
function render(){
 $('#jump').value=S.route; $('#portal').value=S.portal;
 $('#nav').innerHTML=NAV.map(n=>`<button type="button" data-act="nav" data-n="${n}" id="nav-${n}"${(n==='Field'?S.route!=='home':n==='Home'&&S.route==='home')?' class="on" aria-current="page"':''}>${n}</button>`).join('')+'<button type="button" class="pinfo" aria-label="Info"><i class="fa-solid fa-square" aria-hidden="true"></i></button>';
 const v={home,welcome,crew,site,job:site,routine}[S.route];
 const sc2=$('#cl2')?$('#cl2').scrollTop:0; $('#app').innerHTML=v(); foot(); bulk(); modal(); ssDraw(); if($('#cl2')) $('#cl2').scrollTop=sc2;
}

/* ============ Home: a banner only (BisBanner) ============ */
function home(){
 const rows=[['course with form - test',' <b style="color:#d93025">Waiting for Form Completion.</b>','04/16/2026','-','07/21/2026','80%','10 Mins','2/2','-','Resume'],['Kavya topic override from course','','04/16/2026','-','-','80%','95 Mins','0/1','-','Start'],['Kavya course override 1','','04/16/2026','-','-','80%','90 Mins','0/1','-','Start'],['Continuous Learning 01 ORIGINAL','','04/16/2026','-','-','80%','11 Mins','0/1','-','Start'],['Occupational Health And Safety Awareness For Supervisors in 5 Steps','','03/30/2026','-','-','100%','60 Mins','0/1','<i class="fa-regular fa-file-pdf" style="color:#d93025;font-size:20px"></i>','Start'],['17112_safetycourse1','','03/25/2026','-','-','80%','90 Mins','0/1','-','Start']];
 const banner=S.bannerOff?'':`<div class="home-banner"><div class="bis-banner" role="region" aria-label="Field Management"><span class="b-icon"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></span><div class="b-body"><span class="bis-badge blue">NEW</span> <span class="b-title">Field Management</span> See which crews are where, what's been done today, using the locations and people you already have.</div><button class="bis-btn primary" type="button" data-act="goto" data-r="welcome">Set it up</button><button class="bis-btn secondary" type="button" data-act="remind">Remind me next time</button><button class="b-x" type="button" aria-label="Dismiss" data-act="dismiss"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></div>`;
 return `<div class="home-tools"><button class="bis-btn secondary-primary sm" type="button">⊕ Add Course</button><button class="bis-btn secondary-primary sm" type="button">Request Training</button><div class="home-seg"><span>All</span><span>Training</span><span>Forms</span><span>Tasks</span><span>Folders</span></div></div>${banner}
 <div class="home-bar"><span>Assigned</span><span class="o">Show Asset Forms</span></div>
 <table class="home-t"><tr><th>Training</th><th>Added</th><th>Due Date</th><th>Started</th><th>Pass Mark</th><th>Estimated Time</th><th>Segment</th><th>Materials</th><th></th></tr>${rows.map(r=>`<tr><td><a>${r[0]}</a>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td><td style="text-align:right"><span class="st ${r[9]==='Start'?'go':'re'}">${r[9]}</span></td></tr>`).join('')}</table>`;
}

/* ============ Welcome (the empty Field page) ============ */
function welcome(){
 const li=[['fa-location-dot','All your places and work in one list'],['fa-chart-simple','See what’s done and what’s missing today'],['fa-user-group','Know who’s working where'],['fa-mobile-screen','Your people fill it in on their phone'],['fa-repeat','Set the checks that are due, and when']];
 return `<div class="bis-grid welcome"><div class="wcard"><span class="bis-badge blue md">NEW</span><h1>Welcome to <b>Field Management</b></h1><p class="lead">See that the work in the field gets done, every day.</p>
 <div class="wlist">${li.map(([i,t])=>`<div><i class="fa-solid ${i}" aria-hidden="true"></i><span>${t}</span></div>`).join('')}</div>
 <div class="wfoot"><button class="bis-btn primary lg" type="button" data-act="goto" data-r="crew" id="getstarted">Get started</button><span><i class="fa-regular fa-clock" aria-hidden="true"></i> About 10 minutes</span></div></div></div>`;
}

/* ============ Shared setup pieces ============ */
/* BisStepper: steps, current, completed, onStepClick (done steps), save status */
function stepper(cur){
 const ci=STEPS.findIndex(s=>s[0]===cur);
 return `<div class="bis-stepper-wrap"><ol class="bis-stepper" aria-label="Set up progress">${STEPS.map(([k,t],i)=>{
  const inner=`<span class="bis-step-dot">${i<ci?'<i class="fa-solid fa-check" aria-hidden="true"></i>':i+1}</span><span class="bis-step-label">${t}</span>${i<ci?'<span class="bis-sr"> completed</span>':''}`;
  return `<li class="bis-step ${i<ci?'done':i===ci?'current':''}"${i===ci?' aria-current="step"':''}>${i<ci?`<button type="button" data-act="goto" data-r="${k}">${inner}</button>`:inner}</li>`; }).join('')}</ol><span class="bis-savestat" id="savestat" hidden></span></div>`;
}
const setHead=cur=>`<div class="settitle"><i class="fa-solid fa-wrench" aria-hidden="true"></i><h1 style="font-size:18px;font-weight:500">Set up Field Management</h1></div><div style="grid-column:span 12">${stepper(cur)}</div>`;
function stub(t,d){ return `<div class="bis-grid setup">${setHead(S.route)}<div class="c-12 card ph"><b>${t} step</b>${d} Built in the next phase.</div></div>`; }
function foot(){
 const f=$('#foot'), r=S.route, i=STEPS.findIndex(s=>s[0]===r);
 if(i<0&&r!=='welcome'){ f.hidden=true; return; } f.hidden=false;
 if(r==='site'||r==='job'){ const J=r==='job', st=P().sites, full=st.length&&sitesWith()===st.length, nx=J?'routine':'job', pv=J?'site':'crew', ok=full||(J&&!st.length);
  f.innerHTML=`<button class="bis-btn tertiary back" type="button" data-act="goto" data-r="${pv}">Back</button><span class="sp"></span>${!J&&!st.length?`<button class="bis-btn secondary lg" type="button" data-act="goto" data-r="${nx}">I don’t need Sites</button>`:st.length&&!full?`<button class="bis-btn secondary lg" type="button" data-act="goto" data-r="${nx}">${sitesWith()?'Save and add the rest later':'Add crews later'}</button>`:''}<button class="bis-btn primary lg" id="cont" type="button" data-act="scont">Continue</button>`; return; }
 if(r==='routine'){ const n=S.r.list.length; f.innerHTML=`<button class="bis-btn tertiary back" type="button" data-act="goto" data-r="job">Back</button><span class="sp"></span><button class="bis-btn secondary lg" type="button" data-act="rskip">Skip for now</button><button class="bis-btn primary lg" id="cont" type="button" data-act="rcreate">${n>1?'Create '+n+' routines':'Create routine'}</button>`; return; }
 const prev=r==='welcome'?'home':i>0?STEPS[i-1][0]:'welcome', next=i>=0&&i<STEPS.length-1?STEPS[i+1][0]:null;
 f.innerHTML=r==='welcome'?`<button class="bis-btn tertiary back" type="button" data-act="goto" data-r="home">Back</button>`:`<button class="bis-btn tertiary back" type="button" data-act="goto" data-r="${prev}">Back</button><span class="sp"></span>${r==='crew'?`<button class="bis-btn primary lg" id="cont" type="button" data-act="ccont">Continue</button>`:next?`<button class="bis-btn primary lg" type="button" data-act="goto" data-r="${next}">Continue</button>`:`<button class="bis-btn primary lg" type="button" data-act="toast" data-m="That is the end of what is built so far">Finish</button>`}`;
}

/* ============ Crew ============ */
/* BisTreeList: role=tree, one tab stop (arrows move between rows), see KEYBOARD */
function node(l){
 const cr=crewOfLoc(l.id), sel=S.sel.has(l.id), n=esc(l.n);
 return `<li role="treeitem" aria-level="${l.d+1}" aria-selected="${sel}"><div class="bis-trow${cr?' done':''}${sel?' sel':''}"><span class="bis-dot" style="background:${LC[Math.min(l.d,4)]}"></span><span class="bis-tname">${n}</span>${cr?`<span class="bis-created"><i class="fa-regular fa-circle-check" aria-hidden="true"></i> Created</span><button class="bis-edit" type="button" tabindex="-1" data-act="edit" data-id="${cr.id}" aria-label="Edit crew ${n}"><i class="fa-regular fa-pen-to-square" aria-hidden="true"></i></button>`:''}<span class="bis-counter">${l.c}</span><input class="bis-check" type="checkbox" data-act="sel" data-id="${l.id}" aria-label="Select ${n}${cr?' (already a crew)':''}" tabindex="${S.tf===l.id?0:-1}"${cr?' aria-disabled="true"':''}${sel?' checked':''}></div>${l.kids.length?`<ul role="group">${l.kids.map(node).join('')}</ul>`:''}</li>`;
}
const crewIcon=(c)=>`<i class="fa-solid ${c} e-ic" aria-hidden="true"></i>`;
function crew(){
 const empty=S.portal==='none', all=LOCS.filter(r=>!crewOfLoc(r.id)), allOn=all.length&&all.every(r=>S.sel.has(r.id));
 const left=empty?`<section class="c-7 card"><h2>Set up your crews</h2><div class="bis-empty embedded"><span class="e-ic"><i class="fa-solid fa-user-plus" aria-hidden="true"></i></span><div class="e-t">No people in your portal yet</div><div class="e-d">Add users and their groups will show up here, ready to turn into crews.</div><button class="bis-btn secondary" type="button" data-act="toast" data-m="Opens Users (not built in this prototype)"><i class="fa-solid fa-circle-plus" aria-hidden="true"></i> Add users</button></div></section>`
 :`<section class="c-7 card"><div class="card-h"><div class="grow"><h2>Set up your <span class="hint"><button class="bis-btn link" type="button">Crews</button><span class="bis-tip" role="tooltip">What’s a crew? A group of people who work together, set up once and used across your portal.</span></span></h2><p class="sub">Make your crews from your user hierarchy or from scratch.</p></div><span class="hint r"><button class="bis-btn secondary sm" type="button"><i class="fa-regular fa-lightbulb" aria-hidden="true"></i> Help</button>${helpPop('How to set up crews',['Tick the locations you want as crews, then choose <b>Create</b> in the bar at the bottom. Created locations show a <b>Created</b> badge.','No matching location? Choose <b>Create crew</b> to start from scratch: name it and add its people.','Use the pencil next to <b>Created</b> to edit a crew, and the bin in the Created crews list to remove it. You can undo a removal.'],'Choose Continue when you’re done. You can come back to this step any time.')}</span></div>
 <div class="root"><span>${ROOT.n}</span><span class="bis-counter">${ROOT.c}</span><span class="sp"></span><input class="bis-check" type="checkbox" data-act="selall" aria-label="Select all locations"${allOn?' checked':''}${all.length?'':' disabled'}></div>
 <ul class="bis-tree" role="tree" aria-label="Your user hierarchy" aria-multiselectable="true" id="tree">${LOCS.roots.map(node).join('')}</ul></section>`;
 /* Created crews: a plain list, name + people count + edit (Figma 432:3067, Mika Nov 22: no source label, no path). BisSummaryCard is not used here. */
 const list=S.crews.length?`<ul class="clist" id="crewlist" aria-label="Created crews">${S.crews.map(c=>`<li><span class="n">${esc(c.name)}</span><span class="bis-counter" title="${c.members.length} people">${c.members.length}</span><button class="ed rm" type="button" data-act="crewrm" data-id="${c.id}" aria-label="Remove ${esc(c.name)}"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button><button class="ed" type="button" data-act="edit" data-id="${c.id}" aria-label="Edit ${esc(c.name)}"><i class="fa-regular fa-pen-to-square" aria-hidden="true"></i></button></li>`).join('')}</ul>`
  :`<div class="bis-empty embedded"><span class="e-ic"><i class="fa-solid fa-helmet-safety" aria-hidden="true"></i></span><div class="e-t">No crews yet</div><div class="e-d">${empty?'You can create one now and add people later.':'Create them from your hierarchy on the left, or start from scratch.'}</div><button class="bis-btn secondary" type="button" data-act="scratch"><i class="fa-solid fa-circle-plus" aria-hidden="true"></i> Create crew</button></div>`;
 const right=`<aside class="c-5 card${S.tried&&S.tried.crew&&!S.crews.length?' invalid':''}"><div class="card-h2"><span>Created crews</span><span class="bis-counter">${S.crews.length}</span><span class="sp"></span>${S.crews.length?`<button class="bis-btn primary sm" type="button" data-act="scratch"><i class="fa-solid fa-circle-plus" aria-hidden="true"></i> Create</button>`:''}</div>${list}</aside>`;
 return `<div class="bis-grid setup">${setHead('crew')}${left}${right}</div>`;
}
function makeCrews(ids){ ids.forEach(id=>{ const l=LOCS.find(x=>x.id===id); if(!crewOfLoc(id)) S.crews.push({id:'c'+(++S.n),name:l.n,locId:id,members:l.members.slice(),sup:[]}); S.sel.delete(id); }); }
/* BisBulkBar: N selected, Select all, Clear, divider, action */
function bulk(){
  if(multiOn()){ const p=P(), n=p.csel.size, every=p.sites.every(x=>p.csel.has(x.id));
   $('#bulk').innerHTML=n?`<div class="bis-bulk-fixed"><div class="bis-bulkbar" role="region" aria-label="Selected ${K().lmany}"><span class="sel">${n} selected</span>${sg('btarget',{multi:true,opts:()=>S.crews.map(x=>({v:x.id,l:x.name})),vals:()=>P().targets,set:a=>{ P().targets=a; },ph:'Search crews',up:true,field:true,what:'crews',label:'Crews to add to the selected '+K().lmany,none:'No crews found',after:()=>bulk()})}<span class="grow"></span>${every?'':'<button class="bis-btn link" type="button" data-act="msall">Select all</button>'}<button class="bis-btn link" type="button" data-act="mdesel">Deselect all</button><span class="bdiv" role="separator" aria-orientation="vertical"></span><button class="bis-btn primary" id="satt" type="button" data-act="msadd"${p.targets.length?'':' disabled'}>Add crews</button></div></div>`
    :`<div class="bis-bulk-fixed"><div class="bis-bulkbar none" role="region" aria-label="Selected ${K().lmany}"><span class="sel">Nothing selected</span><span class="grow"></span><button class="bis-btn link" type="button" data-act="msall">Select all</button></div></div>`; return; }
  const n=S.route==='crew'?S.sel.size:0;
 $('#bulk').innerHTML=n?`<div class="bis-bulk-fixed"><div class="bis-bulkbar" role="region" aria-label="Selected locations"><span class="sel">${n} selected</span><span class="grow"></span><button class="bis-btn link" type="button" data-act="bulkall">Select all</button><button class="bis-btn secondary" type="button" data-act="bulkclear">Clear</button><span class="bdiv" role="separator" aria-orientation="vertical"></span><button class="bis-btn primary" type="button" data-act="bulkmake">Create</button></div></div>`:'';
}
function bulkMake(){ const n=S.sel.size; if(!n) return; makeCrews([...S.sel]); render(); focusFirst(`input[data-act=sel][data-id="${S.tf}"]`,'#tree input'); autosave(); toast(n+(n===1?' crew created':' crews created')); }

/* ============ Crew modals (create from location, create from scratch, edit) ============ */
function openModal(m,ret){ S.ret=ret||[]; S.m=Object.assign({members:[],sup:[],membersq:'',supq:'',open:null,hl:{members:0,sup:0},name:''},m); modal(); const n=$('#mName'); if(n){ n.focus(); n.select(); } }
function closeModal(){ S.m=null; SG.open=null; modal(); focusFirst(S.ret); }

/* arrow, Home and End move between the ticks of a list */
function navList(e,sel){ const boxes=[...document.querySelectorAll(sel)].filter(i=>!i.disabled), i=boxes.indexOf(e.target); if(i<0) return false; let n=null; if(e.key==='ArrowDown') n=boxes[i+1]; else if(e.key==='ArrowUp') n=boxes[i-1]; else if(e.key==='Home') n=boxes[0]; else if(e.key==='End') n=boxes[boxes.length-1]; else return false; e.preventDefault(); if(n) n.focus(); return true; }

/* ============ KEYBOARD (Mika, Nov 22: every field and selection works from the keyboard) ============
   Modal: opens with the Name field focused; Tab and Shift+Tab stay inside; Esc closes (first Esc closes an open list); Enter in Name moves on to the
          next field; Ctrl/Cmd+Enter saves from anywhere; focus goes back to where it came from.
   BisSelect (combobox): type to filter; Arrow Down/Up open and move; Enter adds the highlighted person (the first match is highlighted as you type);
          the list stays open for the next person; Esc closes; Backspace in an empty field removes the last chip; Tab leaves.
   BisTreeList: one Tab stop; Arrow Up/Down, Home/End move between rows; Space ticks; Enter creates (or edits) that row's crew; Ctrl/Cmd+A selects all;
          Ctrl/Cmd+Enter creates the ticked rows; Esc clears the selection. Changes are announced to screen readers. */
document.addEventListener('keydown',e=>{
 const t=e.target, m=S.m, mod=e.ctrlKey||e.metaKey;
 if(mod&&(e.key==='z'||e.key==='Z')&&UNDO&&!m&&!(t.matches&&t.matches('input,textarea'))){ e.preventDefault(); return runUndo(); }
 if(t.dataset&&t.dataset.act==='rname'){ if(e.key==='Enter'){ e.preventDefault(); return rNameSave(t.dataset.id,t.value,true); } if(e.key==='Escape'){ e.preventDefault(); const id=t.dataset.id; S.r.rename=null; render(); return focusFirst(`[data-act=rren][data-id="${id}"]`,'#btn-rnew'); } }
 if(t.dataset&&t.dataset.act==='ritemreq'){ const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(k){ e.preventDefault(); const r=rById(t.dataset.r), it=r.items.find(x=>x.id===t.dataset.id); it.req=k<0; return rChanged(r,`#rq-${r.id}-${it.id}-${it.req?'req':'opt'}`); } return; }
 if(t.dataset&&t.dataset.act==='rtab'){ const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(k){ e.preventDefault(); S.r.tab=k>0?'scratch':'tpl'; render(); return focusFirst('#rt-'+S.r.tab); } return; }
 /* single select (BisSelect): Arrow keys open and move, Enter opens or picks, Esc closes, Tab leaves */
 const sgw=t.closest&&t.closest('[data-sg]');
 if(sgw&&(t.classList.contains('sgb')||t.classList.contains('sgq'))){ const id=sgw.dataset.sg, open=SG.open===id, n=sgFiltered(id).length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!open) return sgOpen(id); SG.hl=e.key==='ArrowDown'?Math.min(SG.hl+1,n-1):(SG.hl<=0?n-1:SG.hl-1); return sgListRedraw(id); }
  if(e.key==='Backspace'&&SGD[id].multi&&t.classList.contains('sgq')&&!t.value){ const v=SGD[id].vals(); if(v.length){ e.preventDefault(); SGD[id].set(v.slice(0,-1)); SG.dirty=true; sgRedraw(id); if(open) sgListRedraw(id); else if(SGD[id].after) SGD[id].after(); } return; }
  if(e.key==='Enter'&&!mod){ e.preventDefault(); return open?sgPickHl(id):sgOpen(id); }
  if(e.key==='Escape'&&open){ e.preventDefault(); e.stopPropagation(); return sgClose(id,true); }
  if(e.key==='Tab'&&open&&!SGD[id].multi) sgClose(id,false);
 }
 /* combobox */
 const k=t.dataset&&t.dataset.pkin;
 if(m&&k){ const list=pkList(k);
  if(e.key==='ArrowDown'){ e.preventDefault(); if(m.open!==k){ openPk(k); m.hl[k]=0; } else m.hl[k]=Math.min(m.hl[k]+1,list.length-1); return pkRefresh(k); }
  if(e.key==='ArrowUp'){ e.preventDefault(); if(m.open!==k){ openPk(k); m.hl[k]=list.length-1; } else m.hl[k]=m.hl[k]<=0?list.length-1:m.hl[k]-1; return pkRefresh(k); }
  if(e.key==='Enter'&&!mod&&m.open===k&&list.length){ e.preventDefault(); return pick(k,list[m.hl[k]].id); }
  if(e.key==='Escape'&&m.open===k){ e.preventDefault(); e.stopPropagation(); m.open=null; return pkRefresh(k); }
  if(e.key==='Backspace'&&!t.value&&m[k].length){ e.preventDefault(); return unpick(k,m[k][m[k].length-1]); }
 }
 if(m){
  if(m.kind==='imp'&&t.matches&&t.matches('#implist input[data-act=isel]')){
   if(navList(e,'#implist input[data-act=isel]')) return;
   if((e.key==='a'||e.key==='A')&&mod){ e.preventDefault(); impVisible().filter(impPickable).forEach(x=>m.sel.add(x.id)); announce(m.sel.size+' selected'); return impRe(); }
   if(e.key==='Enter'&&!mod){ e.preventDefault(); if(m.sel.size&&!JOB()) return sgOpen('ilv'); return t.click(); }
  }
  if(e.key==='Escape'){ e.preventDefault(); const w=t.closest&&t.closest('[data-pk]'); if(w&&m.open===w.dataset.pk) return closePk(w.dataset.pk,false); if(m.kind==='imp'&&m.sel.size){ m.sel.clear(); announce('Selection cleared'); return impRe(); } return closeModal(); }
  if(e.key==='Enter'&&mod){ e.preventDefault(); return saveModal(); }
  if(e.key==='Enter'&&t.id==='mName'){ e.preventDefault(); const n=$('#sgb-slevel')||$('#sgb-satsite')||document.querySelector('[data-pkin=members]')||$('#mSearch')||document.querySelector('[data-pkin=sup]'); if(n) n.focus(); return; }
  if(e.key==='Tab'){ const f=[...$('.bis-modal').querySelectorAll('button:not([disabled]),input:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(n=>n.offsetParent!==null); if(!f.length) return; const first=f[0], last=f[f.length-1];
   if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } }
  return;
 }
 /* tree */
 /* Site step: crew list, levels control */
 if(t.matches&&t.matches('#cl2 input[data-act=csel]')){
  if(navList(e,'#cl2 input[data-act=csel]')) return;
  if((e.key==='a'||e.key==='A')&&mod){ e.preventDefault(); P().sites.forEach(x=>P().csel.add(x.id)); keepFocus(render); announce(P().csel.size+' selected'); }
  else if(e.key==='Enter'){ e.preventDefault(); if(P().csel.size) sgOpen('btarget'); else if(!mod) t.click(); }
  else if(e.key==='Escape'&&P().csel.size){ e.preventDefault(); P().csel.clear(); keepFocus(render); announce('Selection cleared'); }
  return;
 }
 if(t.matches&&t.matches('.bis-seg.imp button')){ const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(k){ e.preventDefault(); const bs=[...t.parentElement.querySelectorAll('button:not(:disabled)')], n=bs[Math.max(0,Math.min(bs.length-1,bs.indexOf(t)+k))]; if(n){ S.m.f=n.dataset.f==='all'?'all':Number(n.dataset.f); impRe('#imf-'+n.dataset.f); } } return; }
 if(t.matches&&t.matches('.bis-seg.filter button')){ const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(k){ e.preventDefault(); const bs=[...t.parentElement.querySelectorAll('button:not(:disabled)')], n=bs[Math.max(0,Math.min(bs.length-1,bs.indexOf(t)+k))]; if(n){ P().filter=n.dataset.f; render(); focusFirst('#fp-'+P().filter); } } return; }
 if(t.matches&&t.matches('.bis-seg button')){ const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(k){ e.preventDefault(); P().lv=Math.max(1,Math.min(3,P().lv+k)); render(); focusFirst('#slv-'+P().lv); } return; }
 if(t.matches&&t.matches('#tree input[data-act=sel]')){
  const boxes=[...document.querySelectorAll('#tree input[data-act=sel]')], i=boxes.indexOf(t);
  if(e.key==='ArrowDown'){ e.preventDefault(); if(boxes[i+1]) boxes[i+1].focus(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(boxes[i-1]) boxes[i-1].focus(); }
  else if(e.key==='Home'){ e.preventDefault(); boxes[0].focus(); }
  else if(e.key==='End'){ e.preventDefault(); boxes[boxes.length-1].focus(); }
  else if(e.key==='Enter'&&mod){ e.preventDefault(); bulkMake(); }
  else if(e.key==='Enter'){ e.preventDefault(); const row=t.closest('.bis-trow'), b=row.querySelector('[data-act=edit]'); if(b) b.click(); else { const c=row.querySelector('input[data-act=sel]'), l=c&&LOCS.find(x=>x.id===c.dataset.id); if(l) openModal({type:'create',locId:l.id,name:l.n,members:l.members.slice()},[`input[data-act=sel][data-id="${l.id}"]`]); } }
  else if((e.key==='a'||e.key==='A')&&mod){ e.preventDefault(); LOCS.filter(r=>!crewOfLoc(r.id)).forEach(r=>S.sel.add(r.id)); keepFocus(render); announce(S.sel.size+' selected'); }
  else if(e.key==='Escape'&&S.sel.size){ e.preventDefault(); S.sel.clear(); keepFocus(render); announce('Selection cleared'); }
 }
});

addEventListener('keydown',e=>{ if(e.key==='Escape'&&!S.m&&multiOn()&&!e.target.closest('.bis-sg')){ const p=P(); p.multi=false; p.csel.clear(); p.targets=[]; render(); focusFirst('[data-act=multi]'); } });
(function(){ const j=$('#jump'), rv=$('#review'), menu=$('#rvmenu'), cb=$('#cb'), pc=$('#pc');
 const now=()=>{ $('#now').textContent=j.options[j.selectedIndex].text; };
 const step=d=>{ const n=j.options.length; j.selectedIndex=(j.selectedIndex+d+n)%n; go(j.value); now(); };
 $('#pv').onclick=()=>step(-1); $('#nx').onclick=()=>step(1); j.addEventListener('change',now); now();
 cb.onclick=()=>{ const o=menu.classList.toggle('on'); cb.setAttribute('aria-expanded',o); now(); };
 const fold=f=>{ document.body.classList.toggle('folded',f); rv.classList.remove('peek'); menu.classList.remove('on'); cb.setAttribute('aria-expanded','false'); };
 $('#hide').onclick=()=>fold(true); pc.onclick=()=>fold(false);
 const peek=o=>{ if(document.body.classList.contains('folded')) rv.classList.toggle('peek',o); };
 pc.onmouseenter=()=>peek(true); pc.onfocus=()=>peek(true); rv.onmouseleave=()=>{ if(!menu.classList.contains('on')) peek(false); };
 document.addEventListener('click',e=>{ if(menu.classList.contains('on')&&!e.target.closest('.rv-more')){ menu.classList.remove('on'); cb.setAttribute('aria-expanded','false'); } });

{ const r=location.hash.replace('#/',''); if(ROUTES.includes(r)){ S.route=r; if(r!=='home') S.started=true; } render(); }
