<!DOCTYPE html>
<!--
  TKT-22242 — BIS Assets: Redesign Sub-Assets + Parts Inventory & Consumption (Phase 1)
  Mid-fi interactive prototype, v2.
  Chrome: _templates/prototype-template.html.
  Product UI:
    • BIS web shell = the current live chrome (purple title bar, top nav) so the client recognises it.
    • Components follow the BIStrainer UI Library: BisButton (primary = BIS blue), BisModal "themed"
      (BIStrainer UI Library / Storybook BisModal), the Task Management
      "New Task" create pattern (Task Management Figma), and the Field Management right
      panel (field-management-wireframe-ideal.html).
    • Mobile = the live SafeTapp asset screen (Info tab → Linked Sub Asset accordion → eye → bottom sheet),
      Mobile Figma. "Move Inventory" becomes Use / Refill.
  One shared state drives every screen: using / refilling anywhere updates every surface.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TKT-22242 — Sub-Assets & Parts Inventory — Prototype</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    /* BIStrainer UI Library tokens (subset) */
    --primary:#0078B3; --primary-hover:#095F8C; --primary-tint:#F0F9FE; --primary-lightest:#F8FEFF; --primary-stroke:#009ACB; --primary-stroke-l:#C9EFFA;
    --text:#19191A; --text-2:#636368; --text-3:#96969D; --text-on:#FEFEFE;
    --surface:#FEFEFE; --bg:#F8F8F8; --lightest:#F2F2F2; --lighter:#DFDFE2; --disabled:#F2F2F2;
    --stroke:#AFAFB5; --stroke-l:#DFDFE2; --stroke-d:#4C4C4F;
    --success:#167B00; --success-tint:#EBF8D6; --success-stroke:#DDF1BA;
    --notice:#9C6300; --notice-icon:#C37900; --notice-tint:#FFF3E1; --notice-stroke:#FFECCF;
    --danger:#CC2222; --danger-tint:#FFF2F2; --danger-stroke:#FDD4D4;
    --icon:#4C4C4F; --icon-l:#AFAFB5;
    --overlay:rgba(25,25,27,.25);
    --shadow-l1:0 0 3px rgba(0,0,0,.15); --shadow-l2:0 0 4px rgba(0,0,0,.15); --shadow-l3:0 0 8px rgba(0,0,0,.15); --shadow-l5:0 0 20px rgba(0,0,0,.15);
    --r-base:4px; --r-md:8px; --r-lg:12px;
    --bis-purple:#463C58;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI", system-ui, sans-serif; font-size:14px; color:var(--text); background:var(--bg); line-height:1.5; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  a { color:var(--primary); text-decoration:none; cursor:pointer; }
  a:hover { text-decoration:underline; }
  button { font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; }
  input, select, textarea { font-family:inherit; color:var(--text); }

  /* ===== template chrome (not product) ===== */
  .topbar { background:#fff; border-bottom:1px solid var(--stroke-l); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 16px; flex-wrap:wrap; flex-shrink:0; }
  .topbar-left, .topbar-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .t-ticket { font-size:16px; font-weight:600; } .t-project { font-size:14px; } .t-date { font-size:12px; }
  .badge-pill { display:inline-flex; align-items:center; padding:2px 8px; border-radius:12px; font-size:12px; font-weight:600; box-shadow:0 0 4px rgba(0,0,0,.15); white-space:nowrap; background:var(--primary-tint); color:var(--primary); }
  .btn-reset { background:#fff; border:1px solid var(--stroke-d); border-radius:4px; padding:5px 12px; font-size:13px; font-weight:600; color:var(--text-2); }
  .btn-notes { background:var(--primary-tint); border:1px solid var(--primary); color:var(--primary); border-radius:4px; padding:5px 12px; font-size:13px; font-weight:600; }
  .page { width:100%; flex:1; min-height:0; display:flex; flex-direction:column; padding:10px 20px 14px; }
  .navrow { display:flex; align-items:center; gap:16px; margin-bottom:6px; flex-wrap:wrap; flex-shrink:0; }
  .seg-control { display:inline-flex; border:1px solid var(--stroke); border-radius:80px; overflow:hidden; background:#fff; }
  .seg-opt { background:rgba(254,255,255,.75); border-left:1px solid var(--stroke); padding:5px 14px; font-size:13px; }
  .seg-opt:first-child { border-left:none; }
  .seg-opt.active { background:var(--primary-tint); color:var(--primary); font-weight:600; }
  .flow-tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .flow-tab { padding:5px 14px; font-size:14px; font-weight:600; color:var(--text-2); border-radius:4px; border:1px solid transparent; }
  .flow-tab.active { background:#fff; border-color:var(--stroke-l); color:var(--primary); }
  .proto-card { background:#fff; border:1px solid var(--stroke); border-radius:8px; display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; position:relative; }
  .proto-stage { flex:1; min-height:0; overflow-y:auto; padding:18px 20px 24px; background:#EEF0F2; }
  .step-details { background:var(--bg); border-top:1px solid var(--stroke-l); padding:10px 18px 12px; flex-shrink:0; }
  .sd-title { font-size:14px; font-weight:600; margin-bottom:4px; }
  .sd-list { list-style:disc; padding-left:18px; font-size:12px; line-height:1.6; }
  .anno { border:1.5px dashed #8a7fb0; background:#f7f5ff; border-radius:8px; padding:14px 16px; font-size:13px; }
  .anno h4 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#5a4e86; margin-bottom:8px; }
  .anno-tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; background:#5a4e86; color:#fff; border-radius:3px; padding:1px 6px; margin-right:6px; vertical-align:middle; }
  .ctl-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:12px; color:var(--text-2); font-weight:600; flex-wrap:wrap; }

  /* ===== BIS web shell (current live chrome) ===== */
  .bis { background:#fff; border:1px solid #d6d6d6; border-radius:4px; min-height:100%; position:relative; }
  .bis-top { display:flex; align-items:center; gap:12px; padding:9px 16px; border-bottom:1px solid #eee; }
  .logo { display:flex; align-items:center; gap:6px; }
  .logo b { font-size:22px; font-weight:800; letter-spacing:-1px; }
  .logo small { font-size:8.5px; line-height:1.1; border-left:1px solid #333; padding-left:5px; color:#333; text-transform:uppercase; }
  .spacer { flex:1; }
  .usersearch { width:200px; height:30px; padding:4px 8px; font-size:13px; border:1px solid var(--stroke); border-radius:4px; }
  .circ { width:30px; height:30px; border:1.5px solid #555; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; position:relative; color:#444; font-size:13px; }
  .bell-badge { position:absolute; top:-6px; right:-7px; background:var(--danger); color:#fff; font-size:10px; border-radius:8px; padding:0 5px; font-weight:700; line-height:15px; }
  .avatar { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#7ad,#3a8); }
  .logout { font-size:13px; color:#555; }
  .bis-nav { display:flex; gap:28px; padding:8px 16px; border-bottom:1px solid #e5e5e5; font-size:14px; flex-wrap:wrap; }
  .bis-nav .on { color:var(--primary); font-weight:600; }
  .bis-title { background:var(--bis-purple); color:#fff; padding:9px 24px; font-size:17px; display:flex; align-items:center; gap:12px; }
  .bis-title .back { margin-left:auto; border:1px solid #fff; color:#fff; border-radius:4px; padding:2px 9px; font-size:12px; }
  .bis-body { padding:20px 24px 28px; }

  /* menus / popovers */
  .pop { position:absolute; background:var(--surface); border:1px solid var(--stroke-l); border-radius:var(--r-md); box-shadow:var(--shadow-l2); z-index:20; }
  .bell-pop { right:70px; top:46px; width:360px; }
  .bell-pop h5 { font-size:14px; padding:10px 12px; border-bottom:1px solid var(--stroke-l); }
  .notif { padding:10px 12px; border-bottom:1px solid var(--stroke-l); font-size:13px; display:flex; gap:10px; }
  .notif:last-child { border-bottom:none; }
  .notif.unread { background:var(--primary-lightest); }
  .notif i { color:var(--notice-icon); margin-top:3px; }
  .notif small { color:var(--text-2); display:block; }
  .menu { right:0; top:32px; min-width:200px; padding:4px; text-align:left; }
  .mi { width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:14px; text-align:left; border-radius:var(--r-base); }
  .mi:hover { background:var(--primary-lightest); }
  .mi i { width:16px; color:var(--icon); font-size:13px; }
  .mi.danger, .mi.danger i { color:var(--danger); }
  .msep { border-top:1px solid var(--stroke-l); margin:4px 0; }

  /* BisButton [Figma §3.1]: 34 high, padding 4/8, radius 4, 16/26 600; small 26 high, 14/18 */
  .b { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:4px 8px; border-radius:var(--r-base); border:1px solid var(--stroke); background:transparent; font-size:16px; line-height:26px; font-weight:600; color:var(--text-2); white-space:nowrap; }
  .b:hover { background:var(--lightest); }
  .b i { font-size:14px; }
  .b-primary { background:var(--primary); border-color:transparent; color:var(--text-on); }
  .b-primary:hover { background:var(--primary-hover); }
  .b-sp { color:var(--primary); }
  .b-ghost { border-color:transparent; color:var(--text); }
  .b-ghost:hover { background:transparent; color:var(--text-2); }
  .b-danger { background:var(--danger); border-color:transparent; color:var(--text-on); }
  .b-danger:hover { background:#A43232; }
  .b-link { border:none; height:auto; padding:2px; color:var(--primary); font-weight:400; font-size:14px; }
  .b-link:hover { background:none; text-decoration:underline; }
  .b-sm { height:26px; padding:4px 6px; font-size:14px; line-height:18px; }
  .b-sm i { font-size:12px; }
  .b:disabled { opacity:.45; cursor:not-allowed; }
  .b-primary:disabled { opacity:1; background:var(--disabled); color:var(--text-3); }
  .ib { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:var(--r-base); color:var(--icon); font-size:14px; flex-shrink:0; }
  .ib:hover { background:var(--lightest); }

  /* fields */
  .lbl { display:block; font-size:16px; line-height:24px; font-weight:600; margin-bottom:4px; }
  .lbl .req, .req { color:var(--danger); margin-left:2px; }
  .lbl-opt { font-weight:400; color:var(--text-2); font-size:14px; margin-left:4px; display:inline; }
  .input, .sel, .ta { width:100%; height:32px; padding:4px 8px; border:1px solid var(--stroke); border-radius:var(--r-base); font-size:16px; line-height:22px; background:var(--surface); outline:none; }
  .ta { height:auto; min-height:64px; resize:vertical; }
  .input:focus, .sel:focus, .ta:focus { border-color:var(--primary-stroke); }
  .input.bad, .sel.bad { border-color:var(--danger); }
  .ro { display:flex; align-items:center; gap:8px; min-height:32px; padding:4px 8px; border-radius:var(--r-base); background:var(--lightest); font-size:16px; }
  .help { font-size:12px; line-height:16px; color:var(--text-2); margin-top:4px; }
  .err { font-size:13px; color:var(--danger); margin-top:4px; display:flex; gap:6px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .grid2 .full { grid-column:1 / -1; }
  .search { position:relative; display:inline-flex; align-items:center; }
  .search i { position:absolute; left:10px; color:var(--icon-l); font-size:13px; }
  .search .input { padding-left:30px; }

  /* chips (tint + hairline) */
  .chip { display:inline-flex; align-items:center; gap:4px; height:20px; padding:2px 6px; border-radius:var(--r-base); font-size:12px; line-height:16px; font-weight:600; white-space:nowrap; border:1px solid var(--stroke); background:var(--surface); color:var(--text-2); }
  .chip i { font-size:10px; }
  .chip.ok { background:var(--success-tint); border-color:var(--success-stroke); color:var(--success); }
  .chip.low { background:var(--notice-tint); border-color:var(--notice-stroke); color:var(--notice); }
  .chip.out { background:var(--danger-tint); border-color:var(--danger-stroke); color:var(--danger); }
  .chip.mig { background:var(--primary-tint); border-color:var(--primary-stroke-l); color:var(--primary); }
  .kpill { display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--text-2); margin-right:10px; white-space:nowrap; }
  .kpill i { font-size:11px; color:var(--icon-l); }

  /* inventory page */
  .tiles { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .tile { border:1px solid var(--stroke-l); border-radius:var(--r-md); padding:10px 14px; min-width:170px; background:var(--surface); text-align:left; }
  .tile:hover { border-color:var(--primary-stroke); }
  .tile.on { border-color:var(--primary-stroke); background:var(--primary-tint); }
  .tile .k { font-size:12px; line-height:16px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2); font-weight:600; display:flex; gap:6px; align-items:center; }
  .tile .n { font-size:22px; line-height:30px; font-weight:600; }
  .tile.warn .k i:first-child { color:var(--notice-icon); } .tile.t-err .k i:first-child { color:var(--danger); }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar .sel { width:auto; min-width:150px; }
  .tbl-wrap { border:1px solid var(--stroke-l); border-radius:var(--r-md); }
  .tbl { width:100%; border-collapse:separate; border-spacing:0; }
  .tbl th { text-align:left; font-weight:600; font-size:14px; padding:9px 12px; border-bottom:1px solid var(--stroke-l); background:var(--surface); white-space:nowrap; }
  .tbl th:first-child { border-top-left-radius:var(--r-md); } .tbl th:last-child { border-top-right-radius:var(--r-md); }
  .tbl td { padding:9px 12px; border-bottom:1px solid var(--stroke-l); vertical-align:middle; font-size:14px; }
  .tbl tr:last-child td { border-bottom:none; }
  .tbl th + th, .tbl td + td { border-left:1px solid var(--stroke-l); }
  .tbl tr.row { cursor:pointer; } .tbl tr.row:hover td { background:var(--primary-lightest); }
  .tbl tr.sel td { background:var(--primary-tint) !important; }
  .tbl .num { text-align:right; }
  .nm { color:var(--primary); font-weight:600; }
  .psub { font-size:12px; line-height:16px; color:var(--text-2); }
  .qty { font-size:16px; font-weight:600; }
  .muted { color:var(--text-3); }
  .acts { display:flex; gap:6px; align-items:center; justify-content:flex-end; position:relative; }
  .empty { text-align:center; color:var(--text-2); padding:28px; }

  /* asset / location / user page */
  .fields { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px 18px; margin-bottom:14px; }
  .fields .ro { font-size:14px; color:var(--text-2); }
  .fields .flbl { font-size:13px; font-weight:600; margin-bottom:3px; }
  .acc { border-bottom:1px solid #ddd; }
  .acc-h { display:flex; align-items:center; gap:8px; padding:13px 2px; font-weight:700; font-size:15px; }
  .acc-h .chev { margin-left:auto; color:#888; font-size:13px; }
  .acc-h .cnt { background:var(--lightest); border-radius:10px; font-size:12px; padding:0 8px; color:var(--text-2); font-weight:600; }
  .acc-b { padding:0 2px 18px; }
  .sect-bar { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .info { font-size:13px; color:var(--text); background:var(--primary-tint); border:1px solid var(--primary-stroke-l); border-radius:var(--r-base); padding:5px 10px; display:inline-flex; gap:6px; align-items:center; }
  .info i { color:var(--primary-stroke); }
  .acc-h .lock { margin-left:auto; color:#222; font-size:15px; }
  .acc-h .lock + .chev { margin-left:10px; }
  /* live user profile: two-line title bar + card accordions */
  .bis-title.prof-t { padding:6px 10px; display:block; }
  .prof { display:flex; justify-content:space-between; gap:12px; }
  .prof > div:first-child > div { font-size:18px; }
  .prof i { display:block; font-size:15px; }
  .prof-r { text-align:right; }
  .cards { display:flex; flex-direction:column; gap:20px; }
  .acc-card { background:#f5f5f5; border:1px solid #e3e3e3; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .acc-card > .acc-h { padding:16px 16px; font-weight:600 !important; }
  .acc-card > .acc-b { background:#fff; padding:14px 14px 16px; border-top:1px solid #e3e3e3; border-radius:0 0 4px 4px; }
  /* live location page: title buttons + right-hand Menu */
  .bis-title.big { font-size:24px; font-weight:600; padding:8px 12px; }
  .tb-btns { margin-left:auto; display:flex; gap:6px; }
  .tb { font-size:12px; font-weight:400; color:#fff; border-radius:3px; padding:3px 8px; }
  .tb-g { background:#5cb85c; } .tb-b { background:#5b7fc7; } .tb-p { background:#b05cc0; }
  .bis-title .back.w { margin-left:0; background:#fff; color:#222; border-color:#fff; display:inline-flex; gap:6px; align-items:center; }
  .bis-body.flush { padding:0; }
  .loc { display:flex; min-height:560px; }
  .loc-main { flex:1; min-width:0; padding:14px 12px 28px; }
  .loc-h { font-size:20px; font-weight:600; padding-bottom:8px; margin-bottom:12px; border-bottom:1px solid #ddd; display:flex; align-items:center; gap:8px; }
  .loc-h .cnt { background:var(--lightest); border-radius:10px; font-size:12px; padding:0 8px; color:var(--text-2); font-weight:600; }
  .loc-menu { width:230px; flex-shrink:0; border-left:1px solid #ddd; padding:10px 0; }
  .loc-mh { text-align:center; position:relative; padding:4px 0 10px; }
  .loc-mh b { display:block; font-size:15px; }
  .loc-mh span { font-size:12px; color:#777; }
  .loc-mh i { position:absolute; right:6px; top:4px; font-size:22px; color:#222; }
  .loc-mi { display:flex; align-items:center; gap:14px; padding:10px 14px; font-size:14px; color:#222; }
  .loc-mi i { width:18px; text-align:center; color:#555; }
  .loc-mi.on { background:var(--bis-purple); color:#fff; }
  .loc-mi.on i { color:#fff; }
  .newtag { font-size:10px; font-weight:700; background:var(--primary); color:#fff; border-radius:3px; padding:1px 5px; letter-spacing:.04em; }

  /* overlays live inside .proto-card */
  .scrim { position:absolute; inset:0; background:var(--overlay); z-index:30; }
  /* Field Management right panel */
  .drawer { position:absolute; top:0; right:0; bottom:0; width:min(560px, 94%); background:var(--surface); box-shadow:var(--shadow-l3); z-index:31; display:flex; flex-direction:column; border-radius:var(--r-md) 0 0 var(--r-md); transition:width .15s; }
  .dr-h { display:flex; align-items:center; gap:6px; padding:12px 14px; border-bottom:1px solid var(--stroke-l); }
  .dr-h h2 { font-size:16px; line-height:24px; font-weight:400; color:var(--text-2); margin-right:auto; }
  .dr-b { flex:1; overflow:auto; padding:14px 14px 24px; display:flex; flex-direction:column; gap:10px; }
  .dr-title { display:flex; align-items:center; gap:10px; }
  .dr-title h3 { font-size:18px; line-height:26px; font-weight:600; margin-right:auto; }
  .dr-title > i { color:var(--icon-l); font-size:16px; }
  .dr-banner { display:flex; gap:8px; font-size:13px; line-height:18px; padding:8px 10px; border-radius:var(--r-base); background:var(--primary-tint); border:1px solid var(--primary-stroke-l); color:var(--text); }
  .dr-banner i { color:var(--primary-stroke); margin-top:2px; }
  .kv { border:1px solid var(--stroke-l); border-radius:var(--r-md); display:grid; grid-template-columns:repeat(3, 1fr); }
  .kv > div { padding:8px 10px; border-right:1px solid var(--stroke-l); border-bottom:1px solid var(--stroke-l); min-width:0; }
  .kv > div:nth-child(3n) { border-right:none; }
  .kv > div:nth-last-child(-n+3) { border-bottom:none; }
  .kv b { display:block; font-size:13px; font-weight:600; }
  .kv span { font-size:13px; color:var(--text-2); }
  .blk { border:1px solid var(--stroke-l); border-radius:var(--r-md); padding:10px 12px; }
  .blk .k { font-size:12px; line-height:16px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-2); }
  .stock { display:flex; align-items:center; gap:12px; margin-top:4px; }
  .stock .big { font-size:28px; line-height:34px; font-weight:600; }
  .bar { height:6px; background:var(--lightest); border-radius:3px; margin:8px 0 2px; position:relative; overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; }
  .sec { border:1px solid var(--stroke-l); border-radius:var(--r-md); }
  .sec-h { display:flex; align-items:center; gap:8px; width:100%; padding:10px 12px; font-size:15px; font-weight:600; color:var(--text-2); text-align:left; }
  .sec-h .cnt { background:var(--lightest); border-radius:10px; font-size:12px; padding:0 7px; }
  .sec-h .chev { margin-left:auto; font-size:12px; color:var(--icon); }
  .sec-b { padding:0 12px 12px; }
  .grp-h { font-size:12px; font-weight:600; text-transform:uppercase; color:var(--text-2); letter-spacing:.05em; margin:10px 0 4px; display:flex; align-items:center; gap:6px; }

  var map = { use:'Used '+Math.abs(e.delta)+(t?' on '+esc(t.name):''), refill:'Refilled +'+e.delta, create:'Created with '+e.delta,
    alert:'Low-stock alert sent', assign:'Assigned to '+(t?esc(t.name):''), unassign:'Removed from '+(t?esc(t.name):''),
    migrate:'Migrated', threshold:'Minimum changed', edit:'Details edited' };
  return '<div>'+map[e.kind]+'</div><div class="psub">'+esc(e.who)+' · '+fmtShort(e.when)+'</div>';
}
function kindCounts(p){
  var c={asset:0,location:0,user:0}; p.targets.forEach(function(id){ c[tgt(id).kind]++; });
  var out=['asset','location','user'].filter(function(k){return c[k];}).map(function(k){
    return '<span class="kpill">'+ki(k)+c[k]+' '+(c[k]===1?KIND[k].one:KIND[k].many)+'</span>'; }).join('');
  return out || '<span class="muted">Not assigned</span>';
}
function evalLow(p){
  if(isLow(p) && !p.notified){
    p.notified = true;
    var when = now();
    DATA.notifs.unshift({ pid:p.id, text:'Low stock: '+p.name+' — '+p.qty+' left (minimum '+p.min+')', when:when, read:false });
    DATA.log.push({ pid:p.id, kind:'alert', who:'System', when:when, note:p.qty+' left, minimum '+p.min });
    return true;
  }
  if(!isLow(p) && p.notified){ p.notified = false; }
  return false;
}
function doUse(pid, tid, n, note, who){
  var p = part(pid); p.qty -= n;
  DATA.log.push({ pid:pid, kind:'use', delta:-n, tid:tid, who:who, when:now(), note:note||'' });
  return evalLow(p);
}
function doRefill(pid, n, note, who){
  var p = part(pid); p.qty += n;
  DATA.log.push({ pid:pid, kind:'refill', delta:n, who:who, when:now(), note:note||'' });
  evalLow(p);
}
function setTargets(p, ids){
  var when=now();
  ids.forEach(function(t){ if(p.targets.indexOf(t)<0) DATA.log.push({pid:p.id, kind:'assign', tid:t, who:ADMIN, when:when}); });
  p.targets.forEach(function(t){ if(ids.indexOf(t)<0) DATA.log.push({pid:p.id, kind:'unassign', tid:t, who:ADMIN, when:when}); });
  p.targets = ids.slice();
}

function saveEdit(){
  var p=part(st.drawer), ef=st.ef; if(!ef.name.trim()){ toast('Name is required','warn'); render(); return; }

    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'+btn('Use 3 on Truck 12',{sm:true,dis:p.qty<3,on:'demoUse(3)'})+btn('Use 1',{sm:true,dis:p.qty<1,on:'demoUse(1)'})+btn('Refill +10',{sm:true,v:'b-primary',on:'demoRefill(10)'})+'</div>'

  var right = '<div class="anno" style="margin-bottom:14px"><h4><span class="anno-tag">Open Q1</span>Who gets notified, and how?</h4>'
    + '<p>Scope says “admins are notified”. Not decided yet: <b>which</b> admins (all admins, Asset-module admins, or a per-part “Notify” list) and <b>which channel</b> (in-app bell, email, mobile push). Shown below: in-app plus email as a starting point.</p></div>'
    + '<div style="margin-bottom:14px"><div class="psub" style="margin-bottom:4px;font-weight:600">In-app (web header bell)</div><div class="pop bell-pop" style="position:static;width:auto">'
    + DATA.notifs.slice(0,3).map(function(n){return '<div class="notif '+(n.read?'':'unread')+'"><i class="fa-solid fa-triangle-exclamation"></i><div><a onclick="openFromNotif(\''+n.pid+'\')">'+esc(n.text)+'</a><small>'+fmt(n.when)+' · Sub-Asset Inventory</small></div></div>';}).join('')+'</div></div>'
    + '<div class="psub" style="margin-bottom:4px;font-weight:600">Email (draft)</div><div class="email"><div class="eh"><b>Subject:</b> Low stock: Oil filter (5 left)<br><b>To:</b> [recipients TBD]</div><div class="eb">'
    + '<p><b>Oil filter</b> (OF-77) has dropped to <b>5</b>, at or below its minimum of <b>10</b>.</p><p style="margin-top:8px">Last used: 3 on Truck 12 – Kenworth T680 by Priya Shah, Oct 7.</p><p style="margin-top:12px"><span class="b b-primary b-sm">View in Sub-Asset Inventory</span></p></div></div>';
  return '<div class="two"><div>'+left+'</div><div>'+right+'</div></div>';

function demoUse(n){ var fired=doUse('p2','a3',n,'',ADMIN); toast(fired?'Alert fired: Brake pads now '+part('p2').qty+' (min 6)':'Used '+n+'. No alert'+(part('p2').notified?' (already low).':'.'), fired?'warn':''); render(); }

/* Mobile — live SafeTapp asset screen                                 */
/* ------------------------------------------------------------------ */
var M_TID='a2';
function mWho(){ return st.role==='admin'?ADMIN:'Priya Shah'; }
function mGo(screen, pid){
  st.mScreen=screen; if(pid) st.mPart=pid;
  if(screen==='use' || screen==='refill'){ st.mQty=''; st.mNote=''; }
  st.flow = {info:'m-info', sheet:'m-sheet', use:'m-use', refill:'m-refill'}[screen]; render();
}
function scrMobile(){
  var t=tgt(M_TID), ps=DATA.parts.filter(function(p){return p.targets.indexOf(M_TID)>=0;}), p=part(st.mPart);
  var statusBar = function(light){ return '<div class="ph-status'+(light?' light':'')+'"><span>2:05</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> 70</span></div>'; };
  var asset = statusBar() + '<div class="ph-bar"><i class="fa-solid fa-chevron-left"></i><h1>'+esc(t.name)+'</h1><i class="fa-solid fa-house"></i></div>'
    + '<div class="ph-tabs"><span>Actions</span><span class="on">Info</span><span>Document</span></div>'
    + '<div class="ph-scroll"><div class="ph-img"><i class="fa-regular fa-image"></i><span>Select Image</span></div>'
    + '<div class="ph-acc"><div class="ph-acc-h">Assigned Asset<i class="fa-solid fa-chevron-down"></i></div></div>'
    + '<div class="ph-acc"><div class="ph-acc-h">Linked Sub Assets<i class="fa-solid fa-chevron-up"></i></div>'
    + '<div class="ph-th"><span class="c-name">Sub-Asset</span><span class="c-qty">In stock</span><span class="c-eye"></span></div>'
    + ps.map(function(x){ var s=status(x); return '<div class="ph-tr" onclick="mGo(\'sheet\',\''+x.id+'\')"><span class="c-name">'+esc(x.name)+(s==='low'||s==='out'?'<br>'+chip(x):'')+'</span><span class="c-qty">'+x.qty+'</span><span class="c-eye"><i class="fa-regular fa-eye"></i></span></div>'; }).join('')
    + '</div><div class="ph-acc"><div class="ph-acc-h">Details<i class="fa-solid fa-chevron-down"></i></div></div></div>'
    + '<div class="ph-fab"><i class="fa-regular fa-square-plus"></i>Create Task</div>';
  var screen = asset;
  if(st.mScreen==='sheet' && p){
    var others = p.targets.length-1;
    screen += '<div class="ph-dim" onclick="mGo(\'info\')"></div><div class="ph-sheet"><div class="ph-grab"></div><div class="ph-sheet-b">'

      + '<div class="ph-f"><b>Type</b><span>'+esc(p.type)+'</span></div>'
      + '<div class="ph-f"><b>In Stock</b><span style="display:flex;gap:8px;align-items:center"><span style="font-size:20px;font-weight:700">'+p.qty+'</span>'+chip(p)+'</span><span style="font-size:12px;color:#666">Shared stock'+(st.role==='admin'?' · minimum '+(p.min==null?'not set':p.min):'')+'</span></div>'
      + '<div class="ph-f"><b>Linked To</b><span>'+esc(t.name)+(others>0?' + '+others+' more':'')+'</span></div></div>'
      + '<div class="ph-foot"><button class="mb-pri" '+(p.qty<=0?'disabled':'')+' onclick="mGo(\'use\')">'+(p.qty<=0?'Out of Stock':'Use Sub-Asset')+'</button>'
      + (st.role==='admin'?'<button class="mb-sec" onclick="mGo(\'refill\')">Refill</button>':'')
      + '<button class="mb-txt" onclick="mGo(\'info\')">Close</button></div></div>';
  }
  if((st.mScreen==='use' || st.mScreen==='refill') && p){
    var isUse = st.mScreen==='use', n=parseInt(st.mQty,10), over=isUse && n>p.qty, ok=n>0 && !over;
    screen = statusBar(true) + '<div class="ph-page"><h2>'+(isUse?'Use Quantity':'Refill Quantity')+'<button onclick="mGo(\'sheet\')"><i class="fa-solid fa-xmark"></i></button></h2>'
      + '<div class="sub">'+(isUse?'Record use of <b>'+esc(p.name)+'</b> on <b>'+esc(t.name)+'</b>':'Add stock to <b>'+esc(p.name)+'</b>')+'</div>'
      + '<div class="ph-card"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px;flex:1">'+esc(p.name)+'</span>'+chip(p)+'</div>'
      + '<div class="row"><div><label>Available</label><input class="ph-in" readonly value="'+p.qty+'"></div><div><label>'+(isUse?'Use':'Add')+'</label><input class="ph-in'+(over?' bad':'')+'" id="mqty" type="number" min="1" placeholder="0" value="'+esc(st.mQty)+'" oninput="st.mQty=this.value;render()"></div></div>'

      + (ok?'<div style="font-size:13px;color:#555;margin-top:8px">'+(isUse?'Leaves ':'New total: ')+'<b>'+(isUse?p.qty-n:p.qty+n)+'</b></div>':'')+'</div>'

      + '<div class="ph-foot"><button class="mb-pri" '+(ok?'':'disabled')+' onclick="mConfirm()">'+(isUse?'Record Use':'Add to Inventory')+'</button><button class="mb-txt" onclick="mGo(\'sheet\')">Cancel</button></div>';
  }
  var phone = '<div class="phone">'+screen+(st.mToast?'<div class="ph-toast"><i class="fa-solid fa-circle-check"></i><span>'+esc(st.mToast)+'</span></div>':'')+'</div>';
  var side = '<div class="anno"><h4>Prototype controls</h4><div class="ctl-row" style="margin:0">Signed in as<div class="seg-control"><button class="seg-opt '+(st.role==='driver'?'active':'')+'" onclick="st.role=\'driver\';if(st.mScreen===\'refill\')st.mScreen=\'sheet\';render()">Driver</button><button class="seg-opt '+(st.role==='admin'?'active':'')+'" onclick="st.role=\'admin\';render()">Admin</button></div></div><p class="help" style="margin-top:6px">Drivers and mechanics can use parts. Only admin roles see Refill and the minimum.</p></div>'
    + '<div class="anno"><h4>What changes vs. the live app</h4><ul style="padding-left:16px;font-size:12.5px;line-height:1.6"><li>Same place: Info tab → <b>Linked Sub Assets</b> → eye → bottom sheet.</li><li>Sheet button <b>Move Inventory</b> → <b>Use Sub-Asset</b> (+ <b>Refill</b> for admins). Moving stock between links goes away because stock is shared.</li><li>The <b>Move Quantity</b> page pattern is reused: Available + Use / Add, then a note.</li><li>Low / out-of-stock chip under the name in the list.</li></ul></div>'
    + '<div class="anno"><h4>Live on web (same data)</h4><table class="sync" style="width:100%">'+ps.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td style="text-align:right"><b>'+x.qty+'</b></td><td>'+chip(x)+'</td></tr>';}).join('')+'</table><p class="help" style="margin-top:6px">Use or refill on the phone, then open <a onclick="goInventory()">Admin · Inventory page</a> to see it there.</p></div>'
    + '<div class="anno"><h4><span class="anno-tag">Open Q4</span>Location- &amp; user-assigned parts</h4><p class="help" style="color:#333">Use and refill must work on all three targets. In the app, where does someone find parts assigned to a <b>location</b> or to <b>themselves</b>? Proposal: the same Linked Sub Assets accordion on the location screen and on My Profile.</p></div>';
  return '<div class="mwrap"><div class="mside">'+side+'</div>'+phone+'</div>';
}
function mConfirm(){
  var p=part(st.mPart), n=parseInt(st.mQty,10);
  if(st.mScreen==='use'){ var fired=doUse(p.id, M_TID, n, st.mNote, mWho()); mToast('Success! '+n+' '+(n===1?'unit':'units')+' of '+p.name+' recorded on '+tgt(M_TID).name+'.'+(fired?' Stock is low, so admins were notified.':'')); }
  else { doRefill(p.id, n, st.mNote, mWho()); mToast('Success! '+n+' '+(n===1?'unit was':'units were')+' added to '+p.name+'.'); }
  st.mScreen='info'; st.flow='m-info'; render();
}

/* ------------------------------------------------------------------ */
/* Notes panel                                                         */
/* ------------------------------------------------------------------ */
function notesHTML(){
  if(!st.notes) return '';
  return '<div class="notes-scrim" onclick="toggleNotes()"></div><div class="notes"><header><h3>TKT-22242 · Design notes</h3><button class="ib" onclick="toggleNotes()"><i class="fa-solid fa-xmark"></i></button></header><div class="nb">'
  + '<h4>v4 changes (Mika feedback, Oct 9)</h4><ul><li>Asset page matches the live layout: no asset detail fields on top, Linked Sub Assets under Attached Assets, then Documents, Tasks and the form sections.</li><li>User page matches the live profile: two-line title bar and card-style accordions (Driving Information, Assigned Assets, Linked Sub Assets, …).</li><li>The old Edit Inventory modal is replaced by the shared Record Use / Refill Stock BisModals on every page.</li><li>The existing lock icon is kept on the section header until its purpose is confirmed (Q8).</li><li>Dev PRD (data model, rules, migration, QA scenarios) is shared separately with the dev team.</li></ul><h4>v3 changes</h4><ul><li>No maximise button on modals or the side panel.</li><li>Assignment dropdowns float above the modal and open upward when there is no room below, so the list is never clipped.</li><li>“(optional)” sits beside the Note label in Record Use and Refill Stock (all entry points).</li><li>Location page matches the live layout: Edit - LOCATION title bar, right-hand Menu, Linked Sub Assets selected.</li><li>Section renamed back to the live name <b>Linked Sub Assets</b> everywhere.</li></ul><h4>v2 changes</h4><ul>'
  + '<li>Every dialog is a <b>BisModal</b> (type “themed”): title icon, white header and footer, tertiary Cancel, primary or danger confirm.</li>'
  + '<li>New Sub-Asset follows the Task Management <b>New Task</b> layout: icon title, maximise, section headings, chips-in-field multi-selects, Reset on the left.</li>'
  + '<li>The side panel follows the <b>Field Management</b> right panel: grey “View …” header, maximise/close, title row with actions, key-value card, collapsible sections.</li>'
  + '<li>All primary actions use <b>BIS blue</b> (BisButton primary). Green is gone.</li>'
  + '<li>Mobile now matches the live app: Info tab → Linked Sub Assets → eye → bottom sheet. Move Inventory becomes Use / Refill.</li></ul>'
  + '<h4>Key decisions</h4><ol>'
  + '<li><span class="tag chg">Changed</span><b>One shared stock per part.</b> Assigning a part says <i>where it can be used</i>; it no longer splits the quantity. Matches the scope edge case “consumption from any assigned target draws down the same shared quantity”. Removes the “Multiple” row type and Move From / Move Inventory.</li>'
  + '<li><span class="tag chg">Changed</span><b>Read-only list, edit in the side panel.</b> Today every row is a live form; inline editing is a likely cause of the inconsistent updates and rows dropping out.</li>'
  + '<li><span class="tag new">New</span><b>Quantity only changes through Refill / Record use</b>, never by typing over the number, so every change has a who / when / where record.</li>'
  + '<li><span class="tag new">New</span><b>Assignment = three multi-selects</b> (Assets · Locations · Users) plus a “Will appear in…” line. Answers the AC “it is evident which is selected and where it will appear”.</li>'
  + '<li><span class="tag reuse">Reused</span><b>One “Linked Sub Assets” section component</b> for Asset, Location and User pages (keeps the live name), with the same columns and actions. Replaces the old input-field table and the Edit Inventory window.</li>'
  + '<li><span class="tag new">New</span><b>Activity log</b> (action, qty, where, who, when, note) replaces the free-text Notes list and becomes the Phase 2 reporting source.</li>'
  + '<li><span class="tag chg">Migration</span>Existing per-link quantities are <b>summed into one stock</b>. All assignments are kept. Migrated parts get type “Uncategorized”, no minimum, and a “Migrated” badge until reviewed (e.g. Subber: 997 + 5 = 1002).</li></ol>'
  + '<h4>Open questions</h4><ol>'
  + '<li><span class="tag open">Q1</span><b>Alert recipients &amp; channel:</b> all admins, Asset-module admins, or a per-part Notify list? In-app bell, email, mobile push?</li>'
  + '<li><span class="tag open">Q2</span><b>Type:</b> admin-managed list (settings page) or free text with suggestions? Who can add types?</li>'
  + '<li><span class="tag open">Q3</span><b>Stock corrections:</b> after a physical count, how does an admin lower stock without it counting as use? Proposal: an admin-only “Adjust count” with a required reason, logged separately.</li>'
  + '<li><span class="tag open">Q4</span><b>Mobile for location / user parts:</b> where do these appear in the app?</li>'
  + '<li><span class="tag open">Q5</span><b>Threshold edits:</b> if an admin raises the minimum above current stock, send an alert or only flag the row? (The prototype sends one.)</li>'
  + '<li><span class="tag open">Q6</span><b>Delete vs archive:</b> deleting a part with usage history should probably archive it.</li>'
  + '<li><span class="tag open">Q7</span><b>Units / decimals:</b> fluids are measured in litres. Whole numbers only for Phase 1?</li>'
  + '<li><span class="tag open">Q8</span><b>Permissions:</b> which roles can create / assign / refill / use on web and mobile? Does the lock icon on today\'s “Linked Sub Assets” map to one of these?</li>'
  + '<li><span class="tag open">Q9</span><b>Mobile offline:</b> if two people use the last part offline, which wins?</li></ol>'
  + '<h4>Build pieces (for estimating)</h4><ul>'
  + '<li><span class="tag chg">Rework</span>Inventory page (React): summary tiles, filters (search, type, status), read-only table, row actions</li>'
  + '<li><span class="tag reuse">Reuse</span>Right panel (Field Management pattern): key-value card, stock block, Assigned To / Activity / Details sections</li>'
  + '<li><span class="tag reuse">Reuse</span>BisModal ×6: New sub-asset, Edit assignments, Assign to target, Record use, Refill, Remove / Delete</li>'
  + '<li><span class="tag reuse">Reuse</span>Chips-in-field multi-select from Task Management</li>'
  + '<li><span class="tag chg">Rework</span>Linked Sub Assets section ×3 hosts (Asset accordion, Location menu page, User accordion)</li>'
  + '<li><span class="tag new">New</span>Activity/ledger table + API; low-stock state + one-shot alert trigger (+ reset on refill)</li>'
  + '<li><span class="tag chg">Rework</span>Mobile: Linked Sub Assets list (status chip), sheet buttons, Use / Refill pages (reusing Move Quantity), role gating</li>'
  + '<li><span class="tag chg">Migration</span>Sum per-link quantities → single stock, keep links, convert old notes into the Activity log where possible</li></ul>'
  + '<h4>Out of scope (Phase 2)</h4><ul><li>Reporting views and export, cost tracking per part / per asset</li></ul>'
  + '</div></div>';
}

/* ------------------------------------------------------------------ */
/* Step details                                                        */
/* ------------------------------------------------------------------ */
function stepDetails(){
  var m = {
    inv:['Sub-Asset Inventory (replaces “Main Inventory Sub Assets”)', ['Read-only list with stock, minimum and status. The summary tiles act as quick filters.','Try: filter by Type, click a row to open its side panel, or use <b>Refill</b> / <b>⋮</b> on a row.']],
    'new':['New sub-asset (BisModal, Task Management create layout)', ['Name and type, then Stock (starting quantity + minimum), then Assignment as three multi-selects.','Try: pick a couple of assets and a location and read the “Will appear in…” line. Create opens the new part.']],
    detail:['Sub-asset side panel (Field Management pattern)', ['Title row with <b>Record use</b> / <b>Refill</b>, a key-value card, the stock block, then collapsible Assigned To, Activity and Details.','Try: Record use on Oil filter, open Activity, then change the minimum in Details.']],
    asset:['Asset page: Linked Sub Assets section', ['Same place as the live asset page (under Attached Assets). The old input-field table and its Edit Inventory window are replaced: <b>Use</b> and <b>Refill</b> happen in place, and Move From is gone because stock is shared.','Try: <b>Use</b> on Brake pads (watch the low-stock warning), or <b>Assign Sub-Asset</b> to add one from inventory.']],
    locuser:['Location & User pages: same component', ['The location page keeps its live layout (Edit - LOCATION, right-hand Menu with <b>Linked Sub Assets</b> selected); the user page keeps its live profile layout with card accordions. Same section, same actions; use here is recorded against that location or user. The old <b>Edit Inventory</b> modal maps to: Adjust Add → <b>Refill</b>, Adjust Remove → <b>Use</b> (or a future Adjust count, Q3), Move From → removed.','Use the Preview switch to compare both pages.']],
    alert:['Low-stock alert', ['The alert fires once when stock crosses to or below the minimum, stays quiet while low, and re-arms after a refill above the minimum.','Try the live buttons, then check the bell. Recipients and channel are open question Q1.']],
    'm-info':['Mobile: asset → Info tab → Linked Sub Assets', ['Same place as the live app. The list now shows shared stock and a low / out-of-stock chip.','Tap a row (or its eye) to open the bottom sheet.']],
    'm-sheet':['Mobile: sub-asset bottom sheet', ['Same sheet as today; <b>Move Inventory</b> is replaced by <b>Use Sub-Asset</b>, plus <b>Refill</b> for admin roles.','Switch “Signed in as” to Admin to see Refill and the minimum.']],
    'm-use':['Mobile: use quantity', ['Reuses the Move Quantity page: Available (read-only) + Use, then an optional note. Using more than is available is blocked.','Try more than 9, then record a valid amount and check “Live on web”.']],
    'm-refill':['Mobile: refill (admin role)', ['Admins add stock the same way. Wiper blades are out of stock here.','Add stock and watch the web side update; the low-stock state resets once above the minimum.']]
  }[st.flow];
  return { title:m[0], bullets:m[1] };
}

/* ------------------------------------------------------------------ */
/* Render                                                              */
/* ------------------------------------------------------------------ */
/* Multi-select menus float above the modal (fixed position) so the modal body
   can't clip them, and open upward when there isn't room below the field. */
function placeDropdown(){
  if(!st.dd || !document.querySelector) return;
  var f=document.getElementById('dd-'+st.dd), m=document.querySelector('.msel-menu');
  if(!f || !m || !f.getBoundingClientRect) return;
  var r=f.getBoundingClientRect(), mh=m.offsetHeight, below=window.innerHeight-r.bottom, above=r.top;
  m.style.position='fixed'; m.style.left=r.left+'px'; m.style.width=r.width+'px'; m.style.right='auto'; m.style.zIndex=60;
  m.style.top = (below < mh+12 && above > below) ? Math.max(8, r.top-mh-4)+'px' : (r.bottom+4)+'px';
}
var lastViewKey='';
function render(){
  var ae=document.activeElement, fid=ae&&ae.id, ss=null;
  try{ ss=ae.selectionStart; }catch(e){}
  document.getElementById('segA').classList.toggle('active', st.persp==='admin');
  document.getElementById('segB').classList.toggle('active', st.persp==='mobile');
  document.getElementById('flowTabs').innerHTML = FLOWS[st.persp].map(function(f){ return '<button class="flow-tab '+(f.id===st.flow?'active':'')+'" onclick="selectFlow(\''+f.id+'\')">'+f.label+'</button>'; }).join('');
  var d=stepDetails();
  document.getElementById('sdTitle').innerHTML=d.title;
  document.getElementById('sdList').innerHTML=d.bullets.map(function(b){return '<li>'+b+'</li>';}).join('');
  var f=st.flow, html;
  if(st.persp==='mobile') html=scrMobile();
  else if(f==='asset') html=scrAsset();
  else if(f==='locuser') html=scrLocUser();
  else if(f==='alert') html=bisShell('Low-Stock Alerts', scrAlert());
  else html=scrInventory();
  document.getElementById('stage').innerHTML=html;

  var o='';
  if(st.drawer && st.persp==='admin') o+=drawerHTML();
  if(st.modal){
    var mt=st.modal.type;
    o+= mt==='new'?newHTML(): mt==='assign'?assignHTML(): mt==='a2t'?a2tHTML(): mt==='use'?useHTML(): mt==='refill'?refillHTML(): mt==='unassign'?unassignHTML(): mt==='delete'?deleteHTML():'';
  }
  if(st.toast) o+='<div class="snack '+st.toast.kind+'"><i class="fa-solid fa-'+(st.toast.kind==='warn'?'triangle-exclamation':'circle-check')+'"></i><span>'+esc(st.toast.text)+'</span><span class="t"></span></div>';
  document.getElementById('ovlRoot').innerHTML=o;
  document.getElementById('notesRoot').innerHTML=notesHTML();

  placeDropdown();
  if(fid){ var el=document.getElementById(fid); if(el){ el.focus(); try{ if(ss!=null) el.setSelectionRange(ss,ss); }catch(e){} } }
  var key=st.persp+'|'+st.flow;
  if(key!==lastViewKey){ document.getElementById('stage').scrollTop=0; lastViewKey=key; }
}
document.addEventListener('click', function(){ if(st.menu||st.bell||st.dd){ st.menu=null; st.bell=false; st.dd=null; render(); } });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(st.notes){st.notes=false;} else if(st.dd){st.dd=null;} else if(st.modal){st.modal=null;} else {closeOverlays();} render(); } });
/* deep links: #inv #new #detail #asset #locuser #alert #m-info #m-sheet #m-use #m-refill (+ #notes) */
(function(){
  var h=(location.hash||'').replace('#',''); if(h==='notes'){ st.notes=true; h=''; }
  var p = FLOWS.mobile.some(function(f){return f.id===h;}) ? 'mobile' : FLOWS.admin.some(function(f){return f.id===h;}) ? 'admin' : null;
  if(p){ st.persp=p; selectFlow(h); } else render();
})();
</script>
