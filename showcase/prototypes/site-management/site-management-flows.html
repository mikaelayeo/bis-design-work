<!DOCTYPE html>
<!--
  ============================================================================
  SITE MANAGEMENT — LO-FI FLOW PROTOTYPE v0.4
  ----------------------------------------------------------------------------
  Deliberately low fidelity. Greyscale wireframe language from
  site-management-presentation.html. The point is the FLOW, not the pixels.

  FLOWS
    A · Day one            SM-01 · SM-09 · SM-03   admin, web
    B · Create a ritual    SM-03                   admin, web
    C · Create a crew      SM-02                   admin, web
    D · Share a site       S-02                    admin, web  (2 options, undecided)
    E · Review attendance  S-04 · SM-02            admin, web
    F · Find the gap       SM-01 · SM-03 · S-01    admin, web
    G · Fix it from field  SM-04 · S-04            supervisor, mobile
    H · Who's on the field SM-01 · SM-02           supervisor, mobile
    I · The worker floor   SM-04                   mobile (deferred module)
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Management — Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F2F5F7; --surface:#FFFFFF; --surface-2:#E7EDF1; --sunk:#EAEFF3;
    --ink:#0F1B23; --ink-2:#48606E; --ink-3:#6C8494;
    --rule:#D3DFE6; --rule-strong:#B2C4CF;
    --rust:#1387C9; --rust-soft:#D9EDF9;
    --teal:#5E9E1E; --teal-soft:#E4F1D4;
    --warn:#B4560E; --warn-soft:#FBE6D7;
    --wire-fill:#E3EAEF; --wire-line:#A7BAC6;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--paper);line-height:1.5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:.05em}

  /* chrome */
  .topbar{background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 18px;flex-shrink:0;flex-wrap:wrap}
  .tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .t-name{font-size:15px;font-weight:600}
  .t-sub{font-size:13px;color:var(--ink-2)}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 8px;border:1px solid var(--rule-strong);color:var(--ink-2);background:var(--sunk)}
  .pill.hot{border-color:var(--rust);color:var(--rust);background:var(--rust-soft)}
  .t-date{font-size:11.5px;color:var(--ink-3)}
  .btn-reset{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
  .btn-reset:hover{background:var(--sunk)}

  .page{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 18px 12px}

  .flows{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;margin-bottom:8px}
  .fbtn{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:6px 11px;text-align:left;min-width:132px}
  .fbtn:hover{border-color:var(--rule-strong)}
  .fbtn.on{border-color:var(--rust);background:var(--rust-soft)}
  .fbtn .fl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);display:block}
  .fbtn.on .fl{color:var(--rust)}
  .fbtn .fn{font-size:12px;font-weight:600;display:block;line-height:1.3}
  .fbtn .fw{font-size:10px;color:var(--ink-3);display:block}

  .steprail{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex-shrink:0;margin-bottom:8px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:6px 10px}
  .sbtn{background:none;border:none;display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:3px;color:var(--ink-3);font-size:12px}
  .sbtn .sn{width:19px;height:19px;border-radius:50%;border:1px solid var(--rule-strong);display:inline-flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:10px;flex-shrink:0}
  .sbtn.on{color:var(--ink);font-weight:600}
  .sbtn.on .sn{background:var(--rust);border-color:var(--rust);color:#fff}
  .sbtn.past .sn{background:var(--wire-fill)}
  .sarrow{color:var(--rule-strong);font-size:12px}
  .stepnav{margin-left:auto;display:flex;gap:6px}
  .stepnav button{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:4px 12px;font-size:12px;color:var(--ink-2)}
  .stepnav button:hover:not(:disabled){background:var(--sunk)}
  .stepnav button:disabled{opacity:.35;cursor:default}
  .stepnav .next{border-color:var(--rust);color:var(--rust);background:var(--rust-soft);font-weight:600}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .stage{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 340px}
  .framewrap{display:flex;justify-content:center;align-items:flex-start;padding:24px 24px 30px;min-width:0;overflow-y:auto}
  @media(max-width:1080px){
    .stage{grid-template-columns:1fr;overflow-y:auto}
    .framewrap{padding:16px 14px 8px;overflow:visible}
    .ann{overflow:visible}
  }
  .foot{border-top:1px solid var(--rule);background:var(--sunk);padding:9px 18px 11px;flex-shrink:0}
  .foot h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .foot .tkt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;background:var(--surface);border:1px solid var(--rule-strong);color:var(--ink-2);border-radius:3px;padding:1px 7px}
  .foot ul{list-style:none;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:1px}
  .foot li{padding-left:13px;position:relative}
  .foot li::before{content:"—";position:absolute;left:0;color:var(--rule-strong)}

  /* wireframe primitives */
  .win{border:1px solid var(--wire-line);border-radius:2px;background:var(--surface);width:100%;max-width:840px}
  .win__bar{background:var(--wire-fill);border-bottom:1px solid var(--wire-line);padding:10px 15px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:9px}
  .win__bar .r{margin-left:auto;letter-spacing:.04em}
  .win__body{padding:18px}

  .ph{border:1px solid var(--wire-line);border-radius:22px;background:var(--surface);width:340px;flex-shrink:0;overflow:hidden}
  .ph__bar{background:var(--wire-fill);border-bottom:1px solid var(--wire-line);padding:12px 15px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .ph__bar .r{margin-left:auto;letter-spacing:.03em}
  .ph__bar .back{background:none;border:none;color:var(--ink-2);font-size:14px;padding:0 3px 0 0}
  .ph__body{padding:16px;min-height:600px}

  .lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
  .h{font-size:16px;font-weight:600;margin-bottom:2px}
  .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}

  .row{border:1px solid var(--wire-line);background:var(--surface);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;font-size:13.5px;width:100%;text-align:left;border-radius:2px}
  .row.fill{background:var(--wire-fill)}
  .row.act{cursor:pointer}
  .row.act:hover{border-color:var(--rust)}
  .row.hi{border-color:var(--rust);border-style:dashed}
  .row.sel{border-color:var(--rust);background:var(--rust-soft)}
  .row.dim{opacity:.5}
  .row.tight{padding:8px 11px;font-size:12.5px;margin-bottom:5px}
  .row .t{font-weight:500;min-width:0}
  .row .t small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px}
  .row .r{margin-left:auto;flex-shrink:0;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em;color:var(--ink-3)}
  .row .r.miss{color:var(--rust);font-weight:600}
  .row .r.ok{color:var(--teal)}
  .row .r.warn{color:var(--warn)}

  .box{border:1px solid var(--wire-line);padding:14px;border-radius:2px;margin-bottom:11px;font-size:13px}
  .box.dash{border-style:dashed}
  .box.tightb{padding:10px;font-size:12.5px}
  .empty{border:1px dashed var(--wire-line);background:var(--wire-fill);padding:36px 20px;text-align:center;border-radius:2px}

  .cb{width:17px;height:17px;border:1px solid var(--wire-line);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--surface);flex-shrink:0;background:var(--surface)}
  .cb.on{background:var(--rust);border-color:var(--rust);color:#fff}
  .cb.rnd{border-radius:50%}
  .av{width:26px;height:26px;border-radius:50%;border:1px solid var(--wire-line);flex-shrink:0;background:var(--wire-fill)}

  .tabs{display:flex;border-bottom:1px solid var(--wire-line);margin-bottom:12px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 16px;font-size:13.5px;color:var(--ink-3);margin-bottom:-1px}
  .tab.on{color:var(--rust);border-bottom-color:var(--rust);font-weight:600}

  .toggle2{display:inline-flex;border:1px solid var(--wire-line);border-radius:2px;overflow:hidden;margin-bottom:12px}
  .toggle2 button{background:var(--surface);border:none;border-left:1px solid var(--wire-line);padding:9px 22px;font-size:13.5px;color:var(--ink-2)}
  .toggle2 button:first-child{border-left:none}
  .toggle2 button.on{background:var(--rust-soft);color:var(--rust);font-weight:600}

  .btn{border:1px solid var(--wire-line);background:var(--surface);border-radius:2px;padding:9px 18px;font-size:13.5px;color:var(--ink-2)}
  .btn:hover:not(:disabled){background:var(--sunk)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.pri{border-color:var(--rust);color:var(--rust);background:var(--rust-soft);font-weight:600}
  .btn.blk{width:100%}
  .btn.sm{padding:6px 13px;font-size:12.5px}

  .field{border:1px solid var(--wire-line);border-radius:2px;padding:10px 12px;font-size:13.5px;color:var(--ink-3);margin-bottom:10px;background:var(--surface)}
  .field.filled{color:var(--ink)}

  .grouphead{display:flex;align-items:center;gap:9px;background:var(--wire-fill);border:1px solid var(--wire-line);border-bottom:none;padding:9px 13px;font-size:12.5px;border-radius:2px 2px 0 0}
  .grouphead .gn{font-weight:600}
  .grouphead .gc{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;color:var(--ink-3)}
  .grouphead .r{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--rust)}
  .group{border:1px solid var(--wire-line);border-top:none;border-radius:0 0 2px 2px;margin-bottom:11px;padding:10px 11px 3px}

  .kv{display:grid;grid-template-columns:160px 1fr;gap:9px 16px;font-size:13.5px}
  .kv dt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
  .kv dd em{font-style:normal;color:var(--rust);font-weight:600}

  .split2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pick{border:1px solid var(--wire-line);border-radius:2px;padding:16px;text-align:left;background:var(--surface)}
  .pick:hover{border-color:var(--rust)}
  .pick.on{border-color:var(--rust);background:var(--rust-soft)}
  .pick h5{font-size:15px;font-weight:600;margin-bottom:4px}
  .pick p{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .pick .ex{font-size:11.5px;color:var(--ink-3);margin-top:8px;padding-top:8px;border-top:1px dashed var(--wire-line)}

  /* share sheet */
  .share{border:1px solid var(--wire-line);border-radius:2px}
  .share__h{background:var(--wire-fill);border-bottom:1px solid var(--wire-line);padding:10px 14px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .share__b{padding:14px}
  .lvlmenu{border:1px solid var(--wire-line);border-radius:2px;background:var(--surface);padding:4px}
  .lvlopt{padding:9px 11px;border-bottom:1px solid var(--wire-line);font-size:12.5px}
  .lvlopt:last-child{border-bottom:none}
  .lvlopt b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
  .lvlopt span{color:var(--ink-3);font-size:12px}
  .lvlopt.on{background:var(--rust-soft)}
  .lvlopt.on b{color:var(--rust)}
  .note-dash{border:1px dashed var(--rust);padding:11px 13px;border-radius:2px;font-size:12px;color:var(--ink-2);margin-top:12px}
  .note-dash .mono{color:var(--rust);display:block;margin-bottom:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}

  /* annotations */
  .ann{border-left:1px solid var(--rule);background:var(--sunk);padding:20px 20px 26px;overflow-y:auto}
  @media(max-width:1080px){ .ann{border-left:none;border-top:1px solid var(--rule)} }
  .ann__t{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--rule-strong)}
  .a{margin-bottom:13px;padding-left:16px;position:relative;font-size:12px;color:var(--ink-2);line-height:1.55}
  .a::before{content:"";position:absolute;left:0;top:7px;width:9px;border-top:1px dashed var(--rust)}
  .a b{color:var(--ink);font-weight:600;display:block}
  .a i{font-style:italic}
  .a.warnrow::before{border-color:var(--warn)}
  .a.warnrow b{color:var(--warn)}
  .banner{border:1px dashed var(--rust);background:var(--rust-soft);padding:8px 11px;border-radius:2px;font-size:11.5px;color:var(--ink-2);margin-top:14px}
  .banner b{color:var(--rust);font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:3px}
  .caption{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin-top:8px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tl">
    <span class="t-name">Site Management</span>
    <span class="t-sub">MVP — flows</span>
    <span class="pill hot">Lo-fi · v0.4</span>
    <span class="pill">Structure only</span>
    <span class="t-date">Scope of 2026-08-27</span>
  </div>
  <button class="btn-reset" onclick="resetAll()">↺ Reset</button>
</div>

<div class="page">
  <div class="flows" id="flows"></div>
  <div class="steprail" id="steprail"></div>
  <div class="card">
    <div class="stage" id="stage"></div>
    <div class="foot"><h4 id="ftitle"></h4><ul id="flist"></ul></div>
  </div>
</div>

<script>
/* ===================== FLOWS ===================== */
var FLOWS = [
  { id:'a', label:'Flow A', name:'Day one',           where:'Admin · web', steps:['Site or Job','Convert','Attach rituals','Real state'] },
  { id:'b', label:'Flow B', name:'Create a ritual',   where:'Admin · web', steps:['The bundle','Cadence','Attach to sites'] },
  { id:'c', label:'Flow C', name:'Create a crew',     where:'Admin · web', steps:['Members','Supervisor','Add to a site'] },
  { id:'d', label:'Flow D', name:'Share a site',      where:'Admin · web', steps:['Option A — share sheet','Option B — custom roles'] },
  { id:'e', label:'Flow E', name:'Review attendance', where:'Admin · web', steps:['Attendance on a site','The checklist'] },
  { id:'f', label:'Flow F', name:'Find the gap',      where:'Admin · web', steps:['Index','One site','Inside a ritual','Why it counted'] },
  { id:'g', label:'Flow G', name:'Fix it from the field', where:'Supervisor · mobile', steps:['My crew','Inside FLHA','Mark present','Move a ritual'] },
  { id:'h', label:'Flow H', name:'Who’s on the field',where:'Supervisor · mobile', steps:['The list','One person'] },
  { id:'i', label:'Flow I', name:'The worker floor',  where:'Mobile · deferred', steps:['Today / All'] }
];

var LOCATIONS=[{n:'North Yard'},{n:'West Depot'},{n:'Central Branch'},{n:'Lakeside Branch'},{n:'South Yard'},{n:'Concrete Crew 3',bent:true}];
var ASSETS=[{n:'Restoration Job 4471'},{n:'Restoration Job 4482'},{n:'Cable run — Sector 12'},{n:'Toolbox Holder',bent:true}];
var CREW=[
  {n:'J. Alvarez',role:'Foreman'},{n:'K. Bennett',role:'Operator',driving:true},
  {n:'L. Cortez',role:'Operator'},{n:'M. Diallo',role:'Labourer'},
  {n:'N. Emerson',role:'Labourer'},{n:'P. Fontaine',role:'Operator'},
  {n:'R. Gill',role:'Labourer'},{n:'S. Haddad',role:'Apprentice'}
];
var RITUAL_LIB=[
  {id:'sod',n:'Start of Day',items:['Field Level Hazard Assessment','Equipment Pre-Op','Yard walk'],cad:'Daily · working days'},
  {id:'tbt',n:'Toolbox Talk',items:['Talk topic','Attendance checklist'],cad:'Weekly · Mon'},
  {id:'eq', n:'Equipment Check',items:['Fire extinguisher','Eyewash station','Shop inspection'],cad:'Weekly · Fri'},
  {id:'inc',n:'Incident',items:['Incident report','Witness statement','Follow-up task'],cad:'Triggered — never outstanding'}
];
var FORMS=[
  {id:'flha',n:'Field Level Hazard Assessment'},{id:'preop',n:'Equipment Pre-Op'},
  {id:'yard',n:'Yard walk'},{id:'hot',n:'Hot work permit'},
  {id:'cse',n:'Confined space entry'},{id:'veh',n:'Vehicle inspection'}
];
var FILES=[
  {n:'SDS — solvent cleaner.pdf',p:'Safety / Daily'},
  {n:'Site map — current.pdf',p:'Safety / Daily'},
  {n:'Emergency contacts.pdf',p:'Safety / Permits'}
];
var MEETINGS=[
  {n:'Toolbox Talk',d:'weekly · topic + attendance'},
  {n:'Tailgate Meeting',d:'per shift · short'},
  {n:'Pre-Job Briefing',d:'per job · hazards + roles'}
];
var CADENCES=[
  {id:'fixed',  n:'Fixed interval',   d:'Daily, weekly, monthly',                     s:'extend'},
  {id:'working',n:'Working days only',d:'Reads the site’s operating calendar',        s:'build'},
  {id:'metered',n:'Metered',          d:'Engine-hours or mileage',                    s:'exists'},
  {id:'subday', n:'Sub-day / shift',  d:'Two runs on a 12-hour shift',                s:'build'},
  {id:'use',    n:'Use-triggered',    d:'No use, nothing owed',                       s:'open'},
  {id:'trig',   n:'Triggered only',   d:'Fires on an event — never shows as outstanding', s:'extend'}
];

function fresh(){
  return { flow:'a', step:0,
    mode:null, convTab:'locations', pickedLoc:[0,1,2,3,4], pickedAsset:[], converted:0,
    rituals:['sod'], cadEdit:null, cadence:{sod:'working'},
    noRitual:false, floatItems:['flha'],
    indexTab:'sites',
    bundle:[{t:'form',n:'Field Level Hazard Assessment'}], addOpen:null, meetingMode:'template',
    rName:'', rItems:['flha'], rCad:'working', rAttach:[0,1,2],
    cName:'', cMembers:[0,1,2,3], cRule:null, cSup:0, cPerm:'read', cSite:null,
    permModel:'a', openLevel:'crew', access:{me:'full',crew:'edit',tina:'view'},
    att:{}, attOpen:false,
    showDone:false, ritualOpen:null,
    presentNoSig:false, ritualDay:'Fri',
    person:null, workerTab:'today' };
}
var st=fresh();

/* ===================== DERIVED ===================== */
function siteCount(){ return st.converted || 52; }
function flhaDone(){ return st.presentNoSig?5:4; }
function obligations(){
  return [
    {r:'Start of Day',cad:'Daily · 6-day week',what:'Field Level Hazard Assessment',id:'flha',when:flhaDone()+' of 8 crew done',n:8-flhaDone()},
    {r:'Start of Day',cad:'Daily · 6-day week',what:'Equipment Pre-Op',id:'preop',when:'2 units not submitted',n:2},
    {r:'Equipment Check',cad:'Weekly · '+st.ritualDay,what:'Fire extinguisher check',id:'fire',when:'due '+st.ritualDay,n:1,soon:true}
  ];
}
function outstanding(){ return obligations().reduce(function(t,o){return t+o.n;},0); }
function attState(name){ return st.att[name] || (name==='K. Bennett' ? (st.presentNoSig?'nosig':'none') : 'present'); }
function attCount(){ return CREW.filter(function(p){return attState(p.n)!=='none';}).length; }

/* ===================== NAV ===================== */
function curFlow(){ return FLOWS.filter(function(f){return f.id===st.flow;})[0]; }
function enterFlow(id){ st.flow=id; st.step=0; if(id==='a'){st.converted=0;st.mode=null;} render(); }
function setStep(i){ st.step=i; render(); }
function nextStep(){ if(st.step<curFlow().steps.length-1){st.step++;render();} }
function prevStep(){ if(st.step>0){st.step--;render();} }
function goto(f,s){ st.flow=f; st.step=s; render(); }
function resetAll(){ st=fresh(); render(); }

/* ===================== ACTIONS ===================== */
function setMode(m){ st.mode=m; st.convTab = m==='job'?'assets':'locations'; render(); }
function setConvTab(t){ st.convTab=t; render(); }
function togglePick(list,i){ var a=st[list],k=a.indexOf(i); if(k<0)a.push(i); else a.splice(k,1); render(); }
function selectAllLoc(){ st.pickedLoc=[0,1,2,3,4]; render(); }
function totalPicked(){ return st.pickedLoc.length + st.pickedAsset.length; }
function convert(){ st.converted = st.mode==='job' ? totalPicked() : 47+totalPicked(); st.step=2; render(); }
function toggleRitual(id){ var k=st.rituals.indexOf(id);
  if(k<0){ st.rituals.push(id); st.cadence[id]=RITUAL_LIB.filter(function(r){return r.id===id;})[0].cad; }
  else { st.rituals.splice(k,1); delete st.cadence[id]; if(st.cadEdit===id)st.cadEdit=null; }
  render(); }
function editCad(id){ st.cadEdit = st.cadEdit===id?null:id; render(); }
function setCad(id,v){ st.cadence[id]=v; st.cadEdit=null; render(); }
function setIndexTab(t){ st.indexTab=t; render(); }
function toggleNoRitual(){ st.noRitual=!st.noRitual; st.cadEdit=null; render(); }
function toggleFloat(id){ var k=st.floatItems.indexOf(id); if(k<0)st.floatItems.push(id); else st.floatItems.splice(k,1); render(); }
function openAdd(t){ st.addOpen = st.addOpen===t?null:t; render(); }
function setMeetingMode(m){ st.meetingMode=m; render(); }
function removeItem(i){ st.bundle.splice(i,1); render(); }
function addItem(t,n,sub){
  var at=-1;
  st.bundle.forEach(function(b,i){ if(b.t===t&&b.n===n) at=i; });
  if(at>=0) st.bundle.splice(at,1); else st.bundle.push({t:t,n:n,sub:sub});
  render();
}
function setRCad(v){ st.rCad=v; render(); }
function toggleRItem(id){ var k=st.rItems.indexOf(id); if(k<0)st.rItems.push(id); else st.rItems.splice(k,1); render(); }
function toggleRAttach(i){ var k=st.rAttach.indexOf(i); if(k<0)st.rAttach.push(i); else st.rAttach.splice(k,1); render(); }
function toggleMember(i){ var k=st.cMembers.indexOf(i); if(k<0)st.cMembers.push(i); else st.cMembers.splice(k,1); render(); }
function setRule(r){ st.cRule = st.cRule===r?null:r; render(); }
function setSup(i){ st.cSup=i; render(); }
function setPerm(p){ st.cPerm=p; render(); }
function assignSite(n){ st.cSite=n; render(); }
function setPermModel(m){ st.permModel=m; st.step = m==='a'?0:1; render(); }
function openLevel(k){ st.openLevel = st.openLevel===k?null:k; render(); }
function setAccess(k,v){ st.access[k]=v; st.openLevel=null; render(); }
function setAtt(n,v){ st.att[n]=v; render(); }
function markAllPresent(){ CREW.forEach(function(p){ st.att[p.n]='present'; }); render(); }
function toggleDone(){ st.showDone=!st.showDone; render(); }
function openRitual(id){ st.ritualOpen=id; st.step=2; render(); }
function markPresent(){ st.presentNoSig=true; st.att['K. Bennett']='nosig'; render(); }
function moveRitual(){ st.ritualDay = st.ritualDay==='Fri'?'Thu':'Fri'; render(); }
function openPerson(i){ st.person=i; st.step=1; render(); }
function setWorkerTab(t){ st.workerTab=t; render(); }

/* ===================== SHELLS ===================== */
function win(bar,right,body){
  return '<div class="framewrap"><div class="win"><div class="win__bar">'+bar+'<span class="r">'+(right||'')+'</span></div>'
    +'<div class="win__body">'+body+'</div></div></div>';
}
function phone(bar,right,body,cap,back){
  return '<div class="framewrap"><div><div class="ph"><div class="ph__bar">'
    +(back?'<button class="back" onclick="'+back+'">‹</button>':'')+bar+'<span class="r">'+(right||'')+'</span></div>'
    +'<div class="ph__body">'+body+'</div></div>'+(cap?'<div class="caption">'+cap+'</div>':'')+'</div></div>';
}
function ann(title,items,banner){
  return '<div class="ann"><div class="ann__t">'+title+'</div>'
    +items.map(function(a){return '<div class="a'+(a.warn?' warnrow':'')+'"><b>'+a.h+'</b>'+a.b+'</div>';}).join('')
    +(banner?'<div class="banner"><b>'+banner.h+'</b>'+banner.b+'</div>':'')+'</div>';
}
function cbx(on){ return '<span class="cb'+(on?' on':'')+'">'+(on?'✓':'')+'</span>'; }
function rdo(on){ return '<span class="cb rnd'+(on?' on':'')+'">'+(on?'•':'')+'</span>'; }

/* ===================== RENDER ===================== */
function renderFlows(){
  document.getElementById('flows').innerHTML=FLOWS.map(function(f){
    return '<button class="fbtn'+(f.id===st.flow?' on':'')+'" onclick="enterFlow(\''+f.id+'\')">'
      +'<span class="fl">'+f.label+'</span><span class="fn">'+f.name+'</span><span class="fw">'+f.where+'</span></button>';
  }).join('');
}
function renderRail(){
  var f=curFlow();
  var steps=f.steps.map(function(s,i){
    return '<button class="sbtn'+(i===st.step?' on':(i<st.step?' past':''))+'" onclick="setStep('+i+')">'
      +'<span class="sn">'+(i+1)+'</span>'+s+'</button>';
  }).join('<span class="sarrow">→</span>');
  document.getElementById('steprail').innerHTML=steps
    +'<div class="stepnav"><button onclick="prevStep()"'+(st.step===0?' disabled':'')+'>‹ Back</button>'
    +'<button class="next" onclick="nextStep()"'+(st.step===f.steps.length-1?' disabled':'')+'>Next ›</button></div>';
}
function render(){
  renderFlows(); renderRail();
  var stage=document.getElementById('stage');
  stage.innerHTML=SCREENS[st.flow][st.step]();
  var d=FOOT()[st.flow][st.step];
  document.getElementById('ftitle').innerHTML='<span class="tkt">'+d.k+'</span>'+d.t;
  document.getElementById('flist').innerHTML=d.b.map(function(x){return '<li>'+x+'</li>';}).join('');
  stage.scrollTop=0;
  ['.framewrap','.ann'].forEach(function(sel){ var el=stage.querySelector(sel); if(el) el.scrollTop=0; });
}
render();
</script>
