<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIS Admin Redesign v2 — Responsive Preview</title>
<style>
  :root{
    --bar:#443b5a;
    --accent:#0078b3;
    --ink:#191919;
    --muted:#8a8593;
    --line:#e5e3ea;
    --font:"Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:var(--font);color:var(--ink);background:#f4f2f7;display:flex;flex-direction:column;}

  /* ---- toolbar ---- */
  .toolbar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap;box-shadow:0 1px 0 rgba(0,0,0,.15);z-index:5;}
  .toolbar .brand{font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;}
  .toolbar .brand small{font-weight:400;opacity:.7;font-size:12px;}
  .devices{display:flex;gap:6px;background:rgba(255,255,255,.08);padding:4px;border-radius:80px;}
  .devices button{appearance:none;border:0;background:transparent;color:#d9d5e2;font:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:80px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s ease,color .15s ease;white-space:nowrap;}
  .devices button:hover{color:#fff;}
  .devices button[aria-pressed="true"]{background:#fff;color:var(--bar);}
  .devices .dot{font-size:11px;}
  .spacer{flex:1;}
  .openlink{color:#cfe8f4;text-decoration:none;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:6px;white-space:nowrap;}
  .openlink:hover{background:rgba(255,255,255,.1);color:#fff;}

  /* ---- caption ---- */
  .caption{display:flex;align-items:center;gap:10px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:#555;flex-wrap:wrap;}
  .caption .size{font-weight:700;color:var(--ink);}
  .caption .dims{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);font-size:12px;background:#eef7fb;padding:2px 8px;border-radius:5px;}
  .caption .scale{color:var(--muted);font-size:12px;}
  .caption .look{margin-left:auto;color:var(--muted);font-size:12px;font-style:italic;}

  /* ---- stage ---- */
  .stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px;}
  .frame{position:relative;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(40,30,60,.18);transition:width .28s ease,height .28s ease;flex:none;}
  .frame.is-phone,.frame.is-tablet{border-radius:22px;padding:10px;background:#1d1a24;}
  .frame.is-phone .screen,.frame.is-tablet .screen{border-radius:14px;overflow:hidden;background:#fff;width:100%;height:100%;}
  .frame .screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit;}
  iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:#fff;}
  .frame.is-phone iframe,.frame.is-tablet iframe{border-radius:14px;}

  @media (max-width:640px){
    .caption .look{display:none;}
    .stage{padding:14px;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">BIS Admin Redesign v2 <small>· responsive preview</small></div>
  <div class="devices" role="group" aria-label="Choose a viewport">
    <button data-preset="big"    aria-pressed="false"><span class="dot">🖥️</span> Big screen</button>
    <button data-preset="laptop" aria-pressed="true"><span class="dot">💻</span> Laptop</button>
    <button data-preset="tablet" aria-pressed="false"><span class="dot">📱</span> Tablet</button>
    <button data-preset="phone"  aria-pressed="false"><span class="dot">📲</span> Phone</button>
  </div>
  <div class="spacer"></div>
  <a class="openlink" href="admin-page-redesign-v2.html" target="_blank" rel="noopener">Open full page ↗</a>
</div>

<div class="caption">
  <span class="size" id="cap-size">Laptop</span>
  <span class="dims" id="cap-dims">1440 × 900</span>
  <span class="scale" id="cap-scale"></span>
  <span class="look" id="cap-look">Note the grid fills edge-to-edge with no right-side gap.</span>
</div>

<div class="stage" id="stage">
  <div class="frame is-laptop" id="frame">
    <div class="screen">
      <iframe id="pv" src="admin-page-redesign-v2.html" title="Admin redesign v2 prototype"></iframe>
    </div>
  </div>
</div>

<script>
  const PRESETS = {
    big:    {label:"Big screen", w:1920, h:960,  cls:"is-big",    look:"Widescreen — cards stay a comfortable size; the row fills without a dead right gap."},
    laptop: {label:"Laptop",     w:1440, h:900,  cls:"is-laptop", look:"Standard laptop — first module row sits above the fold, no scroll to reach it."},
    tablet: {label:"Tablet",     w:834,  h:1112, cls:"is-tablet", look:"Tablet portrait — grid reflows to fewer columns and still fills the width."},
    phone:  {label:"Phone",      w:390,  h:844,  cls:"is-phone",  look:"Phone — clean 2-up grid, empty Favourites collapses to a slim line, header scrolls."}
  };

  const stage = document.getElementById("stage");
  const frame = document.getElementById("frame");
  const pv    = document.getElementById("pv");
  const buttons = [...document.querySelectorAll(".devices button")];
  const capSize = document.getElementById("cap-size");
  const capDims = document.getElementById("cap-dims");
  const capScale = document.getElementById("cap-scale");
  const capLook = document.getElementById("cap-look");

  let current = "laptop";

  function apply(name){
    const p = PRESETS[name];
    current = name;

    // frame device styling
    frame.className = "frame " + p.cls;

    // logical iframe size
    pv.style.width  = p.w + "px";
    pv.style.height = p.h + "px";

    // fit-to-stage scale (never upscale past 1:1)
    const bezel = (p.cls === "is-phone" || p.cls === "is-tablet") ? 20 : 0; // padding on device frames
    const availW = stage.clientWidth  - 56 - bezel;   // stage padding + bezel
    const availH = stage.clientHeight - 56 - bezel;
    const scale = Math.min(1, availW / p.w, availH / p.h);

    pv.style.transform = "scale(" + scale + ")";

    // outer screen box takes the scaled dimensions so layout flows correctly
    const screen = frame.querySelector(".screen");
    screen.style.width  = (p.w * scale) + "px";
    screen.style.height = (p.h * scale) + "px";

    // caption
    capSize.textContent  = p.label;
    capDims.textContent  = p.w + " × " + p.h;
    capScale.textContent = scale < 1 ? "shown at " + Math.round(scale * 100) + "%" : "actual size";
    capLook.textContent  = p.look;

    buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.preset === name ? "true" : "false"));
  }

  buttons.forEach(b => b.addEventListener("click", () => apply(b.dataset.preset)));
  window.addEventListener("resize", () => apply(current));
  apply("laptop");
</script>
</body>
</html>
