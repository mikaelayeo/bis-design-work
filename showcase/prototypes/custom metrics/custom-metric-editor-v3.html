<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Metric Editor — v3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-raised: #f8f9fb;
    --border: #e2e5e9;
    --border-focus: #4f46e5;
    --text-primary: #1a1d23;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --accent-hover: #4338ca;
    --tag-field: #dbeafe;
    --tag-field-text: #1e40af;
    --tag-operator: #fef3c7;
    --tag-operator-text: #92400e;
    --tag-value: #d1fae5;
    --tag-value-text: #065f46;
    --tag-function: #ede9fe;
    --tag-function-text: #5b21b6;
    --tag-hours: #fce7f3;
    --tag-hours-text: #9d174d;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --error-text: #dc2626;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --success-text: #16a34a;
    --warning-bg: #fffbeb;
    --warning-border: #fde68a;
    --warning-text: #d97706;
    --ai-border: #c7d2fe;
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
    --radius: 8px;
    --radius-lg: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 100px;
  }

  .editor-container {
    width: 100%;
    max-width: 740px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  /* Header */
  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }
  .editor-header h2 { font-size: 16px; font-weight: 600; }
  .header-actions { display: flex; gap: 8px; }

  .btn {
    padding: 7px 16px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
  }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface-raised); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }

  /* Meta Row */
  .meta-row { display: flex; gap: 12px; padding: 20px 24px 0; }
  .field-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .field-group.small { flex: 0 0 140px; }
  .field-label {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field-input {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; font-size: 14px; color: var(--text-primary); outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--border-focus); }
  .color-input-wrap {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
  }
  .color-swatch { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; }
  .color-hex { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-secondary); border: none; outline: none; width: 70px; }

  /* AI Assist */
  .ai-section { padding: 16px 24px 0; }
  .ai-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 0; border: 1.5px solid var(--ai-border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .ai-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
  }
  .ai-bar-icon {
    flex-shrink: 0; width: 36px; height: 36px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    display: flex; align-items: center; justify-content: center;
    margin: 4px 0 4px 4px; border-radius: 6px;
  }
  .ai-bar-icon svg { width: 16px; height: 16px; }
  .ai-bar input {
    flex: 1; border: none; background: transparent;
    font-family: inherit; font-size: 13px; color: var(--text-primary);
    outline: none; padding: 12px 0;
  }
  .ai-bar input::placeholder { color: var(--text-muted); }
  .ai-bar-btn {
    flex-shrink: 0; padding: 8px 16px; margin: 4px 4px 4px 0;
    background: var(--accent); color: white; border: none; border-radius: 6px;
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .ai-bar-btn:hover { background: var(--accent-hover); }

  /* Formula Editor */
  .formula-section { padding: 16px 24px 0; }
  .formula-label-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .formula-editor-wrap {
    position: relative;
    border: 2px solid var(--border); border-radius: var(--radius);
    transition: border-color 0.15s;
    min-height: 80px;
  }
  .formula-editor-wrap.focused { border-color: var(--border-focus); }
  .formula-editor-wrap.has-error { border-color: var(--error-text); }
  .formula-editor-wrap.is-valid { border-color: var(--success-text); }

  .formula-tags {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding: 10px 12px 0 12px; min-height: 20px;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; border-radius: 4px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
  }
  .tag-field { background: var(--tag-field); color: var(--tag-field-text); }
  .tag-operator { background: var(--tag-operator); color: var(--tag-operator-text); }
  .tag-value { background: var(--tag-value); color: var(--tag-value-text); }
  .tag-hours { background: var(--tag-hours); color: var(--tag-hours-text); }

  .formula-input {
    display: block; width: 100%;
    border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--text-primary);
    padding: 8px 12px 10px; min-height: 32px;
    resize: none;
  }
  .formula-input::placeholder { color: var(--text-muted); font-family: 'DM Sans', sans-serif; }

  /* Autocomplete dropdown */
  .autocomplete {
    position: absolute; left: 0; right: 0; top: 100%;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    max-height: 180px; overflow-y: auto; z-index: 50;
    display: none;
  }
  .autocomplete.visible { display: block; }
  .autocomplete-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer; font-size: 13px;
    transition: background 0.08s;
  }
  .autocomplete-item:hover, .autocomplete-item.highlighted { background: var(--surface-raised); }
  .autocomplete-item .ac-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 1px 6px; border-radius: 3px; font-weight: 500;
  }

  /* Validation */
  .validation-msg {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 14px; border-radius: 6px; margin-top: 10px;
    font-size: 13px; line-height: 1.5;
  }
  .validation-msg.error { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }
  .validation-msg.success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text); }
  .validation-msg.warning { background: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--warning-text); }
  .validation-icon { flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; }
  .validation-msg strong { font-weight: 600; }
  .validation-fix {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 6px; padding: 4px 10px;
    background: white; border: 1px solid var(--error-border); border-radius: 4px;
    font-size: 12px; font-weight: 500; color: var(--error-text);
    cursor: pointer; font-family: inherit;
  }
  .validation-fix:hover { background: #fef2f2; }

  /* Options */
  .options-row { padding: 0 24px; margin-top: 12px; }
  .checkbox-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .checkbox-wrap input { accent-color: var(--accent); width: 15px; height: 15px; }
  .checkbox-wrap label { font-size: 13px; color: var(--text-secondary); cursor: pointer; }

  /* Context Panel — Notion style split */
  .context-panel {
    margin: 16px 24px 0;
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .context-tabs {
    display: flex; border-bottom: 1px solid var(--border); background: var(--surface-raised);
  }
  .context-tab {
    padding: 9px 16px; font-size: 12px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border: none; border-bottom: 2px solid transparent;
    background: none; font-family: inherit; transition: all 0.15s;
  }
  .context-tab:hover { color: var(--text-secondary); }
  .context-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .context-body {
    display: flex; min-height: 240px; max-height: 280px;
  }

  /* Left: list */
  .context-list {
    width: 200px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 4px 0;
  }
  .context-list::-webkit-scrollbar { width: 3px; }
  .context-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

  .ctx-section-title {
    padding: 8px 12px 4px; font-size: 10px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px;
  }
  .ctx-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
    transition: background 0.08s; border-left: 2px solid transparent;
  }
  .ctx-item:hover { background: var(--surface-raised); }
  .ctx-item.selected { background: var(--accent-light); border-left-color: var(--accent); }
  .ctx-item-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    padding: 1px 5px; border-radius: 3px; font-weight: 500; flex-shrink: 0;
  }
  .ctx-item-name { font-size: 12px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Right: detail */
  .context-detail {
    flex: 1; padding: 16px; overflow-y: auto;
  }
  .context-detail::-webkit-scrollbar { width: 3px; }
  .context-detail::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

  .detail-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--text-muted); font-size: 13px;
  }
  .detail-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; margin-bottom: 4px;
  }
  .detail-type { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
  .detail-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 14px; }

  .detail-section-label {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px;
  }
  .detail-example {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-primary);
  }
  .detail-example-copy {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 11px; font-family: inherit;
    padding: 2px 6px; border-radius: 4px;
  }
  .detail-example-copy:hover { background: var(--border); color: var(--text-primary); }

  .detail-insert-btn {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 8px; padding: 6px 14px;
    background: var(--accent); color: white; border: none; border-radius: 6px;
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .detail-insert-btn:hover { background: var(--accent-hover); }

  /* Preview */
  .preview-section {
    margin: 16px 24px 24px; padding: 14px 16px;
    background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .preview-label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .preview-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; color: var(--accent); }
  .preview-detail { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  /* Scenario bar */
  .scenario-bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: white; padding: 8px 12px;
    border-radius: 10px; display: flex; align-items: center; gap: 6px;
    box-shadow: var(--shadow-lg); z-index: 100; font-size: 12px;
  }
  .scenario-bar > span { color: #9ca3af; font-weight: 500; }
  .scenario-btn {
    padding: 6px 14px; border: none; border-radius: 6px;
    font-family: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; background: rgba(255,255,255,0.1); color: white;
    transition: all 0.15s;
  }
  .scenario-btn:hover { background: rgba(255,255,255,0.2); }
  .scenario-btn.active { background: var(--accent); }

  .ai-loading-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%);
    border: 1px solid var(--ai-border); border-radius: 6px; margin-top: 10px;
    font-size: 13px; color: var(--accent);
  }
  .dot-pulse span { animation: dotPulse 1.4s infinite; display: inline-block; }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }

  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<div class="editor-container">
  <div class="editor-header">
    <h2>Custom Metric</h2>
    <div class="header-actions">
      <button class="btn btn-ghost">Cancel</button>
      <button class="btn btn-primary">Save</button>
    </div>
  </div>

  <div class="meta-row">
    <div class="field-group">
      <span class="field-label">Name</span>
      <input class="field-input" type="text" value="TRIF Rate" />
    </div>
    <div class="field-group small">
      <span class="field-label">Colour</span>
      <div class="color-input-wrap">
        <input type="color" class="color-swatch" id="colorPicker" value="#4f46e5" />
        <input type="text" class="color-hex" value="#4f46e5" id="colorHex" />
      </div>
    </div>
  </div>

  <!-- AI Assist -->
  <div class="ai-section">
    <span class="field-label">AI Assist</span>
    <div class="ai-bar" style="margin-top:6px">
      <div class="ai-bar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
      </div>
      <input id="aiInput" type="text" placeholder='Describe what you want to calculate, e.g. "TRIF using injuries and hours"' />
      <button class="ai-bar-btn" id="aiBtn">Generate</button>
    </div>
  </div>

  <!-- Formula -->
  <div class="formula-section">
    <div class="formula-label-row">
      <span class="field-label">Formula</span>
    </div>
    <div class="formula-editor-wrap" id="formulaWrap">
      <div class="formula-tags" id="formulaTags"></div>
      <input class="formula-input" id="formulaInput" type="text" placeholder="Start typing or click a field below..." />
      <div class="autocomplete" id="autocomplete"></div>
    </div>
    <div id="validationArea"></div>
  </div>

  <div class="options-row">
    <div class="checkbox-wrap">
      <input type="checkbox" id="includeSubLoc" checked />
      <label for="includeSubLoc">Include hours from sub-locations</label>
    </div>
  </div>

  <!-- Context Panel (Notion-style split) -->
  <div class="context-panel">
    <div class="context-tabs" id="contextTabs"></div>
    <div class="context-body">
      <div class="context-list" id="contextList"></div>
      <div class="context-detail" id="contextDetail">
        <div class="detail-empty">Select an item to see details</div>
      </div>
    </div>
  </div>

  <div class="preview-section">
    <div class="preview-label">Live Preview — Site B (33 users)</div>
    <div class="preview-value" id="previewValue">—</div>
    <div class="preview-detail" id="previewDetail">No formula entered</div>
  </div>
</div>

<div class="scenario-bar" id="scenarioBar"></div>

<script>
// ── DATA ──
var allItems = {
  fields: [
    {
      id: 'CB_9', name: 'Were there any injuries?', type: 'Checkbox', tagCls: 'tag-field',
      desc: 'A checkbox field from your Incident Report form. Returns the count of completed forms where the selected option matches.',
      options: ['Yes', 'No'],
      examples: ['CB_9 IN ( Yes )', 'CB_9 NOT IN ( No )'],
    },
    {
      id: 'DD_7', name: 'Incident Type', type: 'Dropdown', tagCls: 'tag-function',
      desc: 'A dropdown field from your Incident Report form. Use IN to count forms matching specific option(s).',
      options: ['Recordable', 'First Aid', 'Near Miss'],
      examples: ['DD_7 IN ( Recordable )', 'DD_7 IN ( Recordable, First Aid )'],
    },
    {
      id: 'TF_3', name: 'Description', type: 'Text', tagCls: 'tag-value',
      desc: 'A free text field. Can be used with IN to count forms containing specific keywords.',
      options: [],
      examples: ['TF_3 IN ( fall, slip )'],
    },
    {
      id: 'TF_4', name: 'Hours Worked', type: 'Text (Numeric)', tagCls: 'tag-value',
      desc: 'A numeric text field. Use the field ID to sum values across completed forms.',
      options: [],
      examples: ['TF_4', 'TF_4 * 2'],
    },
    {
      id: '{Hours}', name: 'Location Hours', type: 'System', tagCls: 'tag-hours',
      desc: 'Pulls the total hours from the Location Hours table for the location (and sub-locations if enabled) selected on the dashboard widget filter.',
      options: [],
      examples: ['{Hours}', '200000 / {Hours}'],
      isSystem: true,
    },
  ],
  operators: [
    { id: '+', name: 'Add', type: 'Arithmetic', desc: 'Adds two values together.', examples: ['CB_9 IN (Yes) + DD_7 IN (Recordable)'], tagCls: 'tag-operator' },
    { id: '-', name: 'Subtract', type: 'Arithmetic', desc: 'Subtracts the right value from the left.', examples: ['TF_4 - 10'], tagCls: 'tag-operator' },
    { id: '*', name: 'Multiply', type: 'Arithmetic', desc: 'Multiplies two values.', examples: ['CB_9 IN (Yes) * 200000'], tagCls: 'tag-operator' },
    { id: '/', name: 'Divide', type: 'Arithmetic', desc: 'Divides the left value by the right. Returns no result if dividing by zero.', examples: ['200000 / {Hours}'], tagCls: 'tag-operator' },
    { id: 'IN', name: 'In', type: 'Comparison', desc: 'Counts completed forms where the field contains one or more of the specified values. Use with Checkboxes, Dropdowns, or Text fields.', examples: ['CB_9 IN ( Yes )', 'DD_7 IN ( Recordable, First Aid )'], tagCls: 'tag-operator' },
    { id: 'NOT IN', name: 'Not In', type: 'Comparison', desc: 'Counts completed forms where the field does NOT contain the specified values.', examples: ['DD_7 NOT IN ( Near Miss )'], tagCls: 'tag-operator' },
    { id: 'AND', name: 'And', type: 'Logical', desc: 'Both conditions on either side must be true.', examples: ['CB_9 IN (Yes) AND TF_4 IN (1)'], tagCls: 'tag-operator' },
    { id: 'OR', name: 'Or', type: 'Logical', desc: 'Either condition on either side can be true.', examples: ['CB_9 IN (Yes) OR DD_7 IN (Recordable)'], tagCls: 'tag-operator' },
    { id: '( )', name: 'Parentheses', type: 'Grouping', desc: 'Groups expressions to control evaluation order. Always use matching open and close parentheses.', examples: ['( CB_9 IN (Yes) * 200000 ) / {Hours}'], tagCls: 'tag-operator' },
  ],
  formulas: [
    { id: 'trif', name: 'TRIF Rate', type: 'Safety', desc: 'Total Recordable Incident Frequency. Calculates the rate of recordable incidents per 200,000 hours worked. Standard OSHA safety metric.', examples: ['( CB_9 IN (Yes) * 200000 ) / {Hours}'], tagCls: 'tag-field' },
    { id: 'injury_pct', name: 'Injury Rate %', type: 'Safety', desc: 'Percentage of form submissions that reported an injury.', examples: ['CB_9 IN (Yes) / CB_9 IN (Yes, No) * 100'], tagCls: 'tag-field' },
    { id: 'incident_count', name: 'Incident Count', type: 'General', desc: 'Simple count of submissions matching a specific incident type.', examples: ['DD_7 IN ( Recordable )'], tagCls: 'tag-field' },
  ],
};

// ── STATE ──
var activeTab = 'fields';
var selectedItem = null;
var formulaParts = [];
var currentScenario = 'empty';

// ── TABS ──
var tabDefs = [
  { key: 'fields', label: 'Fields' },
  { key: 'operators', label: 'Operators' },
  { key: 'formulas', label: 'Formulas' },
];

function buildTabs() {
  var el = document.getElementById('contextTabs');
  el.innerHTML = '';
  tabDefs.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'context-tab' + (t.key === activeTab ? ' active' : '');
    btn.textContent = t.label;
    btn.addEventListener('click', function() {
      activeTab = t.key;
      selectedItem = null;
      buildTabs();
      renderList();
      renderDetail();
    });
    el.appendChild(btn);
  });
}

// ── LIST (left side) ──
function renderList() {
  var el = document.getElementById('contextList');
  var items = allItems[activeTab];
  var html = '';
  var lastType = '';

  items.forEach(function(item, idx) {
    if (item.type !== lastType) {
      html += '<div class="ctx-section-title">' + item.type + '</div>';
      lastType = item.type;
    }
    var sel = selectedItem && selectedItem.id === item.id ? ' selected' : '';
    html += '<div class="ctx-item' + sel + '" data-idx="' + idx + '">' +
      '<span class="ctx-item-tag ' + item.tagCls + '">' + item.id + '</span>' +
      '<span class="ctx-item-name">' + item.name + '</span>' +
      '</div>';
  });
  el.innerHTML = html;

  el.querySelectorAll('.ctx-item').forEach(function(node) {
    node.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      selectedItem = allItems[activeTab][idx];
      renderList();
      renderDetail();
    });
  });
}

// ── DETAIL (right side — Notion style) ──
function renderDetail() {
  var el = document.getElementById('contextDetail');

  if (!selectedItem) {
    el.innerHTML = '<div class="detail-empty">Select an item to see details</div>';
    return;
  }

  var item = selectedItem;
  var html = '';

  html += '<div class="detail-title"><span class="tag ' + item.tagCls + '">' + item.id + '</span> ' + item.name + '</div>';
  html += '<div class="detail-type">' + item.type + '</div>';
  html += '<div class="detail-desc">' + item.desc + '</div>';

  if (item.options && item.options.length > 0) {
    html += '<div class="detail-section-label">Options</div>';
    html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px">';
    item.options.forEach(function(o) {
      html += '<span class="tag tag-value">' + o + '</span>';
    });
    html += '</div>';
  }

  if (item.examples && item.examples.length > 0) {
    html += '<div class="detail-section-label">Usage Examples</div>';
    item.examples.forEach(function(ex) {
      html += '<div class="detail-example"><span>' + ex + '</span><button class="detail-example-copy" data-ex="' + ex.replace(/"/g, '&quot;') + '">Copy</button></div>';
    });
  }

  // Insert button
  if (activeTab === 'formulas') {
    html += '<button class="detail-insert-btn" id="insertFormulaBtn">Use this formula</button>';
  } else if (activeTab === 'fields') {
    html += '<button class="detail-insert-btn" id="insertFieldBtn">Insert into formula</button>';
  } else if (activeTab === 'operators') {
    html += '<button class="detail-insert-btn" id="insertOpBtn">Insert into formula</button>';
  }

  el.innerHTML = html;

  // Copy buttons
  el.querySelectorAll('.detail-example-copy').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var text = this.getAttribute('data-ex');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
        this.textContent = 'Copied!';
        var self = this;
        setTimeout(function() { self.textContent = 'Copy'; }, 1500);
      }
    });
  });

  // Insert buttons
  var insertFormula = el.querySelector('#insertFormulaBtn');
  if (insertFormula) {
    insertFormula.addEventListener('click', function() {
      if (item.id === 'trif') { applyTrifFormula(); }
    });
  }

  var insertField = el.querySelector('#insertFieldBtn');
  if (insertField) {
    insertField.addEventListener('click', function() {
      appendToInput(item.isSystem ? item.id : item.name + ' (' + item.id + ')');
    });
  }

  var insertOp = el.querySelector('#insertOpBtn');
  if (insertOp) {
    insertOp.addEventListener('click', function() {
      appendToInput(item.id);
    });
  }
}

function appendToInput(text) {
  var input = document.getElementById('formulaInput');
  var current = input.value;
  input.value = current + (current && !current.endsWith(' ') ? ' ' : '') + text + ' ';
  input.focus();
}

// ── FORMULA TAGS + INPUT ──
function renderFormulaTags() {
  var el = document.getElementById('formulaTags');
  if (formulaParts.length === 0) {
    el.innerHTML = '';
    return;
  }
  var html = '';
  formulaParts.forEach(function(p) {
    html += '<span class="tag ' + p.cls + '">' + p.label + '</span> ';
  });
  el.innerHTML = html;
}

function setTrifFormulaTags() {
  formulaParts = [
    { label: '(', cls: 'tag-operator' },
    { label: 'Were there any injuries? (CB_9)', cls: 'tag-field' },
    { label: 'IN', cls: 'tag-operator' },
    { label: '(', cls: 'tag-operator' },
    { label: 'Yes', cls: 'tag-value' },
    { label: ')', cls: 'tag-operator' },
    { label: '*', cls: 'tag-operator' },
    { label: '200000', cls: 'tag-value' },
    { label: ')', cls: 'tag-operator' },
    { label: '/', cls: 'tag-operator' },
    { label: '{Hours}', cls: 'tag-hours' },
  ];
  renderFormulaTags();
  document.getElementById('formulaInput').value = '';
  document.getElementById('formulaInput').placeholder = 'Continue typing to modify...';
}

function applyTrifFormula() {
  setTrifFormulaTags();
  showSuccess();
  setPreview('5,882.35', '(2 × 200,000) ÷ 68 = 5,882.35 — based on current data');
}

// ── AUTOCOMPLETE ──
var acEl = document.getElementById('autocomplete');
var formulaInputEl = document.getElementById('formulaInput');

formulaInputEl.addEventListener('input', function() {
  var val = this.value.trim().toLowerCase();
  if (val.length === 0) { acEl.classList.remove('visible'); return; }

  var matches = [];
  allItems.fields.forEach(function(f) {
    if (f.name.toLowerCase().includes(val) || f.id.toLowerCase().includes(val)) {
      matches.push(f);
    }
  });
  allItems.operators.forEach(function(o) {
    if (o.name.toLowerCase().includes(val) || o.id.toLowerCase().includes(val)) {
      matches.push(o);
    }
  });

  if (matches.length === 0) { acEl.classList.remove('visible'); return; }

  var html = '';
  matches.slice(0, 6).forEach(function(m, i) {
    html += '<div class="autocomplete-item" data-idx="' + i + '">' +
      '<span class="ac-tag ' + m.tagCls + '">' + m.id + '</span>' +
      '<span>' + m.name + '</span></div>';
  });
  acEl.innerHTML = html;
  acEl.classList.add('visible');

  acEl.querySelectorAll('.autocomplete-item').forEach(function(item, i) {
    item.addEventListener('click', function() {
      var m = matches[i];
      formulaInputEl.value = '';
      formulaParts.push({ label: m.isSystem ? m.id : (m.name ? m.name + ' (' + m.id + ')' : m.id), cls: m.tagCls });
      renderFormulaTags();
      acEl.classList.remove('visible');
      formulaInputEl.focus();
    });
  });
});

formulaInputEl.addEventListener('focus', function() {
  document.getElementById('formulaWrap').classList.add('focused');
});
formulaInputEl.addEventListener('blur', function() {
  document.getElementById('formulaWrap').classList.remove('focused');
  setTimeout(function() { acEl.classList.remove('visible'); }, 200);
});

// ── VALIDATION ──
function clearValidation() {
  document.getElementById('validationArea').innerHTML = '';
  var w = document.getElementById('formulaWrap');
  w.classList.remove('has-error', 'is-valid');
}

function showSyntaxError() {
  var w = document.getElementById('formulaWrap');
  w.classList.add('has-error'); w.classList.remove('is-valid');
  document.getElementById('validationArea').innerHTML =
    '<div class="validation-msg error fade-in">' +
      '<svg class="validation-icon" viewBox="0 0 16 16" fill="#dc2626"><circle cx="8" cy="8" r="8"/><text x="8" y="12" text-anchor="middle" fill="white" font-size="11" font-weight="bold">!</text></svg>' +
      '<div><strong>Missing closing parenthesis.</strong><br/>' +
      'The <span class="tag tag-operator" style="display:inline;font-size:11px">(</span> after ' +
      '<span class="tag tag-field" style="display:inline;font-size:11px">CB_9</span> is never closed. ' +
      'Add a <span class="tag tag-operator" style="display:inline;font-size:11px">)</span> after your value.' +
      '<br/><button class="validation-fix" id="autoFixBtn">Auto-fix</button></div></div>';
  document.getElementById('autoFixBtn').addEventListener('click', function() { switchTo('valid'); });
}

function showSuccess() {
  var w = document.getElementById('formulaWrap');
  w.classList.remove('has-error'); w.classList.add('is-valid');
  document.getElementById('validationArea').innerHTML =
    '<div class="validation-msg success fade-in">' +
      '<svg class="validation-icon" viewBox="0 0 16 16" fill="#16a34a"><circle cx="8" cy="8" r="8"/><path d="M5 8l2 2 4-4" stroke="white" stroke-width="2" fill="none"/></svg>' +
      '<div><strong>Formula is valid.</strong> Showing live preview below.</div></div>';
}

// ── PREVIEW ──
function setPreview(v, d) {
  document.getElementById('previewValue').textContent = v;
  document.getElementById('previewDetail').textContent = d;
}
function resetPreview() { setPreview('—', 'No formula entered'); }

// ── SCENARIOS ──
var scenarios = ['empty','building','error','valid','ai'];
var scenarioLabels = {empty:'Empty',building:'Building',error:'Error',valid:'Valid',ai:'AI Assist'};

function buildScenarioBar() {
  var bar = document.getElementById('scenarioBar');
  var html = '<span>State:</span>';
  scenarios.forEach(function(s) {
    html += '<button class="scenario-btn' + (s === currentScenario ? ' active' : '') + '" data-sc="' + s + '">' + scenarioLabels[s] + '</button>';
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.scenario-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { switchTo(this.getAttribute('data-sc')); });
  });
}

function switchTo(scenario) {
  currentScenario = scenario;
  formulaParts = [];
  clearValidation();
  resetPreview();
  document.getElementById('aiInput').value = '';
  document.getElementById('formulaInput').value = '';
  document.getElementById('formulaInput').placeholder = 'Start typing or click a field below...';

  if (scenario === 'empty') {
    renderFormulaTags();
  }

  if (scenario === 'building') {
    formulaParts = [
      { label: '(', cls: 'tag-operator' },
      { label: 'Were there any injuries? (CB_9)', cls: 'tag-field' },
      { label: 'IN', cls: 'tag-operator' },
      { label: '(', cls: 'tag-operator' },
      { label: 'Yes', cls: 'tag-value' },
      { label: ')', cls: 'tag-operator' },
      { label: '*', cls: 'tag-operator' },
      { label: '200000', cls: 'tag-value' },
    ];
    renderFormulaTags();
    document.getElementById('formulaInput').placeholder = 'Continue typing...';
  }

  if (scenario === 'error') {
    formulaParts = [
      { label: '(', cls: 'tag-operator' },
      { label: 'Were there any injuries? (CB_9)', cls: 'tag-field' },
      { label: 'IN', cls: 'tag-operator' },
      { label: '(', cls: 'tag-operator' },
      { label: 'Yes', cls: 'tag-value' },
      { label: '*', cls: 'tag-operator' },
      { label: '200000', cls: 'tag-value' },
      { label: ')', cls: 'tag-operator' },
      { label: '/', cls: 'tag-operator' },
      { label: '{Hours}', cls: 'tag-hours' },
    ];
    renderFormulaTags();
    showSyntaxError();
    setPreview('—', 'Fix formula errors to see preview');
  }

  if (scenario === 'valid') {
    applyTrifFormula();
  }

  if (scenario === 'ai') {
    document.getElementById('aiInput').value = 'Calculate TRIF rate using injury checkbox and total hours';
    renderFormulaTags();
    document.getElementById('validationArea').innerHTML =
      '<div class="ai-loading-bar fade-in">' +
        '<div class="ai-bar-icon" style="width:20px;height:20px;border-radius:5px;margin:0;flex-shrink:0">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" width="12" height="12"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>' +
        '</div>' +
        'Building your formula<span class="dot-pulse"><span>.</span><span>.</span><span>.</span></span>' +
      '</div>';
    setTimeout(function() {
      applyTrifFormula();
      document.getElementById('aiInput').value = '';
      buildScenarioBar();
    }, 2000);
  }

  buildScenarioBar();
}

// ── COLOR SYNC ──
document.getElementById('colorPicker').addEventListener('input', function(e) {
  document.getElementById('colorHex').value = e.target.value;
});

// ── AI BUTTON ──
document.getElementById('aiBtn').addEventListener('click', function() {
  if (document.getElementById('aiInput').value.trim()) {
    switchTo('ai');
  }
});

// ── INIT ──
buildTabs();
renderList();
renderDetail();
renderFormulaTags();
buildScenarioBar();
</script>
</body>
</html>
