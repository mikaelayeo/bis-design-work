<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Rating Scale — Mobile Layouts</title>
<style>
  :root {
    --appbar:      #565A86;
    --header-blue: #0078B3;
    --selected:    #0078B3;
    --stroke:      #B2B2B3;
    --stroke-light:#E5E5E6;
    --surface:     #FEFFFF;
    --card-bg:     #F8F8F9;   /* surface.secondarySubtle */
    --row-alt:     #F2F2F2;
    --text:        #191919;
    --text-muted:  #666666;
    --on-surface:  #FEFFFF;
    --green:       #167B00;
    --page-bg:     #EEF1F4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--page-bg); color: var(--text); min-height: 100vh;
  }
  .page { padding: 26px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .intro { width: 100%; max-width: 1200px; text-align: center; }
  .intro h1 { font-size: 21px; margin: 0 0 6px; font-weight: 700; }
  .intro p { margin: 0; font-size: 14px; color: var(--text-muted); }

  .compare { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; width: 100%; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .col .caption { font-size: 14px; font-weight: 700; }
  .vrule { align-self: stretch; width: 1px; background: var(--stroke); margin: 0 4px; }

  /* ---------- phone shell ---------- */
  .phone {
    width: 372px; height: 800px; background: white; border-radius: 30px;
    border: 1px solid var(--stroke); box-shadow: 0 14px 40px rgba(0,0,0,.12);
    overflow: hidden; position: relative; display: flex; flex-direction: column;
  }
  .appbar {
    background: var(--appbar); color: white; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto;
  }
  .appbar .left { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  .appbar .chev { font-size: 20px; }
  .appbar .more { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .appbar .more .plus { font-size: 17px; }

  .form-body { flex: 1; overflow-y: auto; padding: 16px 14px 18px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .section-notes { font-size: 12.5px; font-style: italic; color: var(--text-muted); margin: 0 0 14px; line-height: 1.5; }

  .footbar {
    flex: 0 0 auto; border-top: 1px solid var(--stroke-light);
    padding: 12px 14px; display: flex; gap: 12px; background: white;
  }
  .footbar button {
    flex: 1; padding: 12px 0; border-radius: 4px; font-size: 15px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .footbar .save { background: white; border: 1px solid var(--stroke); color: var(--text); }
  .footbar .submit { background: var(--header-blue); border: 1px solid var(--header-blue); color: white; }
  .footbar svg { width: 17px; height: 17px; }

  /* ---------- context skeleton fields (de-emphasised) ---------- */
  .skel { opacity: .5; pointer-events: none; }
  .skel.after { margin: 0; }
  .field-label { font-size: 13px; font-weight: 700; margin: 0 0 2px; }
  .field-sub { font-size: 13px; color: var(--text); margin: 0 0 8px; }
  .dropdown {
    border: 1px solid var(--stroke); border-radius: 4px; padding: 11px 12px;
    display: flex; align-items: center; justify-content: space-between;
    color: var(--text-muted); font-size: 14px;
  }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 5px 0; color: var(--text); }
  .chk .box { width: 18px; height: 18px; border: 1.5px solid var(--stroke); border-radius: 3px; flex: 0 0 auto; }
  .divider { height: 1px; background: var(--stroke-light); margin: 18px 0; }

  /* ---------- inline comment box (appears on selection) ---------- */
  .inline-comment { position: relative; }
  .inline-comment textarea {
    width: 100%; min-height: 64px; resize: none; border: 1px solid var(--stroke);
    border-radius: 4px; padding: 11px 38px 11px 12px; font-family: inherit; font-size: 14px;
    color: var(--text); background: #fff;
  }
  .inline-comment textarea::placeholder { color: var(--text-muted); }
  .inline-comment .expand {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--row-alt); display: flex; align-items: center; justify-content: center; color: var(--text-muted);
  }
  .inline-comment .expand svg { width: 13px; height: 13px; }

  /* ---------- TABLE (single grid, sticky first column) ---------- */
  .likert-frame { border: 1px solid var(--stroke); border-radius: 4px; overflow: hidden; }
  .likert-scroll {
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    position: relative; cursor: grab; user-select: none;
  }
  .likert-scroll.dragging { cursor: grabbing; }
  .likert-scroll::-webkit-scrollbar { height: 0; }   /* drag/touch only — no visible bar */
  .lgrid { display: grid; width: max-content; min-width: 100%; }
  .lgrid .c {
    border-right: 1px solid var(--stroke-light); border-bottom: 1px solid var(--stroke-light);
    display: flex; align-items: center; justify-content: center; background: var(--surface);
  }
  .lgrid .c.stmt {
    justify-content: flex-start; gap: 6px; color: var(--text);
    position: sticky; left: 0; z-index: 2; box-shadow: 1px 0 0 0 var(--stroke-light);
  }
  .lgrid .c.stmt.alt, .lgrid .c.opt.alt { background: var(--row-alt); }
  .lgrid .c.head {
    background: var(--header-blue); color: var(--on-surface); font-weight: 600;
    text-align: center; border-right: 1px solid rgba(255,255,255,.25); border-bottom: none;
    padding: 6px 4px;
  }
  .lgrid .c.head-stmt {
    position: sticky; left: 0; z-index: 3; background: var(--surface);
    border-bottom: 1px solid var(--stroke); box-shadow: 1px 0 0 0 var(--stroke-light);
  }
  .lgrid .c.last { border-bottom: none; }
  .stmt .help { color: var(--green); flex: 0 0 auto; font-size: 13px; }

  /* full-width comment row inside the grid — pinned so it never scrolls sideways */
  .lgrid .comment-row {
    grid-column: 1 / -1; position: sticky; left: 0; justify-self: start;
    background: var(--surface); padding: 12px; border-bottom: 1px solid var(--stroke-light);
  }

  /* Current — faithful to live code (label.base 16, tight padding, mid-word wrap) */
  .current .head { font-size: 16px; line-height: 20px; overflow-wrap: anywhere; word-break: break-word; }
  .current .stmt { font-size: 16px; line-height: 21px; padding: 6px 7px; }
  .current .c { min-height: 48px; }

  /* Smaller — label.small 14, clean wrapping, with breathing-room padding */
  .smaller .head { font-size: 14px; line-height: 18px; overflow-wrap: normal; word-break: normal; }
  .smaller .stmt { font-size: 14px; line-height: 19px; padding: 11px 9px; }
  .smaller .c { min-height: 54px; padding: 10px 4px; }
  .smaller .c.stmt { padding: 11px 9px; }

  .radio {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--stroke);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    background: white; flex: 0 0 auto; transition: border-color .15s;
  }
  .radio:hover { border-color: var(--selected); }
  .radio.checked { border-color: var(--selected); }
  .radio.checked::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--selected); }

  /* ---------- CARD layout (option cards, fixed 2-up grid) ---------- */
  .cards { display: flex; flex-direction: column; gap: 18px; }
  .card-stmt { font-size: 16px; line-height: 24px; font-weight: 400; color: var(--text); margin-bottom: 10px; display: flex; align-items: flex-start; gap: 6px; }
  .card-stmt .help { color: var(--green); font-size: 13px; flex: 0 0 auto; margin-top: 3px; }
  .opt-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .opt-card {
    border: 1px solid var(--stroke); border-radius: 4px; background: var(--card-bg);
    color: var(--text); padding: 12px 10px; cursor: pointer; text-align: center;
    font-size: 16px; line-height: 24px; font-weight: 400; appearance: none;
    transition: background .12s, border-color .12s, color .12s;
  }
  .opt-card:hover { border-color: var(--selected); }
  .opt-card.selected { background: var(--selected); border-color: var(--selected); color: var(--on-surface); }
  .card-comment { margin-top: 10px; }
</style>
</head>
<body>
<div class="page">
  <div class="intro">
    <h1>Rating questions on mobile</h1>
    <p>The same checklist, three layouts. Tap an answer to try each one.</p>
  </div>

  <div class="compare">
    <div class="col"><div class="caption">Current</div>
      <div class="phone"><div class="appbar">
        <div class="left"><span class="chev">‹</span><span>Edit Form</span></div>
        <div class="more"><span class="plus">⊕</span><span>More Actions</span></div></div>
        <div class="form-body" id="body-current"></div>
        <div class="footbar">
          <button class="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</button>
          <button class="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Submit</button>
        </div>
      </div>
    </div>

    <div class="vrule"></div>

    <div class="col"><div class="caption">Smaller</div>
      <div class="phone"><div class="appbar">
        <div class="left"><span class="chev">‹</span><span>Edit Form</span></div>
        <div class="more"><span class="plus">⊕</span><span>More Actions</span></div></div>
        <div class="form-body" id="body-smaller"></div>
        <div class="footbar">
          <button class="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</button>
          <button class="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Submit</button>
        </div>
      </div>
    </div>

    <div class="col"><div class="caption">Card layout</div>
      <div class="phone"><div class="appbar">
        <div class="left"><span class="chev">‹</span><span>Edit Form</span></div>
        <div class="more"><span class="plus">⊕</span><span>More Actions</span></div></div>
        <div class="form-body" id="body-cards"></div>
        <div class="footbar">
          <button class="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</button>
          <button class="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Submit</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const SECTION_TITLE = "Safety and storage requirements:";
  const SECTION_NOTES = [
    "Notes:",
    "- It is recommended to display nearby a poster containing the QR codes of the hyperlinks directing us to the laws and regulations.",
    "- If you are using only a gamma measuring device, take into account an additional 30% for neutron radiation."
  ];
  const COMMENT_PLACEHOLDER = "Please provide reasons.";
  const STATEMENTS = [
    { id: 1, label: "Accessible laws and regulations?" },
    { id: 2, label: "Are radiation warning signs posted at the boundaries and access points of the storage area?", comment: true },
    { id: 3, label: "Emergency contact numbers posted?" },
    { id: 4, label: "Copy of license and/or notice posted at entrances to facility?" },
    { id: 5, label: "Copy of emergency procedures posted and/or available?" },
  ];
  const OPTIONS = ["Compliant", "Non-Compliant", "N/I", "N/A"];

  const EXPAND_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';

  const W = 344;
  const state = { current: {}, smaller: {}, cards: {} };
  // preserve typed comment text across re-renders
  const commentText = { current: {}, smaller: {}, cards: {} };

  function skeletonBefore() {
    return `<div class="skel">
        <div class="field-label">Title</div>
        <div class="field-sub">Storage location</div>
        <div class="dropdown"><span>Search location…</span><span>⌄</span></div>
      </div>
      <div class="divider"></div>`;
  }
  function skeletonAfter() {
    return `<div class="divider"></div>
      <div class="skel after">
        <div class="field-label">Title</div>
        <div class="field-sub">Check all that apply</div>
        <label class="chk"><span class="box"></span> First Choice</label>
        <label class="chk"><span class="box"></span> Second Choice</label>
        <label class="chk"><span class="box"></span> Third Choice</label>
      </div>`;
  }
  function sectionHeader() {
    return `<p class="section-title">${SECTION_TITLE}</p>
      <p class="section-notes">${SECTION_NOTES.join('<br>')}</p>`;
  }
  function commentBox(key, sid, extraClass) {
    const wrap = document.createElement('div');
    wrap.className = 'inline-comment ' + (extraClass || '');
    const ta = document.createElement('textarea');
    ta.placeholder = COMMENT_PLACEHOLDER;
    ta.value = commentText[key][sid] || '';
    ta.addEventListener('input', () => { commentText[key][sid] = ta.value; });
    const ex = document.createElement('span');
    ex.className = 'expand'; ex.innerHTML = EXPAND_SVG;
    wrap.appendChild(ta); wrap.appendChild(ex);
    return wrap;
  }

  function render() {
    mount('current', renderTable, { variant: 'current', stmtR: 0.32, optR: 0.22, headH: 46 });
    mount('smaller', renderTable, { variant: 'smaller', stmtR: 0.30, optR: 0.21, headH: 46 });
    mount('cards',   renderCards, {});
  }

  function mount(key, fn, cfg) {
    const host = document.getElementById('body-' + key);
    host.innerHTML = skeletonBefore() + sectionHeader() + `<div id="w-${key}"></div>` + skeletonAfter();
    fn(key, document.getElementById('w-' + key), state[key], cfg);
  }

  function renderTable(key, host, answers, cfg) {
    const stmtW = Math.round(W * cfg.stmtR);
    const optW  = Math.round(W * cfg.optR);

    const frame = document.createElement('div');
    frame.className = 'likert-frame ' + cfg.variant;
    const scroll = document.createElement('div');
    scroll.className = 'likert-scroll';
    const grid = document.createElement('div');
    grid.className = 'lgrid';
    grid.style.gridTemplateColumns = `${stmtW}px repeat(${OPTIONS.length}, ${optW}px)`;

    const hs = document.createElement('div');
    hs.className = 'c head-stmt'; hs.style.minHeight = cfg.headH + 'px';
    grid.appendChild(hs);
    OPTIONS.forEach(o => {
      const h = document.createElement('div');
      h.className = 'c head'; h.style.minHeight = cfg.headH + 'px';
      h.textContent = o; grid.appendChild(h);
    });

    STATEMENTS.forEach((s, i) => {
      const alt = i % 2 === 1;
      const answered = !!answers[s.id];
      const showComment = s.comment && answered;
      const last = i === STATEMENTS.length - 1 && !showComment;
      const st = document.createElement('div');
      st.className = 'c stmt' + (alt ? ' alt' : '') + (last ? ' last' : '');
      const lbl = document.createElement('span'); lbl.textContent = s.label; st.appendChild(lbl);
      if (s.tooltip) { const t = document.createElement('span'); t.className = 'help'; t.textContent = 'ⓘ'; st.appendChild(t); }
      grid.appendChild(st);
      OPTIONS.forEach(o => {
        const cell = document.createElement('div');
        cell.className = 'c opt' + (alt ? ' alt' : '') + (last ? ' last' : '');
        const radio = document.createElement('span');
        radio.className = 'radio' + (answers[s.id] === o ? ' checked' : '');
        radio.addEventListener('click', () => {
          if (scroll.dataset.dragged === '1') { scroll.dataset.dragged = ''; return; }
          answers[s.id] = answers[s.id] === o ? null : o; render();
        });
        cell.appendChild(radio); grid.appendChild(cell);
      });
      if (showComment) {
        const crow = document.createElement('div');
        crow.className = 'comment-row';
        crow.appendChild(commentBox(key, s.id));
        grid.appendChild(crow);
      }
    });

    scroll.appendChild(grid);
    frame.appendChild(scroll);
    host.appendChild(frame);

    enableDragScroll(scroll);
    // pin comment rows to the visible width so they never scroll sideways
    const cw = scroll.clientWidth;
    frame.querySelectorAll('.comment-row').forEach(cr => { cr.style.width = cw + 'px'; });
  }

  // Horizontal scroll: mouse drag (desktop) + native touch swipe. Wheel is left
  // to scroll the page — we do NOT hijack it.
  function enableDragScroll(scroll) {
    let down = false, startX = 0, startLeft = 0;
    scroll.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') return;        // touch uses native scrolling
      down = true; startX = e.clientX; startLeft = scroll.scrollLeft;
      scroll.dataset.dragged = '';
      scroll.classList.add('dragging');
    });
    scroll.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 4) { scroll.dataset.dragged = '1'; scroll.scrollLeft = startLeft - dx; }
    });
    const end = () => { down = false; scroll.classList.remove('dragging'); };
    scroll.addEventListener('pointerup', end);
    scroll.addEventListener('pointercancel', end);
    scroll.addEventListener('pointerleave', end);
  }

  function renderCards(key, host, answers) {
    const wrap = document.createElement('div');
    wrap.className = 'cards';
    STATEMENTS.forEach(s => {
      const block = document.createElement('div');
      const stmt = document.createElement('div');
      stmt.className = 'card-stmt';
      const lbl = document.createElement('span'); lbl.textContent = s.label; stmt.appendChild(lbl);
      if (s.tooltip) { const t = document.createElement('span'); t.className = 'help'; t.textContent = 'ⓘ'; stmt.appendChild(t); }
      block.appendChild(stmt);

      const grid = document.createElement('div');
      grid.className = 'opt-grid';
      OPTIONS.forEach(o => {
        const card = document.createElement('button');
        card.className = 'opt-card' + (answers[s.id] === o ? ' selected' : '');
        card.textContent = o;
        card.addEventListener('click', () => { answers[s.id] = answers[s.id] === o ? null : o; render(); });
        grid.appendChild(card);
      });
      block.appendChild(grid);

      if (s.comment && answers[s.id]) {
        block.appendChild(commentBox(key, s.id, 'card-comment'));
      }
      wrap.appendChild(block);
    });
    host.appendChild(wrap);
  }

  render();
</script>
</body>
</html>
