<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKT-17127 — External Signer Support for Forms — Prototype</title>
  <style>
    :root {
      --surface-primary: #0078b3;
      --surface-primary-lightest: #f2fcff;
      --surface-success: #167b00;
      --surface-success-lightest: #fafff2;
      --surface-warning: #a1851f;
      --surface-warning-lightest: #fffcf2;
      --surface-error: #cc2222;
      --surface-error-lightest: #fff2f2;
      --surface-secondary-subtle: #f8f8f9;
      --text-default: #191919;
      --text-secondary: #666666;
      --text-on-surface: #feffff;
      --surface-default: #feffff;
      --stroke-default: #b2b2b3;
      --stroke-default-light: #e2e2e3;
      --stroke-default-dark: #4d4c4c;
      --bis-red: #b81f2d;
      --success-bright: #22a06b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; color: var(--text-default); background: var(--surface-secondary-subtle); line-height: 1.5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    a { color: var(--surface-primary); text-decoration: none; }
    input, select, textarea { font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--stroke-default); border-radius: 4px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--surface-primary); }
    label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
    button { font-family: inherit; cursor: pointer; }

    /* ===== template chrome ===== */
    .topbar { background: var(--surface-default); border-bottom: 1px solid var(--stroke-default-light); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 16px; flex-wrap: wrap; flex-shrink: 0; }
    .topbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .t-ticket { font-size: 16px; font-weight: 600; color: var(--text-default); }
    .t-project { font-size: 14px; color: var(--text-default); }
    .t-date { font-size: 12px; color: var(--text-default); }
    .badge-pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; box-shadow: 0 0 4px rgba(0,0,0,.15); white-space: nowrap; }
    .badge-pill.primary { background: var(--surface-primary-lightest); color: var(--surface-primary); }
    .badge-pill.success { background: var(--surface-success-lightest); color: var(--surface-success); }
    .btn-reset { background: #fff; border: 1px solid var(--stroke-default-dark); border-radius: 4px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .btn-reset:hover { background: #f7f7f7; }

    .page { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 20px 14px; }
    .navrow { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; flex-wrap: wrap; flex-shrink: 0; }

    .seg-control { display: inline-flex; border: 1px solid var(--stroke-default); border-radius: 80px; overflow: hidden; }
    .seg-opt { background: rgba(254,255,255,.75); border: none; border-left: 1px solid var(--stroke-default); padding: 5px 14px; font-size: 13px; color: var(--text-default); }
    .seg-opt:first-child { border-left: none; }
    .seg-opt.active { background: var(--surface-primary-lightest); color: var(--surface-primary); font-weight: 600; }

    .flow-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .flow-tab { padding: 5px 14px; font-size: 14px; font-weight: 600; color: var(--text-secondary); border-radius: 4px; border: 1px solid transparent; cursor: pointer; background: transparent; }
    .flow-tab.active { background: var(--surface-default); border-color: var(--stroke-default-light); color: var(--surface-primary); }
    .flow-badge { background: var(--surface-error); color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10px; margin-left: 5px; }

    .proto-card { background: var(--surface-default); border: 1px solid var(--stroke-default); border-radius: 8px; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; position: relative; }
    .proto-stage { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px 24px; }
    .step-details { background: var(--surface-secondary-subtle); border-top: 1px solid var(--stroke-default-light); padding: 12px 18px 14px; flex-shrink: 0; }
    .sd-title { font-size: 14px; font-weight: 600; color: var(--text-default); margin-bottom: 6px; }
    .sd-list { list-style: disc; padding-left: 18px; font-size: 12px; color: var(--text-default); line-height: 1.65; }
    .sd-list li { margin-bottom: 2px; }

    /* ===== shared bits ===== */
    .ds-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 4px; border: none; font-size: 13px; font-weight: 600; }
    .ds-btn--primary { background: var(--surface-primary); color: #fff; }
    .ds-btn--success { background: var(--surface-success); color: #fff; }
    .ds-btn--ghost { background: #fff; color: var(--text-secondary); border: 1px solid var(--stroke-default); }
    .ds-btn--warning { background: var(--surface-warning); color: #fff; }
    .ds-btn--sm { padding: 4px 10px; font-size: 12px; }
    .ds-btn:disabled { opacity: .45; cursor: not-allowed; }

    .banner-line { display: flex; gap: 10px; align-items: flex-start; border-radius: 6px; padding: 11px 14px; font-size: 12.5px; margin: 12px 0; }
    .banner-line .ico { flex-shrink: 0; font-size: 15px; line-height: 1.3; }
    .bl-warn { background: var(--surface-warning-lightest); border: 1px solid #e8d98a; border-left: 4px solid var(--surface-warning); color: #6b5800; }
    .bl-info { background: var(--surface-primary-lightest); border: 1px solid #b6dcfa; border-left: 4px solid var(--surface-primary); color: #0c5460; }
    .bl-ok { background: var(--surface-success-lightest); border: 1px solid #bfe0b0; border-left: 4px solid var(--surface-success); color: #14520a; }

    .lede { font-size: 12.5px; color: #555; margin-bottom: 14px; }
    .sub-h { font-size: 12px; font-weight: 700; color: #556; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .03em; }

    .fieldrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .fieldrow .full { grid-column: 1 / -1; }
    .field label { display: block; font-size: 11px; color: #667; margin-bottom: 3px; }
    .field input, .field select { width: 100%; }
    .field .msg { font-size: 11px; margin-top: 4px; }
    .field .msg.ok { color: var(--surface-success); }
    .field .msg.err { color: var(--surface-error); }
    input.ok { border-color: var(--surface-success) !important; }
    input.err { border-color: var(--surface-error) !important; }

    .empty { border: 2px dashed var(--stroke-default-light); border-radius: 8px; padding: 40px 24px; text-align: center; color: var(--text-secondary); background: var(--surface-secondary-subtle); }
    .empty .e-title { font-size: 15px; font-weight: 700; color: var(--text-default); margin-bottom: 6px; }
    .empty p { font-size: 12.5px; }

    /* Form Builder panel */
    .fb-wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
    .fb-panel { border: 1px solid var(--stroke-default-light); border-radius: 6px; overflow: hidden; background: #fff; width: 330px; max-width: 100%; }
    .fb-panel__header { background: var(--surface-secondary-subtle); border-bottom: 1px solid var(--stroke-default-light); padding: 8px 12px; font-size: 11px; font-weight: 700; color: #556; text-transform: uppercase; letter-spacing: .04em; }
    .fb-panel__body { padding: 14px; }
    .fb-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #333; margin-bottom: 9px; }
    .fb-options-row { display: flex; gap: 8px; align-items: center; }
    .fb-options-row input { flex: 1; }
    .fb-icon-btn { width: 32px; height: 32px; flex-shrink: 0; border: 1px solid var(--stroke-default); border-radius: 4px; background: #fff; color: var(--surface-primary); display: flex; align-items: center; justify-content: center; font-size: 14px; }

    /* live BIS form */
    .eu-frame { border: 1px solid var(--stroke-default-light); border-radius: 6px; overflow: hidden; }
    .eu-body { padding: 18px; background: #fff; }
    .eu-title { font-size: 20px; font-weight: 700; color: #222; }
    .eu-subtitle { font-size: 12.5px; color: #8a6d9e; margin: 2px 0 12px; }
    .eu-divider { border-top: 2px solid #333; margin-bottom: 14px; }
    .eu-group { margin-bottom: 16px; }
    .eu-group .lbl { font-size: 14px; font-weight: 700; color: #333; }
    .eu-group .req { color: var(--surface-error); }
    .eu-group .hint { font-size: 11.5px; color: #667; margin-bottom: 7px; }
    .eu-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; margin-bottom: 5px; }
    .eu-sig-block { background: #f2fbfd; border-radius: 4px; padding: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
    .eu-sig-canvas { flex: 1; min-width: 190px; border: 1px dashed #bbb; border-radius: 3px; background: #fff; min-height: 118px; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 26px; }
    .eu-sig-canvas.signed { font-family: "Brush Script MT", cursive; font-size: 32px; color: #35507a; border-style: solid; border-color: #dfe6ea; }
    .eu-sig-side { width: 190px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .eu-sig-side input { border: 1px solid var(--stroke-default-light); border-radius: 3px; padding: 7px 9px; font-size: 12.5px; background: #f3f3f3; color: #555; width: 100%; }
    .eu-bottombar { background: #1a1a1a; color: #fff; display: flex; align-items: center; gap: 16px; padding: 9px 14px; font-size: 11.5px; flex-wrap: wrap; }
    .eu-bottombar .meta { color: #bbb; }
    .eu-bottombar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

    /* email */
    .email { border: 1px solid #e2e6ea; border-radius: 8px; overflow: hidden; max-width: 760px; }
    .email .eh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #eef0f2; background: #fafcfe; }
    .email .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bis-red); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
    .email .subj { font-weight: 600; font-size: 13px; } .email .to { font-size: 11px; color: #889; }
    .email .when { margin-left: auto; font-size: 11px; color: #99a; }
    .email .eb { padding: 13px; font-size: 12.5px; color: #333; }
    .email .efoot { border-top: 1px solid var(--stroke-default); margin-top: 16px; padding: 12px 0 0; font-size: 11.5px; }
    .email .efoot p { margin-bottom: 2px; }
    .email .efoot .link { color: var(--surface-primary); font-weight: 600; }

    /* ===== EXTERNAL SIGNER — WEB CHROME ===== */
    .ext-frame { border: 1px solid var(--stroke-default-light); border-radius: 6px; overflow: hidden; background: #fff; }
    .client-bar { background: #fff; padding: 10px 16px; display: flex; align-items: center; border-bottom: 1px solid #f0f0f0; }
    .client-logo { display: flex; align-items: center; gap: 7px; }
    .client-logo .leaf { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #4aa63c; display: flex; align-items: center; justify-content: center; color: #4aa63c; font-size: 13px; }
    .client-logo .nm { line-height: 1; }
    .client-logo .nm b { font-size: 15px; letter-spacing: -.3px; color: #111; display: block; }
    .client-logo .nm small { font-size: 8.5px; letter-spacing: 1.6px; color: #444; }
    .ext-bar { background: var(--surface-primary); color: #fff; padding: 11px 16px; display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; }
    .ext-bar .back { margin-left: auto; border: 1px solid #fff; background: transparent; color: #fff; border-radius: 4px; padding: 3px 11px; font-size: 12.5px; font-weight: 600; }
    .ext-stage { background: #fff; padding: 26px 18px 34px; display: flex; justify-content: center; }

    .ext-card { background: #fff; border: 1px solid #eceff1; border-radius: 3px; box-shadow: 0 1px 5px rgba(0,0,0,.10); overflow: hidden; width: 100%; }
    .ext-card.narrow { max-width: 420px; }
    .ext-card.wide { max-width: 660px; }
    .ext-card__accent { height: 4px; background: var(--surface-primary); }
    .ext-card__body { padding: 22px 20px; }
    .ext-h { font-size: 17px; font-weight: 700; color: #111; }
    .ext-sub { font-size: 12.5px; color: #333; margin: 6px 0 16px; }
    .ext-label { font-size: 12px; font-weight: 600; color: #111; margin-bottom: 4px; display: block; }
    .ext-input { width: 100%; border: 1px solid #b9c2c8; border-radius: 2px; padding: 8px 9px; font-size: 12.5px; font-family: inherit; background: #fff; }
    .ext-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #111; margin: 14px 0; cursor: pointer; }
    .ext-check.off { color: #a9b2b8; cursor: not-allowed; }
    .ext-check input { width: 15px; height: 15px; }
    .ext-btn-full { width: 100%; border: none; border-radius: 3px; background: var(--surface-primary); color: #fff; font-size: 13.5px; font-weight: 600; padding: 9px; font-family: inherit; }
    .ext-btn-full:disabled { background: #9dcbe2; cursor: not-allowed; }
    .ext-info { display: flex; align-items: center; gap: 9px; background: #f2fafd; border-radius: 3px; padding: 9px 11px; font-size: 12px; color: #333; margin-top: 12px; }
    .ext-info .i { width: 15px; height: 15px; border-radius: 50%; background: var(--surface-primary); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; }
    .ext-intro { font-size: 12.5px; color: #111; margin-bottom: 13px; }

    .doc-row { display: flex; align-items: center; gap: 10px; border: 1px solid #d7dde1; border-radius: 3px; padding: 11px 12px; }
    .doc-row .nm { flex: 1; font-size: 14px; font-weight: 600; color: #111; }
    .doc-row .state-i { width: 16px; height: 16px; border-radius: 50%; border: 1.4px solid #8d979d; color: #8d979d; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; }
    .doc-row .state-i.done { border-color: var(--surface-success); color: var(--surface-success); }
    .doc-row .view { border-radius: 3px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--surface-primary); background: var(--surface-primary); color: #fff; }
    .doc-row .view.seen { background: #fff; color: #111; border-color: #b9c2c8; }

    .sig-head { display: flex; align-items: baseline; justify-content: space-between; margin: 16px 0 5px; }
    .sig-head .lb { font-size: 12.5px; font-weight: 600; color: #111; }
    .sig-head .lb .req { color: var(--surface-error); }
    .sig-head .clear { font-size: 12.5px; color: var(--surface-primary); font-weight: 600; cursor: pointer; }
    .sig-head.off .lb { color: #a9b2b8; } .sig-head.off .lb .req { color: #d8a3a3; }
    .sig-head.off .clear { color: #c3d3dc; cursor: default; }

    .sig-canvas { border: 1px solid #d7dde1; border-radius: 3px; background: #fdfeff; height: 118px; position: relative; }
    .sig-canvas .guide { position: absolute; left: 12%; right: 12%; bottom: 26px; border-top: 1.5px dashed #d3dbe0; }
    .sig-canvas.on { background: #eef8fc; cursor: crosshair; }
    .sig-canvas.on .guide { border-color: #b9ccd6; }
    .sig-canvas .ink { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Brush Script MT", cursive; font-size: 38px; color: #111; }
    .sig-canvas .tap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #7ba7bd; }
    .sig-tools { display: flex; align-items: center; gap: 9px; margin-top: 9px; font-size: 11.5px; color: #8d979d; }
    .sig-tools.on { color: #333; }
    .sig-tools .upload { border: 1px solid #cdd5da; background: #fff; border-radius: 3px; padding: 4px 11px; font-size: 12px; color: #a9b2b8; }
    .sig-tools.on .upload { color: #111; border-color: #9aa4ab; }
    .sig-submit { display: flex; justify-content: flex-end; margin-top: 16px; }
    .sig-submit button { border: none; border-radius: 3px; padding: 7px 18px; font-size: 13px; font-weight: 600; color: #fff; background: #9dcbe2; cursor: not-allowed; }
    .sig-submit button.on { background: var(--surface-primary); cursor: pointer; }

    /* success */
    .succ-card { background: #fff; border: 1px solid #eceff1; border-radius: 5px; box-shadow: 0 1px 5px rgba(0,0,0,.10); padding: 28px 26px; max-width: 430px; text-align: center; }
    .succ-ring { width: 62px; height: 62px; border-radius: 50%; border: 2.5px solid var(--success-bright); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .succ-h { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 8px; }
    .succ-b { font-size: 12.5px; color: #222; line-height: 1.6; }

    /* PDF overlay */
    .pdf-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 18px; }
    .pdf-win { background: #eceff1; border-radius: 6px; width: 640px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.3); }
    .pdf-bar { background: var(--surface-primary); color: #fff; display: flex; align-items: center; gap: 10px; padding: 9px 13px; font-size: 13px; font-weight: 600; }
    .pdf-bar .sp { flex: 1; }
    .pdf-bar button { background: #fff; color: var(--surface-primary); border: none; border-radius: 3px; padding: 4px 11px; font-size: 12px; font-weight: 600; }
    .pdf-bar .x { background: transparent; color: #fff; border: 1px solid #fff; }
    .pdf-body { flex: 1; overflow-y: auto; padding: 16px; }
    .pdf-page { background: #fff; border-radius: 3px; padding: 18px; box-shadow: 0 1px 5px rgba(0,0,0,.15); }
    .pdf-page .t { font-size: 17px; font-weight: 700; color: #111; }
    .pdf-page .s { font-size: 11px; color: #8a6d9e; margin-bottom: 10px; }
    .pdf-page .hr { border-top: 2px solid #333; margin-bottom: 12px; }
    .pdf-page .lbl { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
    .pdf-page .opt { font-size: 12px; color: #333; margin-bottom: 3px; }
    .pdf-page .sigbox { border: 1px solid #e2e6e9; border-radius: 3px; height: 62px; margin-top: 8px; background: #fbfdfe; }

    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .ds-modal { background: #fff; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.2); width: 480px; max-width: 92vw; overflow: hidden; }
    .ds-modal__header { display: flex; align-items: center; gap: 8px; padding: 16px 16px 6px; }
    .ds-modal__title { font-size: 18px; font-weight: 600; }
    .ds-modal__body { padding: 12px 16px 16px; font-size: 14px; }
    .ds-modal__footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; }

    @media (max-width: 720px) { .fieldrow { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="t-ticket">TKT-17127</span>
      <span class="t-project">External Signer Support for Forms</span>
      <span class="badge-pill primary">Prototype - v4</span>
      <span class="t-date">July 24, 2026 Generated</span>
    </div>
    <button class="btn-reset" onclick="resetAll()">↺ Reset Prototype</button>
  </div>

  <div class="page">
    <div class="navrow">
      <div class="seg-control" id="segControl">
        <button class="seg-opt active" id="segA" onclick="switchPersp('admin')">Admin</button>
        <button class="seg-opt" id="segB" onclick="switchPersp('signer')">External Signer</button>
      </div>
      <div class="flow-tabs" id="flowTabs"></div>
    </div>

    <div class="proto-card">
      <div class="proto-stage" id="stage"></div>
      <div id="pdfRoot"></div>
      <div class="step-details">
        <p class="sd-title" id="sdTitle"></p>
        <ul class="sd-list" id="sdList"></ul>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>

<script>
/* ================= FLOWS ================= */
var FLOWS = {
  admin: [
    { id:'setup', label:'Form Setup' },
    { id:'fill',  label:'Fill Out & Send' },
    { id:'done',  label:'Completed Form' }
  ],
  signer: [
    { id:'email',    label:'Email' },
    { id:'identity', label:'Identity' },
    { id:'sign',     label:'Review & Sign' },
    { id:'submitted',label:'Submitted' }
  ]
};

var FORM_NAME = 'Mika - Multi Signature';
var DOC_NAME  = "Mika's Multi Signature Form";
var SENDER    = 'Miku Hatsune';
var TODAY     = '20-Jul-2026';
var EMAIL_RE  = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function initialState(){
  return {
    persp: 'admin',
    adminScreen: 'setup',
    signerScreen: 'email',
    category: 'external',
    choices: [true,false,false],
    extEmail: '',
    confirmOpen: false,
    sent: false,
    identity: { first:'', last:'', privacy:false, email:'' },
    identityDone: false,
    // review & sign gate
    viewed: false,
    pdfOpen: false,
    reviewed: false,
    inked: false,
    submitted: false
  };
}
var st = initialState();

function switchPersp(p){ st.persp = p; render(); }
function selectFlow(id){ if(st.persp==='admin') st.adminScreen = id; else st.signerScreen = id; render(); }
function resetAll(){ st = initialState(); render(); }
function activeFlowId(){ return st.persp==='admin' ? st.adminScreen : st.signerScreen; }

function renderFlowTabs(){
  var list = FLOWS[st.persp], active = activeFlowId();
  document.getElementById('flowTabs').innerHTML = list.map(function(f){
    var badge = '';
    if(f.id==='sign' && st.sent && !st.submitted) badge = '<span class="flow-badge">1</span>';
    if(f.id==='done' && st.submitted) badge = '<span class="flow-badge" style="background:var(--surface-success)">✓</span>';
    return '<button class="flow-tab '+(f.id===active?'active':'')+'" onclick="selectFlow(\''+f.id+'\')">'+f.label+badge+'</button>';
  }).join('');
}

/* ================= actions ================= */
function setCategory(v){ st.category = v; render(); }
function toggleChoice(i){ st.choices[i] = !st.choices[i]; render(); }
function setExtEmail(v){ st.extEmail = v; renderInline(); }
function gotoFill(){ st.adminScreen = 'fill'; render(); }

function trySubmitForm(){
  if(st.category==='external' && !EMAIL_RE.test(st.extEmail.trim())) return;
  st.confirmOpen = true; render();
}
function cancelConfirm(){ st.confirmOpen = false; render(); }
function confirmSend(){ st.confirmOpen = false; st.sent = true; render(); }

function setIdField(k,v){ st.identity[k] = v; renderInline(); }
function togglePrivacy(){ st.identity.privacy = !st.identity.privacy; render(); }
function identityValid(){
  var i = st.identity;
  return !!(i.first.trim() && i.last.trim() && EMAIL_RE.test(i.email.trim()) && i.privacy);
}
function continueIdentity(){ if(!identityValid()) return; st.identityDone = true; st.signerScreen='sign'; render(); }
function openEmailLink(){ st.signerScreen = 'identity'; render(); }
function backToIdentity(){ st.signerScreen = 'identity'; render(); }

/* the gate */
function openPdf(){ st.pdfOpen = true; render(); }
function closePdf(){ st.pdfOpen = false; st.viewed = true; render(); }
function toggleReviewed(){ if(!st.viewed) return; st.reviewed = !st.reviewed; if(!st.reviewed) st.inked = false; render(); }
function inkSignature(){ if(!st.reviewed || st.inked) return; st.inked = true; render(); }
function clearSignature(){ if(!st.reviewed) return; st.inked = false; render(); }
function submitSignature(){ if(!(st.viewed && st.reviewed && st.inked)) return; st.submitted = true; st.signerScreen='submitted'; render(); }

function signerFullName(){ return (st.identity.first.trim()+' '+st.identity.last.trim()).trim() || 'Jane Doe'; }
function firstName(){ return st.identity.first.trim() || 'Jane'; }

function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function clientBar(){
  return '<div class="client-bar"><div class="client-logo">'

         + '<span class="ds-modal__title">Confirm external send</span>'
       + '</div>'
       + '<div class="ds-modal__body">You\'re sending this form outside the BIS system to <b>'+esc(st.extEmail)+'</b>, who is not a BIS account holder. BIS is not responsible for misdelivery, and this cannot be reversed once they sign.</div>'
       + '<div class="ds-modal__footer">'
         + '<button class="ds-btn ds-btn--ghost" onclick="cancelConfirm()">Cancel</button>'
         + '<button class="ds-btn ds-btn--warning" onclick="confirmSend()">Confirm &amp; Send</button>'
       + '</div>'
     + '</div>'
   + '</div>';
}

/* ================= render ================= */
function renderInline(){
  var box = document.getElementById('emailMsg');
  if(box){
    var v = emailValidityMarkup();
    box.innerHTML = v.msg;
    var inp = box.parentElement.querySelector('input');
    if(inp){ inp.classList.remove('ok','err'); if(v.cls) inp.classList.add(v.cls); }
  }
  var sb = document.querySelector('.eu-bottombar .ds-btn--success');
  if(sb && !st.sent) sb.disabled = !(st.category!=='external' || EMAIL_RE.test(st.extEmail.trim()));
  var cb = document.querySelector('.ext-btn-full');
  if(cb) cb.disabled = !identityValid();
}

var lastViewKey = '';
function render(){
  document.getElementById('segA').classList.toggle('active', st.persp==='admin');
  document.getElementById('segB').classList.toggle('active', st.persp==='signer');
  renderFlowTabs();
  var d = stepDetails();
  document.getElementById('sdTitle').innerHTML = d.title;
  document.getElementById('sdList').innerHTML = d.bullets.map(function(b){ return '<li>'+b+'</li>'; }).join('');
  document.getElementById('stage').innerHTML = renderScreen();
  renderPdf();
  renderModal();
  var key = st.persp+'|'+activeFlowId()+'|'+(st.sent?'s':'')+(st.submitted?'d':'');
  if(key !== lastViewKey){ var ps = document.querySelector('.proto-stage'); if(ps) ps.scrollTop = 0; lastViewKey = key; }
}

render();
</script>
</body>
</html>
