    const pr=ph.getBoundingClientRect(), r=el.getBoundingClientRect(); let x=r.left-pr.left+r.width/2-tip.offsetWidth/2, y=r.top-pr.top-tip.offsetHeight-6;
    x=Math.max(8,Math.min(x,pr.width-tip.offsetWidth-28)); if(y<8) y=r.bottom-pr.top+6; tip.style.left=x+'px'; tip.style.top=y+'px'; }
  function hide(){ if(tip){tip.remove(); tip=null;} }
  ph.addEventListener('pointerdown',e=>{ const el=e.target.closest('[data-tip]'); clearTimeout(t); if(el&&e.pointerType!=='mouse') t=setTimeout(()=>{show(el); setTimeout(hide,1800);},450); });
  ph.addEventListener('pointerup',()=>clearTimeout(t));
  ph.addEventListener('mouseover',e=>{ const el=e.target.closest('[data-tip]'); clearTimeout(t); if(el) t=setTimeout(()=>show(el),380); else hide(); });
  ph.addEventListener('mouseleave',()=>{clearTimeout(t);hide();});
  ph.addEventListener('click',()=>{clearTimeout(t);hide();});
})();

try{ const q=new URLSearchParams(location.search); const t=+q.get('ticket'); if(TKV_INFO[t]) TKV.cur=t; if(+q.get('note')) TKV.note=+q.get('note');
  const h=new URLSearchParams(location.hash.slice(1)); if(h.get('asg')) TKV.asg=h.get('asg'); }catch(e){}
(function tkvCss(){ if(document.getElementById('tkv-css')) return; const st=document.createElement('style'); st.id='tkv-css'; st.textContent=`
html[data-tkv] .tkv-hit{outline:2px dashed var(--tkv-c)!important;outline-offset:-2px!important}
#tkv-layer{position:fixed;inset:0;pointer-events:none;z-index:70}
.tkv-tag{position:fixed;display:flex;gap:2px;font:600 10px/14px "Segoe UI",system-ui,-apple-system,sans-serif;white-space:nowrap;pointer-events:none}
.tkv-tag b{padding:0 5px;border-radius:3px;color:#fff;background:var(--c);box-shadow:0 0 0 1px #fff}
.tkv-tag i{font-style:normal;padding:0 4px;border-radius:3px;background:#fff;color:#19191a;border:1px solid var(--c);pointer-events:auto;cursor:pointer}
.tkv-pick{position:relative;display:inline-flex}
.tkv-pick>.rv-btn{display:inline-flex;align-items:center;gap:6px}
.tkv-dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tkv-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:#fff;border:1px solid #dfdfe2;border-radius:8px;box-shadow:0 0 8px #00000026;width:360px;padding:6px;max-height:75vh;overflow:auto;text-align:left}
.tkv-menu button,.tkv-menu a{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:6px 8px;border:0;background:none;border-radius:6px;font:inherit;color:#19191a;cursor:pointer;text-decoration:none}
.tkv-menu button:hover,.tkv-menu a:hover{background:#f2f2f2}
.tkv-menu .on{background:#eef6fb;font-weight:600}
.tkv-menu small{color:#636368;margin-left:auto;white-space:nowrap}
.tkv-menu hr{border:0;border-top:1px solid #dfdfe2;margin:4px 0}
#tkv-ban:empty{display:none}
#tkv-ban{position:relative;z-index:49;background:#fff;border-bottom:1px solid #dfdfe2}
.tkv-ban .tkv-menu{left:0;right:auto}
.tkv-ban>.tkv-pick>.rv-btn{font:600 13px/20px var(--font-family-default);padding:2px 8px;border:1px solid #afafb5;border-radius:4px;background:#fff;color:#19191a;cursor:pointer;align-self:center}
.tkv-ban{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;padding:6px 16px 7px;border-top:1px solid #dfdfe2;border-left:5px solid var(--c);background:#fafafc;font-size:13px;line-height:19px}
.tkv-ban .tkv-id{font-weight:700;color:var(--c)}
.tkv-ban .tkv-st{color:#636368;font-size:12px}
.tkv-ban .tkv-sum{color:#4c4c4f}
.tkv-ban .tkv-scr{flex-basis:100%;color:#636368}
.tkv-ban .tkv-scr a{color:#0078b3;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.tkv-ban .tkv-n{color:#636368;font-size:12px}
.tkv-ban .tkv-x{margin-left:auto;display:flex;gap:6px;align-items:center}
.tkv-ban .tkv-x a,.tkv-ban .tkv-x button{font:inherit;font-size:12px;color:#0078b3;background:none;border:1px solid #dfdfe2;border-radius:4px;padding:0 8px;cursor:pointer;text-decoration:none;line-height:20px}
.tkv-rules{flex-basis:100%;margin:4px 0 2px;padding:0 0 0 18px;color:#19191a}
.tkv-rules q{quotes:none}
.tkv-rules .s{color:#636368}
`; document.head.appendChild(st); })();
const tkvL=t=>{ const x=TKV_INFO[t]; return x?x.ref:''; };
const tkvTxt=el=>((el&&(el.innerText||el.textContent))||'').replace(/\s+/g,' ').trim().toLowerCase().replace(/[‘’]/g,"'");
function tkvPass(el,f){
  if(!f) return true; f=f.toLowerCase();
  let m=f.match(/^([^@~=^<][^@~]*?)@(.*)$/); if(m){ const c=el.querySelector(m[1]); return !!c&&tkvTxt(c).startsWith(m[2]); }
  m=f.match(/^([^@~=^<][^@~]*?)~(.*)$/); if(m){ const c=el.querySelector(m[1]); return !!c&&new RegExp(m[2],'i').test(tkvTxt(c)); }
  const t=tkvTxt(el);
  if(f[0]==='=') return t===f.slice(1);
  if(f[0]==='^') return t.startsWith(f.slice(1));
  if(f[0]==='~') return new RegExp(f.slice(1),'i').test(t);
  if(f[0]==='<'){ const p=el.previousElementSibling; return !!p&&tkvTxt(p).includes(f.slice(1)); }
  return t.includes(f);
}
/* where am I? e.g. "supervisor site:people", "worker field-worker", "supervisor attendance sheet:away", "supervisor more nofm" */
function tkvWhere(){ return S.role+' '+K+(K==='site'?':'+S.siteTab:'')+(S.sheet?' sheet:'+S.sheet.type:'')+(S.fm?'':' nofm'); }
const TKV_RE=TKV_MAP.map(r=>r[0]?new RegExp(r[0],'i'):null);
function tkvApply(){
  TKV.raf=0;
  document.querySelectorAll('[data-tkm]').forEach(el=>{ el.removeAttribute('data-tk'); el.removeAttribute('data-tkm'); el.removeAttribute('data-tk-nt'); el.classList.remove('tkv-hit'); });
  const where=tkvWhere(), acc=new Map();
  TKV_MAP.forEach((r,i)=>{
    if(TKV_RE[i]&&!TKV_RE[i].test(where)) return;
    let els; try{ els=document.querySelectorAll(r[1]); }catch(e){ return; }
    els.forEach(el=>{ if(!tkvPass(el,r[3])) return; let o=acc.get(el); if(!o){o={t:new Set(),nt:true}; acc.set(el,o);} r[2].split(' ').forEach(t=>o.t.add(t)); if(!r[4]) o.nt=false; });
  });
  let hits=0; const cur=TKV.cur?String(TKV.cur):null;
  acc.forEach((o,el)=>{ const ts=[...o.t].sort((a,b)=>TKV_ORDER.indexOf(+a)-TKV_ORDER.indexOf(+b));
    el.setAttribute('data-tk',ts.join(' ')); el.setAttribute('data-tkm','1'); if(o.nt) el.setAttribute('data-tk-nt','1');
    if(cur&&o.t.has(cur)){ el.classList.add('tkv-hit'); hits++; } });
  TKV.hits=hits; const n=document.getElementById('tkv-n'); if(n) n.textContent=tkvCount();
  tkvDraw();
  const key=TKV_KEY(); if(TKV.cur&&key!==TKV.seen){ TKV.seen=key; clearTimeout(TKV.st); TKV.st=setTimeout(tkvReveal,700); }
}
/* a new screen with nothing outlined in view: bring the first outlined element into view (once per screen) */
function tkvReveal(){ if(!TKV.cur||!TKV.hits) return; const els=[...document.querySelectorAll(TKV_PAGE.split(',').map(x=>x.trim()+' .tkv-hit').join(','))].filter(e=>e.getBoundingClientRect().width>0), H=window.innerHeight;
  if(!els.length||els.some(e=>{ const r=e.getBoundingClientRect(); return r.bottom>90&&r.top<H-40; })) return; els[0].scrollIntoView({block:'center'}); tkvDraw(); }
const tkvCount=()=>TKV.hits?TKV.hits+' outlined on this screen':'Nothing from this ticket on this screen';
function tkvSchedule(){ if(!TKV.raf) TKV.raf=requestAnimationFrame(tkvApply); }
function tkvScheduleDraw(){ if(TKV.draw) return; TKV.draw=requestAnimationFrame(()=>{TKV.draw=0; tkvDraw();}); }
function tkvDraw(){
  let L=document.getElementById('tkv-layer'); if(!L){ L=document.createElement('div'); L.id='tkv-layer'; document.body.appendChild(L); }
  const cur=TKV.cur; if(!cur){ L.innerHTML=''; document.documentElement.removeAttribute('data-tkv'); return; }
  document.documentElement.setAttribute('data-tkv',String(cur)); document.documentElement.style.setProperty('--tkv-c',TKV_INFO[cur].c);
  const cover=[L,document.getElementById('pins'),document.getElementById('tip'),...document.querySelectorAll('.pinlayer')].filter(Boolean);
  cover.forEach(c=>c.style.visibility='hidden'); const placed=[]; let h='', n=0, inPage=0;
  const W=document.documentElement.clientWidth, H=window.innerHeight;
  document.querySelectorAll('.tkv-hit').forEach(el=>{
    if(n>=60||el.hasAttribute('data-tk-nt')) return;
    const up=el.parentElement&&el.parentElement.closest('.tkv-hit'); if(up&&up.getAttribute('data-tk')===el.getAttribute('data-tk')) return;
    const r=el.getBoundingClientRect(); if(r.width<4||r.height<4||r.bottom<0||r.top>H||r.right<0||r.left>W) return;
    const x=Math.max(2,Math.min(r.left+3,W-60)), y=Math.max(2,r.top-7); /* straddles the top edge, so it covers little content */
    const hit=document.elementFromPoint(Math.min(r.left+12,r.right-2),Math.min(Math.max(r.top,0)+10,r.bottom-2)); /* inside rounded corners */ if(!hit||!(el===hit||el.contains(hit)||hit.contains(el))) return;
    let px=x; placed.forEach(p=>{ if(Math.abs(p.y-y)<15&&px<p.x+p.w&&px+60>p.x) px=p.x+p.w+2; });
    const ts=el.getAttribute('data-tk').split(' '), others=ts.filter(t=>t!==String(cur));
    const txt=`<b style="--c:${TKV_INFO[cur].c}" title="#${cur} ${esc(TKV_INFO[cur].title)}">${tkvL(cur)} · ${cur}</b>`+others.map(t=>`<i style="--c:${TKV_INFO[t].c}" title="Also #${t} ${esc(TKV_INFO[t].title)}: click to see that ticket" onclick="tkvSet(${t})">${tkvL(t)}</i>`).join('');
    const w=40+others.length*34+String(tkvL(cur)).length*6; placed.push({x:px,y,w});
    h+=`<span class="tkv-tag" style="left:${px}px;top:${y}px">${txt}</span>`; n++; if(el.closest(TKV_PAGE)) inPage++;
  });
  L.innerHTML=h; cover.forEach(c=>c.style.visibility=''); TKV.inPage=inPage;
}
const tkvWebUrl=(t,w,pin)=>'field-management-mvp-web-v3.html?ticket='+t+(pin?'&pin='+encodeURIComponent(pin):'')+w;
function tkvBanner(){
  const t=TKV.cur, x=TKV_INFO[t]; if(!x) return '';
  const a=s=>s.m?`<a role="link" tabindex="0" onclick="tkvGo('${s.m}')">${esc(s.l)}</a>`:`<a href="${tkvWebUrl(t,s.w)}" target="_blank" rel="noopener">Web: ${esc(s.l)} ↗</a>`;
  const mob=x.mob.map(a).join(' · '), web=x.web.map(a).join(' · ');
  const rules=x.rules?`<button onclick="TKV.rules=!TKV.rules;tkvBan()" aria-expanded="${TKV.rules}">${TKV.rules?'Hide':'Show'} the ${x.rules.length} cross-ticket rules</button>`:'';
  const list=x.rules&&TKV.rules?`<ol class="tkv-rules">${x.rules.map(r=>`<li><b>${esc(r.r)}</b> <q>${esc(r.d)}</q> <span class="s">· Shown on: ${r.s.map(a).join(', ')}</span></li>`).join('')}</ol>`:'';
  return `<div class="tkv-ban" style="--c:${x.c}" role="region" aria-label="Ticket view: #${t}">
    <div class="tkv-pick">${tkvPicker()}</div><span class="tkv-id">#${t} ${esc(x.ref)} · ${esc(x.title)}</span><span class="tkv-st">${esc(x.status)} · ${esc(x.mvp)}</span>
    <span class="tkv-sum">“${esc(x.sum)}”</span><span class="tkv-n" id="tkv-n">${tkvCount()}</span>
    <span class="tkv-x">${rules}<a href="field-management-ticket-map-v3.html#t${t}" target="_blank" rel="noopener">Ticket map ↗</a><button onclick="tkvSet(null)">Off</button></span>
    <span class="tkv-scr"><b>Screens in this ticket:</b> ${mob||'none in the app'}${web?' · '+web:''}</span>${list}</div>`;
}
function tkvPicker(){
  const t=TKV.cur, x=TKV_INFO[t];
  const items=TKV_ORDER.map(n=>{ const y=TKV_INFO[n]; return `<button class="${n===t?'on':''}" onclick="tkvSet(${n})"><span class="tkv-dot" style="background:${y.c}"></span>#${n} · ${esc(y.ref)} ${esc(y.title)}<small>${esc(y.mvp==='Not MVP'?'Not MVP':y.status)}</small></button>`; }).join('');
  const menu=TKV.menu?`<div class="tkv-menu" role="menu"><button class="${t?'':'on'}" onclick="tkvSet(null)">Off: normal view</button><hr>${items}<hr><a href="field-management-ticket-map-v3.html" target="_blank" rel="noopener">Open the ticket map ↗</a></div>`:'';
  return `<button class="rv-btn" aria-haspopup="menu" aria-expanded="${TKV.menu}" onclick="TKV.menu=!TKV.menu;tkvBan()" title="Highlight what one BIS PM ticket owns">${x?`<span class="tkv-dot" style="background:${x.c}"></span>#${t}`:'Ticket'} ▾</button>${menu}`;
}
/* the picker and the banner live in the review bar (static HTML), so they are drawn here, not by render() */
function tkvBan(){
  const rb=document.getElementById('rbar'); if(!rb) return;
  /* the picker: a "Ticket" select in the review bar's More ▾ menu (the bar is tuned to fit one row at 1280px) */
  const mn=document.getElementById('rbMenu'); let f=document.getElementById('tkv-mf');
  if(mn&&!f){ f=document.createElement('div'); f.id='tkv-mf'; f.className='rv-f'; const sep=mn.querySelector('.rv-sep'); mn.insertBefore(f,sep||null); }
  if(f) f.innerHTML='<label class="rv-lb" for="tkvSel" title="Highlight what one BIS PM ticket owns">Ticket</label><span class="rv-sel"><select id="tkvSel" onchange="rbMore(false);tkvSet(this.value?+this.value:null)"><option value="">Off</option>'+TKV_ORDER.map(n=>'<option value="'+n+'"'+(n===TKV.cur?' selected':'')+'>#'+n+' '+esc(TKV_INFO[n].ref)+' '+esc(TKV_INFO[n].title)+'</option>').join('')+'</select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></span>';
  /* the banner sits right under the review bar; it carries its own Ticket ▾ picker to switch */
  let b=document.getElementById('tkv-ban'); if(!b){ b=document.createElement('div'); b.id='tkv-ban'; rb.parentNode.insertBefore(b,rb.nextSibling); }
  b.innerHTML=TKV.cur?tkvBanner():'';
}
function tkvSet(t){
  TKV.cur=t&&TKV_INFO[t]?+t:null; TKV.menu=false; TKV.rules=false;
  try{ const q=new URLSearchParams(location.search); if(TKV.cur) q.set('ticket',TKV.cur); else q.delete('ticket'); q.delete('note'); const s=q.toString(); history.replaceState(history.state,'',location.pathname+(s?'?'+s:'')+location.hash); }catch(e){}
  tkvBan(); tkvApply();
}
/* a screen link: the same deep link the review uses (#role=…&tab=…&go=…&sub=…&mode=…&sheet=…&fm=0&asg=…), applied without a reload */
function tkvGo(m){
  const h=new URLSearchParams(m);
  S.stack=[]; S.sheet=null; S.asg=null; S.sel={}; S.fabOpen=false; S.day=0; S.siteTab='overview'; S.attMode='check'; S.emptyFor={}; S.loading=false; S.fm=true;
  if(h.get('role')) S.role=h.get('role'); S.tab=h.get('tab')||'home';
  if(h.get('fm')==='0'){ S.fm=false; if(S.tab==='field') S.tab='more'; }
  if(h.get('mode')) S.attMode=h.get('mode'); if(h.get('sub')) S.siteTab=h.get('sub');
  (h.get('go')||'').split(',').filter(Boolean).forEach(x=>{ const [s,id,pid,mode]=x.split(':'); S.stack.push({s,id,pid,mode}); });
  if(h.get('sheet')){ const [type,id,pid]=h.get('sheet').split(':'); S.sheet={type,id,pid,pids:[pid]}; }
  if(cur().s==='sign'){ S.ink=false; S.signConfirm=false; }
  try{ history.replaceState(history.state,'',location.pathname+location.search+'#'+m); }catch(e){}
  render(true); if(h.get('asg')) openAssign(h.get('asg'));
  document.getElementById('phone').scrollIntoView({block:'nearest'});
}
const _tkv_render=render;
render=function(){ const o=_tkv_render.apply(this,arguments); tkvSchedule(); return o; };
document.addEventListener('click',e=>{ if(TKV.menu&&!e.target.closest('.tkv-pick')){ TKV.menu=false; tkvBan(); } },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&TKV.menu){ TKV.menu=false; tkvBan(); } });
window.addEventListener('scroll',tkvScheduleDraw,{passive:true,capture:true});
window.addEventListener('resize',tkvScheduleDraw);
try{ const ph=document.getElementById('phone'); if(ph) new MutationObserver(tkvSchedule).observe(ph,{childList:true,subtree:true}); }catch(e){}
/* ?note=<n>: open that note and pulse its pin (ticket-map.html links each open question to it) */
function tkvOpenNote(){
  const n=TKV.note; TKV.note=null; if(!n) return;
  S.pins=true; S.notes=true; S.hl=n; S.pulse=n; render();
  const a=document.querySelector('#phone .pa[data-pin="'+n+'"]'), nc=document.querySelector('#phone .content');
  if(a&&nc&&nc.contains(a)){ const r=a.getBoundingClientRect(), cr=nc.getBoundingClientRect(); if(r.top<cr.top+30||r.top>cr.bottom-90) nc.scrollTop+=r.top-cr.top-140; }
  placePins(); focusNote(n); setTimeout(()=>{ S.pulse=null; placePins(); },4600);
}
tkvBan();
if(TKV.asg){ const a=TKV.asg; TKV.asg=null; try{ openAssign(a); }catch(e){} }
render();
if(TKV.note) setTimeout(tkvOpenNote,150);
/* ==== 13q TICKET VIEW END ==== */
</script>
