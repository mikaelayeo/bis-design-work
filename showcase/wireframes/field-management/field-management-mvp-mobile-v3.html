  Field Management v2 — MOBILE design-system prototype (worker + supervisor). LOCAL ONLY. Do not publish.
  Built from Brief 3 (2026-10-08) + Brief 2 global bullets. Notes: mobile.notes.md
  Tokens + component specs: wireframing-briefs/bis-ds-reference.md (Figma "BIStrainer_UI-Library-Guide" sYqKFiF1879GNNITzqd8qC
  wins; mobile storybook for mobile components: 44px buttons, filled secondary, pill chips, list items, empty states, skeletons).
  Visual language: Teams Update (FY0Qjr6b5ATCivO7iFUDSg 159-5723 / 1324-27188 / 1206-3660), Mobile Home Redesign (T5uVMpRk1q9LJR5WoJDnER 1470-8390).
  Colours on by default (Design, Oct 9); the review bar's Colours toggle adds html[data-colours="grey"] for greyscale.
  Data is invented. All state is in memory; Reset starts over.
  Batch 4 mobile (m4, merged 2026-10-09): "Also available" optional ritual items on the Site's Rituals tab, under the
  worker's Field › Due today, and as one row at the bottom of Home › To Do (pin 401). Script tail; source in modules/m4.js.
  Mobile round 2 (Oct 9, after review pt 1): Can view role (W-29), FAB per the storybook (C-28), Assign = Form · Task · Folder file
  with a primary action (C-29, C-35, R-18), decluttered Field page and Job cards (C-30, C-31), chip quick actions (C-34),
  no "another company" (C-36, R-15), expected vs assigned (W-27), Expired / Expiring training only, Away starts on the viewed day.
  Ticket view (Oct 15, review tooling, script tail): ?ticket=<n> or More ▾ › Ticket outlines what one BIS PM ticket owns

/* =====================================================================
   2. PAGE + REVIEW LAYER
   ===================================================================== */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-family-default);background:#E6E6EA;color:var(--color-text-default);min-height:100vh}
/* Header restyle (Figma juC2LpgEYS5tyP7T5u5I4X 151-7584 "Updated Prototype Header", Oct 9): the review bar is a white
   prototype header, same style as the web file. Title block, label-over-control groups with thin dividers, pill segmented
   buttons, a square Annotations toggle group, outline buttons on the right. Fixed hex on purpose (review chrome): it ignores
   the sample portal and stays the same in grey mode. Look only: same ids, same handlers. */
.rbar{position:sticky;top:0;z-index:50;background:#fff;color:#19191a;border-bottom:1px solid #dfdfe2;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;align-items:center;padding:12px 16px;font:400 14px/20px var(--font-family-default)}
.rbar .rv-l{display:flex;align-items:center;gap:12px 32px;flex-wrap:wrap;min-width:0}
.rbar .rv-id{display:flex;flex-direction:column;gap:2px;padding:0 4px;min-width:0}
.rbar .rv-idr{display:flex;align-items:center;gap:8px;white-space:nowrap}
.rbar .rv-ttl{font-size:18px;line-height:22px;font-weight:600;color:#000}
.rbar .rv-ver{font-size:16px;line-height:24px;color:#000}
.rbar .rv-dot{width:6px;height:6px;border-radius:50%;background:#dfdfe2;flex-shrink:0}
.rbar .rv-date{font-size:14px;line-height:20px;color:#000}
.rbar .where{font-size:12px;line-height:16px;color:#636368;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .rv-ctl{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.rbar .rv-cl{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.rbar .rv-div{width:1px;align-self:stretch;min-height:54px;background:#dfdfe2;flex-shrink:0}
.rbar .rv-f{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.rbar .rv-lb{font:600 12px/16px var(--font-family-default);text-transform:uppercase;color:#000;padding-left:5px;white-space:nowrap}
.rbar .rv-seg{display:inline-flex;border:1px solid #afafb5;border-radius:80px;overflow:hidden;background:rgba(254,255,255,.75)}
.rbar .rv-seg.sq{border-radius:4px}
.rbar .rv-seg button{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;margin:0;font:400 16px/26px var(--font-family-default);color:#19191a;background:rgba(254,255,255,.75);border:0;border-left:1px solid #afafb5;border-radius:0;white-space:nowrap;cursor:pointer}
.rbar .rv-seg button:first-child{border-left:0;padding-left:12px}
.rbar .rv-seg button:last-child{padding-right:12px}

.rbar .rv-seg button:hover:not(.on){background:#f4f4f6}
.rbar .rv-sel{position:relative;display:inline-flex;align-items:center}
.rbar .rv-sel select{appearance:none;-webkit-appearance:none;min-width:137px;font:400 16px/24px var(--font-family-default);color:#19191a;background:rgba(254,255,255,.75);border:1px solid #afafb5;border-radius:80px;padding:4px 32px 4px 12px;cursor:pointer}
.rbar .rv-sel i{position:absolute;right:12px;font-size:12px;color:#4c4c4f;pointer-events:none}
.rbar .rv-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.rbar .rv-btn{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid #afafb5;border-radius:4px;background:#fff;color:#636368;font:600 16px/26px var(--font-family-default);text-decoration:none;white-space:nowrap;cursor:pointer}
.rbar .rv-btn:hover{background:#f4f4f6;color:#19191a}
/* Batch 7 (Design, Oct 9): a thinner review bar (same change as the web file): one row about 38px tall from ~1880px wide, two rows (~69px) below that. Labels sit
   beside their control, padding and gaps shrink, controls stay 28px tall. CSS only: same markup and handlers; the app bar is untouched. */
.rbar{padding:4px 12px;gap:4px 16px}
.rbar .rv-l{gap:4px 16px}
.rbar .rv-id{flex-direction:row;align-items:center;gap:8px;padding:0 2px}
.rbar .rv-idr{gap:6px}
.rbar .rv-ttl{font-size:15px;line-height:20px}
.rbar .rv-ver{font-size:13px;line-height:20px}
.rbar .rv-date{font-size:12px;line-height:16px;color:#4c4c4f}
.rbar .where{font-size:11px;line-height:14px;max-width:180px}
.rbar .rv-ctl{gap:4px 12px}
.rbar .rv-cl{align-items:center;gap:4px 12px}
.rbar .rv-div{min-height:20px;height:20px;align-self:center}
.rbar .rv-f{flex-direction:row;align-items:center;gap:6px}
.rbar .rv-lb{font-size:11px;line-height:14px;color:#4c4c4f;padding-left:0}

.rbar .rv-seg button:last-child{padding-right:10px}
.rbar .rv-sel select{font-size:13px;line-height:20px;padding:3px 28px 3px 10px;min-width:0;min-height:28px}
.rbar .rv-sel i{right:10px;font-size:10px}
.rbar .rv-r{gap:6px}
.rbar .rv-btn{font-size:13px;line-height:20px;padding:3px 8px;min-height:28px;box-sizing:border-box}
.rbar .flagbtn .cnt{font-size:11px;line-height:16px}
/* Batch 8 (Oct 9): the review bar fits on one row (~40px) from 1280px wide. The most-used controls stay in the bar (Role, Worker, Colours, Notes,
   Flags, Open web ↗); the rest (Loading, Portal, All / Pins, Reset Prototype) move into a "More ▾" dropdown. Same 151-7584 look as the web bar.
   Narrower windows still wrap. Same ids and handlers; the app bar is untouched. */
.rbar .rv-id{min-width:0;flex:0 1 auto}
.rbar .rv-idr{flex-shrink:0}
.rbar .where{flex:0 1 auto;min-width:40px}
.rbar .rv-seg.one button{padding:3px 10px}

.rbar .rv-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:280px;display:flex;flex-direction:column;gap:10px;padding:12px;background:#fff;border:1px solid #dfdfe2;border-radius:8px;box-shadow:0 0 8px #00000026}

@media (max-width:1499px){.rbar .rv-date,.rbar .rv-dot{display:none}.rbar .rv-idr{flex-shrink:0}
  .rbar .rv-id{flex:0 0 auto;flex-direction:column;align-items:flex-start;gap:0}           /* the trail sits under the title instead of beside it */
  .rbar .where{max-width:230px;min-width:0;line-height:13px}}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:20px 16px 40px;flex-wrap:wrap}
.rail{width:380px;max-width:100%;max-height:864px;display:flex;flex-direction:column;background:#fff;border:1px dashed #9a9aa0;border-radius:10px;font:13px/1.45 var(--font-family-default);position:sticky;top:calc(var(--rb-h,82px) + 12px);overflow:hidden}

.card-b{padding:8px 12px 10px}

.bar .s{background:var(--color-surface-success-light)} .bar .e{background:var(--color-surface-error)} .bar .n{background:var(--color-surface-warning-light)} .bar .g{background:var(--color-surface-secondary-light)}

/* Buttons [mobile SB]: 44 high, padding 12, r4, 16/20 600; secondary FILLED #DFDFE2; small 34 high 14/18 */
.btn{height:44px;border-radius:var(--border-radius-base);border:0;padding:0 12px;font:600 16px/20px var(--font-family-default);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap}

/* Feature icon tones, sampled from today's More menu (b3-img1) and mapped to the nearest library tokens.
   Sampled: Offline #009CD2 on #F8FEFF · Tasks #C77805 on #FEFBF0 · Training #D07600 on #FFFCF1 · Working Alone #C82127 on #FEF2F4 · Teams #3D3C3F on #F1F1F1 · Gate Access #118100 on #FDFFF3.
   In grey mode the tokens go grey with everything else. */
.tone-info{background:var(--color-surface-primary-lightest);color:var(--color-icon-primary)}

.kind{display:inline-flex;align-items:center;height:20px;border-radius:2px;background:var(--color-surface-secondary-lightest);padding:2px 6px;font:600 12px/16px var(--font-family-default);color:var(--color-text-secondary)} /* BisBadge Gray small */

 {n:2,tone:'q',on:['home'],k:'rec',t:'Quick actions = the old More items',b:'A sideways-scrolling row of small chip-like buttons (mobile round 2, C-34: smaller, no heavy shadow; a small tinted icon beside the label). Tiles navigate; they never filter, so they look different from filter chips. Fixed order for v1: Tasks, Training, Teams, Offline Dashboard. No customising until we see usage.',r:'Brief 3: "introduce a quick action in the home page … to house items like teams, offline dashboard, training, tasks"'},
 {n:3,tone:'scope',on:['home'],k:'scope',t:'To Do date filter: Today, Tomorrow, This week, All (decision 118)',b:'<b>Settled Oct 13, decision 118.</b> Same To Do card, plus chips: <b>Today</b> (default) · Tomorrow · This week · All. Weeks start on Monday (decision 106). <b>Items tied to a Site show there:</b> once the worker is signed in, an "At North Yard" group lists what they owe at that Site (it used to be only a count on the Forms row). Tap to start, tap again to submit. With Field Management off, the To Do has no Site items. No new object, no new screen.',r:'Brief 3: "home page will have a today\'s task section, maybe just reuse the to do to have a date filter"'},
 {n:4,tone:'scope',on:['home','field-worker'],k:'scope',t:'A clear Sign in for the worker',b:'The card lists the Sites and Jobs the worker is assigned to, each with Sign in. Signing in is the visit (proof level "signed in"). Decision 91: signing in means being confirmed at work by any method (your own tap, an attendance list, or a supervisor adding you). One place at a time: signing in somewhere else moves them. <b>Round 3, decision 92:</b> signing into a Job at a Site also signs you into that Site ("via Riverbend #4471"); signing into the Site doesn\'t sign you into its Jobs. Several Jobs at once is open (pin 61). Decisions 41, 52, 69, 91, 92.',r:'Brief 3: "also for end user have the way to sign in"'},
 {n:5,tone:'q',on:['field-worker'],k:'answer',t:'❓ Is Field also for workers? Yes, recommended',b:'Same tab, shaped by role. Supervisors get "the Sites and Jobs I look after"; workers get "where I am today": sign in/out, what\'s due, the Site\'s info, plus Working Alone (a worker tool). One consistent home for everything on site. Home still has the sign-in card and today\'s To Do, so a worker never has to find Field to start the day.<br><b>Decision flagged:</b> decision 63, <q>Worker mobile leans towards a "your day" home screen woven into the app, not a separate page. Direction, not locked.</q> A worker Field tab is a separate page. Shown, not resolved.',r:'Brief 3: "❓ maybe fied tab is also for end user but it shows something different so there is a consisten home for ir"'},
 {n:6,tone:'scope',on:['field-sup'],k:'scope',t:'Supervisor Field home is the gap view',b:'A summary card, then one card per Site, worst first. <b>Mobile round 2 (C-30, C-31):</b> no bars and no coloured legend dots anywhere on this page; colour only on the status icons. Each Site card has one plain line "Expected · Here · Not here yet" (W-27, pin 52), then at most three rows: outstanding → not here yet → done. Training and away live on the Site page. A Job is a simple card with its statuses on one line, not a full section. Training (a separate count, decision 39; a badge only, 66) shows on the Site page. Scope: the Sites and Jobs their crew is assigned to (decisions 42, 74). Card style follows the Teams "Location Details" cards.',r:'Decision 77: "The gap view is MVP, on web and app"'},
 {n:7,tone:'scope',on:['field-sup','field-worker'],k:'scope',t:'Working Alone and Gate Access live here, unchanged',b:'Both open the existing screens. Decision 107: Lone Worker (the app\'s "Working Alone") and Gate Access sit under Field. Decision 100: <q>Gate Access works exactly as it does now</q>, switched on per Site (confirms 65: <q>minimal work, no improvements</q>). Visitors are not designed around it (Design, Brief 3).',r:'Decisions 107, 100 · Brief 3: "Working Alone and Gate Access will be house in a new nav item called Field"'},
 {n:8,tone:'q',on:['site'],k:'rec',t:'Site page: today\'s progress, people, requirements, crews',b:'Teams-style header card, then the date strip (‹ Today ›) from Brief 2. Yesterday shows a read-only record; tomorrow shows who\'s expected (see Variants). The Attendance button opens that day. <b>Round 3:</b> the third tab is <b>Requirements</b> (decision 83: rituals, one-offs and optional items). Lists show one day (decision 85), and the chosen day carries in from the Field page (decision 111).',r:'Brief 3: "on a site page..there is an attendance button that opens the attendance for that day"'},
 {n:9,tone:'q',on:['attendance'],k:'flag',t:'What the page is called',b:'The button says "Attendance" as briefed. The page title says <b>"Who\'s on site"</b> (or "Who\'s on the job"), because S-04 says users never see attendance as a named thing.<br><b>Decision flagged:</b> decision 3, <q>Attendance is a component, not an object (Sep 23). Users never see "attendance" as a named thing.</q> Exact copy is still S-04 open question 1.',r:'Brief 3: "there is an attendance button"'},
 {n:10,tone:'q',on:['attendance'],k:'rec',t:'Three ways, one screen',b:'No helper text on screen (Design, Feedback 4: "very busy"). What each way does lives here. A segmented control: <b>Checklist</b> (tick + bulk Mark present) · <b>Pass the phone</b> (each person signs on this phone) · <b>Own phones</b> (send a request; people sign on their own). The admin\'s minimum proof for this Site shows on top (decision 4); anyone can go above it. Assumption: the supervisor can switch ways on the day.',r:'Brief 3: "a checklist variant … a manual version … a way for end user to sign themselves in"'},
 {n:11,tone:'q',on:['attendance'],k:'flag',t:'Bulk action is "Mark present" only',b:'Selecting (Design, Feedback 4): one <b>Select all</b> checkbox for everyone not here yet; tap a row to select it and tap again to deselect; a selection bar shows "N selected", a Clear ×, Mark away (icon) and <b>Mark present</b>. ⋮ opens the person’s actions.<br>Bulk records the supervisor\'s observation, at the "marked by supervisor" level. There is no bulk "Sign in": only the person can sign in or sign.<br><b>Decision flagged:</b> decision 4, <q>Proof levels on attendance: marked by supervisor · signed in · signed.</q> S-04 §4.3: <q>"Mark all present" is recorded as the supervisor\'s observation, never as an attestation on anyone\'s behalf.</q> Brief 2\'s bulk menu had both "mark as present" and "sign in". Left for Design to settle.<br><b>Oct 13, decision 91:</b> <q>Signing in means being confirmed at work, by any method: your own tap in the app, an attendance list, or a supervisor or admin adding you.</q> So Mark present already counts as signed in. Only the wording of the bulk button is still open.',r:'Brief 2: "Also I have mark as present but sign in for more action"'},
 {n:12,tone:'scope',on:['attendance','site'],k:'scope',t:'Proof level on every person',b:'Shape-coded so it reads in greyscale: <i class="fa-solid fa-user-check"></i> Marked by supervisor · <i class="fa-solid fa-mobile-screen"></i> Signed in · <i class="fa-solid fa-signature"></i> Signed, each with the time. Long-press the (i) for definitions.',r:'Decision 4 (proof levels); S-04 §4.1 "who, where, when, status, proof level, recorded by"'},
 {n:13,tone:'scope',on:['sign','signed'],k:'scope',t:'Pass the phone: the person signs their own entry',b:'Full-screen pad. The person confirms "I\'m …" before signing; the supervisor can\'t sign for them. Every signature stores who, when and which device (S-04 10d). After each one, "Next" hands straight to whoever\'s left. Reuses the mobile SignatureField.',r:'Decision 56: "Two modes: pass the device, or each person\'s own."'},
 {n:14,tone:'q',on:['sign'],k:'flag',t:'Saved signature: only on your own phone',b:'"Use my saved signature" appears only when someone signs on their own phone, never on a passed phone, so nobody can apply another person\'s.<br><b>Decision flagged:</b> decision 56, <q>Saved signatures in scope, pending Research lead.</q>',r:'S-04 §4.2b: "a supervisor must never apply someone else\'s"'},
 {n:15,tone:'q',on:['attendance','field-worker','home'],k:'assume',t:'Own phones: a request, not a push',b:'The supervisor sends a sign request; the worker sees it on Home and Field and signs there. Assumes the existing remote/deferred signing path can carry it (S-04 §8 Q6, still open). Offline behaviour is undecided.',r:'Decision 56 ("each person\'s own"); Brief 3 "a way for end user to sign themselves in"'},
 {n:16,tone:'scope',on:['add','guest'],k:'scope',t:'+ Person: a person or a guest only (decisions 88, 86)',b:'<b>Settled Oct 13.</b> Decision 88: <q>No one from another company\'s portal in the MVP. Guests stay simple.</q> Decision 86: adding people is a search <q>filtered by crew or location only</q>, so the Company role filter is gone (round 3). One search, two ways in: this portal\'s users (name + company role + location, so same names can be told apart), filters Crew · Location; then "Add a guest" (no BIS account, today only, #22315). <b>Mobile round 2:</b> "Find a BIS user from another company" is gone (R-15, C-36: not in the MVP; Product lead: "The guest is totally fine though"). It stays in the web ideal file. Guest storage is dev discussion D-03.',r:'Brief 2: "for all instance to add people … there should be a way to add a visitor/guest too"'},
 {n:18,tone:'scope',on:['attendance','away'],k:'scope',t:'Away for a period (decision 89)',b:'"Mark away" takes a duration (today only, a set date, or a range) and an optional reason. While away, nothing is expected of them and they\'re left out of progress.<br><b>Settled Oct 13, decision 89:</b> <q>Away: a date range that starts on the date being viewed (a past date if you\'re on one). It applies to every Site and Job in the MVP; per-Site Away comes later.</q> Decision 80: marking someone away lowers what\'s expected. Was a conflict with S-04 §4.1 (<q>present · absent · not yet recorded</q>); now in the Flags tab under "Settled". <b>Still open (Q-06):</b> Product lead asked whether future Away is still needed now that work waits for sign-in.',r:'Brief 2: "mark as absent so nothing is expected of them? … an option to select a duration like if they have a vacation"'},
 {n:19,tone:'scope',on:['field-worker'],k:'scope',t:'What\'s due appears once you\'re signed in',b:'Rituals are owed when you\'re signed in, so before sign-in the card says so instead of listing forms. After sign-in: Start of Day forms for you, plus Site-wide items anyone can do. Upcoming items (Friday\'s check) show greyed. Decision 80 (Oct 13): work is assigned to a person only once they\'re confirmed on site. Items carried over from an earlier day show above this, already owed (pin 58).',r:'Decisions 69, 80: "Attendance is the sign-in; rituals are owed when you\'re signed in, for Sites as well as Jobs"'},
 {n:20,tone:'q',on:['field-worker'],k:'flag',t:'"Site requirements" = what the Site already holds',b:'Shown: the Site\'s address and supervisor, files linked from Folders (decision 54), and your training as a badge that opens Teams. No requirement list is set on the Site.<br><b>Decision flagged:</b> decision 66, <q>No requirements are set on a Site or Job</q>, and training is a small badge only.',r:'Brief 3 / #22315 notes: visitors "see site reqs"'},
 {n:21,tone:'scope',on:['signin'],k:'scope',t:'Sign-in check',b:'Training gaps warn and never block (SM-04 criterion 11; decision 66). If the Job asks for a signature, Sign in goes to the pad. If you\'re signed in somewhere else, it tells you it will move you (decision 52). <b>Round 3, decision 92:</b> signing into a Job at a Site says it signs you into the Site too, and never moves you off that Site. Training shows only Expired or Expiring, in grey (decision 84).',r:'SM-04 §4B.2 · decisions 52, 84, 92'},
 {n:22,tone:'q',on:['home'],k:'rec',t:'Supervisor Home: a "Field today" snapshot',b:'Built like To Do (Design, Feedback 2): a light-blue section header with a count and "Open Field", then one row per Site or Job, worst first, with its outstanding count. Every Home section header (To Do, Favourites, Field today, Where are you today?) uses the same light-blue header (surface/primary-lighter). The detail lives in Field, so Home isn\'t a second dashboard.',r:'Brief 3: "for supervisors … the end user\'s designs will mostly be updated in the existing pages"'},
 {n:23,tone:'q',on:['home','attendance','site'],k:'how',t:'Tooltips on touch',b:'Phones have no hover, so tooltips open on <b>long-press</b> of icon buttons, tiles and badges (and on hover in this review). Where a definition matters (proof levels) there\'s an (i) button. Dark tooltip per the Figma spec.',r:'Brief 2: "Hovering on actions … will have a tooltip … Sprinkle this everywhere!"'},
 {n:24,tone:'q',on:['field-sup','field-worker','home'],k:'how',t:'Loading, empty and confirmation states',b:'Review bar → Loading: ON swaps every screen to skeleton blocks. The rail\'s <b>Variants</b> tab shows each screen\'s empty state (and other states) and reverts it. Every action ends in a snackbar, with Undo where it\'s safe.',r:'Brief 2: "feel free to add skeletons for loading state"'},
 {n:25,tone:'q',on:['field-sup'],k:'assume',t:'"Last synced"',b:'SM-04 asks to show staleness wherever a number could be out of date. Offline behaviour itself is undecided (parent ticket: "Offline: sync or degrade?").',r:'SM-04 §3 offline'},
 {n:26,tone:'q',on:['person'],k:'rec',t:'Person actions',b:'Mark present · Hand the phone to sign · Mark away · Remove from this Site. Remove takes them off this Site from today, not out of their crew, and keeps their history (Brief 2).',r:'Brief 2: People tab actions'},
 {n:27,tone:'scope',on:['site'],k:'scope',t:'People not in a crew',b:'The Crews tab lists crews and, separately, people added straight to the Site. No crew is needed to sign in.',r:'Decision 75: "No crew needed."'},
 {n:28,tone:'scope',on:['field-worker','signed'],k:'scope',t:'Sign out',b:'Sign-in and sign-out are Field Management now (decision 65). Signing out keeps the record: "Signed in 07:15 · out 15:30".',r:'Decision 65'}
,{n:29,tone:'scope',on:['field-sup','site','attendance'],k:'scope',t:'No progress bars anywhere',b:'<b>Mobile round 3 (Design, Oct 14):</b> the last bar, on the Who’s on site header, is gone too. Every card now shows counts and status icons only, no bars. History: per Design (Feedback 2), bars were kept only on header cards. <b>Mobile round 2 (C-30):</b> the Field summary\'s bar and coloured legend are gone too, so the only bar left is the "Who\'s on site" header. Rows in each card run worst first: red, then yellow, then green.',r:'Feedback 2: "other than the header card, we dont need the progress bar"; review pt 1 C-30: "do not put the bars everywhere"'}
,{n:30,tone:'q',on:['site','attendance'],k:'rec',t:'Floating action button per tab',b:'Uses the mobile storybook FloatingActionButton (Design, Feedback 4), with the round 2 rule (C-28, pin 51): <b>1 action = extended FAB</b>; <b>2 actions = two stacked buttons</b> (SB "Two Slots": the top one icon-only and secondary, the bottom one labelled and primary); <b>3 or more = speed dial</b> (SB: a 56px grey trigger with a centred +, opening 44px pills and a Close pill). Overview → extended <b>Assign</b>. People → Assign (icon) over <b>+ Person</b> (a person or a guest only, decision 88). Requirements → Assign (icon) over <b>Move rituals</b> (no adding on mobile, pin 32). Crews → speed dial: Add crew · Move crew · Remove crew · Assign. Who’s on site → extended <b>+ Person</b>. The FAB hides on read-only days, while people are selected, and for Can view (pin 50).',r:'Feedback 4: "I would use a FAB component … for actions related to a tab or page"; review pt 1 C-28, R-18'}
,{n:31,tone:'scope',on:['site','person','attendance'],k:'scope',t:'Where "Away" lives',b:'<b>Mobile:</b> the ⋮ menu on any person row → <b>Mark away…</b> (today only, until a date, or a range, plus a reason). The People tab has an <b>Away</b> filter chip, and selected people can be marked away from the selection bar. <b>Web:</b> a People-row action, plus a setting on the person page (Batch 3). Settled Oct 13 by decision 89 (pin 18): a date range that starts on the day you are viewing, for every Site and Job.',r:'Feedback 4: "where are we adding our away feature?" · decision 89'}
,{n:33,tone:'scope',on:['home','field-sup','site','attendance'],k:'scope',t:'Portal colour: section tints only',b:'Following portal-themes.md, Home section headers and Field header cards (Field summary, Site header, Who’s on site header) use a muted tint (about 12% portal colour) with an accent icon darkened until it reaches 3:1 (4.5:1 for text). <b>The app bar is not portal-coloured.</b> It keeps the v1 design Design approved (Feedback 2: <q>I also love the header of the mobile file</q>). Switch sample portals with the <b>Portal</b> dropdown in the review bar, which is review-only. BIS colours (primary blue, status) never change, and in grey mode it all goes grey.',r:'portal-themes.md; Design, Oct 9 (keep the mobile header as it was)'}
,{n:34,tone:'scope',on:['home','field-sup','site','attendance','field-worker'],k:'scope',t:'Status values: colour on the icon only',b:'Same rule as the web (Design, Oct 9). <b>The colour goes on the icon only, never the text</b>; text stays default #19191A. <b>Positive</b> (Done, Signed, Here, All current): green check-circle. <b>Negative</b> (Outstanding, Not started, Missing): red x-circle. <b>Waiting</b> (In progress, Not here yet, Waiting): amber clock. <b>Neutral</b> (Away, waived): grey dash. <b>Expected</b> (round 2, W-27): a grey hourglass, for items owed by someone not here yet; never counted as missing. <b>Training</b> is fully neutral (pin 37). Cards stay white, with only a subtle tint circle behind the icon. In grey mode the icon shape carries the meaning. One helper, stat(). <b>Oct 13, decision 108:</b> one status vocabulary across the product, based on the Training Matrix Summary Report. The exact words aren\'t listed yet, so these labels stay as they are.',r:'Design, Oct 9 (status values rule, shared with web) · decision 108'}
,{n:35,tone:'q',on:['away','awayConfirm','site','attendance'],k:'flag',t:'Backdated Away waives past items',b:'Design, Oct 9: someone sick Mon–Wed can be marked away afterwards. The Away sheet adds <b>Yesterday</b> and a <b>range that can start in the past</b>, with an optional reason (Sick, Vacation, Other). If past days are included, a confirm step says how many outstanding items will be <b>waived</b> (they stop counting; anything submitted stays). After saving, a snackbar offers Undo, and the items show <b>Waived · Away</b> with the grey dash under Rituals › Earlier this week.<br><b>Oct 13, decision 89:</b> Away starts on the date being viewed, <q>a past date if you\'re on one</q>, so backdating itself is in. <b>Still open for dev, D-04:</b> who may backdate, how far back, and the audit trail (who waived what, when and why).',r:'Design, Oct 9 (backdate away); decision 89; dev discussion D-04'}
,{n:36,tone:'scope',on:['home','field-worker','attendance'],k:'scope',t:'No double sign-in: one presence record',b:'If the supervisor already recorded the worker today, the worker’s card reflects it. <b>Marked present and the Site’s minimum is “marked by supervisor”</b>: done (“You’re checked in · marked by A. Brooks, 07:03”), with Sign out and an optional “Add your own sign-in”. <b>Marked present but the minimum is higher</b>: “A. Brooks marked you present · North Yard needs your sign-in” with Sign in (or Sign); this upgrades the proof level on the same record. <b>Signed on the supervisor’s phone</b>: done, no button. Try it: mark someone present in the Checklist, then pick them in the review bar’s Worker dropdown. Variants show all four card states.',r:'S-04 §4.2 / decision 4: “The admin sets the minimum proof level per use. A person can always exceed it.”'}
,{n:37,tone:'scope',on:['site','attendance','field-sup','field-worker','add','signin'],k:'scope',t:'Training is informational: shown, never highlighted',b:'Training appears as a neutral grey chip with a certificate icon in default-light and default text: no red, amber, ✕ or clock. It links to Teams. In status rows it sits after the green and red rows as “N with expired or expiring training · informational”. It never blocks anything. <b>Oct 13, decision 84:</b> training shows only <b>Expired</b> and <b>Expiring</b>, grey and informational, in tables too. The worker’s “before you start” card says “Nothing expired or expiring” when there’s nothing to show.',r:'Decision 66: “Training comes from the training matrix only … a small badge … informational, never blocking.”'}
,{n:38,tone:'q',on:['guest'],k:'assume',t:'Guest company is optional',b:'Design’s answer (Oct 9, same as the web): a guest’s company is optional. <b>Design to confirm with the team.</b>',r:'Design, Oct 9 (guest company)'}
,{n:39,tone:'scope',on:['away','awayConfirm'],k:'scope',t:'Future: Away per Site (decision 89)',b:'<b>Settled Oct 13, decision 89:</b> <q>It applies to every Site and Job in the MVP; per-Site Away comes later.</q> MVP: Away applies to <b>all Sites and Jobs</b> (Design, Oct 9). <b>Future:</b> Away per Site. Sites can be cities apart, so someone may be away from one Site but working at another. Revisit after the MVP.',r:'Design, Oct 9 (Away scope)'}
,{n:40,tone:'scope',on:['person','moveToCrew'],k:'scope',t:'Moving to another crew moves their Sites',b:'Design, Oct 9 (same as the web): a person who moves crew <b>follows the new crew’s Sites and Jobs</b> and leaves the old crew’s, except Sites they were added to directly, which stay. The confirm sheet lists exactly what changes before you confirm.',r:'Design, Oct 9 (move person between crews)'}
,{n:41,tone:'q',on:['assign','site'],k:'flag',t:'Supervisor Assign on the app: in scope?',b:'<b>Item 9 says “an admin can…”. Supervisor Assign on the app isn’t in scope; confirm (T-17).</b> Built as Design asked: the Site page FAB has <b>Assign</b> for supervisors, as a bottom sheet with the same steps as the web (type → search → who → when), then a snackbar with Undo. Item 9, verbatim: <q>Instead, inside a Site or Job, an admin can add a task or assign a form to people or a crew.</q> Settings audit O5 (Assign on mobile) and O4 (who can assign: admin; a supervisor to their crew, SM-03 §1.1) are open.',r:'Parent MVP item 9 · team list T-17 · settings audit O4, O5'}
,{n:42,tone:'q',on:['assign'],k:'flag',t:'Decision 79: build forms and files here, or link to Folders?',b:'Form (one card for every form, from Forms or a Folder) and Folder file are offered (mobile round 2, C-35; Folder file kept for now, C-07), but <b>decision 79 reopened one-off work</b>: <q>One-off work reopened: build it in Field Management, or link to Folders? Product lead flagged that on-demand forms in Field Management remove the reason to pay for Folders (Oct 1). Not decided.</q> A company decision (decision 78; team list T-17). Same pins as the web. <b>Oct 13, decision 81:</b> Assign = Form + Task; Folder file stays for now (Design\'s call; ask Product lead to confirm). <q>Decision 79 is still open.</q>',r:'Decisions 78, 79, 81 · settings audit O1'}
,{n:44,tone:'scope',on:['site','assign'],k:'scope',t:'Assign: one-off work for a Site or Job',b:'Parent MVP item 9: one-off work is assigned inside a Site or Job, counts toward it, shows in its view, and is <b>owed once</b>. On the app it sits on the Site page FAB (every tab: Overview has an extended <b>Assign</b> FAB; People, Rituals and Crews add it to their speed dial). The items count in the Site’s outstanding, show on the Overview (“N of these are one-off”) and on the Requirements tab (“One-off · assigned today”; decision 83 puts one-offs on Requirements).',r:'Parent MVP item 9 (decision 53, revised by 79) · decision 83'}
,{n:45,tone:'q',on:['assign'],k:'rec',t:'Hide types for modules the portal doesn’t have?',b:'<b>Should Assign hide types for modules this portal doesn’t have? (settings audit O3, T-46)</b> Built: all three types (Form, Task, Folder file) always show. Recommendation: hide them automatically from the portal’s modules, with no setting.',r:'Settings audit O3 · team list T-46'}
,{n:46,tone:'scope',on:['assign'],k:'scope',t:'You can’t assign into the past',b:'When defaults to the day you’re viewing: today, or tomorrow if you stepped to tomorrow. Viewing yesterday, it starts today and says so. Only Today and Tomorrow are offered on the app; it’s owed once, and anything not done shows as missing from the next day.',r:'Parent MVP item 9 (owed once); same rule as the web'}
,{n:47,tone:'scope',on:['home','field-worker'],k:'scope',t:'“Assigned today” on the worker’s To Do',b:'Assigned items reach the worker through shared state: their <b>To Do</b> (Home) lists them first under “Assigned to you”, with an <b>Assigned today</b> chip, and Field › Due today lists them once they’re signed in. Tap to start, tap again to submit. Try it: assign something as the supervisor, then pick that person in the review bar’s Worker dropdown. <b>Answered in round 2 by W-27 (pin 52):</b> today\'s one-offs wait for sign-in like rituals. Before the worker signs in or is marked present, To Do shows "Sign in to see today\'s items". <b>Settled Oct 13, decision 80:</b> <q>Work is assigned to a person only once they\'re confirmed on site.</q>',r:'Design, Oct 9 (Assign brief) · decisions 69, 80'}
,{n:48,tone:'scope',on:['assign'],k:'scope',t:'Task: a compact “New Task” form',b:'Task is written from scratch, so it opens a compact version of the Task Management create modal (Figma DWkPdRCRTzFMeKQijRGvko 50-12655): Title, details, Priority, the Site or Job (prefilled), who it’s assigned to (prefilled with everyone here today), Schedule One-time (Recurring off: repeating work is a ritual), Assignment date and Due date, then <b>Assign Task</b>. Form and Folder file use the search steps instead.',r:'Design, Oct 9: “do not be afraid to use this exact design”'}
,{n:49,tone:'scope',on:['placeholder'],k:'scope',t:'Placeholder screens: existing BIS screens, unchanged',b:'These screens stand in for what already exists. <b>Teams</b> opens the person on the existing Teams page (training is a badge only, decision 66). <b>Gate Access</b> is the existing Site Access app flow, unchanged (decision 65: the Access feature). <b>Folders</b> files are linked, never copied (decision 54). Batch 8 moved these references out of the screen text. Oct 13: decision 100 confirms Gate Access works exactly as it does now; decision 107 puts it and Working Alone under Field, or keeps them in <b>More</b> when the portal has no Field Management.',r:'Decisions 54, 65, 66, 100, 107'}
,{n:32,tone:'scope',on:['site','moveRitual'],k:'scope',t:'Rituals are only moved on mobile, never created',b:'Agreed by Design, Oct 9: there’s no adding rituals on mobile in the MVP. On the Requirements tab, the FAB’s labelled action is <b>Move rituals</b>, which moves today’s ritual to another day for this Site only (SM-04 criterion 6). New rituals are set up on the web.',r:'SM-04 acceptance criterion 7: "A supervisor cannot create Sites, Jobs, rituals or crews on mobile, but can move people and crews between work contexts."'}
/* ---- Mobile round 2 (Oct 9, after review pt 1) ---- */
,{n:50,tone:'q',on:['home','field-sup','site','attendance'],k:'flag',t:'Can view on the app, read-only (decision 90, Product lead to confirm)',b:'Someone given <b>Can view</b> on a Site or Job sees it in the app the way a supervisor does: Field today on Home, the Field tab\'s Sites and Jobs, the Site page and Who\'s on site. <b>No actions:</b> no FAB, Mark present, Assign, Away, Move, Remove or Add, no selection checkboxes and no attendance ways (Checklist / Pass the phone / Own phones). Rows don\'t open action sheets. A small <b>View only</b> chip shows on each of those screens. Try it: Role → <b>Can view</b> in the review bar. Decisions 43 and 57 make Can view web-only today, so this extends them; add to S-02 and SM-04 (answers Q-13).<br><b>Oct 13, decision 90 (open):</b> <q>"Can view" also works on the app, read-only: no actions and no FAB. Design\'s call. Product lead hasn\'t ruled on it (Q-13).</q> So this pin is now yellow and in the Flags tab: <b>Product lead to confirm.</b>',r:'W-29 (Design, Oct 9) · decision 90 · Q-13'}
,{n:51,tone:'q',on:['site','attendance'],k:'rec',t:'FAB rule, from the storybook (C-28, Q-17)',b:'<b>What the storybook says</b> (FloatingActionButton docs): it <q>Floats one or two buttons</q>, and <q>The last button can open a speed dial of extra actions</q>. "Two Slots": <q>Top slot stays icon-only while the bottom one carries the label</q>. Its Speed Dial story has 3 actions. <b>Q-17:</b> the storybook does <b>not</b> write down a minimum number of actions for a speed dial; "3 or more" is Design\'s rule from the review, and it fits the two-slot limit. Confirm with Mobile dev (and zeroheight, Q-18). <b>Built:</b> 1 action = extended FAB; 2 = two stacked buttons; 3+ = speed dial with the storybook\'s grey 56px trigger. The + is centred (a pin anchor used to push it 4px left). The ButtonDock docs also say <q>Primary action is always required in the dock</q> (R-18).',r:'Storybook foundation-buttons-floatingactionbutton--docs, --two-slots, --speed-dial; foundation-buttons-buttondock--docs'}
,{n:52,tone:'scope',on:['field-sup','site','attendance','home','field-worker'],k:'scope',t:'Expected vs assigned (W-27)',b:'From the start of the day a Site or Job shows who is <b>expected</b>: everyone on it who isn\'t away. The supervisor sees <b>Expected · Here · Not here yet</b>. Work is only <b>assigned</b> (owed) once a person signs in or is marked present, so items for people not here yet read <b>Expected</b> (grey hourglass), never missing or outstanding. <b>Mark away lowers the expected count.</b> The worker\'s To Do (Today) only fills once they\'re signed in or marked present; before that it says "Sign in to see today\'s items". Place items (Yard walk, anyone on the Site) are owed from the start. <b>Open (Q-04):</b> someone who never signed in and wasn\'t marked away: missing, or a separate "not signed in" gap? Built: they stay "Not here yet" with their items "Expected". <b>Logged Oct 13 as decision 80</b> (<q>A Site or Job shows what\'s expected from the start of the day. Work is assigned to a person only once they\'re confirmed on site. Marking someone away lowers what\'s expected.</q>). Q-04 is still open.',r:'W-27 · decision 80 · review pt 1 R-12, C-18 · decision 69; changes SM-04 line 107'}
,{n:53,tone:'scope',on:['assign'],k:'scope',t:'Assign types: Form · Task · Folder file, with a primary action',b:'Round 2 (C-05, C-06, C-35): <b>Form</b> is one card for every form (from Forms or kept in a Folder), then <b>Task</b>, then <b>Folder file</b> (kept for now, C-07: see what clients and devs think). Asset form is gone. The type step is now a choice with a primary <b>Next</b> button, so the sheet never ends with only a tertiary Cancel (R-18; storybook ButtonDock: a primary action is always required). Logged Oct 13 as <b>decision 81</b> (Assign = Form + Task; Folder file stays for now; asset form is out).',r:'Decision 81 · review pt 1 C-05, C-06, C-07, C-29, C-35, R-18'}
,{n:54,tone:'scope',on:['away','person','site'],k:'scope',t:'Away starts on the day you\'re viewing',b:'Round 2 (C-19, same as the web): Mark away opens on the date you\'re looking at. Today → Today only. Yesterday → Yesterday (the past items are waived after a confirm, pin 35). Tomorrow → Pick dates, from Fri, Oct 9, and it\'s saved as a planned away. The date range stays. Logged Oct 13 as <b>decision 89</b>.',r:'Decision 89 · review pt 1 C-19 · HANDOFF "Away (C-19)"'}

,{n:55,tone:'q',on:['home','field-sup','field-worker','more','site','attendance','placeholder'],k:'flag',t:'"Equipment" or "Assets" in the nav',b:'Moved here from pin 1, which decision 107 settled. The Home Redesign frame (1470-8390) labels the 4th tab "Assets"; today\'s app and Brief 3 say "Equipment". Kept "Equipment". <b>Confirm which label ships.</b>',r:'Brief 3 vs Figma 1470-8390'}
,{n:56,tone:'q',on:['more'],k:'rec',t:'Without Field Management: what stays in More?',b:'Decision 107 only says <q>Field replaces More only in portals that have Field Management.</q> Built: More keeps today\'s menu unchanged (Offline Dashboard, Tasks, Training, Working Alone, Teams, Gate Access), and Home keeps its quick actions. In the review, Design said Working Alone <q>would be up here</q> (on Home) when there\'s no Field tab. <b>Confirm:</b> does More keep all six items, and does Working Alone also become a Home quick action?',r:'Decision 107 · review pt 2 [1:28:05–1:28:15]'}
,{n:58,tone:'scope',on:['home','field-worker','site'],k:'scope',t:'Missed work carries over (decision 95)',b:'<b>Decision 95:</b> <q>An item someone signed in for but didn\'t finish stays on their list the next day, marked as the earlier day\'s. Nothing is owed if they never showed up. Reports count it on the day it was owed.</q> Built: a <b>Carried over</b> group at the top of the worker\'s To Do (Today, This week, All) and Field page, each item with a grey <b>"From Tue, Oct 6"</b> chip and "counts for Tue, Oct 6". It shows before today\'s sign-in, because it was already owed. Tap to start, tap again to submit (snackbar with Undo). The supervisor sees the same items in a <b>Carried over</b> card on the Requirements tab. They are <b>not</b> in today\'s outstanding or done counts. Try it: Worker role, T. Nguyen (two missed FLHAs) or E. Chen.',r:'Decision 95 · review pt 2 [0:36:08–0:41:19]'}
,{n:59,tone:'q',on:['home','field-worker'],k:'flag',t:'Group repeated copies? Not decided',b:'Someone who misses the same item on several days gets one row per day (T. Nguyen has FLHA from Tue, Oct 6 and from Wed, Oct 7). Design\'s idea is to group repeated copies on mobile, so the app doesn\'t fill up with copies. <b>Not decided</b> (decision 95: <q>Design may group repeated copies on mobile; still an idea.</q>). Shown ungrouped.',r:'Decision 95 · review pt 2 [0:37:38–0:37:52]'}
,{n:60,tone:'scope',on:['field-sup'],k:'scope',t:'Date picker on the page itself',b:'Review Oct 13 (supervisor view): the date picker sits on the Field page, above the summary, the same ‹ Today › strip as the Site page. Yesterday is a read-only record; tomorrow shows who\'s expected. The chosen day carries into the Site page you open (decision 111) and resets to Today when you change tab. Lists show one day; ranges live in the web Calendar (decision 85). The rest of the supervisor view is unchanged: Design will rebuild it with existing components.',r:'From Direction Oct 13 (Mobile: supervisor view) · decisions 85, 111'}
,{n:61,tone:'q',on:['home','field-worker','signin'],k:'flag',t:'Several Jobs on one day? Open',b:'<b>Decision 92</b> (built): signing into a Job at a Site also signs you into that Site, and a ritual both carry is done once. Signing into the Site doesn\'t sign you into its Jobs. <b>Open</b> (not designed): <q>several Jobs open at once, or sign out of one first? Does the previous Job\'s work stay assigned? What happens after signing into the wrong Job?</q> And how a Job across several Sites knows which Site you\'re at. The prototype still moves you when you sign in at another Job or Site.',r:'Decision 92 (🚩 open part)'}

/* =====================================================================
   PORTAL THEMES — wireframing-briefs/portal-themes.md (shared with the web prototype; keep the values identical)
   Only the section-header and Field header-card tints (and their accent) change. The app bar never does. BIS tokens never change.
   ===================================================================== */
const PORTALS={
  clean:{n:'Northwind Field Services',c:'#0099CC',b:'#0081AD',mark:'fa-leaf',word:'CLEAN',sub:'ENVIRONMENT'},
  inhouse:{n:'Contoso Industrial',c:'#A50E15',b:'#7E0A10',mark:'fa-shield-halved',word:'BIS │ Contoso Industrial',sub:''},
  safetynet:{n:'Fabrikam Safety',c:'#FFD200',b:'#E0B800',mark:'fa-triangle-exclamation',word:'FABRIKAM',sub:''}
};
const hexRgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));};
const rgbHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
function relLum(h){ return hexRgb(h).map(v=>{v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}).reduce((a,v,i)=>a+v*[0.2126,0.7152,0.0722][i],0); } // WCAG relative luminance
function contrast(a,b){ const A=relLum(a),B=relLum(b); return (Math.max(A,B)+0.05)/(Math.min(A,B)+0.05); }
function mix(a,b,t){ const A=hexRgb(a),B=hexRgb(b); return rgbHex(A.map((v,i)=>v*t+B[i]*(1-t))); } // t of a, (1-t) of b
function darkenUntil(h,bg,min){ let c=h; for(let i=0;i<60&&contrast(c,bg)<min;i++) c=mix(c,'#000000',0.94); return c; }
function portalTheme(hex){
  const band=hex, bandText=contrast('#FEFEFE',hex)>=4.5?'#FEFEFE':'#19191A';
  const tint=mix(hex,'#FEFEFE',0.12);                       // ~12% portal colour into #FEFEFE
  return {band, bandText, tint, accentIcon:darkenUntil(hex,tint,3), accentText:darkenUntil(hex,tint,4.5)}; // ≥3:1 icons, ≥4.5:1 text
}
function toGrey(h){ const L=relLum(h); const v=L<=0.0031308?L*12.92:1.055*Math.pow(L,1/2.4)-0.055; const g=Math.round(v*255); return rgbHex([g,g,g]); } // same luminance, no hue
function applyPortal(){
  const p=PORTALS[S.portal]||PORTALS.clean; const base=S.colours?p.c:toGrey(p.c), border=S.colours?p.b:toGrey(p.b);
  const t=portalTheme(base), st=document.documentElement.style;
  st.setProperty('--portal-band',t.band); st.setProperty('--portal-band-text',t.bandText); st.setProperty('--portal-border',border);
  st.setProperty('--portal-tint',t.tint); st.setProperty('--portal-accent-icon',t.accentIcon); st.setProperty('--portal-accent-text',t.accentText);
}

  attMode:'check', sel:{}, addSel:{}, addQ:'', addF:{}, guest:{f:'',l:'',c:'',p:''},
  awayOpt:{dur:'today',reason:'',from:'oct6',to:'today'}, waived:{}, signConfirm:false, ink:false,
  ctxCrews:{ny:['nyc'],rb:['ugc'],wd:['wdc']}, ctxRituals:{ny:['sod','yw','eq'],rb:['sod'],wd:['sod']}, moved:{}, fabOpen:false, collapsed:{},
  crewMem:Object.fromEntries(Object.entries(CREWS).map(([k,v])=>[k,v.members.slice()])),

let S=fresh();

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>n.replace(/\./g,'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
function now(){ S.clock+=2; const m=S.clock; return String(7+Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function signLeft(cid){ return S.ctxPeople[cid].filter(p=>att(cid,p).st!=='away'&&att(cid,p).proof!=='signed').sort((a,b)=>(att(cid,a).st==='here')-(att(cid,b).st==='here')); }
const P=id=>S.people[id];
const EM=()=>!!S.emptyFor[K];
function att(cid,pid){ return ((S.att[cid]||{})[pid])||{st:'notyet'}; }
function setAtt(cid,pid,v){ (S.att[cid]=S.att[cid]||{})[pid]=v; }
function pin(n){ return `<span class="pa" data-pin="${n}"></span>`; }
function pinR(n){ return `<span class="pa" data-pin="${n}" style="left:auto;right:4px"></span>`; } // round 2: a second pin on a FAB button, on its right edge
const cbx=on=>`<i class="cbx ${on?'on fa-solid fa-square-check':'fa-regular fa-square'}"></i>`;

/* ---------- obligations ---------- */
function owed(cid){
  const c=CTX[cid], out=[];
  S.ctxRituals[cid].forEach(rid=>{ const r=RITUALS[rid]; if(r.next||(S.moved[cid]||{})[rid]) return;
    if(r.per==='person') S.ctxPeople[cid].filter(p=>att(cid,p).st==='here'&&!(att(cid,p).via&&S.ctxRituals[att(cid,p).via].includes(rid))).forEach( /* round 3 (92): a ritual the Job and its Site both carry is done once, on the Job */p=>r.forms.forEach(f=>out.push({rid,form:f,who:p})));
    else r.forms.forEach(f=>out.push({rid,form:f,who:null}));
  });
  /* Batch 3c: one-off items assigned for today, owed once. Round 2 (W-27): only by people here (signed in or marked present). */
  (S.assigned||[]).filter(a=>a.cid===cid&&a.day==='today').forEach(a=>a.who.forEach(p=>{ if(att(cid,p).st==='here') out.push({rid:'one',form:'one:'+a.id,label:a.name,who:p,one:a.id}); }));
  return out;
}
/* Round 2 (W-27, expected vs assigned): what people who are NOT here yet will owe once they sign in or are marked present.
   Away people are never expected, so Mark away lowers the expected count. These read "Expected", never missing. */
function expected(cid){
  const out=[], ny=S.ctxPeople[cid].filter(p=>att(cid,p).st==='notyet');
  S.ctxRituals[cid].forEach(rid=>{ const r=RITUALS[rid]; if(r.next||(S.moved[cid]||{})[rid]||r.per!=='person') return; ny.forEach(p=>r.forms.forEach(f=>out.push({rid,form:f,who:p,exp:true}))); });

function scrFieldSup(){
  /* Round 3 (review Oct 13): the date picker sits on the page itself, above the summary. The chosen day carries into the Site page (decision 111). */
  let h=`<div style="height:12px"></div>${dateNav(60)}<div style="height:8px"></div>`;
  const hd=`<div class="card-h tint"><i class="fa-solid fa-helmet-safety"></i>${S.day===0?'Today':S.day<0?'Yesterday':'Tomorrow'}<span class="see xs">Last synced just now${pin(25)}</span></div>`;
  if(S.day!==0) h+=`<div class="banner grey"><i class="fa-solid fa-clock-rotate-left"></i><div class="grow">${S.day<0?'Read-only record for yesterday.':'Nothing has happened yet. This is who is expected.'}</div></div>`;
  if(VIEW()) h+=`<div style="padding:0 16px 10px;display:flex">${viewChip(1)}</div>`; // W-29: the View only chip sits above the summary
  if(EM()) h+=`<div class="card">${hd}</div>`+empty('fa-helmet-safety','No Sites or Jobs today',(VIEW()?'Nothing has been shared with you':'Your crews aren\'t assigned anywhere')+' today. Sites and Jobs are set up on the web.');
  else{
    /* Round 2 (C-30): no bar, no coloured legend dots. Colour only on the status icons. W-27: Expected · Here · Not here yet. */
    let out=0,miss=0,gaps=0,owedT=0,doneT=0,here=0,expP=0; SUP_CTX.forEach(c=>{const s=stats(c); out+=s.out; miss+=s.notyet; owedT+=s.owed; doneT+=s.done; here+=s.here; expP+=s.expP; if(s.out||s.notyet)gaps++;});
    h+=`<div class="card">${hd}<div class="card-b"><div class="big"><b>${gaps}</b>of ${SUP_CTX.length} Sites &amp; Jobs need attention${pin(6)}</div>
      <div class="exp-line"><span>Expected <b>${expP}</b></span><span>Here <b>${here}</b></span><span>Not here yet <b>${miss}</b></span>${pin(52)}</div>
      <div class="exp-line"><span><b>${out}</b> outstanding</span><span><b>${doneT}/${owedT}</b> done</span></div></div></div>`;
    const f=[['all','All'],['Site','Sites'],['Job','Jobs']];
    h+=`<div class="sec-h">${VIEW()?'Sites &amp; Jobs you can view':'Your Sites &amp; Jobs'}</div><div class="chips">${f.map(x=>`<button class="chip ${S.fieldFilter===x[0]?'on':''}" onclick="S.fieldFilter='${x[0]}';render()">${x[1]} <span class="c">${x[0]==='all'?SUP_CTX.length:SUP_CTX.filter(c=>CTX[c].kind===x[0]).length}</span></button>`).join('')}</div>`;
    const list=worstFirst(SUP_CTX.filter(c=>S.fieldFilter==='all'||CTX[c].kind===S.fieldFilter));
    h+=list.map(c=>CTX[c].kind==='Job'?jobCard(c):ctxCard(c)).join('');
  }
  h+=`<div class="sec-h">Tools${pin(7)}</div><div class="card">${toolRows()}</div>`;
  return {key:'field-sup', body:h, title:'Field'};
}
function toolRows(){
  return `<div class="row tap" onclick="go({s:'ph',title:'Working Alone',icon:'fa-tower-broadcast',msg:'The existing Working Alone screens, unchanged. Moved here from More.'})"><div class="ic tone-error"><i class="fa-solid fa-tower-broadcast"></i></div><div class="mid"><div class="t">Working Alone</div><div class="s">Check-ins while you work alone</div></div><i class="fa-solid fa-chevron-right chev"></i></div>
  <div class="row tap" style="border-bottom:0" onclick="go({s:'ph',title:'Gate Access',icon:'fa-location-pin-lock',msg:'The existing Gate Access screens, unchanged. Moved here from More.'})"><div class="ic tone-success"><i class="fa-solid fa-location-pin-lock"></i></div><div class="mid"><div class="t">Gate Access</div><div class="s">Scan in and out at the gate</div></div><i class="fa-solid fa-chevron-right chev"></i></div>`;
}
function ctxCard(cid){
  const c=CTX[cid], s=stats(cid);
  /* Round 2 (C-30): one plain "Expected · Here · Not here yet" line (W-27), then at most three status rows. Training, away and waived live on the Site page. */
  return `<div class="card tap" onclick="go({s:'site',id:'${cid}'})"><div class="card-h"><span class="kind">${c.kind}</span>${esc(c.n)}${pin(34)}<span class="see">See ${c.kind} <i class="fa-solid fa-chevron-right"></i></span></div><div class="card-b">${expLine(s)}${statusRows(s)}
   <div class="xs muted" style="margin-top:6px">${esc(c.meta)}</div></div></div>`;
}
function expLine(s){ return `<div class="exp-line"><span>Expected <b>${s.expP}</b></span><span>Here <b>${s.here}</b></span><span>Not here yet <b>${s.notyet}</b></span>${s.away?`<span>${s.away} away</span>`:''}</div>`; }
/* C-31: a Job is a simple card with its statuses on one line, not a full section */
function jobCard(cid){
  const c=CTX[cid], s=stats(cid);
  const sts=[s.out?stat('neg',s.out+' outstanding',1):'', s.notyet?stat('wait',s.notyet+' not here yet',1):'', stat(s.out?'neu':'pos',s.out?`${s.here} of ${s.expP} here`:'All current',1)].filter(Boolean).join('');
  return `<div class="card tap" onclick="go({s:'site',id:'${cid}'})"><div class="jobcard"><div class="mid"><div class="t"><span class="kind">Job</span>${esc(c.n)}</div><div class="xs muted" style="margin-top:2px">${esc(c.meta)}</div><div class="sts">${sts}</div></div><i class="fa-solid fa-chevron-right chev"></i></div></div>`;
}
/* Worst first: red (outstanding) → yellow (not here yet) → green (done). No bars (Feedback 2; round 2 C-30). */
function statusRows(s,opts={}){
  const r=[];
  if(s.out) r.push(['e','fa-circle-exclamation',`<b>${s.out}</b> outstanding${s.prog?` <span class="muted">· ${s.prog} in progress</span>`:''}`,'']);
  if(s.notyet) r.push(['n','fa-clock',`<b>${s.notyet}</b> not here yet`, (opts.noNames?'':s.missing.map(esc).join(', '))+(s.expI?` · ${s.expI} items expected`:'')]);
  r.push(['s','fa-circle-check', s.out?`<b>${s.done}/${s.owed}</b> done`:`<b>All current</b> <span class="muted">· ${s.done}/${s.owed} done</span>`, '']);
  return r.map(x=>statRow(STK[x[0]],x[2],x[3])).join('');
}
/* One helper for every status value (Design, Oct 9). kind: pos · neg · wait · neu */
const STK={e:'neg',n:'wait',s:'pos',g:'neu',t:'training',x:'exp'};
const ST_ICON={pos:'fa-circle-check',neg:'fa-circle-xmark',wait:'fa-clock',neu:'fa-minus',training:'fa-award',exp:'fa-hourglass-start'}; // exp = "Expected" (round 2, W-27): neutral // training always neutral (decision 66)
function stat(kind,value,sm){ return `<span class="stat st-${kind}"><span class="si ${sm?'sm':''}"><i class="fa-solid ${ST_ICON[kind]}"></i></span><span class="sv">${value}</span></span>`; }
function statRow(kind,value,sub){ return `<div class="srow st-${kind}"><span class="si"><i class="fa-solid ${ST_ICON[kind]}"></i></span><div><span class="sv">${value}</span>${sub?`<span class="sub">${sub}</span>`:''}</div></div>`; }

/* ---------- Site page ---------- */
function dayLabel(){ return S.day===0?'Today, '+TODAY:S.day<0?'Yesterday, Wed, Oct 7':'Tomorrow, Fri, Oct 9'; }
function dateNav(p){ return `<div class="datenav"><button class="ibtn" data-tip="Previous day" onclick="S.day=Math.max(-1,S.day-1);render()"><i class="fa-solid fa-chevron-left"></i></button><div class="d"><i class="fa-regular fa-calendar"></i>${dayLabel()}${p?pin(p):''}</div><button class="ibtn" data-tip="Next day" onclick="S.day=Math.min(1,S.day+1);render()"><i class="fa-solid fa-chevron-right"></i></button>${S.day?`<button class="btn sm ter" onclick="S.day=0;render()">Reset</button>`:''}</div>`; }
function scrSite(r){
  const c=CTX[r.id], s=stats(r.id);
  let h=`<div class="hero"><div class="top"></div><div class="icn"><i class="fa-solid ${c.kind==='Site'?'fa-building':'fa-briefcase'}"></i></div><div class="nm">${esc(c.n)}${pin(8)}</div>${VIEW()?`<div style="text-align:center;margin-top:2px">${viewChip(1)}</div>`:''}<div class="mt">${c.kind} · ${esc(c.meta)}${c.kind==='Job'?pin(62):''}</div><div class="mt"><b>Supervisor:</b> ${esc(c.sup)} · <b>Minimum proof:</b> ${PROOF_NAME[S.minProof[c.id]]} <span data-tip="Set by your admin. Anyone can go above it.">(admin)</span></div>
   <div class="act"><button class="btn pri block" data-tip="Who's here, and how we know" onclick="go({s:'attendance',id:'${r.id}'})"><i class="fa-solid fa-clipboard-user"></i>Attendance</button></div></div>${dateNav()}<div style="height:6px"></div>`;
  if(S.day!==0) h+=`<div class="banner grey"><i class="fa-solid fa-clock-rotate-left"></i><div class="grow">${S.day<0?'Read-only record for yesterday.':'Nothing has happened yet. This is who is expected.'}</div></div>`;
  if(EM()) return {key:'site', title:c.n, body:h+empty('fa-users','No one is on this '+c.kind+' today',CAN_ACT()?'Add people or a crew to get started. Crews are assigned on the web.':'Nobody has been added here today.',false,CAN_ACT()?`<button class="btn pri" onclick="go({s:'add',id:'${r.id}'})"><i class="fa-solid fa-plus"></i>Add people</button>`:'')};
  /* Round 3 (decision 83): the client-facing tab is "Requirements" (rituals, one-offs and optional items). The internal key stays 'rituals'. */
  const tabs=[['overview','Overview',''],['people','People',s.total],['rituals','Requirements',s.out],['crews','Crews','']];
  const tips={overview:'Today at a glance',people:'Who\'s here and who isn\'t',rituals:'Everything owed today: rituals, one-offs and optional items',crews:'Crews on this '+c.kind};
  h+=`<div class="tabs">${tabs.map(t=>`<button class="${S.siteTab===t[0]?'on':''}" data-tip="${tips[t[0]]}" onclick="S.siteTab='${t[0]}';S.fabOpen=false;render()">${t[1]} ${t[2]!==''?`<span class="cbadge ${t[0]==='rituals'&&t[2]?'':'grey'}">${t[2]}</span>`:''}</button>`).join('')}</div>`;
  h+=({overview:siteOverview,people:sitePeople,rituals:siteRituals,crews:siteCrews})[S.siteTab](r.id,s);
  return {key:'site', body:h, title:c.n, fab:S.day===0?siteFab(r.id):''};

/* FAB [mobile SB FloatingActionButton]: extended = one main action; speed dial = several (Design, Feedback 4) */
/* Round 2 (C-28, storybook FloatingActionButton): 1 action = extended FAB · 2 actions = two slots (fabTwo) · 3+ = speed dial (fabDial).
   Pins inside the FAB are absolutely placed, so they never push the icon off-centre. */
function fabExt(label,icon,onclick,tip){ return `<div class="fab" id="fab"><button class="fab-main" data-tip="${tip}" onclick="${onclick}"><i class="fa-solid ${icon}"></i>${label}${pin(30)}</button></div>`; }
/* SB "Two Slots": the top slot is icon-only (secondary), the bottom one carries the label (primary). top/bottom = [label, icon, onclick, pinHtml] */
function fabTwo(top,bottom,tip){ return `<div class="fab" id="fab"><button class="fab-slot" aria-label="${top[0]}" data-tip="${top[0]}" onclick="${top[2]}"><i class="fa-solid ${top[1]}"></i>${top[3]||''}</button><button class="fab-main" data-tip="${tip}" onclick="${bottom[2]}"><i class="fa-solid ${bottom[1]}"></i>${bottom[0]}${pin(30)}${bottom[3]||''}</button></div>`; }
function fabDial(acts,tip){
  if(acts.length<3){ const strip=s=>String(s).replace(/<[^>]*>/g,''); return acts.length===1?fabExt(acts[0][0],acts[0][1],acts[0][2],tip):fabTwo([strip(acts[1][0]),acts[1][1],acts[1][2]],[acts[0][0],acts[0][1],acts[0][2]],tip); } // the rule: no speed dial under 3 actions
  if(!S.fabOpen) return `<div class="fab" id="fab"><button class="fab-main dial" aria-label="Actions" data-tip="${tip}" onclick="S.fabOpen=true;render()"><i class="fa-solid fa-plus"></i>${pin(30)}</button></div>`;
  return `<div class="fab-scrim" onclick="S.fabOpen=false;render()"></div><div class="fab" id="fab">${acts.map(a=>`<button class="fab-act ${a[3]||''}" onclick="S.fabOpen=false;${a[2]}"><i class="fa-solid ${a[1]}"></i>${a[0]}</button>`).join('')}<button class="fab-main open" onclick="S.fabOpen=false;render()"><i class="fa-solid fa-xmark"></i>Close</button></div>`;
}
function siteFab(cid){
  if(!CAN_ACT()) return ''; // worker and Can view (W-29): no FAB
  /* Batch 3c: Assign is on the Site page's FAB on every tab (supervisor). Round 2 (C-28): 2 actions = two slots, Assign icon-only on top. */
  const AS=['Assign'+pin(44),'fa-clipboard-check',`openAssign('${cid}')`];
  const AS_TOP=['Assign','fa-clipboard-check',`openAssign('${cid}')`,pin(44)+pinR(51)];
  if(S.siteTab==='overview') return fabExt('Assign'+pin(44),'fa-clipboard-check',`openAssign('${cid}')`,'Assign a form, task or file, owed once');
  if(S.siteTab==='people') return fabTwo(AS_TOP,['Person','fa-plus',`go({s:'add',id:'${cid}'})`],'Add a person or a guest');
  if(S.siteTab==='rituals') return fabTwo(AS_TOP,['Move rituals','fa-calendar-day',`openSheet({type:'moveRitual',id:'${cid}'})`,pinR(32)],'Move a ritual to another day');
  if(S.siteTab==='crews') return fabDial([['Add crew','fa-plus',`openSheet({type:'addCrew',id:'${cid}'})`],['Move crew','fa-right-left',`openSheet({type:'moveCrew',id:'${cid}'})`],['Remove crew','fa-user-minus',`openSheet({type:'removeCrew',id:'${cid}'})`,'danger'],AS],'Crew actions, or assign work');
  return '';
}
function siteOverview(cid,s){
  const c=CTX[cid];
  const R=(cls,ic,main,sub)=>statRow(STK[cls],main,sub);
  let h=`<div class="card tap" onclick="S.siteTab='rituals';render()"><div class="card-h"><i class="fa-solid fa-list-check"></i>Today's items${pin(34)}<span class="see">See more <i class="fa-solid fa-chevron-right"></i></span></div><div class="card-b">
    ${s.out-s.prog?R('e','fa-circle-exclamation',`<b>${s.out-s.prog}</b> not started`):''}${s.prog?R('n','fa-hourglass-half',`<b>${s.prog}</b> in progress`):''}${R('s','fa-circle-check',`<b>${s.done}/${s.owed}</b> done`)}${s.expI?R('x','',`<b>${s.expI}</b> expected`+pin(52),'From people not here yet · assigned when they sign in or are marked present'):''}${(()=>{const n=owed(cid).filter(o=>o.one).length; return n?R('g','fa-user-plus',`<b>${n}</b> of these are one-off`,'Assigned today with Assign · owed once'):'';})()}</div></div>
  <div class="card tap" onclick="S.siteTab='people';render()"><div class="card-h"><i class="fa-solid fa-users"></i>People${pin(12)}<span class="see">See more <i class="fa-solid fa-chevron-right"></i></span></div><div class="card-b">
    ${expLine(s)}${s.notyet?R('n','fa-clock',`<b>${s.notyet}</b> not here yet`,s.missing.map(esc).join(', ')):''}${R('s','fa-circle-check',`<b>${s.here}</b> of ${s.total} here`)}${s.tr?R('t','fa-award',`<b>${s.tr}</b> with expired or expiring training`,'From the training matrix · informational'):''}${s.away?R('g','fa-plane-departure',`<b>${s.away}</b> away`,'Not counted in progress'):''}</div></div>`;
  if(c.jobsAt) h+=`<div class="sec-h" style="padding-top:4px;font-size:16px">Jobs here</div>`+c.jobsAt.map(jobCard).join(''); // C-31: the same simple Job card as the Field tab
  if(c.at) h+=`<div class="card"><div class="row tap" style="border-bottom:0" onclick="go({s:'site',id:'${c.at}'})"><div class="ic"><i class="fa-solid fa-building"></i></div><div class="mid"><div class="t">At ${esc(CTX[c.at].n)}</div><div class="s">This Job's items also roll up to the Site</div></div><i class="fa-solid fa-chevron-right chev"></i></div></div>`;
  return h;
}
function personRow(cid,pid){
  const p=P(pid);

  return `<div class="row tap" onclick="openSheet({type:'person',id:'${cid}',pid:'${pid}'})"><div class="av">${initials(p.n)}</div><div class="mid"><div class="t">${esc(p.n)}${p.guest?'<span class="guest">Guest</span>':''} ${trBadge(p)}</div>${proofLine(cid,pid)}</div><i class="fa-solid fa-ellipsis-vertical chev" data-tip="Actions"></i></div>`;
}
function sitePeople(cid,s){
  const f=[['all','All',s.total],['here','Here',s.here],['notyet','Not yet',s.notyet],['away','Away',s.away]];
  const list=S.ctxPeople[cid].filter(p=>{const a=att(cid,p).st; return S.peopleFilter==='all'||(S.peopleFilter==='notyet'?(a!=='here'&&a!=='away'):a===S.peopleFilter);});
  return `<div class="chips">${f.map(x=>`<button class="chip ${S.peopleFilter===x[0]?'on':''}" onclick="S.peopleFilter='${x[0]}';render()">${x[1]} <span class="c">${x[2]}</span>${x[0]==='away'?pin(31):''}</button>`).join('')}</div>
  ${list.length?list.map(p=>personRow(cid,p)).join(''):empty(S.peopleFilter==='notyet'?'fa-circle-check':'fa-user-slash',{here:'No one here yet',notyet:'Everyone\'s accounted for',away:'No one is away'}[S.peopleFilter]||'No people','',S.peopleFilter==='notyet')}`;
}
/* Collapsible header (Design's rule, Oct 9): the whole header row is ONE button — title to chevron — with aria-expanded, min 44px, hover/pressed tint. Chips stay inside. */
function accHead(key,inner,cls){ const open=!S.collapsed[key]; return `<button class="acc-h ${cls||''}" aria-expanded="${open}" data-tip="${open?'Collapse':'Expand'}" onclick="S.collapsed['${key}']=${open};render()">${inner}<i class="fa-solid fa-chevron-down acc-chev ${open?'':'shut'}" aria-hidden="true"></i></button>`; }
function siteRituals(cid){
  const c=CTX[cid]; const o=owed(cid);
  return S.ctxRituals[cid].map(rid=>{ const r=RITUALS[rid];
    const mv=(S.moved[cid]||{})[rid];
    if(mv) return `<div class="card" style="opacity:.8"><div class="card-h">${r.n}<span class="see"><i class="fa-solid fa-calendar-day"></i> Moved</span></div><div class="card-b small"><span class="muted">Moved to <b style="color:var(--color-text-default)">${esc(mv)}</b> for this ${c.kind} only. Nothing owed today.</span> <button class="btn link" style="${CAN_ACT()?'':'display:none'}" onclick="delete S.moved['${cid}']['${rid}'];snack('${r.n} is back on today',true);render()">Undo</button></div></div>`;
    if(r.next) return `<div class="card" style="opacity:.75"><div class="card-h">${r.n}<span class="see">${r.sch}</span></div><div class="card-b muted small"><i class="fa-regular fa-calendar"></i> Next due ${r.next}. Nothing owed today.</div></div>`;
    const items=o.filter(x=>x.rid===rid); const doneN=items.filter(x=>itemSt(cid,x)==='done').length; const open=items.filter(x=>itemSt(cid,x)!=='done');
    const shown=S.showDone?items:open;
    const ex=expected(cid).filter(x=>x.rid===rid); // round 2 (W-27): items for people not here yet read "Expected"
    const k='rit:'+cid+':'+rid, op=!S.collapsed[k];
    return `<div class="card"><div class="accent"></div>${accHead(k,`${r.n}<span class="see">${items.length-doneN?`<span class="cbadge">${items.length-doneN}</span> outstanding`:items.length?stat('pos','All done',1):''}${ex.length?` <span class="muted">· ${ex.length} expected</span>`:''}</span>`,'card-h')}${op?`
     <div class="xs muted" style="padding:6px 12px 0">${r.sch}</div>
     ${shown.map(x=>{const st=itemSt(cid,x); return `<div class="row" style="padding:8px 12px;min-height:56px"><div class="mid"><div class="t" style="font-size:15px">${esc(x.form)}</div><div class="s">${x.who?esc(P(x.who).n):'Anyone on the '+c.kind}</div></div>${st==='done'?stat('pos','Done',1):st==='prog'?stat('wait','In progress',1):stat('neg','Not started',1)}</div>`;}).join('')||(ex.length?'':`<div class="card-b muted small">${items.length?'':'Nobody is signed in yet, so nothing is owed.'}</div>`)}
     ${ex.map((x,i)=>`<div class="row" style="padding:8px 12px;min-height:56px"><div class="mid"><div class="t" style="font-size:15px">${esc(x.form)}</div><div class="s">${esc(P(x.who).n)} · not here yet</div></div>${stat('exp','Expected'+(i===0?pin(52):''),1)}</div>`).join('')}
     ${doneN?`<div style="padding:8px 12px"><button class="btn link" onclick="S.showDone=!S.showDone;render()"><i class="fa-solid ${S.showDone?'fa-eye-slash':'fa-eye'}"></i> ${S.showDone?'Hide':'Show'} done (${doneN})</button></div>`:''}`:''}</div>`;
  }).join('')+asgSiteCard(cid)+carryCard(cid)+waivedCard(cid);
}
/* Round 3 (decision 95): carried-over items on the supervisor's Requirements tab. Not in today's counts: reports count them on the day they were owed. */
function carryCard(cid){ const l=(S.carry||[]).filter(x=>x.cid===cid&&S.ctxPeople[cid].includes(x.who)); if(!l.length) return ''; const k='carry:'+cid, op=!S.collapsed[k];
  return `<div class="card">${accHead(k,`<i class="fa-solid fa-clock-rotate-left"></i>Carried over${pin(58)}<span class="see"><span class="cbadge grey">${l.filter(x=>x.st!=='done').length}</span></span>`,'card-h')}${op?`<div class="xs muted" style="padding:6px 12px 0">Missed on an earlier day by someone who was signed in. Each counts for the day it was owed, not today.</div>${l.map(x=>`<div class="row" style="padding:8px 12px;min-height:56px"><div class="mid"><div class="t" style="font-size:15px">${esc(x.form)}<span class="achip late"><i class="fa-solid fa-clock-rotate-left"></i>From ${esc(x.from)}</span></div><div class="s">${esc(P(x.who).n)} · ${esc(RITUALS[x.rid].n)}</div></div>${x.st==='done'?stat('pos','Done',1):x.st==='prog'?stat('wait','In progress',1):stat('neg','Not started',1)}</div>`).join('')}`:''}</div>`; }
/* Past items waived by a backdated Away: grey dash "Waived · Away"; they left the outstanding and progress counts */function waivedCard(cid){ const w=S.waived[cid]||[]; if(!w.length) return ''; const k='waived:'+cid, op=!S.collapsed[k];  return `<div class="card">${accHead(k,`<i class="fa-solid fa-clock-rotate-left"></i>Earlier this week${pin(35)}<span class="see">${stat('neu',w.length+' waived',1)}</span>`,'card-h')}${op?w.map(x=>`<div class="row" style="padding:8px 12px;min-height:56px"><div class="mid"><div class="t" style="font-size:15px">${esc(x.form)}</div><div class="s">${esc(P(x.pid).n)} · ${esc(x.day)} · ${RITUALS[x.rid].n}</div></div>${stat('neu','Waived · Away',1)}</div>`).join(''):''}</div>`; }
function siteCrews(cid){

function useSaved(){ const cv=document.getElementById('pad'); const x=cv.getContext('2d'); x.font='italic 32px "Segoe Script","Brush Script MT",cursive'; x.fillStyle='#19191A'; x.fillText(P(cur().pid).n,24,cv.height-48); S.ink=true; document.getElementById('padPh').style.display='none'; updSignBtn(); }
function bindPad(){
  const cv=document.getElementById('pad'); if(!cv) return;
  const r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=r.height;
  const x=cv.getContext('2d'); x.lineWidth=2.5; x.lineCap='round'; x.strokeStyle='#19191A'; let draw=false;
  const pt=e=>{const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  cv.onpointerdown=e=>{draw=true; if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId); const [a,b]=pt(e); x.beginPath(); x.moveTo(a,b);};
  cv.onpointermove=e=>{ if(!draw) return; const [a,b]=pt(e); x.lineTo(a,b); x.stroke(); if(!S.ink){S.ink=true; document.getElementById('padPh').style.display='none'; updSignBtn();} };

function workItem(cid,who,form){ const o={who:who||null,form}; const st=itemSt(cid,o); if(st==='todo'){setItem(cid,who||null,form,'prog'); snack(form+' started (opens the existing form)');} else {setItem(cid,who||null,form,'done'); snack(form+' submitted · '+now());} render(); }
function moveOthers(cid){ WCTX().filter(c=>c!==cid&&c!==CTX[cid].at).forEach(c=>{const a=att(c,S.me); if(a.st==='here'&&!a.out){a.out=now(); a.moved=cid;}}); } // round 3 (92): never signs you out of the Job's own Site
/* Round 3 (decision 92): signing into a Job at a Site also signs you into that Site (one record there, marked "via" the Job).
   Signing into the Site doesn't sign you into its Jobs. Several Jobs at once is open (pin 61). */
function viaSite(cid,t){ const s=CTX[cid].at; if(!s||!S.ctxPeople[s].includes(S.me)) return; const a=att(s,S.me); if(a.st==='here'&&!a.out) return; setAtt(s,S.me,{st:'here',proof:'signedin',t,via:cid}); }
function doSignIn(cid){ const t=now(), prev=att(cid,S.me), up=prev.st==='here'&&!prev.out&&prev.proof==='marked'; moveOthers(cid);
  setAtt(cid,S.me,{st:'here',proof:'signedin',t,marked:up?{by:prev.by,t:prev.t}:null}); viaSite(cid,t); S.sheet=null; // one record: the proof level is upgraded
  snack(up?`Your sign-in was added to today’s record · ${t}`:`Signed in at ${CTX[cid].n}${CTX[cid].at&&S.ctxPeople[CTX[cid].at].includes(S.me)?' and '+CTX[CTX[cid].at].n:''} · ${t}`); render(); }
function signOut(cid){ const a=att(cid,S.me); a.out=now(); WCTX().forEach(c=>{ const b=att(c,S.me); if(b.via===cid&&!b.out) b.out=a.out; }); snack(`Signed out of ${CTX[cid].n} · ${a.out}`); render(); }

/* Moving a person between crews (Design, Oct 9): they follow the new crew's Sites/Jobs; Sites they were added to directly stay */
function crewOf(pid){ return Object.keys(S.crewMem).find(k=>S.crewMem[k].includes(pid)); }
function crewSites(k){ return SUP_CTX.filter(c=>S.ctxCrews[c].includes(k)); }
function isDirect(pid,c){ return S.ctxPeople[c].includes(pid)&&!S.ctxCrews[c].some(k=>S.crewMem[k].includes(pid)); }
function crewMoveImpact(pid,from,to){ const toS=crewSites(to);
  const leaves=from?crewSites(from).filter(c=>S.ctxPeople[c].includes(pid)&&!toS.includes(c)):[];
  const joins=toS.filter(c=>!S.ctxPeople[c].includes(pid));
  const stays=SUP_CTX.filter(c=>isDirect(pid,c)); return {leaves,joins,stays}; }
function doMovePerson(){ const sh=S.sheet, pid=sh.pid, from=crewOf(pid), to=sh.sel, im=crewMoveImpact(pid,from,to);
  if(from) S.crewMem[from]=S.crewMem[from].filter(p=>p!==pid); S.crewMem[to].push(pid);
  im.leaves.forEach(c=>{ S.ctxPeople[c]=S.ctxPeople[c].filter(p=>p!==pid); }); im.joins.forEach(c=>S.ctxPeople[c].push(pid));
  S.sheet=null; snack(`${P(pid).n} moved to ${CREWS[to].n}${im.joins.length?' · now on '+im.joins.map(c=>CTX[c].n).join(', '):''}`,true); render(); }
function crewOnly(cid,k){ const others=new Set(); S.ctxCrews[cid].filter(x=>x!==k).forEach(x=>S.crewMem[x].forEach(p=>others.add(p))); return S.crewMem[k].filter(p=>!others.has(p)); }
function addCrews(cid){ const ks=Object.keys(S.sheet.sel).filter(k=>S.sheet.sel[k]); ks.forEach(k=>{ S.ctxCrews[cid].push(k); S.crewMem[k].forEach(p=>{ if(!S.ctxPeople[cid].includes(p)) S.ctxPeople[cid].push(p); }); });
  snack(ks.map(k=>CREWS[k].n).join(', ')+' added to '+CTX[cid].n,true); S.sheet=null; render(); }
function moveCrew(cid){ const k=S.sheet.sel, d=S.sheet.dest; const leaving=crewOnly(cid,k);
  S.ctxCrews[cid]=S.ctxCrews[cid].filter(x=>x!==k); S.ctxPeople[cid]=S.ctxPeople[cid].filter(p=>!leaving.includes(p));
  if(!S.ctxCrews[d].includes(k)) S.ctxCrews[d].push(k); S.crewMem[k].forEach(p=>{ if(!S.ctxPeople[d].includes(p)) S.ctxPeople[d].push(p); });
  snack(CREWS[k].n+' moved to '+CTX[d].n,true); S.sheet=null; render(); }
function removeCrew(cid){ const k=S.sheet.sel; const leaving=crewOnly(cid,k);
  S.ctxCrews[cid]=S.ctxCrews[cid].filter(x=>x!==k); S.ctxPeople[cid]=S.ctxPeople[cid].filter(p=>!leaving.includes(p));
  snack(CREWS[k].n+' removed from '+CTX[cid].n,true); S.sheet=null; render(); }
/* Backdated away (Design, Oct 9): Yesterday or a range that starts in the past. Past days' outstanding items are WAIVED
   (stop counting); anything submitted stays. Today is Thu, Oct 8; past working days this week: Mon Oct 5 – Wed Oct 7. */
const AWAY_FROM=[['oct5','Mon, Oct 5'],['oct6','Tue, Oct 6'],['oct7','Wed, Oct 7'],['today','Today'],['oct9','Fri, Oct 9']];
/* Round 2 (C-19, same as the web): Mark away starts on the day being viewed, including a past day. Yesterday → "Yesterday";
   tomorrow → a range from Fri, Oct 9 (saved as a planned away, so today is unchanged). */
function openAway(cid,pids){ S.awayOpt=S.day<0?{dur:'yesterday',reason:'',from:'oct7',to:'today'}:S.day>0?{dur:'range',reason:'',from:'oct9',to:'oct9'}:{dur:'today',reason:'',from:'oct6',to:'today'}; openSheet({type:'away',id:cid,pids}); }
const AWAY_TO=[['today','Today'],['oct9','Fri, Oct 9'],['oct12','Mon, Oct 12']];
function awayPastDays(o){ if(o.dur==='yesterday') return ['Wed, Oct 7']; if(o.dur==='range'){ const i={oct5:0,oct6:1,oct7:2,today:3}[o.from]; return AWAY_FROM.slice(i,3).map(x=>x[1]); } return []; }
function awayLabel(o){ const short=s=>s.replace(/^[A-Za-z]+, /,''); const past=awayPastDays(o); if(!past.length) return '';
  const end=o.dur==='yesterday'?'Oct 7':{today:'Oct 8',oct9:'Oct 9',oct12:'Oct 12'}[o.to]; const start=short(past[0]); return start===('Oct '+end.split(' ')[1])||start===end?start:start+'–'+end.split(' ')[1]; }
function perPersonForms(cid){ return S.ctxRituals[cid].filter(r=>RITUALS[r].per==='person'&&!RITUALS[r].next).reduce((a,r)=>a+RITUALS[r].forms.length,0); }
function startAway(cid){
  const sh=S.sheet, o=S.awayOpt, pids=sh.pids||[sh.pid], past=awayPastDays(o);
  if(!past.length){ doAway(cid); return; }
  const n=past.length*perPersonForms(cid)*pids.length;
  openSheet({type:'awayConfirm',id:cid,pids,n,label:awayLabel(o)});
}
function doAway(cid){
  const sh=S.sheet, o=S.awayOpt; const pids=sh.pids||[sh.pid]; const past=awayPastDays(o);
  const untilMap={today:'today',oct9:'Fri, Oct 9',oct12:'Mon, Oct 12'};
  const until=o.dur==='range'?untilMap[o.to]:untilMap[o.dur];
  const from=o.dur==='range'&&o.from!=='today'?AWAY_FROM.find(x=>x[0]===o.from)[1]:'';
  if(o.dur==='range'&&o.from==='oct9'){ // round 2: starts tomorrow, so today is unchanged; saved as a planned away
    pids.forEach(p=>setAtt(cid,p,Object.assign({},att(cid,p),{planned:{from,until:untilMap[o.to]==='today'?from:untilMap[o.to],reason:o.reason}})));
    snack(`${pids.length===1?P(pids[0]).n:pids.length+' people'} will be away from ${from}`,true); S.sheet=null; S.sel={}; render(); return; }
  if(o.dur!=='yesterday') pids.forEach(p=>setAtt(cid,p,{st:'away',until,from,reason:o.reason}));   // "Yesterday" only: back today, nothing changes now
  if(past.length){ const w=(S.waived[cid]=S.waived[cid]||[]); const forms=S.ctxRituals[cid].filter(r=>RITUALS[r].per==='person'&&!RITUALS[r].next).flatMap(r=>RITUALS[r].forms.map(f=>[r,f]));
    pids.forEach(p=>past.forEach(d=>forms.forEach(([r,f])=>w.push({pid:p,day:d,rid:r,form:f,reason:o.reason})))); }
  const who=pids.length===1?P(pids[0]).n:pids.length+' people';
  snack(past.length?`${who} marked away ${awayLabel(o)} · ${sh.n||0} past items waived`:`${who} ${pids.length===1?'is':'are'} away ${until==='today'?'today':'until '+until}`,true);
  S.sheet=null; S.sel={}; S.awayOpt={dur:'today',reason:'',from:'oct6',to:'today'}; render();
}
