<!DOCTYPE html>
<!--
  ============================================================================
  FIELD MANAGEMENT MVP — CLICKABLE LO-FI WIREFRAME PROTOTYPE  (v1 · 2026-10-01)
  ----------------------------------------------------------------------------
  House format: conjurer's Interactive Prototype chrome (topbar · perspective
  control · flow tabs · scrolling stage · step-details footer · Reset) wearing
  the Lo-Fi Wireframe skin (greyscale ramp, device frames, "→" notes, the
  neutral "Wireframe - v1" pill). Light mode only — BIS has no dark theme.

  INPUTS (read, never edited)
    _notes/scope/Site Managment/scope/parent-site-management-mvp.md (v2, 2026-09-30)
    + child tickets SM-01, SM-02, SM-03, SM-04, S-01, S-04, SM-06, S-06, S-02
    _notes/research/field-management-competitors/field-management-competitor-ui-reference.html

  RULES THIS FILE KEEPS
    • Greyscale only. --action red = "needs attention". --accent blue = annotation.
    • Sample data is invented. No BIS client is named anywhere.
    • Open decisions from the scope are shown as ⚑ callouts — never resolved here.
    • One shared data set: what you do as a worker or supervisor shows up on
      the admin's web view (and the other way round).

  HOW IT'S BUILT
    PERSP / FLOWS  → the perspective control and flow tabs
    SCREENS        → per-screen rail: tickets covered, pattern, notes, decisions
    render*()      → one renderer per screen; render() repaints everything
    Reset          → freshState()
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Management — Lo-Fi Prototype</title>
<style>
  :root {
    /* wireframe paper — neutrals biased slightly cool (from lofi-wireframe-template) */
    --paper: #f7f8fa;
    --card: #ffffff;
    --line: #d4d8de;
    --line-strong: #aeb4bd;
    --ink: #2b2f36;
    --ink-soft: #6b7280;
    --ink-faint: #9aa1ab;
    --fill: #eceef1;
    --fill-2: #e2e5e9;
    --action: #d64545;      /* the ONLY state colour: needs attention */
    --action-soft: #fbe9e9;
    --update-line: #9aa1ab;
    --accent: #3d6ae0;      /* structural accent: annotations, entry points */
    --accent-soft: #eef2fd;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--paper);
         display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 12.5px; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; background: var(--card); }
  p { margin: 0; }

  /* ===== template chrome ===== */
  .topbar { background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 7px 16px; flex-wrap: wrap; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .t-ticket { font-size: 16px; font-weight: 600; }
  .t-project { font-size: 14px; }
  .t-date { font-size: 12px; color: var(--ink-soft); }
  .badge-pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 12px; font-size: 12px; font-weight: 600;
                box-shadow: 0 0 4px rgba(0,0,0,.15); white-space: nowrap; }
  .badge-pill.wire { background: var(--fill); color: var(--ink-soft); border: 1px solid var(--line-strong); }
  .btn-reset { background: var(--card); border: 1px solid var(--ink-soft); border-radius: 4px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .btn-reset:hover { background: var(--paper); }

  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 20px 14px; }
  .navrow { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .seg-control { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 80px; overflow: hidden; background: var(--card); }
  .seg-opt { background: transparent; border: none; border-left: 1px solid var(--line-strong); padding: 5px 13px; font-size: 13px; }
  .seg-opt:first-child { border-left: none; }
  .seg-opt.active { background: var(--ink); color: #fff; font-weight: 600; }
  .flow-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .flow-tab { padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--ink-soft); border-radius: 4px; border: 1px solid transparent; background: transparent; }
  .flow-tab:hover { color: var(--ink); }
  .flow-tab.active { background: var(--card); border-color: var(--line); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.05); }

  .proto-card { background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .proto-stage { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px 28px; background: var(--paper); }
  .step-details { background: var(--card); border-top: 1px solid var(--line); padding: 10px 18px 12px; flex-shrink: 0; }
  .sd-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .sd-list { list-style: disc; padding-left: 18px; margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink); }

  /* ===== stage layout: device + annotation rail ===== */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; max-width: 1480px; margin: 0 auto; }
  .layout.mob { grid-template-columns: minmax(0, 1fr) 340px; max-width: 1100px; }
  @media (max-width: 1080px) { .layout, .layout.mob { grid-template-columns: 1fr; } }
  .dev { min-width: 0; }
  .frame-tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px 2px; }
  .rail { display: flex; flex-direction: column; gap: 16px; }
  .rsec h4 { margin: 0 0 7px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
  .rsec .pat { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .tk { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
        border: 1px solid var(--ink); color: var(--ink); background: var(--card); white-space: nowrap; }
  .tk-name { font-size: 11px; color: var(--ink-soft); }
  .covers { display: flex; flex-direction: column; gap: 5px; }
  .covers div { display: flex; gap: 8px; align-items: center; }
  .notes { border-top: 1px solid var(--line); padding-top: 14px; }
  .notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .notes li { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; padding-left: 18px; position: relative; }
  .notes li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-family: var(--mono); }
  .notes b { color: var(--ink); font-weight: 650; }
  .decision { border: 1.5px dashed var(--ink-soft); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--ink-soft); line-height: 1.5;
              background: repeating-linear-gradient(135deg, var(--card) 0 9px, #f2f3f5 9px 10px); }
  .decision .dl { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); font-weight: 700; margin-bottom: 4px; }
  .decision b { color: var(--ink); display: block; margin-bottom: 2px; font-size: 12.5px; }
  .flag { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
          color: var(--ink); border: 1.2px dashed var(--ink-soft); border-radius: 4px; padding: 1px 5px; background: var(--card); white-space: nowrap; vertical-align: middle; }

  /* ===== shared lo-fi UI bits ===== */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--card); border-radius: 6px;
         padding: 6px 11px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn.pri { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.sm { padding: 3px 8px; font-size: 11px; border-radius: 5px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
  .btn.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: inherit; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .sub { font-size: 11px; color: var(--ink-faint); }
  .muted { color: var(--ink-soft); }
  .mono { font-family: var(--mono); }
  .row-flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .st-out { background: var(--action); color: #fff; }
  .st-ok { border: 1.5px solid var(--update-line); color: var(--ink-soft); padding: 2px 9px; }
  .st-closed { border: 1.5px solid var(--ink); color: var(--ink); background: var(--fill); padding: 2px 9px; }
  .st.big { font-size: 15px; padding: 5px 13px; }
  .tn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; white-space: nowrap; }
  .tn .pi { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); position: relative; }
  .tn.zero { color: var(--ink-faint); font-weight: 400; }
  .tn.zero .pi { border-color: var(--ink-faint); }
  .kind { font-family: var(--mono); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line-strong); border-radius: 4px;
          padding: 1px 5px; color: var(--ink-soft); white-space: nowrap; vertical-align: middle; }
  .aw { display: inline-block; font-size: 10.5px; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 6px; background: var(--fill); white-space: nowrap; }
  .ext { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border: 1px dashed var(--ink-soft);
         border-radius: 4px; padding: 0 4px; color: var(--ink-soft); white-space: nowrap; }
  .fchip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; background: var(--card); font-weight: 600; }
  .fchip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .seg2 { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; background: var(--card); }
  .seg2 button { border: 0; border-left: 1px solid var(--line-strong); background: transparent; padding: 5px 10px; font-size: 11.5px; font-weight: 650; }
  .seg2 button:first-child { border-left: 0; }
  .seg2 button.on { background: var(--ink); color: #fff; }
  .info { font-size: 11.5px; color: var(--ink-soft); border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 7px 10px; border-radius: 0 6px 6px 0; line-height: 1.45; }
  .ph { display: block; height: 8px; border-radius: 4px; background: var(--fill); }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 7px 10px; font-size: 12px; margin: 0; }
  .kv dt { color: var(--ink-faint); }
  .kv dd { margin: 0; }

  /* ===== web (browser) frame ===== */
  .browser { width: 100%; border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--card); box-shadow: 0 12px 34px rgba(0,0,0,.10); }
  .chrome { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--fill); border-bottom: 1px solid var(--line); }
  .chrome .tl { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
  .chrome .url { flex: 1; margin-left: 10px; height: 18px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); font-family: var(--mono);
                 font-size: 10px; color: var(--ink-faint); padding: 0 10px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
  .app-nav { display: flex; align-items: center; gap: 16px; padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--card); overflow-x: auto; }
  .app-nav .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--ink); flex: none; }
  .app-nav .ni { font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; padding: 2px 0; }
  .app-nav .ni.on { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--ink); }
  .app-nav .nsp { flex: 1; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--fill-2); font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .web { position: relative; min-height: 600px; background: var(--paper); }
  .wpage { padding: 18px 20px 28px; }
  .wh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .wh h2 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .crumb { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 4px; }
  .crumb a { color: var(--accent); cursor: pointer; }
  .viewer-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 20px; background: var(--fill); border-bottom: 1px solid var(--line-strong); font-size: 12px; }
  .tbl-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .t th { text-align: left; font-size: 10px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
          padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .t td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .t tr:last-child td { border-bottom: 0; }
  .t tr.click:hover td { background: #fafbfc; cursor: pointer; }
  .t .first { width: 150px; }
  .tabs-w { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin: 14px 0 14px; overflow-x: auto; }
  .tab-w { font-size: 12.5px; font-weight: 650; padding: 8px 0 9px; color: var(--ink-soft); border: 0; border-bottom: 2px solid transparent; background: none; white-space: nowrap; }
  .tab-w.on { color: var(--ink); border-bottom-color: var(--ink); }
  .cnt { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 8px; margin-left: 4px; border: 1.2px solid var(--update-line); color: var(--ink-soft); }
  .cnt.act { background: var(--action); color: #fff; border-color: var(--action); }
  .statrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 150px; }
  .stat .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
  .stepper { display: flex; gap: 0; align-items: center; flex-wrap: wrap; font-size: 11px; }
  .stepper span { padding: 3px 9px; border: 1px solid var(--line-strong); margin-right: -1px; color: var(--ink-faint); background: var(--card); }
  .stepper span.done { color: var(--ink-soft); background: var(--fill); }
  .stepper span.now { color: #fff; background: var(--ink); border-color: var(--ink); font-weight: 700; }
  .stepper span:first-child { border-radius: 5px 0 0 5px; }
  .stepper span:last-child { border-radius: 0 5px 5px 0; }

  /* obligations */
  .bd { padding: 10px 12px; margin-bottom: 12px; }
  .bd-items { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .bdi { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 5px 9px; font-size: 11.5px; }
  .bdi b { font-family: var(--mono); margin-right: 4px; }
  .bdi.hot b { color: var(--action); }
  .bdi.on { border-color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1px var(--ink); }
  .rgroup { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
  .rg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .rg-title { font-weight: 700; font-size: 13px; }
  .rg-meta { font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); }
  .rg-count { font-size: 11.5px; font-weight: 700; font-family: var(--mono); }
  .ob { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .rg-head + .ob { border-top: 0; }
  .sdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ob.not .sdot, .sdot.not { background: var(--action); }
  .ob.prog .sdot, .sdot.prog { border: 1.5px dashed var(--action); }
  .ob.done .sdot, .sdot.done { background: var(--ink-faint); }
  .ob.didnt .sdot, .sdot.didnt { border: 1.5px solid var(--ink-faint); }
  .ob-main { flex: 1; min-width: 0; cursor: pointer; }
  .ob-t { font-size: 12.5px; font-weight: 600; }
  .ob-m { font-size: 11px; color: var(--ink-faint); }
  .ob.done .ob-t, .ob.didnt .ob-t { color: var(--ink-soft); font-weight: 500; }
  .ob-acts { display: flex; gap: 5px; position: relative; flex: none; }
  .collapsed { padding: 8px 12px; font-size: 11.5px; color: var(--ink-soft); border-top: 1px dashed var(--line); cursor: pointer; }
  .collapsed:hover { color: var(--ink); }
  .pop { position: absolute; right: 0; top: 30px; width: 270px; z-index: 6; background: var(--card); border: 1.5px solid var(--ink); border-radius: 8px;
         box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 11px; text-align: left; }
  .pop-t { font-weight: 700; font-size: 12.5px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .radio { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; padding: 4px 0; cursor: pointer; }
  .radio .rb { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--ink-soft); flex: none; margin-top: 2px; }
  .radio.on .rb { border: 4px solid var(--ink); }
  .radio.dis { opacity: .45; cursor: not-allowed; }
  .check { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; padding: 4px 0; cursor: pointer; }
  .check .cb { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--ink-soft); flex: none; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; }
  .check.on .cb { background: var(--ink); border-color: var(--ink); }
  .check.on .cb::after { content: "✓"; }
  .check.dis { opacity: .55; cursor: default; }

  /* overlays inside the web frame */
  .overlay { position: absolute; inset: 0; display: flex; z-index: 10; }
  .overlay .scrim { flex: 1; background: repeating-linear-gradient(135deg, rgba(43,47,54,.06) 0 11px, rgba(43,47,54,.12) 11px 12px); }
  .spanel { width: 360px; max-width: 92%; background: var(--card); border-left: 1.5px solid var(--ink); box-shadow: -8px 0 26px rgba(0,0,0,.08); overflow-y: auto; padding: 16px; }
  .overlay.center { background: rgba(43,47,54,.22); align-items: flex-start; justify-content: center; padding: 50px 16px; }
  .sheet { width: min(500px, 100%); background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; padding: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.18); }
  .sheet h3, .spanel h3 { margin: 0 0 4px; font-size: 15px; }
  .sheet-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .close-x { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft); background: var(--card); font-size: 12px; flex: none; }
  .sec-h { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 16px 0 8px; font-weight: 600; }
  .chain { margin: 0; padding: 0; list-style: none; counter-reset: c; }
  .chain li { counter-increment: c; position: relative; padding: 0 0 10px 26px; font-size: 12px; line-height: 1.45; }
  .chain li::before { content: counter(c); position: absolute; left: 0; top: 0; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--ink);
                      font-family: var(--mono); font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .chain li:not(:last-child)::after { content: ""; position: absolute; left: 8px; top: 19px; bottom: 2px; border-left: 1.5px dotted var(--line-strong); }
  .blocker { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .blocker .bt { flex: 1; min-width: 180px; }

  /* wizard / forms on web */
  .wiz { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 22px; }
  @media (max-width: 760px) { .wiz { grid-template-columns: 1fr; } }
  .wsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 3400);
}

function idxRows() {
  var f = S.idxFilter, q = S.idxQ.toLowerCase();
  var rows = CTX.filter(function (c) {
    var gone = isClosed(c) || isArchived(c);
    if (f === 'closed') return gone;
    if (gone) return false;
    if (S.viewer && !S.access.scope[c.id]) return false;
    if (f === 'site' && c.kind !== 'site') return false;
    if (f === 'job' && c.kind !== 'job') return false;
    if (f === 'await' && !c.awaiting) return false;
    if (q && (cname(c) + ' ' + whereText(c)).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  rows.sort(function (a, b) { return outCount(b.id) - outCount(a.id) || ((b.awaiting ? 1 : 0) - (a.awaiting ? 1 : 0)) || a.name.localeCompare(b.name); });
  return rows;
}
function idxBody() {
  var rows = idxRows();
  if (!rows.length) return '<tr><td colspan="7" class="sub" style="padding:24px;text-align:center">Nothing here.</td></tr>';
  return rows.map(function (c) {
    var split = '';
    if (c.id === 'ny') {
      var all = owed('ny').filter(isOut), site = all.filter(function (o) { return !o.job; }).length;
      if (all.length) split = '<div class="sub" style="margin-top:3px">' + site + ' site · ' + (all.length - site) + ' across ' + JLs().toLowerCase() + '</div>';
    }
    var prog = owed(c.id).filter(function (o) { return o.state === 'prog'; }).length;
    if (!split && prog) split = '<div class="sub" style="margin-top:3px">' + prog + ' in progress</div>';
    return '<tr class="click" onclick="openCtx(\'' + c.id + '\')"><td class="first">' + statePill(c.id) + split + '</td><td>' + trainCell(c.id) + '</td>' +
      '<td><b>' + cname(c) + '</b></td><td><span class="kind">' + kindLabel(c) + '</span> <span class="sub">' + whereText(c) + '</span></td>' +
      '<td>' + datesCell(c) + '</td><td class="sub">' + (c.crews.length ? c.crews.join(', ') : '—') + '</td><td class="sub" style="white-space:nowrap">' + c.last + '</td></tr>';
  }).join('');
}

  var cnt = { all: base.length, site: base.filter(function (c) { return c.kind === 'site'; }).length, job: base.filter(function (c) { return c.kind === 'job'; }).length,

  var chips = [['all','All'],['site','Sites'],['job',JLs()],['await','Awaiting close']];

    's-view': ['Supervisor — ' + byId(S.sup.ctx).name, ['On screen: the same ritual grouping as the web, with Remind on each row.', 'Try: ⋯ on a ritual to move it, or Who’s on site.']],
    's-att': ['Who’s on site — attendance checklist', ['On screen: pre-filled from the crews; mark present or absent; training shows beside names.', 'Try: mark K. Diaz present, then Collect signatures.']],
    's-sign': ['Signatures', [S.sup.sigMode === 'pass' ? 'Pass the phone: each person reads the attestation and signs for themselves.' : 'Choose: pass this phone round, each person’s own phone, or a photo of a paper sheet.', 'A supervisor never signs for someone else.']],
    's-visitor': ['Add someone', ['On screen: add a BIS user for today, or an external person record with training added by hand.', 'Try: photograph a ticket and Add to Who’s on site.']],
    's-move': ['Move', ['On screen: move a ritual for this Site only, or move people and crews.', 'Creating stays on the web.']],
    'w-pick': ['Worker — pick where you are', ['On screen: an ungated list of the crew’s Sites and ' + JLs() + ', with search and recents.', 'Try: pick WO-4471 — you’ll get a training warning that doesn’t block.']],
    'w-day': ['Worker — your day', [S.w.ctx ? 'On screen: the chosen ' + kindLabel(byId(S.w.ctx)) + ' as a chip with Switch, and what it owes you today.' : 'Pick a Site or ' + JL() + ' first.', 'Try: Start the confined space permit and submit — then check North Yard on the admin web view.']],
    'w-forms': ['Worker — the existing Forms tab', ['On screen: the Forms list with a Today / Yesterday / Next / All filter; the chip stays on.', 'Try: open Hazard report — see where it counts, submit, then find it in Admin → Why it counted / Evidence.']]
  };
  var d = D[f] || ['', []];
  return { title: d[0], bullets: d[1] };
}
function renderScreen() {
  var f = S.flow;
  if (f === 'ov') return renderOverview();
  if (f === 'a-setup') return renderSetup();
  if (f === 'a-index') return renderIndex();
  if (f === 'a-view' || f === 'a-why' || f === 'a-people') return renderView();
  if (f === 'a-attach') return renderAttach();
  if (f === 'a-close') return renderClose();
  if (f === 'a-access') return renderAccess();
  if (f === 's-home') return renderSupHome();
  if (f === 's-view') return renderSupView();
  if (f === 's-att') return renderSupAtt();
  if (f === 's-sign') return renderSupSign();
  if (f === 's-visitor') return renderSupVisitor();
  if (f === 's-move') return renderSupMove();
  if (f === 'w-pick') return renderWPick();
  if (f === 'w-day') return renderWDay();
  if (f === 'w-forms') return renderWForms();
  return '';
}
var lastKey = '';
function render() {
  document.getElementById('seg').innerHTML = PERSP.map(function (p) { return '<button class="seg-opt' + (S.persp === p.id ? ' active' : '') + '" onclick="switchPersp(\'' + p.id + '\')">' + p.label + '</button>'; }).join('');
  var af = activeFlow();
  document.getElementById('flowTabs').innerHTML = FLOWS[S.persp].map(function (f) { return '<button class="flow-tab' + (f.id === af ? ' active' : '') + '" onclick="selectFlow(\'' + f.id + '\')">' + f.label + '</button>'; }).join('');
  var key = S.persp + '|' + af + '|' + S.ctx + '|' + S.setup.step + '|' + S.close.step + S.close.view + '|' + S.sup.ctx + '|' + (S.w.form || '') + '|' + S.viewer;
  /* keep in-phone scroll positions for in-screen tweaks */
  var keep = [].map.call(document.querySelectorAll('[data-keep]'), function (el) { return el.scrollTop; });
  var d = stepDetails();
  document.getElementById('sdTitle').textContent = d.title;
  document.getElementById('sdList').innerHTML = d.bullets.map(function (b) { return '<li>' + b + '</li>'; }).join('');
  document.getElementById('stage').innerHTML = renderScreen();
  if (key !== lastKey) { document.getElementById('stage').scrollTop = 0; lastKey = key; }
  else [].forEach.call(document.querySelectorAll('[data-keep]'), function (el, i) { if (keep[i]) el.scrollTop = keep[i]; });
}
document.addEventListener('click', function (e) {
  if (S.menu && !e.target.closest('.pop') && !e.target.closest('.ob-acts')) { S.menu = null; render(); }
});
render();
</script>
